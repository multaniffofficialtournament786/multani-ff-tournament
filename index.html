<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <meta name="google-site-verification" content="AoFuCJIFEHGeGRieVxZp5WBCI6JI84rj_bLzmDuz0s8" />

  <title>Multani FF Official Tournament - Pakistan's #1 Free Fire Esports Platform</title>
  <meta name="theme-color" content="#0a0a0f" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-base: #06070a;
      --bg-surface: #0e1118;
      --bg-card: #151922;
      --border-color: #262f40;
      --primary: #ff4624;
      --primary-glow: rgba(255, 70, 36, 0.45);
      --accent-cyan: #00f0ff;
      --accent-gold: #ffbe00;
      --success: #00e676;
      --danger: #ff1744;
      --text-main: #f3f4f6;
      --text-muted: #8e9bb0;
      --text-dim: #5c687a;
      --header-height: 56px;
      --bottom-nav-height: 64px;
      --max-app-width: 430px;
      --font-gaming: 'Rajdhani', sans-serif;
      --font-ui: 'Inter', sans-serif;
      --radius: 14px;
      --radius-sm: 8px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    body { background-color: #020203; color: var(--text-main); font-family: var(--font-ui); min-height: 100dvh; display: flex; justify-content: center; align-items: center; user-select: none; }
    
    #app-container { 
      width: 100%; 
      max-width: var(--max-app-width); 
      height: 100dvh; 
      background-color: var(--bg-base); 
      display: flex; 
      flex-direction: column; 
      position: relative; 
      overflow: hidden; 
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 2px rgba(255, 70, 36, 0.3); 
    }
    @media (min-width: 431px) { #app-container { height: 94vh; border-radius: 28px; border: 1px solid #1f2636; } }

    .app-header { position: sticky; top: 0; z-index: 100; height: var(--header-height); background: rgba(14, 17, 24, 0.96); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
    .header-bar { height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .brand-logo { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .brand-sub { font-family: var(--font-gaming); font-size: 10px; letter-spacing: 3px; color: var(--primary); font-weight: 700; line-height: 1; }
    .brand-main { font-family: var(--font-gaming); font-size: 19px; font-weight: 800; letter-spacing: 1.5px; background: linear-gradient(90deg, #ffffff, #ffb39e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .icon-btn { background: transparent; border: none; color: var(--text-main); font-size: 18px; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); position: relative; }
    .icon-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.05); }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .avatar-btn { padding: 0; overflow: hidden; border: 1.5px solid var(--primary); }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
    .sub-header-title { font-family: var(--font-gaming); font-size: 18px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .sub-header-spacer { width: 38px; }

    .drawer-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); z-index: 150; }
    .side-drawer { position: absolute; top: 0; left: -320px; width: 290px; height: 100%; background: var(--bg-surface); border-right: 1px solid var(--border-color); z-index: 200; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; padding: 20px 16px; box-shadow: 10px 0 30px rgba(0,0,0,0.8); }
    .side-drawer.open { transform: translateX(320px); }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
    .drawer-user-info { display: flex; align-items: center; gap: 12px; }
    .avatar-round { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
    .user-meta h3 { font-family: var(--font-gaming); font-size: 18px; color: var(--text-main); line-height: 1.1; }
    .uid-tag { font-size: 11px; color: var(--accent-cyan); font-weight: 500; }
    .drawer-nav { flex: 1; overflow-y: auto; margin-top: 14px; display: flex; flex-direction: column; gap: 4px; }
    .drawer-link { display: flex; align-items: center; gap: 14px; padding: 10px 14px; color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; border-radius: var(--radius-sm); transition: var(--transition); background: transparent; border: none; width: 100%; text-align: left; cursor: pointer; }
    .drawer-link i { width: 18px; font-size: 16px; color: var(--text-dim); }
    .drawer-link:hover, .drawer-link:active { background: var(--bg-card); color: #fff; }
    .drawer-link.logout-link { color: var(--danger); }
    .drawer-divider { height: 1px; background: var(--border-color); margin: 8px 0; }
    .drawer-footer { padding-top: 12px; text-align: center; font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }

    .main-content { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 85px; position: relative; -webkit-overflow-scrolling: touch; }
    .view-container { padding: 16px; animation: fadeIn 0.22s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .screenshot-card {
      border: 1.5px solid #ff770055;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      background-color: transparent !important;
      background-size: cover !important;
      background-position: center !important;
      overflow: hidden;
    }
    .screenshot-card > * { position: relative; z-index: 2; }
    .screenshot-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .screenshot-card-logo { width: 22px; height: 22px; background: var(--primary); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
    .screenshot-brand-text { font-family: var(--font-gaming); font-size: 11px; letter-spacing: 1px; color: #ffbe00; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
    .screenshot-title { font-family: var(--font-gaming); font-size: 22px; font-weight: 800; color: #ffaa00; line-height: 1.1; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; text-shadow: 0 2px 6px rgba(0,0,0,0.98); }
    .screenshot-subtitle { font-size: 10px; font-weight: 700; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; text-shadow: 0 1px 5px rgba(0,0,0,0.98); }

    .led-signboard { background: #020305; border: 3px solid transparent; border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 14px; overflow: hidden; position: relative; box-shadow: 0 0 18px rgba(0, 240, 255, 0.35); background-image: radial-gradient(circle, #151c28 1px, transparent 1px); background-size: 6px 6px; }
    .led-signboard i { color: #ffbe00; font-size: 16px; filter: drop-shadow(0 0 6px #ffbe00); }
    .ticker-viewport { overflow: hidden; white-space: nowrap; width: 100%; position: relative; }
    .ticker-content { display: inline-block; font-family: var(--font-gaming); font-size: 14px; font-weight: 800; letter-spacing: 1.5px; background: linear-gradient(90deg, #ff1744, #00f0ff, #ffbe00, #00e676, #ff1744); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding-left: 100%; animation: smoothTicker 16s linear infinite; }
    @keyframes smoothTicker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
  
    .bottom-nav { height: var(--bottom-nav-height); background: rgba(14, 17, 24, 0.98); border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-around; padding: 0 8px; z-index: 110; position: absolute; bottom: 0; left: 0; right: 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; gap: 4px; width: 20%; transition: var(--transition); cursor: pointer; }
    .nav-item i { font-size: 18px; }
    .nav-item.active { color: var(--primary); }

    .category-scroll-container { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 14px 2px; margin-bottom: 14px; scrollbar-width: none; }
    .category-scroll-container::-webkit-scrollbar { display: none; }
    .cat-item { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; cursor: pointer; gap: 6px; }
    .cat-circle { width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg, #2b1218, #150a0d); border: 2px solid var(--primary); box-shadow: 0 4px 14px rgba(255, 70, 36, 0.3); display: flex; align-items: center; justify-content: center; color: var(--accent-gold); font-size: 18px; transition: var(--transition); }
    .cat-circle:active { transform: scale(0.92); }
    .cat-label { font-size: 11px; font-weight: 600; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }

    #admin-float-widget { position: absolute; bottom: 120px; right: 18px; z-index: 300; display: flex; flex-direction: column-reverse; align-items: center; }
    .bot-bubble { width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg, #1f293d, #0f131a); border: 2px solid var(--primary); box-shadow: 0 4px 20px rgba(255, 70, 36, 0.5); display: flex; align-items: center; justify-content: center; }
    .bot-bubble img { width: 34px; height: 34px; object-fit: contain; }
    .bot-badge-tag { margin-top: -6px; background: #ff4624; color: #fff; font-family: var(--font-gaming); font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 10px; }
    .support-popup-menu { display: none; flex-direction: column; gap: 8px; margin-bottom: 10px; align-items: center; }
    .support-popup-menu.show { display: flex; }
    .support-action-btn { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #ffbe00, #ff9800); border: 2px solid #fff; color: #000; display: flex; align-items: center; justify-content: center; font-size: 18px; text-decoration: none; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 18px; border-radius: var(--radius-sm); font-family: var(--font-gaming); font-size: 16px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; border: none; cursor: pointer; transition: var(--transition); }
    .btn-primary { background: linear-gradient(135deg, #ff5733, #e62200); color: #fff; box-shadow: 0 4px 18px var(--primary-glow); }
    .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-sm { padding: 8px 12px; font-size: 13px; width: auto; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-input { width: 100%; padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-ui); font-size: 14px; outline: none; transition: var(--transition); }
    
    .player-hero-card { background: linear-gradient(145deg, #181d29, #0f131a); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
    .hero-profile-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
    .hero-avatar { width: 52px; height: 52px; border-radius: 12px; border: 2px solid var(--primary); object-fit: cover; }
    .hero-details h2 { font-family: var(--font-gaming); font-size: 20px; font-weight: 700; line-height: 1.1; }
    .hero-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: var(--radius-sm); }
    .stat-box { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
    .stat-val { font-family: var(--font-gaming); font-size: 17px; font-weight: 700; color: #fff; }
    .stat-val.gold { color: var(--accent-gold); }
    .stat-val.green { color: var(--success); }

    .toast-container { position: absolute; bottom: 80px; left: 16px; right: 16px; z-index: 700; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast-msg { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 14px; color: #fff; font-size: 13px; }
    .toast-msg.toast-success { border-color: var(--success); }
    .toast-msg.toast-error { border-color: var(--danger); }
    .toast-msg.toast-info { border-color: var(--accent-cyan); }

    .global-loader { position: absolute; inset: 0; background: rgba(6, 7, 10, 0.9); backdrop-filter: blur(6px); z-index: 999; display: none; flex-direction: column; justify-content: center; align-items: center; gap: 16px; }
    .spinner-flame { width: 44px; height: 44px; border: 3px solid transparent; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loader-text { font-family: var(--font-gaming); letter-spacing: 1px; font-size: 14px; color: var(--text-muted); }

    /* MULTANI FF SQUAD CHAT FULL SCREEN UI */
    .squad-chat-banner {
      background: linear-gradient(135deg, #101726 0%, #090e18 100%);
      border: 1.5px solid #00d2ff;
      box-shadow: 0 0 18px rgba(0, 210, 255, 0.28);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .chat-banner-left { display: flex; align-items: center; gap: 12px; }
    .chat-glow-icon { font-size: 22px; background: rgba(0, 210, 255, 0.15); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid rgba(0, 210, 255, 0.35); color: #00d2ff; }
    .chat-banner-info { display: flex; flex-direction: column; }
    .banner-title { color: #ffffff; font-weight: 800; font-size: 14px; font-family: var(--font-gaming); letter-spacing: 1px; text-transform: uppercase; }
    .banner-sub { color: #00e676; font-size: 11px; font-weight: 600; margin-top: 2px; }
    .chat-banner-badge { background: rgba(0, 230, 118, 0.12); border: 1px solid #00e676; color: #00e676; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .pulse-dot { width: 7px; height: 7px; background-color: #00e676; border-radius: 50%; }

    #squad-chat-view {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      background: #0b141a;
      z-index: 550;
      display: none;
      flex-direction: column;
    }
    #squad-chat-view.active { display: flex !important; }

    .wa-header { background: #1f2c34; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; color: #e9edef; flex-shrink: 0; }
    .wa-header-left { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; }
    .wa-group-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1.5px solid #00a884; }
    .wa-title-block { display: flex; flex-direction: column; }
    .wa-group-name { font-size: 15px; font-weight: 700; color: #e9edef; font-family: var(--font-gaming); }
    .wa-status-text { font-size: 11px; color: #00e676; display: flex; align-items: center; gap: 5px; }

    .wa-menu-dropdown { position: absolute; top: 45px; right: 8px; background: #233138; border-radius: 8px; padding: 6px 0; min-width: 165px; display: none; z-index: 100; border: 1px solid rgba(255,255,255,0.08); }
    .wa-menu-dropdown.show { display: block; }
    .wa-menu-item { padding: 10px 16px; font-size: 13px; color: #d1d7db; display: flex; align-items: center; gap: 10px; cursor: pointer; }

    .wa-chat-body { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; background-color: #0b141a; background-image: radial-gradient(#1f2c34 1px, transparent 1px); background-size: 18px 18px; }
    .wa-msg-row { display: flex; gap: 8px; align-items: flex-end; width: 100%; }
    .wa-msg-row.mine { justify-content: flex-end; }
    .wa-msg-row.theirs { justify-content: flex-start; }
    .wa-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .wa-msg-bubble { max-width: 82%; padding: 7px 11px; border-radius: 8px; font-size: 13px; word-break: break-word; }
    .wa-msg-bubble.mine { background: #005c4b; color: #e9edef; }
    .wa-msg-bubble.theirs { background: #202c33; color: #e9edef; }

    .wa-sender-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 3px; font-size: 11px; }
    .wa-sender-name { font-weight: 700; color: #53bdeb; }
    .wa-sender-uid { font-size: 10px; color: #ffbe00; font-family: monospace; }
    .wa-quoted-box { background: rgba(0, 0, 0, 0.25); border-left: 3.5px solid #25d366; border-radius: 5px; padding: 4px 8px; margin-bottom: 5px; font-size: 11px; }
    .wa-quoted-sender { font-weight: 700; color: #25d366; }
    .wa-meta-line { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 9px; color: #8696a0; margin-top: 2px; }

    .wa-reply-bar { background: #1f2c34; border-left: 4px solid #00a884; padding: 6px 12px; display: none; justify-content: space-between; align-items: center; }
    .wa-reply-bar.show { display: flex; }
    .wa-input-container { background: #1f2c34; padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
    .wa-input-box { flex: 1; background: #2a3942; border-radius: 22px; padding: 8px 14px; display: flex; align-items: center; gap: 8px; }
    .wa-text-field { width: 100%; background: transparent; border: none; outline: none; color: #e9edef; font-size: 14px; }
    .wa-send-btn { width: 42px; height: 42px; border-radius: 50%; background: #00a884; border: none; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer; }

    /* FREE FIRE STICKER DRAWER */
    .ff-sticker-drawer { background: #182229; border-top: 1px solid #262f40; padding: 12px; display: none; grid-template-columns: repeat(4, 1fr); gap: 10px; max-height: 180px; overflow-y: auto; }
    .ff-sticker-drawer.show { display: grid; }
    .ff-sticker-item { background: #202c33; border: 1px solid #2d3b45; border-radius: 10px; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
    .ff-sticker-item img { width: 50px; height: 50px; object-fit: contain; }
    .ff-sticker-item span { font-size: 9px; font-weight: 700; color: #ffbe00; margin-top: 4px; }
    .chat-sticker-img { width: 95px; height: 95px; object-fit: contain; }

    .theme-modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.75); z-index: 650; display: none; align-items: center; justify-content: center; padding: 16px; }
    .theme-modal-overlay.show { display: flex; }
    .theme-modal-card { background: #1a2228; border: 1px solid #2d3b45; border-radius: 16px; width: 100%; max-width: 340px; padding: 18px; }
    .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .theme-pick-btn { border-radius: 10px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; border: 2px solid transparent; }
    .theme-dot { width: 22px; height: 22px; border-radius: 50%; }

    /* THEME OVERRIDES */
    body.theme-wa-green #squad-chat-view .wa-header { background: #005c4b; }
    body.theme-ocean #squad-chat-view .wa-header { background: #0a2540; }
    body.theme-purple #squad-chat-view .wa-header { background: #2b1044; }
    body.theme-orange #squad-chat-view .wa-header { background: #3b1803; }
    body.theme-amoled #squad-chat-view { background: #000; }
  </style>
</head>
<body>

  <div id="app-container">
    <header id="main-header" class="app-header">
      <div id="master-header-bar" class="header-bar">
        <button id="btn-hamburger" class="icon-btn"><i class="fa-solid fa-bars-staggered"></i></button>
        <div class="brand-logo" onclick="Router.navigate('home')">
          <span class="brand-sub">MULTANI FF</span>
          <span class="brand-main">ARENA</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn avatar-btn" onclick="Router.navigate('profile')">
            <img id="header-avatar-img" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100&auto=format&fit=crop&q=80" alt="Avatar" />
          </button>
        </div>
      </div>
    </header>

    <!-- SQUAD CHAT FULL SCREEN VIEW -->
    <div id="squad-chat-view">
      <div class="wa-header">

  <div id="toast-container" class="toast-container"></div>

  <script>
    const SUPABASE_URL = "https://yzirjidgdxhljbhhjfqp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_-dPl2eQV4afRDarZOR3QGA_RoDvmsX5";
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;
    const APK_DOWNLOAD_LINK = "https://www.mediafire.com/file/9rz2av8v75uoo7q/_MULTANI_FF_OFFICIAL_TOURNAMENT_20171925+%281%29.apk/file?dkey=4ejqto951zi&r=1369";

    const Toast = {
      show(msg, type = 'info') {
        const c = document.getElementById('toast-container');
        if (!c) return;
        const t = document.createElement('div');
        t.className = `toast-msg toast-${type}`;
        t.innerText = msg;
        c.appendChild(t);
        setTimeout(() => t.remove(), 2500);
      }
    };

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function syncAuthAndProfile() {
      try {
        const { data: { user } } = await sbClient.auth.getUser();
        currentUser = user;
        if (user) {
          const { data: profile } = await sbClient.from('profiles').select('*').eq('id', user.id).maybeSingle();
          currentProfile = profile;
        } else {
          currentProfile = null;
        }
        updateDrawerUI();
      } catch (e) {
        console.error("Auth sync:", e);
      }
    }

    function updateDrawerUI() {
      const dName = document.getElementById('drawer-name');
      const dUid = document.getElementById('drawer-uid');
      const hAvatar = document.getElementById('header-avatar-img');
      const dAvatar = document.getElementById('drawer-avatar');
      const avatarUrl = currentProfile?.avatar_url || 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100&auto=format&fit=crop&q=80';

      if (hAvatar) hAvatar.src = avatarUrl;
      if (dAvatar) dAvatar.src = avatarUrl;

      if (currentUser && currentProfile) {
        if (dName) dName.innerText = currentProfile.free_fire_name || currentProfile.full_name || 'Soldier';
        if (dUid) dUid.innerHTML = `UID: ${currentProfile.free_fire_uid || '--'}`;
      } else {
        if (dName) dName.innerText = 'Guest Gamer';
        if (dUid) dUid.innerHTML = `Login / Register`;
      }
    }

    const Router = {
      async navigate(page) {
        Drawer.close();
        if (page === 'home') renderHome();
      }
    };

    function renderHome() {
      const p = currentProfile || { free_fire_name: "Soldier", free_fire_uid: "Tap to Login", wallet_balance: 0, total_won: 0, total_matches: 0, phone: "No WhatsApp" };
      const tickerText = "🔥 WELCOME TO MULTANI FF OFFICIAL TOURNAMENT • BOOYAH PRIZES APPLIED • LIVE SQUAD CHAT ACTIVE!";

      document.getElementById('app-view').innerHTML = `
        <div class="view-container">
          <div class="led-signboard">
            <i class="fa-solid fa-bolt"></i>
            <div class="ticker-viewport">
              <div class="ticker-content">${escapeHTML(tickerText)}</div>
            </div>
          </div>

          <div class="player-hero-card">
            <div class="hero-profile-row">
              <div style="display:flex; align-items:center; gap:12px;">
                <img src="${p.avatar_url || 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100&auto=format&fit=crop&q=80'}" class="hero-avatar" />
                <div class="hero-details">
                  <h2>${escapeHTML(p.free_fire_name || 'Soldier')}</h2>
                  <span class="uid-tag"><i class="fa-solid fa-gamepad"></i> UID: ${escapeHTML(p.free_fire_uid || '--')}</span>
                  <div style="font-size:11px; color:var(--success); margin-top:2px; font-weight:600;"><i class="fa-brands fa-whatsapp"></i> ${escapeHTML(p.phone || '')}</div>
                </div>
              </div>
            </div>
            <div class="hero-stats-grid">
              <div class="stat-box"><span class="stat-label">Balance</span><span class="stat-val gold">PKR ${p.wallet_balance || 0}</span></div>
              <div class="stat-box"><span class="stat-label">Won</span><span class="stat-val green">PKR ${p.total_won || 0}</span></div>
              <div class="stat-box"><span class="stat-label">Matches</span><span class="stat-val">${p.total_matches || 0}</span></div>
            </div>
          </div>

          <div style="margin-bottom:12px;">
            <a href="${APK_DOWNLOAD_LINK}" target="_blank" class="btn btn-primary" style="padding:12px 16px; font-size:15px; background:linear-gradient(135deg, #00f0ff, #0077ff); color:#000; font-weight:800; text-decoration:none;">
              <i class="fa-solid fa-cloud-arrow-down" style="font-size:18px;"></i> DOWNLOAD OFFICIAL APP
            </a>
          </div>

          <div class="squad-chat-banner" onclick="SquadChat.open()">
            <div class="chat-banner-left">
              <div class="chat-glow-icon"><i class="fa-solid fa-comments"></i></div>
              <div class="chat-banner-info">
                <span class="banner-title">MULTANI FF SQUAD</span>
                <span class="banner-sub">Global Squad Chat • Live</span>
              </div>
            </div>
            <div class="chat-banner-badge">
              <span class="pulse-dot"></span> OPEN CHAT
            </div>
          </div>

          <div class="category-scroll-container">
            <div class="cat-item" onclick="Toast.show('Matches Section', 'info')">
              <div class="cat-circle"><i class="fa-solid fa-trophy"></i></div>
              <span class="cat-label">Matches</span>
            </div>
            <div class="cat-item" onclick="Toast.show('Withdraw Section', 'info')">
              <div class="cat-circle" style="border-color:var(--accent-cyan);"><i class="fa-solid fa-money-bill-transfer" style="color:var(--accent-cyan)"></i></div>
              <span class="cat-label">Withdraw</span>
            </div>
            <div class="cat-item" onclick="Toast.show('Add Cash', 'info')">
              <div class="cat-circle"><i class="fa-solid fa-circle-arrow-down" style="color:var(--accent-cyan)"></i></div>
              <span class="cat-label">Add Cash</span>
            </div>
            <div class="cat-item" onclick="Toast.show('Daily Spin', 'info')">
              <div class="cat-circle" style="border-color:var(--accent-gold);"><i class="fa-solid fa-dharmachakra" style="color:var(--accent-gold)"></i></div>
              <span class="cat-label">Daily Spin</span>
            </div>
            <div class="cat-item" onclick="Toast.show('Wallet', 'info')">
              <div class="cat-circle"><i class="fa-solid fa-wallet" style="color:var(--primary)"></i></div>
              <span class="cat-label">Wallet</span>
            </div>
          </div>

          <div class="social-footer">
            <p>Connect With Us</p>
            <div class="social-icons-row">
              <a href="https://whatsapp.com/channel/0029Vb9CdLqHbFV9Q7mBEB1v" target="_blank" class="social-icon-btn whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
              <a href="https://www.tiktok.com/@multaniffgaming7" target="_blank" class="social-icon-btn tiktok"><i class="fa-brands fa-tiktok"></i> TikTok</a>
              <a href="https://youtube.com/@multaniff-b2k?si=ZSI9KImSRvDH8U17" target="_blank" class="social-icon-btn youtube"><i class="fa-brands fa-youtube"></i> YouTube</a>
            </div>
          </div>
        </div>
      `;
    }

    /* SQUAD CHAT LOGIC */
    const SquadChat = {
      messages: [],
      replyingTo: null,
      availableThemes: [
        { id: "default", name: "Dark", color: "#0e1118", border: "#262f40" },
        { id: "wa-green", name: "Green", color: "#005c4b", border: "#25d366" },
        { id: "ocean", name: "Ocean", color: "#0a2540", border: "#00d2ff" },
        { id: "purple", name: "Purple", color: "#2b1044", border: "#bb86fc" },
        { id: "orange", name: "Orange", color: "#3b1803", border: "#ff5722" },
        { id: "amoled", name: "AMOLED", color: "#000000", border: "#ffffff" }
      ],

      applyTheme(themeName) {
        document.body.classList.remove('theme-wa-green', 'theme-ocean', 'theme-purple', 'theme-orange', 'theme-amoled');
        if (themeName && themeName !== 'default') document.body.classList.add(`theme-${themeName}`);
        localStorage.setItem('squad_chat_theme', themeName);
        this.closeThemeModal();
      },

      openThemeModal() {
        this.closeMenu();
        const currentTheme = localStorage.getItem('squad_chat_theme') || 'default';
        const grid = document.getElementById('theme-grid-boxes');
        if (grid) {
          grid.innerHTML = this.availableThemes.map(t => `
            <div class="theme-pick-btn" style="background:${t.color}; border-color:${currentTheme === t.id ? '#00ff88' : t.border};" onclick="SquadChat.applyTheme('${t.id}')">
              <span class="theme-dot" style="background:${t.border};"></span>
              <span style="font-size:11px; color:#fff;">${t.name}</span>
            </div>
          `).join('');
        }
        document.getElementById('wa-theme-modal').classList.add('show');
      },

      closeThemeModal() {
        const m = document.getElementById('wa-theme-modal');
        if (m) m.classList.remove('show');
      },

      toggleStickers() {
        const drawer = document.getElementById('ff-sticker-drawer');
        if (drawer) drawer.classList.toggle('show');
      },

      async sendSticker(stickerUrl, stickerName) {
        this.toggleStickers();
        await this.postPayload(stickerUrl, 'sticker');
      },

      open() {
        document.getElementById('squad-chat-view').classList.add('active');
        this.fetchMessages();
        this.subscribeRealtime();
      },

      close() {
        document.getElementById('squad-chat-view').classList.remove('active');
        this.closeMenu();
        this.cancelReply();
      },

      toggleMenu() {
        const d = document.getElementById('wa-menu-dropdown');
        if (d) d.classList.toggle('show');
      },

      closeMenu() {
        const d = document.getElementById('wa-menu-dropdown');
        if (d) d.classList.remove('show');
      },

      clearLocalMessages() {
        this.closeMenu();
        document.getElementById('wa-chat-body').innerHTML = `<div style="text-align:center; padding:20px; font-size:11px; color:#8696a0;">Chat cleared locally.</div>`;
      },

      async fetchMessages() {
        try {
          const { data } = await sbClient.from('squad_messages').select('*').order('created_at', { ascending: true }).limit(50);
          if (data) {
            this.messages = data;
            this.renderMessages();
          }
        } catch (e) {
          console.error(e);
        }
      },

      subscribeRealtime() {
        sbClient.channel('public:squad_messages')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'squad_messages' }, payload => {
            this.messages.push(payload.new);
            this.renderMessages();
          })
          .subscribe();
      },

      renderMessages() {
        const container = document.getElementById('wa-chat-body');
        if (!container) return;

        container.innerHTML = this.messages.map(m => {
          const isMine = (currentUser && m.user_id === currentUser.id);
          const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const dp = m.avatar_url || 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100&auto=format&fit=crop&q=80';

          let content = escapeHTML(m.message);
          if (m.msg_type === 'sticker') {
            content = `<img src="${m.message}" class="chat-sticker-img" />`;
          }

          return `
            <div class="wa-msg-row ${isMine ? 'mine' : 'theirs'}">
              ${!isMine ? `<img src="${dp}" class="wa-avatar" />` : ''}
              <div class="wa-msg-bubble ${isMine ? 'mine' : 'theirs'}">
                ${!isMine ? `
                  <div class="wa-sender-header">
                    <span class="wa-sender-name">~ ${escapeHTML(m.player_name)}</span>
                    <span class="wa-sender-uid">${escapeHTML(m.player_uid)}</span>
                  </div>
                ` : ''}
                <div>${content}</div>
                <div class="wa-meta-line"><span>${time}</span></div>
              </div>
            </div>
          `;
        }).join('');

        container.scrollTop = container.scrollHeight;
      },

      cancelReply() {
        this.replyingTo = null;
        document.getElementById('wa-reply-bar').classList.remove('show');
      },

      async sendMessage(e) {
        e.preventDefault();
        const input = document.getElementById('wa-msg-input');
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        await this.postPayload(text, 'text');
      },

      async postPayload(content, type = 'text') {
        const payload = {
          user_id: currentUser ? currentUser.id : null,
          player_name: currentProfile?.free_fire_name || 'Soldier',
          player_uid: currentProfile?.free_fire_uid || 'UID: --',
          avatar_url: currentProfile?.avatar_url || '',
          message: content,
          msg_type: type
        };

        const { error } = await sbClient.from('squad_messages').insert([payload]);
        if (error) {
          Toast.show("Message send failed. Check database permissions.", "error");
        }
      }
    };

    const Drawer = {
      open() {
        document.getElementById('side-drawer').classList.add('open');
        document.getElementById('drawer-overlay').style.display = 'block';
      },
      close() {
        document.getElementById('side-drawer').classList.remove('open');
        document.getElementById('drawer-overlay').style.display = 'none';
      }
    };

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('btn-hamburger').onclick = () => Drawer.open();
      document.getElementById('float-main-btn').onclick = () => {
        document.getElementById('support-popup-menu').classList.toggle('show');
      };

      document.getElementById('btn-drawer-logout').onclick = async () => {
        await sbClient.auth.signOut();
        location.reload();
      };

      // App bina kisi blocking loader ke direct open hogi:
      renderHome();
      await syncAuthAndProfile();
      renderHome();
    });
  </script>
