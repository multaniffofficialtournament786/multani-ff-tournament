<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <meta name="google-site-verification" content="AoFuCJIFEHGeGRieVxZp5WBCI6JI84rj_bLzmDuz0s8" />

  <title>Multani FF Official Tournament - Pakistan's #1 Free Fire Esports & Custom Room Platform</title>
  <meta name="description" content="Welcome to Multani FF Official Tournament, Pakistan's leading Free Fire esports platform." />
  <meta name="theme-color" content="#0a0a0f" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-base: #06070a;
      --bg-surface: #0e1118;
      --bg-card: #151922;
      --border-color: #262f40;
      --primary: #ff4624;
      --primary-glow: rgba(255, 70, 36, 0.45);
      --accent-cyan: #00f0ff;
      --accent-cyan-glow: rgba(0, 240, 255, 0.4);
      --accent-gold: #ffbe00;
      --accent-gold-glow: rgba(255, 190, 0, 0.4);
      --success: #00e676;
      --danger: #ff1744;
      --text-main: #f3f4f6;
      --text-muted: #8e9bb0;
      --text-dim: #5c687a;
      --header-height: 56px;
      --bottom-nav-height: 64px;
      --max-app-width: 430px;
      --font-gaming: 'Rajdhani', sans-serif;
      --font-ui: 'Inter', sans-serif;
      --radius: 14px;
      --radius-sm: 8px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);

      --squad-header-bg: #075e54;
      --squad-bubble-mine: #005c4b;
      --squad-bubble-theirs: #202c33;
      --squad-text-mine: #ffffff;
      --squad-text-theirs: #e9edef;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    body { background-color: #020203; color: var(--text-main); font-family: var(--font-ui); min-height: 100dvh; display: flex; justify-content: center; align-items: center; user-select: none; }
    
    #app-container { 
      width: 100%; 
      max-width: var(--max-app-width); 
      height: 100dvh; 
      background-color: var(--bg-base); 
      display: flex; 
      flex-direction: column; 
      position: relative; 
      overflow: hidden; 
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 2px rgba(255, 70, 36, 0.3); 
    }
    @media (min-width: 431px) { #app-container { height: 94vh; border-radius: 28px; border: 1px solid #1f2636; } }

    .app-header { position: sticky; top: 0; z-index: 100; height: var(--header-height); background: rgba(14, 17, 24, 0.96); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
    .header-bar { height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .brand-logo { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .brand-sub { font-family: var(--font-gaming); font-size: 10px; letter-spacing: 3px; color: var(--primary); font-weight: 700; line-height: 1; }
    .brand-main { font-family: var(--font-gaming); font-size: 19px; font-weight: 800; letter-spacing: 1.5px; background: linear-gradient(90deg, #ffffff, #ffb39e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .icon-btn { background: transparent; border: none; color: var(--text-main); font-size: 18px; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); position: relative; }
    .icon-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.05); }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .avatar-btn { padding: 0; overflow: hidden; border: 1.5px solid var(--primary); }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
    .sub-header-title { font-family: var(--font-gaming); font-size: 18px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .sub-header-spacer { width: 38px; }

    .drawer-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); z-index: 150; }
    .side-drawer { position: absolute; top: 0; left: -320px; width: 290px; height: 100%; background: var(--bg-surface); border-right: 1px solid var(--border-color); z-index: 200; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; padding: 20px 16px; box-shadow: 10px 0 30px rgba(0,0,0,0.8); }
    .side-drawer.open { transform: translateX(320px); }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
    .drawer-user-info { display: flex; align-items: center; gap: 12px; }
    .avatar-round { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
    .user-meta h3 { font-family: var(--font-gaming); font-size: 18px; color: var(--text-main); line-height: 1.1; }
    .uid-tag { font-size: 11px; color: var(--accent-cyan); font-weight: 500; }
    .drawer-nav { flex: 1; overflow-y: auto; margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
    .drawer-link { display: flex; align-items: center; gap: 14px; padding: 10px 14px; color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; border-radius: var(--radius-sm); transition: var(--transition); background: transparent; border: none; width: 100%; text-align: left; cursor: pointer; }
    .drawer-link i { width: 18px; font-size: 16px; color: var(--text-dim); }
    .drawer-link:hover, .drawer-link:active { background: var(--bg-card); color: #fff; }
    .drawer-link.logout-link { color: var(--danger); }
    .drawer-divider { height: 1px; background: var(--border-color); margin: 8px 0; }
    .drawer-footer { padding-top: 12px; text-align: center; font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }

    .drawer-squad-btn {
      background: linear-gradient(135deg, rgba(37, 211, 102, 0.25), rgba(7, 94, 84, 0.5)) !important;
      border: 1.5px solid #25d366 !important;
      color: #fff !important;
      font-weight: 700 !important;
      border-radius: 10px !important;
    }
    .drawer-squad-btn i { color: #25d366 !important; font-size: 18px !important; }

    .main-content { 
      flex: 1; 
      overflow-y: auto; 
      overflow-x: hidden; 
      padding-bottom: 85px; 
      position: relative; 
      -webkit-overflow-scrolling: touch; 
    }
    .view-container { padding: 16px; animation: fadeIn 0.22s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .screenshot-card {
      border: 1.5px solid #ff770055;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      background-color: #11151e !important;
      background-size: cover !important;
      background-position: center !important;
      overflow: hidden;
    }
    .screenshot-card > * { position: relative; z-index: 2; }
    .screenshot-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .screenshot-card-logo { width: 22px; height: 22px; background: var(--primary); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
    .screenshot-brand-text { font-family: var(--font-gaming); font-size: 11px; letter-spacing: 1px; color: #ffbe00; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
    .screenshot-title { font-family: var(--font-gaming); font-size: 22px; font-weight: 800; color: #ffaa00; line-height: 1.1; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .screenshot-subtitle { font-size: 10px; font-weight: 700; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

    .rules-dropdown-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); margin-bottom: 14px; overflow: hidden; }
    .rules-dropdown-header { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #1a1e29; }
    .rules-dropdown-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; padding: 0 14px; background: #12151d; font-size: 12px; color: #c7cbd1; line-height: 1.6; }
    .rules-dropdown-container.open .rules-dropdown-content { max-height: 1800px; padding: 12px 14px; }
    .rules-dropdown-container.open .rules-arrow { transform: rotate(180deg); }
    .rules-arrow { transition: transform 0.3s ease; color: var(--accent-gold); font-size: 12px; }

    .filter-tab-btn { padding: 8px 10px; border-radius: 8px; font-family: var(--font-gaming); font-size: 11px; font-weight: 700; background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); white-space: nowrap; cursor: pointer; }
    .filter-tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .led-signboard { background: #020305; border: 2px solid #262f40; border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 14px; overflow: hidden; }
    .led-signboard i { color: #ffbe00; font-size: 16px; }
    .ticker-viewport { overflow: hidden; white-space: nowrap; width: 100%; }
    .ticker-content { display: inline-block; font-family: var(--font-gaming); font-size: 14px; font-weight: 800; letter-spacing: 1px; color: #ffbe00; padding-left: 100%; animation: smoothTicker 18s linear infinite; }
    @keyframes smoothTicker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
  
    .bottom-nav { height: var(--bottom-nav-height); background: rgba(14, 17, 24, 0.98); border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-around; padding: 0 8px; z-index: 110; position: absolute; bottom: 0; left: 0; right: 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; gap: 4px; width: 20%; cursor: pointer; }
    .nav-item i { font-size: 18px; }
    .nav-item.active { color: var(--primary); }

    .category-scroll-container { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 14px 2px; margin-bottom: 14px; scrollbar-width: none; }
    .category-scroll-container::-webkit-scrollbar { display: none; }
    .cat-item { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; cursor: pointer; gap: 6px; }
    .cat-circle { width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg, #2b1218, #150a0d); border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; color: var(--accent-gold); font-size: 18px; }
    .cat-label { font-size: 11px; font-weight: 600; color: var(--text-main); text-transform: uppercase; }

    #admin-float-widget { position: absolute; bottom: 90px; right: 18px; z-index: 300; display: flex; flex-direction: column-reverse; align-items: center; cursor: pointer; }
    .bot-bubble { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #1f293d, #0f131a); border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
    .bot-bubble img { width: 32px; height: 32px; object-fit: contain; }
    .bot-badge-tag { margin-top: -6px; background: #ff4624; color: #fff; font-family: var(--font-gaming); font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 10px; }
    .support-popup-menu { display: none; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .support-popup-menu.show { display: flex; }
    .support-action-btn { width: 42px; height: 42px; border-radius: 50%; background: #ff9800; border: 2px solid #fff; color: #000; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; text-decoration: none; }

    /* FULL PAGE WHATSAPP SQUAD CHAT SCREEN */
    #squad-chat-screen {
      position: absolute;
      inset: 0;
      background-color: #0b141a;
      z-index: 500;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .squad-chat-header {
      height: 60px;
      background: var(--squad-header-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: #fff;
      z-index: 10;
      flex-shrink: 0;
    }
    .squad-chat-top-left { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .squad-avatar-box { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.4); }
    .squad-avatar-box img { width: 100%; height: 100%; object-fit: cover; }
    .squad-header-info h3 { font-size: 15px; font-weight: 700; color: #fff; }
    .squad-header-info span { font-size: 11px; color: #25d366; font-weight: 600; }
    
    .squad-dropdown-menu {
      position: absolute;
      top: 55px;
      right: 12px;
      background: #233138;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      padding: 6px 0;
      min-width: 180px;
      z-index: 100;
      display: none;
      flex-direction: column;
    }
    .squad-dropdown-menu.show { display: flex; }
    .squad-drop-item {
      padding: 10px 16px;
      font-size: 13px;
      color: #e9edef;
      background: transparent;
      border: none;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .squad-drop-item:hover { background: #182229; }

    .squad-chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-size: cover;
      background-position: center;
      -webkit-overflow-scrolling: touch;
    }
    
    .squad-msg-wrapper { display: flex; gap: 8px; width: 100%; align-items: flex-start; }
    .squad-msg-wrapper.mine { justify-content: flex-end; }
    .squad-user-dp { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .squad-bubble {
      max-width: 78%;
      padding: 6px 10px;
      border-radius: 8px;
      word-break: break-word;
      font-size: 13.5px;
      line-height: 1.35;
      position: relative;
    }
    .squad-bubble.mine { background: var(--squad-bubble-mine); color: var(--squad-text-mine); border-top-right-radius: 2px; }
    .squad-bubble.theirs { background: var(--squad-bubble-theirs); color: var(--squad-text-theirs); border-top-left-radius: 2px; }
    .squad-sender-header { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; margin-bottom: 2px; }
    .squad-ign-color { color: #53bdeb; }
    .squad-uid-tag { color: #ffbe00; font-family: monospace; font-size: 10px; }
    .squad-time { font-size: 9.5px; opacity: 0.65; float: right; margin-left: 10px; margin-top: 4px; }

    .squad-chat-footer {
      background: #202c33;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .squad-input-wrap {
      flex: 1;
      background: #2a3942;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 6px 12px;
      gap: 8px;
    }
    .squad-input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
    }
    .squad-send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #00a884;
      border: none;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    #stickers-drawer {
      height: 180px;
      background: #111b21;
      border-top: 1px solid #222d34;
      padding: 10px;
      display: none;
      overflow-y: auto;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    #stickers-drawer.show { display: grid; }
    .sticker-item-btn {
      background: #202c33;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
      cursor: pointer;
      gap: 4px;
    }
    .sticker-item-btn span.emoji-icon { font-size: 32px; line-height: 1; }
    .sticker-item-btn span.label { font-size: 10px; color: var(--accent-gold); font-weight: 700; }

    #wallpaper-modal {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 600;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #wallpaper-modal.show { display: flex; }
    .wallpaper-dialog {
      background: #182229;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      padding: 18px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .wallpaper-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; }
    .wp-box { height: 60px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 18px; border-radius: var(--radius-sm); font-family: var(--font-gaming); font-size: 16px; font-weight: 700; border: none; cursor: pointer; text-transform: uppercase; }
    .btn-primary { background: linear-gradient(135deg, #ff5733, #e62200); color: #fff; }
    .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-sm { padding: 8px 12px; font-size: 13px; width: auto; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-input { width: 100%; padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; font-size: 14px; outline: none; }
    .player-hero-card { background: linear-gradient(145deg, #181d29, #0f131a); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
    .hero-profile-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .hero-avatar { width: 50px; height: 50px; border-radius: 12px; border: 2px solid var(--primary); object-fit: cover; }
    .hero-details h2 { font-family: var(--font-gaming); font-size: 20px; font-weight: 700; }
    .hero-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: var(--radius-sm); }
    .stat-box { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
    .stat-val { font-family: var(--font-gaming); font-size: 17px; font-weight: 700; color: #fff; }
    .stat-val.gold { color: var(--accent-gold); }
    .stat-val.green { color: var(--success); }
    .section-title { font-family: var(--font-gaming); font-size: 17px; font-weight: 700; text-transform: uppercase; margin: 18px 0 10px 0; display: flex; justify-content: space-between; align-items: center; }
    
    .tournaments-stack-as8 { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .t-card-as8-large { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
    .t-card-thumb-large { width: 100%; height: 160px; background: #000; cursor: pointer; }
    .t-card-thumb-large img { width: 100%; height: 100%; object-fit: cover; }
    .t-card-info-large { padding: 12px; display: flex; flex-direction: column; gap: 6px; background: #11151e; }
    .t-card-title-large { font-family: var(--font-gaming); font-size: 16px; font-weight: 700; color: #fff; }
    .t-card-meta-large { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); }

    .wallet-hero { background: linear-gradient(135deg, #1d1b28, #10121a); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 20px; text-align: center; margin-bottom: 16px; }
    .wallet-balance-title { font-size: 12px; text-transform: uppercase; color: var(--text-muted); }
    .wallet-amount { font-family: var(--font-gaming); font-size: 38px; font-weight: 800; color: var(--accent-gold); margin: 6px 0 14px 0; }
    .toast-container { position: absolute; bottom: 80px; left: 16px; right: 16px; z-index: 600; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast-msg { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 14px; color: #fff; font-size: 13px; pointer-events: auto; }
    .global-loader { position: absolute; inset: 0; background: rgba(6, 7, 10, 0.88); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; }
    .spinner-flame { width: 44px; height: 44px; border: 3px solid transparent; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    const Toast = {

    const Loader = {

      renderStickers() {

      open() {

        document.getElementById('squad-chat-screen').classList.add('hidden');

        document.getElementById('squad-dropdown-menu')?.classList.toggle('show');

      },

        document.getElementById('wallpaper-modal')?.classList.remove('show');
      },

      setWallpaper(type) {
        const body = document.getElementById('squad-chat-body');
        if (type === 'classic') body.style.background = "#0b141a";
        else if (type === 'amoled') body.style.background = "#000000";
        else if (type === 'gradient') body.style.background = "linear-gradient(135deg,#1f1c2c,#928dab)";
        else if (type === 'gaming') body.style.background = "linear-gradient(135deg,#232526,#414345)";
        localStorage.setItem('squad_wp', type);
        this.closeWallpaperModal();
        Toast.show("Wallpaper changed!");
      },

      applySavedWallpaper() {
        const saved = localStorage.getItem('squad_wp') || 'classic';
        this.setWallpaper(saved);
      },

      cycleTheme() {
        this.closeMenu();
        let idx = parseInt(localStorage.getItem('squad_th') || '0');
        idx = (idx + 1) % this.themes.length;
        localStorage.setItem('squad_th', idx.toString());
        const t = this.themes[idx];
        document.documentElement.style.setProperty('--squad-header-bg', t.header);
        document.documentElement.style.setProperty('--squad-bubble-mine', t.mine);
        document.documentElement.style.setProperty('--squad-bubble-theirs', t.theirs);
        Toast.show(t.name);

        this.closeMenu();
        this.messages = [];
        this.renderMessages();
        Toast.show("Chat cleared");
      },

      renderMessages() {
        const body = document.getElementById('squad-chat-body');
        if (!body) return;

        body.innerHTML = this.messages.map(m => `

                    <span style="color:var(--accent-gold);">Prize: PKR ${t.prize_pool || 0}</span>
                  </div>
                  <button onclick="Router.navigate('tournaments')" class="btn btn-primary btn-sm" style="margin-top:6px;">JOIN MATCH (${t.entry_fee == 0 ? 'FREE' : t.entry_fee + ' PKR'})</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderDailySpin() {
      document.getElementById('app-view').innerHTML = `
        <div class="view-container" style="text-align:center;">
          <h2 style="font-family:var(--font-gaming); font-size:22px; color:#ffaa00;">DAILY SPIN</h2>
          <p style="font-size:12px; color:#888; margin:14px 0;">Earn free bonus coins every 24 hours.</p>
          <button onclick="Toast.show('Spin claimed!')" class="btn btn-primary" style="max-width:200px; margin:0 auto;">SPIN NOW</button>
        </div>
      `;
    }

    async function renderTournaments() {
      const view = document.getElementById('app-view');
      view.innerHTML = `
        <div class="view-container">
          <div class="section-title"><span>Available Matches</span></div>
          <div class="tournaments-stack-as8">
            ${activeTournaments.map(t => `
              <div class="t-card-as8-large">
                <div class="t-card-info-large">
                  <h4 class="t-card-title-large">${escapeHTML(t.title)}</h4>
                  <p style="font-size:12px; color:#aaa;">Prize: PKR ${t.prize_pool} \vert{} Entry:${t.entry_fee} PKR</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderWallet() {
      document.getElementById('app-view').innerHTML = `
        <div class="view-container">
          <div class="wallet-hero">
            <span class="wallet-balance-title">Balance</span>
            <div class="wallet-amount">PKR ${currentProfile?.wallet_balance || 0}</div>
            <div style="display:flex; gap:10px;">
              <button class="btn btn-primary" style="flex:1;" onclick="Router.navigate('withdrawal')">Withdraw</button>
              <button class="btn btn-secondary" style="flex:1;" onclick="Router.navigate('deposit')">Deposit</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderWithdrawal() {
      document.getElementById('app-view').innerHTML = `
        <div class="view-container">
          <div class="player-hero-card">
            <h3 style="color:var(--accent-gold); font-family:var(--font-gaming); margin-bottom:12px;">WITHDRAW FUNDS</h3>
            <div class="form-group"><label class="form-label">Amount</label><input type="number" class="form-input" placeholder="Min 200 PKR" /></div>
            <button onclick="Toast.show('Withdrawal submitted!')" class="btn btn-primary">SUBMIT</button>
          </div>
        </div>
      `;
    }

    function renderDeposit() {
      document.getElementById('app-view').innerHTML = `
        <div class="view-container">
          <div class="player-hero-card">
            <h4 style="color:var(--accent-gold);">Deposit Accounts</h4>
            <div style="font-size:16px; font-weight:bold; color:var(--accent-cyan); margin-top:6px;">03186815926 (Easypaisa)</div>
            <div style="font-size:12px; color:#aaa;">Title: MUHAMMAD NADEEM</div>
          </div>
        </div>
      `;
    }

    function renderProfile() {
      const p = currentProfile || {};
      document.getElementById('app-view').innerHTML = `
        <div class="view-container" style="text-align:center;">
          <div class="player-hero-card">
            <img src="${p.avatar_url || 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100&auto=format&fit=crop&q=80'}" style="width:70px; height:70px; border-radius:50%; border:2px solid var(--primary); margin:0 auto 10px auto;" />
            <h3 style="font-family:var(--font-gaming); font-size:18px;">${escapeHTML(p.free_fire_name || 'Soldier')}</h3>
            <span class="uid-tag">UID: ${escapeHTML(p.free_fire_uid || '--')}</span>
          </div>
        </div>
      `;
    }

    function renderRules() {
      document.getElementById('app-view').innerHTML = `
        <div class="view-container">
          <div class="player-hero-card">
            <h3 style="color:var(--accent-gold); font-family:var(--font-gaming); margin-bottom:8px;">Rules</h3>
            <p style="font-size:12px; color:#aaa; line-height:1.6;">Fair play mandatory. Hacks & teaming result in instant account ban.</p>
          </div>
        </div>
      `;
    }

    function renderAuth(mode = 'login') {
      const isLogin = (mode === 'login');
      document.getElementById('app-view').innerHTML = `
        <div class="view-container">
          <div class="arena-login-wrap">
            <h2 class="arena-title">MULTANI FF ARENA</h2>
            <p class="arena-subtitle">${isLogin ? 'Sign in to your account' : 'Register to join tournaments'}</p>
            <form id="auth-form">
              ${!isLogin ? `
                <div class="arena-input-box"><input type="text" id="reg-ign" class="arena-field" placeholder="Free Fire IGN" required /></div>
                <div class="arena-input-box"><input type="text" id="reg-uid" class="arena-field" placeholder="Free Fire UID" required /></div>
              ` : ''}
              <div class="arena-input-box"><input type="email" id="auth-email" class="arena-field" placeholder="Email" required /></div>
              <div class="arena-input-box"><input type="password" id="auth-pass" class="arena-field" placeholder="Password" required /></div>
              <button type="submit" class="btn btn-primary">${isLogin ? 'LOGIN' : 'SIGN UP'}</button>
            </form>
            <div style="text-align:center; font-size:13px; color:var(--text-muted); margin-top:16px;">
              ${isLogin ? `Don't have an account? <span onclick="Router.navigate('register')" style="color:var(--primary); font-weight:bold; cursor:pointer;">Sign Up</span>` : `Have an account? <span onclick="Router.navigate('login')" style="color:var(--primary); font-weight:bold; cursor:pointer;">Login</span>`}
            </div>
          </div>
        </div>
      `;

      document.getElementById('auth-form').onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-pass').value;

        Loader.show();
        try {
          if (isLogin) {
            const { error } = await sbClient.auth.signInWithPassword({ email, password: pass });
            if (error) throw error;
          } else {
            const ign = document.getElementById('reg-ign').value;
            const uid = document.getElementById('reg-uid').value;
            const { data, error } = await sbClient.auth.signUp({ email, password: pass });
            if (error) throw error;
            if (data.user) {
              await sbClient.from('profiles').upsert([{ id: data.user.id, email, free_fire_name: ign, free_fire_uid: uid, wallet_balance: 0 }]);
            }
          }
          await syncAuthAndProfile();
          Router.navigate('home');
        } catch (err) {
          Toast.show(err.message, "error");
        } finally {
          Loader.hide();
        }
      };
    }

    const Drawer = {
      open() {
        document.getElementById('side-drawer').classList.add('open');
        document.getElementById('drawer-overlay').classList.remove('hidden');
      },
      close() {
        document.getElementById('side-drawer').classList.remove('open');
        document.getElementById('drawer-overlay').classList.add('hidden');
      }
    };

    function toggleSupportMenu() {
      document.getElementById('support-popup-menu')?.classList.toggle('show');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('btn-hamburger').onclick = () => Drawer.open();
      document.getElementById('btn-drawer-logout').onclick = async () => {
        Drawer.close();
        await sbClient.auth.signOut();
        currentUser = null;
        currentProfile = null;
        Router.navigate('login');
      };

      SquadChat.init();

      Loader.show();
      await syncAuthAndProfile();
      Loader.hide();

      if (currentUser) Router.navigate('home');
      else Router.navigate('login');
    });
  </script>
</body>
</html>
