<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MULTANI FF OFFICIAL TOURNAMENT</title>
  <meta name="description" content="Pakistan's Ultimate Free Fire Tournament Platform" />
  <meta name="theme-color" content="#0a0a0f" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-base: #06070a;
      --bg-surface: #0e1118;
      --bg-card: #151922;
      --border-color: #262f40;
      --primary: #ff4624;
      --primary-glow: rgba(255, 70, 36, 0.45);
      --accent-cyan: #00f0ff;
      --accent-cyan-glow: rgba(0, 240, 255, 0.4);
      --accent-gold: #ffbe00;
      --accent-gold-glow: rgba(255, 190, 0, 0.4);
      --success: #00e676;
      --danger: #ff1744;
      --text-main: #f3f4f6;
      --text-muted: #8e9bb0;
      --text-dim: #5c687a;
      --header-height: 60px;
      --bottom-nav-height: 68px;
      --max-app-width: 430px;
      --font-gaming: 'Rajdhani', sans-serif;
      --font-ui: 'Inter', sans-serif;
      --radius: 12px;
      --radius-sm: 8px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #020203; color: var(--text-main); font-family: var(--font-ui); min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow-x: hidden; user-select: none; }
    #app-container { width: 100%; max-width: var(--max-app-width); height: 100vh; min-height: 100dvh; background-color: var(--bg-base); display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 2px rgba(255, 70, 36, 0.3); }
    @media (min-width: 431px) { #app-container { height: 94vh; border-radius: 28px; border: 1px solid #1f2636; } }
    .app-header { position: sticky; top: 0; z-index: 100; height: var(--header-height); background: rgba(14, 17, 24, 0.96); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); }
    .header-bar { height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .brand-logo { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .brand-sub { font-family: var(--font-gaming); font-size: 10px; letter-spacing: 3px; color: var(--primary); font-weight: 700; line-height: 1; }
    .brand-main { font-family: var(--font-gaming); font-size: 19px; font-weight: 800; letter-spacing: 1.5px; background: linear-gradient(90deg, #ffffff, #ffb39e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .icon-btn { background: transparent; border: none; color: var(--text-main); font-size: 18px; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); }
    .icon-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.05); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .avatar-btn { padding: 0; overflow: hidden; border: 1.5px solid var(--primary); }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
    .badge-dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; background-color: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); }
    .back-btn { width: auto; gap: 6px; font-family: var(--font-gaming); font-size: 16px; font-weight: 700; color: var(--text-muted); }
    .sub-header-title { font-family: var(--font-gaming); font-size: 18px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .sub-header-spacer { width: 38px; }
    .drawer-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); z-index: 150; }
    .side-drawer { position: absolute; top: 0; left: -320px; width: 290px; height: 100%; background: var(--bg-surface); border-right: 1px solid var(--border-color); z-index: 200; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; padding: 20px 16px; box-shadow: 10px 0 30px rgba(0,0,0,0.8); }
    .side-drawer.open { transform: translateX(320px); }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
    .drawer-user-info { display: flex; align-items: center; gap: 12px; }
    .avatar-round { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
    .user-meta h3 { font-family: var(--font-gaming); font-size: 18px; color: var(--text-main); line-height: 1.1; }
    .uid-tag { font-size: 11px; color: var(--accent-cyan); font-weight: 500; }
    .drawer-nav { flex: 1; overflow-y: auto; margin-top: 14px; display: flex; flex-direction: column; gap: 4px; }
    .drawer-link { display: flex; align-items: center; gap: 14px; padding: 10px 14px; color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; border-radius: var(--radius-sm); transition: var(--transition); background: transparent; border: none; width: 100%; text-align: left; cursor: pointer; }
    .drawer-link i { width: 18px; font-size: 16px; color: var(--text-dim); }
    .drawer-link:hover, .drawer-link:active { background: var(--bg-card); color: #fff; }
    .drawer-link.logout-link { color: var(--danger); }
    .drawer-divider { height: 1px; background: var(--border-color); margin: 8px 0; }
    .drawer-footer { padding-top: 12px; text-align: center; font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }
    .bottom-nav { height: var(--bottom-nav-height); background: rgba(14, 17, 24, 0.98); border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-around; padding: 0 8px; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; font-size: 10px; font-weight: 600; gap: 4px; width: 25%; transition: var(--transition); cursor: pointer; }
    .nav-item i { font-size: 18px; }
    .nav-item.active { color: var(--primary); }
    .main-content { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 24px; position: relative; -webkit-overflow-scrolling: touch; }
    .view-container { padding: 16px; animation: fadeIn 0.22s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 18px; border-radius: var(--radius-sm); font-family: var(--font-gaming); font-size: 16px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; border: none; cursor: pointer; transition: var(--transition); }
    .btn-primary { background: linear-gradient(135deg, #ff5733, #e62200); color: #fff; box-shadow: 0 4px 18px var(--primary-glow); }
    .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-sm { padding: 8px 12px; font-size: 13px; width: auto; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-input { width: 100%; padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; font-family: var(--font-ui); font-size: 14px; outline: none; transition: var(--transition); }
    .form-input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
    .announcement-banner { background: linear-gradient(90deg, rgba(255, 70, 36, 0.15), rgba(0, 240, 255, 0.15)); border: 1px solid rgba(255, 70, 36, 0.3); padding: 9px 12px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 12px; overflow: hidden; }
    .announcement-banner i { color: var(--accent-gold); }
    .ticker-wrap { overflow: hidden; white-space: nowrap; width: 100%; }
    .ticker-move { display: inline-block; animation: ticker 25s linear infinite; }
    @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    .player-hero-card { background: linear-gradient(145deg, #181d29, #0f131a); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 18px; position: relative; overflow: hidden; margin-bottom: 16px; box-shadow: 0 10px 24px rgba(0,0,0,0.5); }
    .hero-profile-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .hero-avatar { width: 52px; height: 52px; border-radius: 12px; border: 2px solid var(--primary); object-fit: cover; }
    .hero-details h2 { font-family: var(--font-gaming); font-size: 20px; font-weight: 700; line-height: 1.1; }
    .hero-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.04); }
    .stat-box { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
    .stat-val { font-family: var(--font-gaming); font-size: 17px; font-weight: 700; color: #fff; }
    .stat-val.gold { color: var(--accent-gold); }
    .stat-val.green { color: var(--success); }
    .section-title { font-family: var(--font-gaming); font-size: 17px; font-weight: 700; text-transform: uppercase; margin: 18px 0 10px 0; display: flex; justify-content: space-between; align-items: center; }
    .quick-actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
    .action-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-main); text-decoration: none; cursor: pointer; transition: var(--transition); }
    .action-card i { font-size: 20px; color: var(--primary); }
    .action-card span { font-size: 11px; font-weight: 600; }
    .tournament-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; position: relative; }
    .t-banner-wrapper { position: relative; width: 100%; height: 120px; background-color: #1a1e28; }
    .t-banner-img { width: 100%; height: 100%; object-fit: cover; }
    .t-badge { position: absolute; top: 10px; right: 10px; padding: 4px 8px; border-radius: 4px; font-family: var(--font-gaming); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-live { background: var(--danger); color: #fff; }
    .badge-upcoming { background: var(--accent-cyan); color: #000; }
    .badge-filling { background: var(--accent-gold); color: #000; }
    .badge-full { background: #555; color: #fff; }
    .t-details { padding: 14px; }
    .t-title { font-family: var(--font-gaming); font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .t-specs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .spec-pill { font-size: 11px; background: var(--bg-surface); border: 1px solid var(--border-color); padding: 3px 7px; border-radius: 4px; color: var(--text-muted); }
    .spec-pill strong { color: #fff; }
    .t-slot-progress-wrap { margin-bottom: 12px; }
    .t-slot-bar { width: 100%; height: 6px; background: var(--bg-surface); border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .t-slot-fill { height: 100%; background: linear-gradient(90deg, var(--accent-cyan), var(--primary)); }
    .t-footer-grid { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 10px; }
    .t-prize { font-family: var(--font-gaming); font-size: 16px; font-weight: 700; color: var(--accent-gold); }
    .t-fee { font-size: 12px; color: var(--text-muted); }
    .wallet-hero { background: linear-gradient(135deg, #1d1b28, #10121a); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 20px; text-align: center; margin-bottom: 16px; }
    .wallet-balance-title { font-size: 12px; text-transform: uppercase; color: var(--text-muted); }
    .wallet-amount { font-family: var(--font-gaming); font-size: 38px; font-weight: 800; color: var(--accent-gold); margin: 6px 0 14px 0; }
    .tx-item { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .tx-info h4 { font-size: 14px; font-weight: 600; }
    .tx-info span { font-size: 11px; color: var(--text-dim); }
    .tx-amount { font-family: var(--font-gaming); font-size: 16px; font-weight: 700; }
    .tx-positive { color: var(--success); }
    .tx-negative { color: var(--danger); }
    .toast-container { position: absolute; bottom: 80px; left: 16px; right: 16px; z-index: 600; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast-msg { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 14px; color: #fff; font-size: 13px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; pointer-events: auto; }
    .toast-msg.toast-success { border-color: var(--success); }
    .toast-msg.toast-error { border-color: var(--danger); }
    .toast-msg.toast-info { border-color: var(--accent-cyan); }
    .global-loader { position: absolute; inset: 0; background: rgba(6, 7, 10, 0.88); backdrop-filter: blur(6px); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; }
    .spinner-flame { width: 50px; height: 50px; border: 3px solid transparent; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loader-text { font-family: var(--font-gaming); letter-spacing: 1px; font-size: 15px; color: var(--text-muted); }
    .hidden { display: none !important; }
    .text-accent { color: var(--accent-cyan) !important; }
    .text-gold { color: var(--accent-gold) !important; }
    .empty-state { text-align: center; padding: 40px 16px; color: var(--text-dim); }
    .empty-state i { font-size: 40px; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div id="app-container">
    <header id="main-header" class="app-header">
      <div id="master-header-bar" class="header-bar">
        <button id="btn-hamburger" class="icon-btn" aria-label="Open Menu">
          <i class="fa-solid fa-bars-staggered"></i>
        </button>
        <div class="brand-logo" onclick="Router.navigate('home')">
          <span class="brand-sub">MULTANI FF</span>
          <span class="brand-main">OFFICIAL</span>
        </div>
        <div class="header-actions">
          <button id="btn-header-notif" class="icon-btn" onclick="Router.navigate('notifications')">
            <i class="fa-solid fa-bell"></i>
          </button>
          <button id="btn-header-profile" class="icon-btn avatar-btn" onclick="Router.navigate('profile')">
            <img id="header-avatar-img" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100&auto=format&fit=crop&q=80" alt="Avatar" />
          </button>
        </div>
      </div>

      <div id="sub-header-bar" class="header-bar hidden">

      </div>
    </header>

    <div id="drawer-overlay" class="drawer-overlay hidden" onclick="Drawer.close()"></div>
    <aside id="side-drawer" class="side-drawer">
      <div class="drawer-header">
        <div class="drawer-user-info">
          <img id="drawer-avatar" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100&auto=format&fit=crop&q=80" alt="Avatar" class="avatar-round" />
          <div class="user-meta">
            <h3 id="drawer-name">Guest Gamer</h3>

      </div>

      <nav class="drawer-nav">
        <button onclick="Router.navigate('home')" class="drawer-link"><i class="fa-solid fa-house"></i> Home</button>
        <button onclick="Router.navigate('tournaments')" class="drawer-link"><i class="fa-solid fa-trophy"></i> Tournaments</button>
        <button onclick="Router.navigate('matches')" class="drawer-link"><i class="fa-solid fa-crosshairs"></i> My Matches</button>
        <button onclick="Router.navigate('wallet')" class="drawer-link"><i class="fa-solid fa-wallet"></i> Wallet</button>
        <button onclick="Router.navigate('deposit')" class="drawer-link text-accent"><i class="fa-solid fa-circle-arrow-down"></i> Deposit Money</button>
        <button onclick="Router.navigate('winners')" class="drawer-link"><i class="fa-solid fa-medal"></i> Hall of Winners</button>
        <button onclick="Router.navigate('leaderboard')" class="drawer-link"><i class="fa-solid fa-ranking-star"></i> Leaderboard</button>
        <button onclick="Router.navigate('notifications')" class="drawer-link"><i class="fa-solid fa-bell"></i> Notifications</button>
        <button onclick="Router.navigate('support')" class="drawer-link"><i class="fa-solid fa-headset"></i> Live Support</button>
        <button onclick="Router.navigate('profile')" class="drawer-link"><i class="fa-solid fa-user-ninja"></i> Profile</button>
        <button onclick="Router.navigate('rules')" class="drawer-link"><i class="fa-solid fa-book-skull"></i> Rules</button>
        <button onclick="Router.navigate('about')" class="drawer-link"><i class="fa-solid fa-shield-halved"></i> About Us</button>
        <div class="drawer-divider"></div>
        <button id="btn-drawer-logout" class="drawer-link logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>

        <p>MULTANI FF • PRODUCTION READY</p>
      </div>
    </aside>

    <main id="app-view" class="main-content"></main>

    <nav id="bottom-nav" class="bottom-nav">
      <div class="nav-item" data-page="home" onclick="Router.navigate('home')"><i class="fa-solid fa-house"></i><span>Home</span></div>
      <div class="nav-item" data-page="tournaments" onclick="Router.navigate('tournaments')"><i class="fa-solid fa-trophy"></i><span>Matches</span></div>
      <div class="nav-item" data-page="matches" onclick="Router.navigate('matches')"><i class="fa-solid fa-crosshairs"></i><span>My Slots</span></div>
      <div class="nav-item" data-page="wallet" onclick="Router.navigate('wallet')"><i class="fa-solid fa-wallet"></i><span>Wallet</span></div>
    </nav>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <div id="global-loader" class="global-loader hidden">
    <div class="spinner-flame"></div>
    <span id="global-loader-text" class="loader-text">Loading...</span>
  </div>

  <script>
    // ==========================================
    // 1. SUPABASE CLIENT & STATE
    // ==========================================
    const SUPABASE_URL = "https://yzirjidgdxhljbhhjfqp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_-dPl2eQV4afRDarZOR3QGA_RoDvmsX5";
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;
    let siteSettings = {};
    let activeTournaments = [];

    const Toast = {
      show(msg, type = 'info') {
        const c = document.getElementById('toast-container');
        if (!c) return;
        const t = document.createElement('div');
        t.className = `toast-msg toast-${type}`;
        t.innerText = msg;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3000);
      }
    };

    const Loader = {
      show(text = "Loading...") {
        const el = document.getElementById('global-loader');
        const txt = document.getElementById('global-loader-text');
        if (txt) txt.innerText = text;
        if (el) el.classList.remove('hidden');
      },
      hide() {
        const el = document.getElementById('global-loader');
        if (el) el.classList.add('hidden');
      }
    };

    // ==========================================
    // 2. DATA SYNCHRONIZATION
    // ==========================================
    async function syncAuthAndProfile() {
      try {
        const { data: { user } } = await sbClient.auth.getUser();
        currentUser = user;
        if (user) {
          const { data } = await sbClient.from('profiles').select('*').eq('id', user.id).maybeSingle();
          currentProfile = data;
        } else {
          currentProfile = null;
        }
        updateDrawerUI();
      } catch (e) {
        console.error("Auth sync error:", e);
      }
    }

    function updateDrawerUI() {
      const dName = document.getElementById('drawer-name');
      const dUid = document.getElementById('drawer-uid');
      const hAvatar = document.getElementById('header-avatar-img');
      const dAvatar = document.getElementById('drawer-avatar');
      const avatarUrl = currentProfile?.avatar_url || 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100&auto=format&fit=crop&q=80';

      if (hAvatar) hAvatar.src = avatarUrl;
      if (dAvatar) dAvatar.src = avatarUrl;

      if (currentUser && currentProfile) {
        if (dName) dName.innerText = currentProfile.free_fire_name || currentProfile.username || 'Soldier';
        if (dUid) dUid.innerHTML = `<i class="fa-solid fa-gamepad"></i> UID: ${currentProfile.free_fire_uid || '--'}`;
      } else {
        if (dName) dName.innerText = 'Guest Gamer';
        if (dUid) dUid.innerHTML = `<i class="fa-solid fa-gamepad"></i> Click below to Login`;
      }
    }

    // ==========================================
    // 3. PAGE CONTROLLER (RELIABLE DIRECT ROUTING)
    // ==========================================
    const Router = {
      history: ['home'],
      navigate(page, id = null) {
        Drawer.close();
        if (this.history[this.history.length - 1] !== page) {
          this.history.push(page);
        }

        const isSub = (page !== 'home');
        const masterHeader = document.getElementById('master-header-bar');
        const subHeader = document.getElementById('sub-header-bar');
        const subTitle = document.getElementById('sub-header-title');

        if (isSub) {
          masterHeader.classList.add('hidden');
          subHeader.classList.remove('hidden');
          subTitle.innerText = page.toUpperCase();
        } else {
          masterHeader.classList.remove('hidden');
          subHeader.classList.add('hidden');
        }

        document.querySelectorAll('.nav-item').forEach(el => {
          el.classList.toggle('active', el.getAttribute('data-page') === page);
        });

        if (page === 'home') renderHome();
        else if (page === 'tournaments') renderTournaments();
        else if (page === 'tournament_detail') renderTournamentDetail(id);
        else if (page === 'matches') renderMatches();
        else if (page === 'wallet') renderWallet();
        else if (page === 'deposit') renderDeposit();
        else if (page === 'login') renderAuth();
        else if (page === 'profile') renderProfile();
        else if (page === 'winners') renderWinners();
        else if (page === 'leaderboard') renderLeaderboard();
        else if (page === 'notifications') renderNotifications();
        else if (page === 'support') renderSupport();
        else if (page === 'rules') renderRules();
        else if (page === 'about') renderAbout();
      },
      back() {
        if (this.history.length > 1) {
          this.history.pop();
          const prev = this.history[this.history.length - 1];
          this.navigate(prev);
        } else {
          this.navigate('home');
        }
      }
    };

              <div>
                <span class="spec-pill" style="background:var(--accent-gold); color:#000; font-weight:800;">${w.position}</span>
                <h3 style="margin-top:4px;">${w.profiles?.free_fire_name || 'Player'}</h3>
                <div style="font-size:11px; color:var(--text-dim);">${w.tournaments?.title || 'Match'}</div>
              </div>
              <div style="font-family:var(--font-gaming); font-size:20px; font-weight:800; color:var(--accent-gold);">+PKR ${w.prize_amount}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function renderLeaderboard() {
      Loader.show("Loading leaderboard...");
      const { data } = await sbClient.from('profiles').select('free_fire_name, total_won, total_wins').order('total_won', { ascending: false }).limit(20);
      Loader.hide();

      const view = document.getElementById('app-view');
      if (!data || !data.length) {
        view.innerHTML = `<div class="view-container empty-state"><p>No leaderboard records.</p></div>`;
        return;
      }

      view.innerHTML = `
        <div class="view-container">
          ${data.map((l, idx) => `
            <div class="tx-item">
              <div style="display:flex; align-items:center; gap:12px;">
                <span style="font-family:var(--font-gaming); font-size:20px; font-weight:800; color:${idx === 0 ? 'var(--accent-gold)' : 'var(--accent-cyan)'};">#${idx + 1}</span>
                <div>
                  <h4>${l.free_fire_name}</h4>
                  <span style="font-size:11px; color:var(--text-dim);">${l.total_wins || 0} Wins</span>
                </div>
              </div>
              <div style="font-family:var(--font-gaming); font-size:16px; font-weight:700; color:var(--success);">PKR ${l.total_won || 0}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function renderNotifications() {
      if (!currentUser) { Router.navigate('login'); return; }
      Loader.show("Loading notifications...");
      const { data } = await sbClient.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
      Loader.hide();

      const view = document.getElementById('app-view');
      if (!data || !data.length) {
        view.innerHTML = `<div class="view-container empty-state"><i class="fa-solid fa-bell"></i><p>No notifications.</p></div>`;
        return;
      }

      view.innerHTML = `
        <div class="view-container">
          ${data.map(n => `
            <div class="tx-item" style="border-left: 3px solid var(--primary);">
              <div class="tx-info">
                <h4>${n.title}</h4>
                <p style="font-size:12px; color:var(--text-muted);">${n.message}</p>
                <span>${new Date(n.created_at).toLocaleString()}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function renderSupport() {
      if (!currentUser) { Router.navigate('login'); return; }
      Loader.show("Loading support...");
      const { data } = await sbClient.from('support_messages').select('*').or(`sender_id.eq.${currentUser.id},user_id.eq.${currentUser.id}`).order('created_at', { ascending: true });
      Loader.hide();

      const messages = data || [];
      const view = document.getElementById('app-view');
      view.innerHTML = `
        <div class="view-container" style="display:flex; flex-direction:column; height:calc(100vh - var(--header-height) - 40px);">
          <div id="chat-box" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:12px;">
            ${messages.map(m => {
              const isMine = m.sender_id === currentUser.id;
              return `
                <div style="max-width:80%; padding:10px 14px; border-radius:12px; font-size:13px; align-self:${isMine ? 'flex-end' : 'flex-start'}; background:${isMine ? 'var(--primary)' : 'var(--bg-card)'};">
                  <div>${m.message}</div>
                  <div style="font-size:10px; opacity:0.7; text-align:right;">${new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                </div>
              `;
            }).join('')}
          </div>
          <form id="chat-form" style="display:flex; gap:8px;">
            <input type="text" id="chat-input" class="form-input" placeholder="Type message..." required />
            <button type="submit" class="btn btn-primary btn-sm" style="width:50px;"><i class="fa-solid fa-paper-plane"></i></button>
          </form>
        </div>
      `;

      const box = document.getElementById('chat-box');
      if (box) box.scrollTop = box.scrollHeight;

      document.getElementById('chat-form').onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;
        input.value = "";

        await sbClient.from('support_messages').insert([{
          user_id: currentUser.id,
          sender_id: currentUser.id,
          sender_role: 'player',
          message: text
        }]);
        renderSupport();
      };
    }

    function renderRules() {
      document.getElementById('app-view').innerHTML = `
        <div class="view-container">
          <div class="player-hero-card">
            <h3 style="color:var(--primary); font-family:var(--font-gaming); margin-bottom:6px;">Fair Play Mandatory</h3>
            <p style="font-size:12px; color:var(--text-muted); line-height:1.6;">No hacks, emulators, or teaming allowed. Violators will be banned permanently with forfeiture of wallet balance.</p>
          </div>
          <div class="player-hero-card" style="margin-top:10px;">
            <h3 style="color:var(--accent-gold); font-family:var(--font-gaming); margin-bottom:6px;">Permanent Slot Policy</h3>
            <p style="font-size:12px; color:var(--text-muted); line-height:1.6;">Once a slot is reserved, funds are locked and slot registration is non-refundable.</p>
          </div>
        </div>
      `;
    }

    function renderAbout() {
      document.getElementById('app-view').innerHTML = `
        <div class="view-container" style="text-align:center;">
          <h2 style="font-family:var(--font-gaming); font-size:24px; color:var(--primary);">MULTANI FF OFFICIAL</h2>
          <p style="font-size:13px; color:var(--text-muted); margin-top:10px; line-height:1.6;">Pakistan's dedicated esports Free Fire platform with daily tournaments, automated processing, and instant winner prizes.</p>
        </div>
      `;
    }

    // ==========================================
    // 5. DRAWER LOGIC
    // ==========================================
    const Drawer = {
      open() {
        document.getElementById('side-drawer').classList.add('open');
        document.getElementById('drawer-overlay').classList.remove('hidden');
      },
      close() {
        document.getElementById('side-drawer').classList.remove('open');
        document.getElementById('drawer-overlay').classList.add('hidden');
      }
    };

    // ==========================================
    // 6. INITIALIZATION
    // ==========================================
    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('btn-hamburger').onclick = () => Drawer.open();

      document.getElementById('btn-drawer-logout').onclick = async () => {
        Drawer.close();
        await sbClient.auth.signOut();
        currentUser = null;
        currentProfile = null;
        updateDrawerUI();
        Toast.show("Logged out successfully", "info");
        Router.navigate('home');
      };

      await syncAuthAndProfile();
      Router.navigate('home');
    });
  </script>
</body>
</html>
