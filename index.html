<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MULTANI FF OFFICIAL TOURNAMENT</title>
  <meta name="description" content="Pakistan's Ultimate Free Fire Tournament Platform" />
  <meta name="theme-color" content="#0a0a0f" />
  
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* ==========================================================================
       CORE STYLES - DARK FUTURISTIC GAMING THEME (MOBILE FIRST)
       ========================================================================== */
    :root {
      --bg-base: #06070a;
      --bg-surface: #0e1118;
      --bg-card: #151922;
      --border-color: #262f40;
      
      --primary: #ff4624;
      --primary-glow: rgba(255, 70, 36, 0.45);
      --accent-cyan: #00f0ff;
      --accent-cyan-glow: rgba(0, 240, 255, 0.4);
      --accent-gold: #ffbe00;
      --accent-gold-glow: rgba(255, 190, 0, 0.4);

      --success: #00e676;
      --danger: #ff1744;
      --text-main: #f3f4f6;
      --text-muted: #8e9bb0;
      --text-dim: #5c687a;
      
      --header-height: 60px;
      --bottom-nav-height: 68px;
      --max-app-width: 430px;
      
      --font-gaming: 'Rajdhani', sans-serif;
      --font-ui: 'Inter', sans-serif;
      --radius: 12px;
      --radius-sm: 8px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #020203;
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      user-select: none;
    }

    /* Mobile App Frame */
    #app-container {
      width: 100%;
      max-width: var(--max-app-width);
      height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-base);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 2px rgba(255, 70, 36, 0.3);
    }

    @media (min-width: 431px) {
      #app-container {
        height: 94vh;
        border-radius: 28px;
        border: 1px solid #1f2636;
      }
    }

    /* HEADER */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-height);
      background: rgba(14, 17, 24, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }

    .header-bar {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .brand-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .brand-sub {
      font-family: var(--font-gaming);
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--primary);
      font-weight: 700;
      line-height: 1;
    }

    .brand-main {
      font-family: var(--font-gaming);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #ffffff, #ffb39e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 18px;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.05);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar-btn {
      padding: 0;
      overflow: hidden;
      border: 1.5px solid var(--primary);
    }

    .avatar-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-dot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 8px;
      height: 8px;
      background-color: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--primary);
    }

    .back-btn {
      width: auto;
      gap: 6px;
      font-family: var(--font-gaming);
      font-size: 16px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .back-btn:hover, .back-btn:active { color: var(--primary); }

    .sub-header-title {
      font-family: var(--font-gaming);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .sub-header-spacer { width: 38px; }

    /* HAMBURGER SIDE DRAWER */
    .drawer-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 150;
      transition: opacity 0.3s ease;
    }

    .side-drawer {
      position: absolute;
      top: 0;
      left: -320px;
      width: 290px;
      height: 100%;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      z-index: 200;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      box-shadow: 10px 0 30px rgba(0,0,0,0.8);
    }

    .side-drawer.open { transform: translateX(320px); }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .drawer-user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-round {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      object-fit: cover;
    }

    .user-meta h3 {
      font-family: var(--font-gaming);
      font-size: 18px;
      color: var(--text-main);
      line-height: 1.1;
    }

    .uid-tag {
      font-size: 11px;
      color: var(--accent-cyan);
      font-weight: 500;
    }

    .drawer-nav {
      flex: 1;
      overflow-y: auto;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .drawer-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      transition: var(--transition);
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }

    .drawer-link i {
      width: 18px;
      font-size: 16px;
      color: var(--text-dim);
    }

    .drawer-link:hover, .drawer-link:active {
      background: var(--bg-card);
      color: #fff;
    }
    .drawer-link:hover i { color: var(--primary); }
    .drawer-link.logout-link { color: var(--danger); }
    .drawer-link.logout-link i { color: var(--danger); }

    .drawer-divider {
      height: 1px;
      background: var(--border-color);
      margin: 8px 0;
    }

    .drawer-footer {
      padding-top: 12px;
      text-align: center;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      height: var(--bottom-nav-height);
      background: rgba(14, 17, 24, 0.98);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      gap: 4px;
      width: 20%;
      transition: var(--transition);
    }

    .nav-item i { font-size: 18px; }
    .nav-item.active { color: var(--primary); }
    .nav-item.active i {
      transform: translateY(-2px);
      filter: drop-shadow(0 0 6px var(--primary-glow));
    }

    /* MAIN VIEW CONTAINER */
    .main-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 24px;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    .view-container {
      padding: 16px;
      animation: fadeIn 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* BUTTONS & FORMS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 18px;
      border-radius: var(--radius-sm);
      font-family: var(--font-gaming);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff5733, #e62200);
      color: #fff;
      box-shadow: 0 4px 18px var(--primary-glow);
    }

    .btn-primary:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-cyan {
      background: linear-gradient(135deg, #00f0ff, #0099cc);
      color: #06070a;
      font-weight: 800;
      box-shadow: 0 4px 18px var(--accent-cyan-glow);
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 13px;
      width: auto;
    }

    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: var(--font-ui);
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    /* CARDS & PANELS */
    .announcement-banner {
      background: linear-gradient(90deg, rgba(255, 70, 36, 0.15), rgba(0, 240, 255, 0.15));
      border: 1px solid rgba(255, 70, 36, 0.3);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-size: 12px;
      overflow: hidden;
    }
    .announcement-banner i { color: var(--accent-gold); }

    .ticker-wrap { overflow: hidden; white-space: nowrap; }
    .ticker-move {
      display: inline-block;
      animation: ticker 20s linear infinite;
    }
    @keyframes ticker {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .player-hero-card {
      background: linear-gradient(145deg, #181d29, #0f131a);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 18px;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.5);
    }

    .hero-profile-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .hero-avatar {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      border: 2px solid var(--primary);
      object-fit: cover;
    }

    .hero-details h2 {
      font-family: var(--font-gaming);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
    }

    .hero-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255,255,255,0.04);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
    .stat-val { font-family: var(--font-gaming); font-size: 17px; font-weight: 700; color: #fff; }
    .stat-val.gold { color: var(--accent-gold); }
    .stat-val.green { color: var(--success); }

    .section-title {
      font-family: var(--font-gaming);
      font-size: 17px;
      font-weight: 700;
      text-transform: uppercase;
      margin: 18px 0 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-link {
      font-size: 12px;
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 600;
    }

    .quick-actions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .action-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-main);
      text-decoration: none;
      cursor: pointer;
      transition: var(--transition);
    }
    .action-card i { font-size: 20px; color: var(--primary); }
    .action-card span { font-size: 11px; font-weight: 600; }
    .action-card:active { transform: translateY(-2px); border-color: var(--primary); }

    /* TOURNAMENT CARD */
    .tournament-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 14px;
      position: relative;
      transition: var(--transition);
    }
    .tournament-card:hover { border-color: rgba(255, 70, 36, 0.4); }

    .t-banner-wrapper {
      position: relative;
      width: 100%;
      height: 120px;
      background-color: #1a1e28;
    }
    .t-banner-img { width: 100%; height: 100%; object-fit: cover; }

    .t-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: var(--font-gaming);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-live { background: var(--danger); color: #fff; }
    .badge-upcoming { background: var(--accent-cyan); color: #000; }
    .badge-filling { background: var(--accent-gold); color: #000; }
    .badge-full { background: #555; color: #fff; }

    .t-details { padding: 14px; }
    .t-title { font-family: var(--font-gaming); font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .t-specs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .spec-pill {
      font-size: 11px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 3px 7px;
      border-radius: 4px;
      color: var(--text-muted);
    }
    .spec-pill strong { color: #fff; }

    .t-slot-progress-wrap { margin-bottom: 12px; }
    .t-slot-bar {
      width: 100%;
      height: 6px;
      background: var(--bg-surface);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .t-slot-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--primary));
      transition: width 0.4s ease;
    }

    .t-footer-grid {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }
    .t-prize { font-family: var(--font-gaming); font-size: 16px; font-weight: 700; color: var(--accent-gold); }
    .t-fee { font-size: 12px; color: var(--text-muted); }

    /* WALLET & TRANSACTIONS */
    .wallet-hero {
      background: linear-gradient(135deg, #1d1b28, #10121a);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
    }
    .wallet-balance-title { font-size: 12px; text-transform: uppercase; color: var(--text-muted); }
    .wallet-amount {
      font-family: var(--font-gaming);
      font-size: 38px;
      font-weight: 800;
      color: var(--accent-gold);
      margin: 6px 0 14px 0;
      text-shadow: 0 0 15px var(--accent-gold-glow);
    }
    .wallet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .tx-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .tx-info h4 { font-size: 14px; font-weight: 600; }
    .tx-info span { font-size: 11px; color: var(--text-dim); }
    .tx-amount { font-family: var(--font-gaming); font-size: 16px; font-weight: 700; }
    .tx-positive { color: var(--success); }
    .tx-negative { color: var(--danger); }

    /* IMAGE UPLOADER */
    .uploader-card {
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-sm);
      padding: 20px;
      text-align: center;
      background: var(--bg-card);
      position: relative;
      cursor: pointer;
    }
    .uploader-card input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .uploader-preview {
      position: relative;
      width: 100%;
      max-height: 220px;
      overflow: hidden;
      border-radius: var(--radius-sm);
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    .uploader-preview img { max-width: 100%; max-height: 220px; object-fit: contain; }
    .btn-remove-preview {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 23, 68, 0.85);
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
    }

    /* MODAL & TOAST */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: var(--bg-surface);
      border-radius: var(--radius);
      width: 100%;
      max-width: 360px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }
    .neon-border {
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-header h3 { font-family: var(--font-gaming); font-size: 20px; }
    .modal-x { background: transparent; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; }
    .modal-body { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; }

    .toast-container {
      position: absolute;
      bottom: 80px;
      left: 16px;
      right: 16px;
      z-index: 600;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast-msg {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideToast 0.3s ease;
      pointer-events: auto;
    }
    .toast-msg.toast-success { border-color: var(--success); }
    .toast-msg.toast-error { border-color: var(--danger); }
    .toast-msg.toast-info { border-color: var(--accent-cyan); }
    @keyframes slideToast {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .global-loader {
      position: absolute;
      inset: 0;
      background: rgba(6, 7, 10, 0.88);
      backdrop-filter: blur(6px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .spinner-flame {
      width: 50px;
      height: 50px;
      border: 3px solid transparent;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* ==========================================================================

    const SupabaseService = {
      async registerUser(formData) {
        if (!sbClient) return { error: null, user: AppState.profile };
        return await sbClient.auth.signUp({
          email: formData.email,
          password: formData.password,
          options: {
            data: {
              full_name: formData.fullName,
              username: formData.username,
              ff_uid: formData.ffUid,
              ff_name: formData.ffName,
              phone: formData.phone
            }
          }
        });
      },

      async login(email, password) {
        if (!sbClient) return { data: { user: AppState.profile }, error: null };
        return await sbClient.auth.signInWithPassword({ email, password });
      },

      async logout() {
        if (sbClient) await sbClient.auth.signOut();
        AppState.user = null;
      },

      async joinTournamentRPC(tournamentId) {
        if (!sbClient) {
          const t = AppState.mockTournaments.find(x => x.id === tournamentId);
          if (!t) return { success: false, message: "Tournament not found." };
          if (AppState.profile.balance < t.entry_fee) {
            return { success: false, message: "Insufficient wallet balance." };
          }
          AppState.profile.balance -= t.entry_fee;
          t.joined_players += 1;
          const bookedSlot = t.joined_players;
          AppState.myJoinedMatches.unshift({
            tournament_id: t.id,
            tournament_title: t.title,
            slot_number: bookedSlot,
            match_date: t.match_date,
            entry_fee: t.entry_fee,
            prize_pool: t.prize_pool,
            room_id: "Released 15m before match",
            room_pass: "Released 15m before match",
            status: "upcoming"
          });
          AppState.transactions.unshift({
            id: "tx-" + Date.now(),
            type: "entry_fee",
            amount: -t.entry_fee,
            date: "Just now",
            desc: `Entry Fee: ${t.title}`,
            status: "completed",
            balance_after: AppState.profile.balance
          });
          return { success: true, slotNumber: bookedSlot };
        }

        const { data, error } = await sbClient.rpc('join_tournament_permanently', { p_tournament_id: tournamentId });
        if (error) return { success: false, message: error.message };
        return data;
      },

      async submitDeposit(file, amount, method, txnId, senderName) {
        if (sbClient) {
          const fileExt = file.name.split('.').pop();
          const filePath = `receipts/${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
          
          const { error: uploadError } = await sbClient.storage.from('deposit-screenshots').upload(filePath, file);

          const { error } = await sbClient.from('deposit_requests').insert([{
            amount: parseFloat(amount),
            payment_method: method,
            transaction_id: txnId,
            sender_name: senderName,
            screenshot_url: filePath,
            status: 'pending'
          }]);
          if (error) return { success: false, message: error.message };

          AppState.transactions.unshift({
            id: "dep-" + Date.now(),
            type: "deposit",
            amount: parseFloat(amount),
            date: "Just now",
            desc: `Deposit via ${method} (Pending)`,

        return { success: true, message: "Deposit slip submitted successfully. Verification pending." };

    /* ==========================================================================

    const Toast = {
      show(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast-msg toast-${type}`;
        
        let icon = 'fa-circle-info';
        if (type === 'success') icon = 'fa-circle-check';
        if (type === 'error') icon = 'fa-triangle-exclamation';

        toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
        container.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = '0.3s ease';
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }
    };

    const Modal = {
      show({ title, body, confirmText = "Confirm", onConfirm }) {
        const modalEl = document.getElementById('modal-container');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-body').innerHTML = body;
        
        const confirmBtn = document.getElementById('modal-confirm-btn');
        confirmBtn.innerText = confirmText;
        modalEl.classList.remove('hidden');

        const handleConfirm = () => {
          if (onConfirm) onConfirm();
          Modal.close();
          cleanup();
        };

        const handleCancel = () => {
          Modal.close();
          cleanup();
        };

        const cleanup = () => {
          confirmBtn.removeEventListener('click', handleConfirm);
          document.getElementById('modal-cancel-btn').removeEventListener('click', handleCancel);
          document.getElementById('modal-close').removeEventListener('click', handleCancel);
        };

        confirmBtn.addEventListener('click', handleConfirm);
        document.getElementById('modal-cancel-btn').addEventListener('click', handleCancel);
        document.getElementById('modal-close').addEventListener('click', handleCancel);
      },
      close() {
        document.getElementById('modal-container').classList.add('hidden');

      close() {
        document.getElementById('side-drawer').classList.remove('open');
        document.getElementById('drawer-overlay').classList.add('hidden');
      }
    };

    const Router = {
      routes: {},
      init() {
        window.addEventListener('hashchange', () => this.handleRoute());
        if (!window.location.hash) {
          window.location.hash = '#/home';
        } else {
          this.handleRoute();
        }
      },
      navigate(hash) {
        window.location.hash = hash;
      },
      back() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          this.navigate('#/home');
        }
      },
      register(path, viewHandler, title = "MULTANI FF", isSecondary = false) {
        this.routes[path] = { viewHandler, title, isSecondary };
      },
      handleRoute() {
        const rawHash = window.location.hash || '#/home';
        const [path, param] = rawHash.split('/');
        const fullRouteKey = param ? `${path}/:id` : path;

        const route = this.routes[fullRouteKey] || this.routes['#/home'];

        const masterHeader = document.getElementById('master-header-bar');
        const subHeader = document.getElementById('sub-header-bar');
        const subTitle = document.getElementById('sub-header-title');

        if (route.isSecondary) {
          masterHeader.classList.add('hidden');
          subHeader.classList.remove('hidden');
          subTitle.textContent = route.title;
        } else {
          masterHeader.classList.remove('hidden');
          subHeader.classList.add('hidden');
        }

        document.querySelectorAll('.nav-item').forEach(item => {
          item.classList.toggle('active', item.getAttribute('data-route') === path);
        });

        Drawer.close();

        const viewContainer = document.getElementById('app-view');
        viewContainer.scrollTop = 0;
        viewContainer.innerHTML = '';
        route.viewHandler(param);
      }
    };

              <div id="uploader-dropzone" class="uploader-card">
                <input type="file" id="dep-file" accept="image/png, image/jpeg, image/webp" capture="environment" required />
                <div id="uploader-prompt">
                  <i class="fa-solid fa-cloud-arrow-up" style="font-size:24px; color:var(--accent-cyan);"></i>
                  <div style="font-size:13px; font-weight:600; margin-top:4px;">Upload Receipt Image</div>
                </div>

                  <img id="uploader-img-preview" src="" alt="Proof Preview" />
                  <button type="button" id="btn-clear-preview" class="btn-remove-preview"><i class="fa-solid fa-xmark"></i></button>
                </div>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:8px;">SUBMIT DEPOSIT SLIP</button>
          </form>
        </div>
      `;

      const fileInput = document.getElementById('dep-file');
      const promptBox = document.getElementById('uploader-prompt');
      const previewBox = document.getElementById('uploader-preview-box');
      const previewImg = document.getElementById('uploader-img-preview');
      const clearBtn = document.getElementById('btn-clear-preview');
      let selectedFile = null;

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 5 * 1024 * 1024) {
            Toast.show("File size exceeds 5MB limit", "error");
            fileInput.value = "";
            return;
          }
          selectedFile = file;
          const reader = new FileReader();
          reader.onload = (re) => {
            previewImg.src = re.target.result;
            promptBox.classList.add('hidden');
            previewBox.classList.remove('hidden');
          };
          reader.readAsDataURL(file);
        }
      });

      clearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedFile = null;
        fileInput.value = "";
        previewImg.src = "";
        previewBox.classList.add('hidden');
        promptBox.classList.remove('hidden');
      });

      document.getElementById('deposit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!selectedFile) {
          Toast.show("Please select screenshot proof", "error");
          return;
        }
        Loader.show("Uploading Receipt...");
        const res = await SupabaseService.submitDeposit(
          selectedFile,
          document.getElementById('dep-amount').value,
          document.getElementById('dep-method').value,
          document.getElementById('dep-tid').value,
          document.getElementById('dep-sender').value
        );
        Loader.hide();

        if (res.success) {
          Toast.show(res.message, "success");
          Router.navigate('#/wallet');
        } else {
          Toast.show(res.message || "Failed to submit", "error");
        }
      });
    }

              status: "pending",
              balance_after: AppState.profile.balance
            });
            Toast.show("Withdrawal placed successfully", "success");
            Router.navigate('#/wallet');

        });
      });
