<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MULTANI FF - Place SMM Order</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Inter,sans-serif;background:#06070a;color:#f3f4f6}
.font-gaming{font-family:Rajdhani,sans-serif}
.sidebar-scroll::-webkit-scrollbar{width:4px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:#262f40}
</style>
</head>
<body class="p-3 md:p-6 max-w-lg mx-auto space-y-5 pb-20">

<!-- Header -->
<div class="flex items-center justify-between border-b border-[#262f40] pb-3">
<div class="flex items-center gap-3">
<a href="index.html" class="bg-[#151922] border border-[#262f40] text-gray-200 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5">
<i class="fa-solid fa-arrow-left text-[#ff4624]"></i> Back
</a>
<h1 class="font-gaming text-lg font-bold tracking-wider text-cyan-400">SMM SERVICES & ORDERS</h1>
</div>
<div class="bg-[#151922] border border-[#262f40] px-3 py-1.5 rounded-lg flex items-center gap-2">
<i class="fa-solid fa-wallet text-amber-400 text-sm"></i>
<span id="player-wallet-balance" class="text-xs font-bold text-amber-400">PKR 0</span>
</div>
</div>

<!-- Order Form Card -->
<div class="bg-[#0e1118] border border-[#262f40] p-4 md:p-6 rounded-2xl space-y-4 shadow-xl">
<h2 class="font-gaming text-base font-bold uppercase text-white flex items-center gap-2">
<i class="fa-solid fa-cart-shopping text-cyan-400"></i> New SMM Order
</h2>

<form id="smm-order-form" class="space-y-3.5 text-xs">
<div>
<label class="block font-bold text-gray-300 mb-1">Select Category</label>
<select id="order-category" class="w-full bg-[#06070a] border border-[#262f40] rounded-xl p-3.5 text-white text-sm outline-none focus:border-cyan-500">
<option value="">-- Choose Category --</option>
</select>
</div>

<div>
<label class="block font-bold text-gray-300 mb-1">Select Service</label>
<select id="order-service" class="w-full bg-[#06070a] border border-[#262f40] rounded-xl p-3.5 text-white text-sm outline-none focus:border-cyan-500" disabled>
<option value="">-- Choose Service First --</option>
</select>
</div>

<div id="service-info-box" class="bg-[#151922] p-3 rounded-xl text-gray-400 text-xs hidden space-y-1 border border-[#262f40]">
<p>Rate per 1k: <strong id="info-rate" class="text-emerald-400">0 PKR</strong></p>
<p>Min Qty: <strong id="info-min" class="text-white">0</strong> | Max Qty: <strong id="info-max" class="text-white">100000</strong></p>
</div>

<div>
<label class="block font-bold text-gray-300 mb-1">Target Link / Profile URL</label>
<input id="order-link" type="url" placeholder="https://instagram.com/username" required class="w-full bg-[#06070a] border border-[#262f40] rounded-xl p-3.5 text-white text-sm outline-none focus:border-cyan-500">
</div>

<div>
<label class="block font-bold text-gray-300 mb-1">Quantity</label>
<input id="order-quantity" type="number" min="1" placeholder="100" required class="w-full bg-[#06070a] border border-[#262f40] rounded-xl p-3.5 text-white text-sm outline-none focus:border-cyan-500">
</div>

<div class="bg-[#151922] p-3 rounded-xl flex justify-between items-center border border-[#262f40]">
<span class="text-gray-300 font-bold">Total Charge:</span>
<span id="order-total-charge" class="font-gaming text-base font-bold text-amber-400">PKR 0</span>
</div>

<button type="submit" id="submit-order-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white py-3.5 rounded-xl font-gaming font-bold uppercase text-sm tracking-wide transition shadow-lg">
PLACE SMM ORDER
</button>

<p id="order-message" class="text-center text-xs font-medium text-gray-400"></p>
</form>
</div>

<!-- My Orders History Section -->
<div class="bg-[#0e1118] border border-[#262f40] p-4 rounded-2xl space-y-3 shadow-xl">
<h3 class="font-gaming font-bold text-sm text-gray-300 uppercase flex items-center gap-2">
<i class="fa-solid fa-clock-rotate-left text-amber-400"></i> My Recent Orders
</h3>
<div id="player-orders-list" class="space-y-2 max-h-60 overflow-y-auto sidebar-scroll">
<p class="text-gray-500 text-center py-4 text-xs">Loading your orders...</p>
</div>
</div>

<script>
(() => {
'use strict';

const SUPABASE_URL = 'https://yzirjidgdxhljbhhjfqp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_-dPl2eQV4afRDarZOR3QGA_RoDvmsX5';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
let currentUser = null;
let allServices = [];
let selectedServiceObj = null;
let userWalletBalance = 0;

async function init() {
try {
const { data: { session } } = await supabaseClient.auth.getSession();
if (session && session.user) {
currentUser = session.user;
fetchWallet(currentUser.id);
fetchServices();
fetchPlayerOrders(currentUser.id);
} else {
// Fallback for testing or guest
$('player-wallet-balance').textContent = 'PKR 0';
fetchServices();
}
} catch (e) {
console.error(e);
}
}

async function fetchWallet(userId) {
try {
let { data } = await supabaseClient.from('wallets').select('balance').eq('user_id', userId).single();
if (!data) {
let profileRes = await supabaseClient.from('profiles').select('balance').eq('id', userId).single();
userWalletBalance = profileRes.data?.balance || 0;
} else {
userWalletBalance = data.balance || 0;
}
$('player-wallet-balance').textContent = `PKR ${userWalletBalance}`;
} catch (err) {
console.error('Wallet fetch error:', err);
}
}

async function fetchServices() {
try {
let { data, error } = await supabaseClient.from('smm_services').select('*');
if (error) throw error;
allServices = data || [];

const categories = [...new Set(allServices.map(s => s.category))];
const catSelect = $('order-category');
catSelect.innerHTML = '<option value="">-- Choose Category --</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');
} catch (err) {
console.error('Services load error:', err);
}
}

$('order-category').addEventListener('change', function() {
const cat = this.value;
const srvSelect = $('order-service');
srvSelect.innerHTML = '<option value="">-- Choose Service --</option>';
srvSelect.disabled = true;
$('service-info-box').classList.add('hidden');
selectedServiceObj = null;
calculateTotal();

if (!cat) return;

const filtered = allServices.filter(s => s.category === cat);
srvSelect.innerHTML = '<option value="">-- Choose Service --</option>' + filtered.map(s => `<option value="${s.id}">${s.name} (Rate: ${s.rate})</option>`).join('');
srvSelect.disabled = false;
});

$('order-service').addEventListener('change', function() {
const srvId = this.value;
selectedServiceObj = allServices.find(s => s.id == srvId);

if (selectedServiceObj) {
$('info-rate').textContent = `${selectedServiceObj.rate} PKR`;
$('info-min').textContent = selectedServiceObj.min || 1;
$('info-max').textContent = selectedServiceObj.max || 100000;
$('service-info-box').classList.remove('hidden');
$('order-quantity').value = selectedServiceObj.min || 10;
calculateTotal();
} else {
$('service-info-box').classList.add('hidden');
}
});

$('order-quantity').addEventListener('input', calculateTotal);

function calculateTotal() {
if (!selectedServiceObj) {
$('order-total-charge').textContent = 'PKR 0';
return;
}
const qty = Number($('order-quantity').value) || 0;
const rate = Number(selectedServiceObj.rate) || 0;
const total = (qty / 1000) * rate;
$('order-total-charge').textContent = `PKR ${total.toFixed(2)}`;
}

async function fetchPlayerOrders(userId) {
const container = $('player-orders-list');
try {
let { data, error } = await supabaseClient.from('smm_orders').select('*').order('created_at', { ascending: false }).limit(10);
if (error) throw error;

if (!data || data.length === 0) {
container.innerHTML = '<p class="text-gray-500 text-center py-4 text-xs">No orders placed yet.</p>';
return;
}

container.innerHTML = data.map(o => `
<div class="bg-[#06070a] border border-[#262f40] p-3 rounded-xl flex justify-between items-center text-xs">
<div>
<p class="text-white font-bold">${o.service_name}</p>
<p class="text-gray-400 text-[10px] truncate max-w-[180px]">Link: ${o.link}</p>
<p class="text-gray-400 text-[10px]">Qty: ${o.quantity} | Charge: <span class="text-amber-400">PKR ${o.charge || 0}</span></p>
</div>
<span class="px-2 py-1 rounded text-[10px] font-bold uppercase bg-gray-800 text-amber-400 border border-gray-700">${o.status || 'Pending'}</span>
</div>
`).join('');
} catch (e) {
container.innerHTML = '<p class="text-red-400 text-center py-2 text-xs">Could not load orders.</p>';
}
}

$('smm-order-form').addEventListener('submit', async function(e) {
e.preventDefault();
if (!selectedServiceObj) return alert('Please select a service.');

const link = $('order-link').value.trim();
const quantity = Number($('order-quantity').value);
const min = selectedServiceObj.min || 1;
const rate = Number(selectedServiceObj.rate) || 0;
const totalCharge = (quantity / 1000) * rate;

if (quantity < min) {
return alert(`Minimum quantity for this service is ${min}`);
}

if (currentUser && userWalletBalance < totalCharge) {
return alert('Insufficient wallet balance! Please deposit money first.');
}

const btn = $('submit-order-btn');
btn.disabled = true;
btn.textContent = 'PLACING ORDER...';

try {
// 1. Deduct Wallet if logged in
if (currentUser) {
const newBalance = userWalletBalance - totalCharge;
let walletUpdate = await supabaseClient.from('wallets').update({ balance: newBalance }).eq('user_id', currentUser.id);
if (walletUpdate.error) {
let profileUpdate = await supabaseClient.from('profiles').update({ balance: newBalance }).eq('id', currentUser.id);
if (profileUpdate.error) throw new Error('Wallet deduction failed.');
}
userWalletBalance = newBalance;
$('player-wallet-balance').textContent = `PKR ${userWalletBalance}`;
}

// 2. Insert Order into smm_orders table
const orderRecord = {
order_id: Math.floor(100000 + Math.random() * 900000),
service_name: selectedServiceObj.name,
link: link,
quantity: quantity,
charge: totalCharge,
status: 'Pending'
};

const { error } = await supabaseClient.from('smm_orders').insert([orderRecord]);
if (error) throw error;

alert('SMM Order placed successfully! Admin will process it soon.');
$('order-link').value = '';
$('order-quantity').value = '';
if (currentUser) fetchPlayerOrders(currentUser.id);
} catch (err) {
console.error(err);
alert('Order placement failed: ' + err.message);
} finally {
btn.disabled = false;
btn.textContent = 'PLACE SMM ORDER';
}
});

window.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
