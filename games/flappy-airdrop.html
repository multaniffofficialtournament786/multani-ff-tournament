<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MULTANI FLAPPY AIRDROP</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body {
  background: #06070a;
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}
#game-wrap {
  width: 100%;
  max-width: 500px;
  margin: auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background-color: #0b0f19;
  background-image: url('https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/1792388836123.jpg');
  background-size: cover;
  background-position: center;
}
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: rgba(14, 17, 24, 0.9);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid #ff542d44;
  z-index: 10;
}
.title-tag { font-size: 16px; font-weight: 900; color: #ffbe00; text-shadow: 0 0 10px rgba(255,190,0,0.5); }
.header-actions { display: flex; align-items: center; gap: 12px; }
.score-badge { font-weight: bold; font-size: 15px; color: #00f0ff; }
.music-toggle {
  background: rgba(255,255,255,0.1);
  border: 1px solid #00f0ff;
  color: #fff;
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  font-weight: 700;
}

#stage-box { flex: 1; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }

#game-overlay {
  position: absolute;
  inset: 0;
  background: rgba(4, 6, 12, 0.88);
  backdrop-filter: blur(5px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  z-index: 20;
}
#game-overlay h1 { font-size: 30px; color: #ffbe00; margin-bottom: 8px; text-shadow: 0 0 16px #ff542d; }
#game-overlay p { font-size: 13px; color: #cbd5e1; line-height: 1.6; max-width: 290px; margin-bottom: 20px; }
.play-btn {
  padding: 13px 34px;
  font-size: 16px;
  font-weight: 800;
  color: #000;
  background: linear-gradient(135deg, #00f0ff, #00e676);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 240, 255, 0.4);
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="game-wrap">
  <div class="header-bar">
    <div class="title-tag">🪂 FLAPPY AIRDROP</div>
    <div class="header-actions">
      <button class="music-toggle" id="musicBtn">🎵 MUSIC ON</button>
      <div class="score-badge">⭐ <span id="scoreText">0</span></div>
    </div>
  </div>

  <div id="stage-box">
    <canvas id="gameCanvas"></canvas>
    
    <div id="game-overlay">
      <h1 id="screenTitle">FLAPPY AIRDROP</h1>
      <p id="screenDesc">
        Screen par Tap karke Airdrop ko hawa mein rakhein!<br>
        Towers se bach kar nikalna hai.<br>
        Dekhein aap kitna aage ja sakte hain!
      </p>
      <button class="play-btn" id="startBtn">▶ START GAME</button>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage-box");
  const scoreText = document.getElementById("scoreText");
  const overlay = document.getElementById("game-overlay");
  const screenTitle = document.getElementById("screenTitle");
  const screenDesc = document.getElementById("screenDesc");
  const startBtn = document.getElementById("startBtn");
  const musicBtn = document.getElementById("musicBtn");

  let W, H;
  let running = false;
  let score = 0;
  let frames = 0;
  let audioCtx = null;
  let musicOn = true;
  let musicInterval = null;

  const player = {
    x: 60,
    y: 200,
    w: 36,
    h: 36,
    vy: 0,
    gravity: 0.38,
    jump: -6.8
  };

  let pipes = [];
  const pipeWidth = 56;
  const pipeGap = 150;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  // FUNNY SOUND EFFECTS
  function playFlapSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(380, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  function playScoreSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(659, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1318, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
  }

  function playCrashSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(45, audioCtx.currentTime + 0.35);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
  }

  // CHEERFUL BGM
  const melody = [261.63, 293.66, 329.63, 392.00, 329.63, 293.66, 349.23, 392.00];
  let melIdx = 0;

  function startMusic() {
    if (musicInterval) clearInterval(musicInterval);
    if (!musicOn) return;

    musicInterval = setInterval(() => {
      if (!running || !musicOn || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.value = melody[melIdx % melody.length];
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.16);
      melIdx++;
    }, 220);
  }

  function toggleMusic() {
    initAudio();
    musicOn = !musicOn;
    musicBtn.innerText = musicOn ? "🎵 MUSIC ON" : "🔇 MUSIC OFF";
    if (musicOn && running) startMusic();
    else if (musicInterval) {
      clearInterval(musicInterval);
      musicInterval = null;
    }
  }

  musicBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleMusic();
  });

  function resize() {
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  function flap() {
    if (!running) return;
    initAudio();
    playFlapSound();
    player.vy = player.jump;
  }

  canvas.addEventListener("pointerdown", flap);

  function drawPlayer() {
    ctx.save();
    ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
    
    // Tilt angle based on velocity
    const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, player.vy * 0.08));
    ctx.rotate(angle);

    // Parachute canopy
    ctx.fillStyle = "#ff542d";
    ctx.beginPath();
    ctx.arc(0, -14, 18, Math.PI, 0);
    ctx.closePath();
    ctx.fill();

    // Ropes
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-16, -14);
    ctx.lineTo(-4, 0);
    ctx.moveTo(16, -14);
    ctx.lineTo(4, 0);
    ctx.stroke();

    // Airdrop crate
    ctx.fillStyle = "#e53935";
    ctx.beginPath();
    ctx.roundRect(-14, 0, 28, 22, 4);
    ctx.fill();

    // Blue ribbon
    ctx.fillStyle = "#00f0ff";
    ctx.fillRect(-14, 8, 28, 5);

    ctx.restore();
  }

  function drawPipes() {
    for (const p of pipes) {
      // Top pipe
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(p.x, 0, pipeWidth, p.top);
      ctx.strokeStyle = "#ffbe00";
      ctx.lineWidth = 2.5;
      ctx.strokeRect(p.x, 0, pipeWidth, p.top);

      // Top pipe rim
      ctx.fillStyle = "#ff542d";
      ctx.fillRect(p.x - 3, p.top - 18, pipeWidth + 6, 18);

      // Bottom pipe
      const bottomY = p.top + pipeGap;
      const bottomH = H - bottomY;
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(p.x, bottomY, pipeWidth, bottomH);
      ctx.strokeStyle = "#ffbe00";
      ctx.lineWidth = 2.5;
      ctx.strokeRect(p.x, bottomY, pipeWidth, bottomH);

      // Bottom pipe rim
      ctx.fillStyle = "#ff542d";
      ctx.fillRect(p.x - 3, bottomY, pipeWidth + 6, 18);
    }
  }

  function startGame() {
    initAudio();
    score = 0;
    frames = 0;
    pipes = [];
    player.y = H * 0.4;
    player.vy = 0;
    scoreText.innerText = "0";
    running = true;
    overlay.classList.add("hidden");
    startMusic();
    loop();
  }

  function gameOver() {
    running = false;
    playCrashSound();
    if (musicInterval) {
      clearInterval(musicInterval);
      musicInterval = null;
    }
    screenTitle.innerText = "💥 CRASHED!";
    screenDesc.innerHTML = `Tower se takra gaye!<br>Aapka Final Score: <b style="color:#00f0ff; font-size:22px;">${score}</b>`;
    startBtn.innerText = "↻ TRY AGAIN";
    overlay.classList.remove("hidden");
  }

  startBtn.addEventListener("click", startGame);

  function loop() {
    if (!running) return;
    ctx.clearRect(0, 0, W, H);

    frames++;

    // Player physics
    player.vy += player.gravity;
    player.y += player.vy;

    // Ceiling & Ground collision
    if (player.y < 0) {
      player.y = 0;
      player.vy = 0;
    }
    if (player.y + player.h >= H - 10) {
      gameOver();
      return;
    }

    // Spawn pipes
    if (frames % 105 === 0) {
      const minPipe = 60;
      const maxPipe = H - pipeGap - minPipe;
      const topHeight = Math.floor(Math.random() * (maxPipe - minPipe + 1)) + minPipe;
      pipes.push({
        x: W + 10,
        top: topHeight,
        passed: false
      });
    }

    // Move & collide pipes
    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= 2.6;

      // Score count
      if (!p.passed && p.x + pipeWidth < player.x) {
        p.passed = true;
        score++;
        scoreText.innerText = score;
        playScoreSound();
      }

      // Check collision
      const bottomY = p.top + pipeGap;
      const box = { x: player.x, y: player.y + 6, w: player.w, h: player.h - 6 };

      const hitTop = (box.x + box.w > p.x && box.x < p.x + pipeWidth && box.y < p.top);
      const hitBottom = (box.x + box.w > p.x && box.x < p.x + pipeWidth && box.y + box.h > bottomY);

      if (hitTop || hitBottom) {
        gameOver();
        return;
      }

      if (p.x + pipeWidth < -20) {
        pipes.splice(i, 1);
      }
    }

    drawPipes();
    drawPlayer();

    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
