<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MULTANI 3D TRAFFIC RACER</title>
<!-- Three.js 3D Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body {
  background: #06070a;
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}
#game-wrap {
  width: 100%;
  max-width: 500px;
  margin: auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background-color: #0b0f19;
  background-image: url('https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/1792388836123.jpg');
  background-size: cover;
  background-position: center;
}
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: rgba(14, 17, 24, 0.9);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid #ff542d44;
  z-index: 10;
}
.title-tag { font-size: 16px; font-weight: 900; color: #ffbe00; text-shadow: 0 0 10px rgba(255,190,0,0.5); }
.header-actions { display: flex; align-items: center; gap: 10px; }
.stats-badge { font-weight: bold; font-size: 15px; color: #00f0ff; }
.music-toggle {
  background: rgba(255,255,255,0.1);
  border: 1px solid #00f0ff;
  color: #fff;
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  font-weight: 700;
}

#stage-box { flex: 1; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }

#game-overlay {
  position: absolute;
  inset: 0;
  background: rgba(4, 6, 12, 0.88);
  backdrop-filter: blur(5px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  z-index: 20;
}
#game-overlay h1 { font-size: 32px; color: #ffbe00; margin-bottom: 8px; text-shadow: 0 0 16px #ff542d; }
#game-overlay p { font-size: 13px; color: #cbd5e1; line-height: 1.6; max-width: 290px; margin-bottom: 20px; }
.play-btn {
  padding: 13px 34px;
  font-size: 16px;
  font-weight: 800;
  color: #000;
  background: linear-gradient(135deg, #00f0ff, #00e676);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 240, 255, 0.4);
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="game-wrap">
  <div class="header-bar">
    <div class="title-tag">🏎️ 3D TRAFFIC RACER</div>
    <div class="header-actions">
      <button class="music-toggle" id="musicBtn">🎵 MUSIC ON</button>
      <div class="stats-badge">⭐ <span id="scoreText">0</span></div>
    </div>
  </div>

  <div id="stage-box">
    <div id="game-overlay">
      <h1 id="screenTitle">3D TRAFFIC RACER</h1>
      <p id="screenDesc">
        Screen par Left/Right Ungli ghumayein!<br>
        🚗 Traffic aur doosri cars se bachein.<br>
        ⭐ Chamakdar Coins collect karke record banayein!
      </p>
      <button class="play-btn" id="startBtn">▶ START RACING</button>
    </div>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById("stage-box");
  const scoreText = document.getElementById("scoreText");
  const overlay = document.getElementById("game-overlay");
  const screenTitle = document.getElementById("screenTitle");
  const screenDesc = document.getElementById("screenDesc");
  const startBtn = document.getElementById("startBtn");
  const musicBtn = document.getElementById("musicBtn");

  let scene, camera, renderer;
  let playerCar;
  let roadLines = [];
  let trafficCars = [];
  let coins = [];
  let running = false;
  let score = 0;
  let speed = 0.6;
  let targetX = 0;

  let audioCtx = null;
  let musicOn = true;

  // Background Audio (Sanwal Karaoke Track)
  const bgMusic = new Audio("https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/games/SANWAL___Karaoke_with_URDU_Lyrics___Shafaullah_Khan_Rokhri___Saraiki___Love_Song___Rokhri_Production(256k).mp3");
  bgMusic.loop = true;
  bgMusic.volume = 0.18; // Background music volume low

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  // TEZ SOUND EFFECTS
  function playCoinSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(650, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  function playCrashSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(260, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(35, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.45, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }

  function toggleMusic() {
    initAudio();
    musicOn = !musicOn;
    musicBtn.innerText = musicOn ? "🎵 MUSIC ON" : "🔇 MUSIC OFF";
    if (musicOn && running) bgMusic.play().catch(()=>{});
    else bgMusic.pause();
  }
  musicBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleMusic();
  });

  // BUILD 3D CAR HELPER
  function createCarMesh(color) {
    const carGroup = new THREE.Group();

    // Body
    const bodyGeo = new THREE.BoxGeometry(0.9, 0.4, 1.6);
    const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.25;
    carGroup.add(body);

    // Roof
    const roofGeo = new THREE.BoxGeometry(0.7, 0.3, 0.8);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x111520, roughness: 0.2 });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.set(0, 0.5, -0.1);
    carGroup.add(roof);

    // Headlights
    const lightGeo = new THREE.BoxGeometry(0.18, 0.1, 0.05);
    const lightMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
    const l1 = new THREE.Mesh(lightGeo, lightMat);
    l1.position.set(-0.3, 0.25, -0.81);
    const l2 = new THREE.Mesh(lightGeo, lightMat);
    l2.position.set(0.3, 0.25, -0.81);
    carGroup.add(l1);
    carGroup.add(l2);

    return carGroup;
  }

  // INITIALIZE 3D ENGINE
  function init3D() {
    const W = stage.clientWidth;
    const H = stage.clientHeight;

    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x060814, 0.02);

    camera = new THREE.PerspectiveCamera(65, W / H, 0.1, 100);
    camera.position.set(0, 2.5, 4.5);
    camera.lookAt(0, 0, -6);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    stage.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 12, 6);
    scene.add(dirLight);

    // Road Surface
    const roadGeo = new THREE.PlaneGeometry(6, 120);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x151821, roughness: 0.8 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -50;
    scene.add(road);

    // Animated Road Strips
    for (let i = 0; i < 15; i++) {
      const lineGeo = new THREE.PlaneGeometry(0.18, 2.5);
      const lineMat = new THREE.MeshBasicMaterial({ color: 0xffbe00 });
      const line = new THREE.Mesh(lineGeo, lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.02, -i * 8);
      scene.add(line);
      roadLines.push(line);
    }

    // Player Car (Neon Orange)
    playerCar = createCarMesh(0xff542d);
    playerCar.position.set(0, 0, 0);
    scene.add(playerCar);
  }

  // SPAWN TRAFFIC & COINS
  const TRAFFIC_COLORS = [0x00f0ff, 0xff1744, 0x00e676, 0xffbe00, 0x9d00ff];
  const LANES = [-1.8, 0, 1.8];

  function spawnObjects() {
    // Traffic Car
    if (Math.random() < 0.045) {
      const col = TRAFFIC_COLORS[Math.floor(Math.random() * TRAFFIC_COLORS.length)];
      const car = createCarMesh(col);
      const laneX = LANES[Math.floor(Math.random() * LANES.length)];
      car.position.set(laneX, 0, -50);
      scene.add(car);
      trafficCars.push(car);
    }

    // Gold Coin
    if (Math.random() < 0.04) {
      const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.08, 12);
      const coinMat = new THREE.MeshStandardMaterial({ color: 0xffbe00, metalness: 0.9, roughness: 0.1 });
      const coin = new THREE.Mesh(coinGeo, coinMat);
      coin.rotation.x = Math.PI / 2;
      const laneX = LANES[Math.floor(Math.random() * LANES.length)];
      coin.position.set(laneX, 0.35, -50);
      scene.add(coin);
      coins.push(coin);
    }
  }

  // CONTROLS (Drag Left / Right)
  function handleMove(clientX) {
    if (!running) return;
    const rect = stage.getBoundingClientRect();
    const normX = ((clientX - rect.left) / rect.width) * 2 - 1;
    targetX = normX * 2.1;
  }

  stage.addEventListener("pointerdown", (e) => handleMove(e.clientX));
  stage.addEventListener("pointermove", (e) => {
    if (e.buttons === 1) handleMove(e.clientX);
  });

  function resize() {
    if (!renderer) return;
    const W = stage.clientWidth;
    const H = stage.clientHeight;
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  }
  window.addEventListener("resize", resize);

  function startGame() {
    initAudio();
    score = 0;
    speed = 0.6;
    targetX = 0;
    playerCar.position.set(0, 0, 0);

    trafficCars.forEach(c => scene.remove(c));
    coins.forEach(c => scene.remove(c));
    trafficCars = [];
    coins = [];

    scoreText.innerText = "0";
    running = true;
    overlay.classList.add("hidden");

    if (musicOn) bgMusic.play().catch(()=>{});
    animate();
  }

  function gameOver() {
    running = false;
    bgMusic.pause();
    playCrashSound();
    screenTitle.innerText = "💥 ACCIDENT!";
    screenDesc.innerHTML = `Car crash ho gayi!<br>Aapka Final Score: <b style="color:#00f0ff; font-size:24px;">${score}</b>`;
    startBtn.innerText = "↻ PLAY AGAIN";
    overlay.classList.remove("hidden");
  }

  startBtn.addEventListener("click", startGame);

  // 3D RENDER LOOP
  function animate() {
    if (!running) return;
    requestAnimationFrame(animate);

    // Car Steering & Tilt
    playerCar.position.x += (targetX - playerCar.position.x) * 0.12;
    playerCar.rotation.y = -(targetX - playerCar.position.x) * 0.3;

    // Road Lines Movement
    roadLines.forEach(line => {
      line.position.z += speed;
      if (line.position.z > 6) {
        line.position.z -= 120;
      }
    });

    spawnObjects();

    // Traffic Cars
    for (let i = trafficCars.length - 1; i >= 0; i--) {
      const car = trafficCars[i];
      car.position.z += speed * 0.65;

      // Crash check
      const dist = playerCar.position.distanceTo(car.position);
      if (dist < 1.15) {
        gameOver();
        return;
      }

      if (car.position.z > 6) {
        scene.remove(car);
        trafficCars.splice(i, 1);
        score += 2;
        scoreText.innerText = score;
        speed = Math.min(speed + 0.0008, 1.1);
      }
    }

    // Coins
    for (let i = coins.length - 1; i >= 0; i--) {
      const coin = coins[i];
      coin.position.z += speed;
      coin.rotation.z += 0.05;

      // Collect check
      const dist = playerCar.position.distanceTo(coin.position);
      if (dist < 1.05) {
        playCoinSound();
        scene.remove(coin);
        coins.splice(i, 1);
        score += 10;
        scoreText.innerText = score;
        continue;
      }

      if (coin.position.z > 6) {
        scene.remove(coin);
        coins.splice(i, 1);
      }
    }

    renderer.render(scene, camera);
  }

  init3D();
})();
</script>
</body>
</html>
