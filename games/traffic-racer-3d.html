<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MULTANI 3D HORSE RUNNER</title>
<!-- Three.js 3D Engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body {
  background: #06070a;
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}
#game-wrap {
  width: 100%;
  max-width: 500px;
  margin: auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background-color: #0b0f19;
  background-image: url('https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/1792388836123.jpg');
  background-size: cover;
  background-position: center bottom;
}
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: rgba(14, 17, 24, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid #ff542d44;
  z-index: 10;
}
.back-btn {
  background: #ff542d;
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 8px;
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(255,84,45,0.4);
}
.title-tag { font-size: 15px; font-weight: 900; color: #ffbe00; text-shadow: 0 0 10px rgba(255,190,0,0.5); }
.header-actions { display: flex; align-items: center; gap: 8px; }
.stats-badge { font-weight: bold; font-size: 14px; color: #00f0ff; }
.music-toggle {
  background: rgba(255,255,255,0.1);
  border: 1px solid #00f0ff;
  color: #fff;
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  font-weight: 700;
}

#stage-box { flex: 1; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }

/* BRAKE BUTTON */
.brake-control {
  position: absolute;
  bottom: 22px;
  right: 22px;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle, #ff1744, #b71c1c);
  border: 3px solid #ffbe00;
  color: white;
  font-weight: 900;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 16px rgba(255, 23, 68, 0.6);
  cursor: pointer;
  z-index: 15;
  user-select: none;
}
.brake-control:active {
  transform: scale(0.92);
  background: #b71c1c;
}
.brake-control span { font-size: 18px; line-height: 1; margin-bottom: 2px; }

#game-overlay {
  position: absolute;
  inset: 0;
  background: rgba(4, 6, 12, 0.88);
  backdrop-filter: blur(5px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  z-index: 20;
}
#game-overlay h1 { font-size: 30px; color: #ffbe00; margin-bottom: 8px; text-shadow: 0 0 16px #ff542d; }
#game-overlay p { font-size: 13px; color: #cbd5e1; line-height: 1.6; max-width: 290px; margin-bottom: 20px; }
.play-btn {
  padding: 13px 34px;
  font-size: 16px;
  font-weight: 800;
  color: #000;
  background: linear-gradient(135deg, #00f0ff, #00e676);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 240, 255, 0.4);
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="game-wrap">
  <div class="header-bar">
    <button class="back-btn" id="backNavBtn">⬅ BACK</button>
    <div class="title-tag">🐎 3D HORSE RUNNER</div>
    <div class="header-actions">
      <button class="music-toggle" id="musicBtn">🎵 MUSIC</button>
      <div class="stats-badge">⭐ <span id="scoreText">0</span></div>
    </div>
  </div>

  <div id="stage-box">
    <!-- BRAKE BUTTON -->
    <div class="brake-control" id="brakeBtn">
      <span>🛑</span>
      BRAKE
    </div>

    <div id="game-overlay">
      <h1 id="screenTitle">3D HORSE RUNNER</h1>
      <p id="screenDesc">
        🐎 Ungli se Ghoray ko Left/Right ghumayein.<br>
        🛑 Rukawat aane par <b>BRAKE</b> daba kar slow karein.<br>
        ⭐ Chamakdar Coins collect karke aasan score banayein!
      </p>
      <button class="play-btn" id="startBtn">▶ START RUN</button>
    </div>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById("stage-box");
  const scoreText = document.getElementById("scoreText");
  const overlay = document.getElementById("game-overlay");
  const screenTitle = document.getElementById("screenTitle");
  const screenDesc = document.getElementById("screenDesc");
  const startBtn = document.getElementById("startBtn");
  const musicBtn = document.getElementById("musicBtn");
  const backNavBtn = document.getElementById("backNavBtn");
  const brakeBtn = document.getElementById("brakeBtn");

  // Back Navigation
  backNavBtn.addEventListener("click", () => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "../index.html";
    }
  });

  let scene, camera, renderer;
  let horseGroup;
  let legFL, legFR, legBL, legBR, horseTail, horseNeck;
  let obstacles = [];
  let coins = [];
  let roadLines = [];
  let running = false;
  let score = 0;
  let animTime = 0;

  // Bilkul easy aur aahista speed
  const NORMAL_SPEED = 0.22;
  const BRAKE_SPEED = 0.08;
  let speed = NORMAL_SPEED;
  let targetX = 0;

  let audioCtx = null;
  let musicOn = true;

  // Background Audio (Sanwal Track)
  const bgMusic = new Audio("https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/games/SANWAL___Karaoke_with_URDU_Lyrics___Shafaullah_Khan_Rokhri___Saraiki___Love_Song___Rokhri_Production(256k).mp3");
  bgMusic.loop = true;
  bgMusic.volume = 0.18;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function playCoinSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(650, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  function playCrashSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(35, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.40, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }

  function toggleMusic() {
    initAudio();
    musicOn = !musicOn;
    musicBtn.innerText = musicOn ? "🎵 MUSIC" : "🔇 MUTED";
    if (musicOn && running) bgMusic.play().catch(()=>{});
    else bgMusic.pause();
  }
  musicBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleMusic();
  });

  // BRAKE HANDLERS
  const startBrake = (e) => {
    e.preventDefault();
    speed = BRAKE_SPEED;
  };
  const endBrake = (e) => {
    e.preventDefault();
    speed = NORMAL_SPEED;
  };
  brakeBtn.addEventListener("pointerdown", startBrake);
  window.addEventListener("pointerup", endBrake);
  window.addEventListener("pointercancel", endBrake);

  // BUILD REALISTIC 3D ANIMATED HORSE
  function create3DHorse() {
    const horse = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.6 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x221510, roughness: 0.4 });
    const saddleMat = new THREE.MeshStandardMaterial({ color: 0xff542d });

    // Torso
    const bodyGeo = new THREE.BoxGeometry(0.65, 0.7, 1.4);
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.95;
    horse.add(body);

    // Saddle
    const saddleGeo = new THREE.BoxGeometry(0.7, 0.2, 0.55);
    const saddle = new THREE.Mesh(saddleGeo, saddleMat);
    saddle.position.set(0, 1.25, 0);
    horse.add(saddle);

    // Neck & Head
    horseNeck = new THREE.Group();
    horseNeck.position.set(0, 1.15, -0.6);

    const neckGeo = new THREE.BoxGeometry(0.32, 0.8, 0.4);
    neckGeo.rotateX(Math.PI / 6);
    const neckMesh = new THREE.Mesh(neckGeo, bodyMat);
    neckMesh.position.set(0, 0.38, -0.18);
    horseNeck.add(neckMesh);

    const headGeo = new THREE.BoxGeometry(0.35, 0.38, 0.65);
    const headMesh = new THREE.Mesh(headGeo, bodyMat);
    headMesh.position.set(0, 0.72, -0.42);
    horseNeck.add(headMesh);

    const maneGeo = new THREE.BoxGeometry(0.1, 0.7, 0.3);
    const maneMesh = new THREE.Mesh(maneGeo, darkMat);
    maneMesh.position.set(0, 0.52, -0.05);
    horseNeck.add(maneMesh);

    horse.add(horseNeck);

    // Tail
    horseTail = new THREE.Group();
    horseTail.position.set(0, 1.15, 0.7);
    const tailGeo = new THREE.BoxGeometry(0.14, 0.75, 0.14);
    tailGeo.rotateX(-Math.PI / 8);
    const tailMesh = new THREE.Mesh(tailGeo, darkMat);
    tailMesh.position.set(0, -0.32, 0.12);
    horseTail.add(tailMesh);
    horse.add(horseTail);

    // Legs
    function makeLeg(x, z) {
      const legPivot = new THREE.Group();
      legPivot.position.set(x, 0.9, z);

      const legGeo = new THREE.BoxGeometry(0.18, 0.85, 0.18);
      const legMesh = new THREE.Mesh(legGeo, bodyMat);
      legMesh.position.set(0, -0.42, 0);
      legPivot.add(legMesh);

      const hoofGeo = new THREE.BoxGeometry(0.2, 0.14, 0.2);
      const hoofMesh = new THREE.Mesh(hoofGeo, darkMat);
      hoofMesh.position.set(0, -0.8, 0);
      legPivot.add(hoofMesh);

      horse.add(legPivot);
      return legPivot;
    }

    legFL = makeLeg(-0.22, -0.45);
    legFR = makeLeg(0.22, -0.45);
    legBL = makeLeg(-0.22, 0.45);
    legBR = makeLeg(0.22, 0.45);

    return horse;
  }

  // INITIALIZE 3D WORLD WITH FLAT GROUND PERSPECTIVE
  function init3D() {
    const W = stage.clientWidth;
    const H = stage.clientHeight;

    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0e1a, 0.015);

    // Camera angle seedha zameen par gate ki taraf
    camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 100);
    camera.position.set(0, 1.5, 6.0);
    camera.lookAt(0, 0.1, -12);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    stage.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    // ZAMEEN PAR FLAT ROAD (GATE KI TARAF SEEDHI)
    const roadWidth = 6.5;
    const roadGeo = new THREE.PlaneGeometry(roadWidth, 120);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x181e28, roughness: 0.9 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, -0.85, -50);
    scene.add(road);

    // Yellow Center Strips
    for (let i = 0; i < 15; i++) {
      const lineGeo = new THREE.PlaneGeometry(0.18, 2.2);
      const lineMat = new THREE.MeshBasicMaterial({ color: 0xffbe00 });
      const line = new THREE.Mesh(lineGeo, lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, -0.83, -i * 8);
      scene.add(line);
      roadLines.push(line);
    }

    // Horse
    horseGroup = create3DHorse();
    horseGroup.position.set(0, -0.85, 0);
    scene.add(horseGroup);
  }

  // LANES (Bohat chaudi aur safe lanes)
  const LANES = [-2.0, 0, 2.0];

  function spawnObjects() {
    // Traffic / Obstacle (Frequency bohat kam kar di hai taaki aasaani se bachein)
    if (Math.random() < 0.016) {
      const obsGroup = new THREE.Group();
      const obsMat = new THREE.MeshStandardMaterial({ color: 0xd32f2f });
      const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.65, 0.35), obsMat);
      box.position.y = 0.32;
      obsGroup.add(box);

      const laneX = LANES[Math.floor(Math.random() * LANES.length)];
      obsGroup.position.set(laneX, -0.85, -55);
      scene.add(obsGroup);
      obstacles.push(obsGroup);
    }

    // Gold Coins
    if (Math.random() < 0.035) {
      const coinGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.08, 12);
      const coinMat = new THREE.MeshStandardMaterial({ color: 0xffbe00, metalness: 0.9, roughness: 0.1 });
      const coin = new THREE.Mesh(coinGeo, coinMat);
      coin.rotation.x = Math.PI / 2;
      const laneX = LANES[Math.floor(Math.random() * LANES.length)];
      coin.position.set(laneX, -0.35, -55);
      scene.add(coin);
      coins.push(coin);
    }
  }

  // CONTROLS (Swipe / Drag Left Right)
  function handleMove(clientX) {
    if (!running) return;
    const rect = stage.getBoundingClientRect();
    const normX = ((clientX - rect.left) / rect.width) * 2 - 1;
    targetX = normX * 2.2;
  }

  stage.addEventListener("pointerdown", (e) => {
    if (e.target !== brakeBtn && !brakeBtn.contains(e.target)) handleMove(e.clientX);
  });
  stage.addEventListener("pointermove", (e) => {
    if (e.buttons === 1 && e.target !== brakeBtn) handleMove(e.clientX);
  });

  function resize() {
    if (!renderer) return;
    const W = stage.clientWidth;
    const H = stage.clientHeight;
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  }
  window.addEventListener("resize", resize);

  function startGame() {
    initAudio();
    score = 0;
    speed = NORMAL_SPEED;
    targetX = 0;
    animTime = 0;
    horseGroup.position.set(0, -0.85, 0);

    obstacles.forEach(o => scene.remove(o));
    coins.forEach(c => scene.remove(c));
    obstacles = [];
    coins = [];

    scoreText.innerText = "0";
    running = true;
    overlay.classList.add("hidden");

    if (musicOn) bgMusic.play().catch(()=>{});
    animate();
  }

  function gameOver() {
    running = false;
    bgMusic.pause();
    playCrashSound();
    screenTitle.innerText = "💥 OOPS! TAKKAR HO GAYI!";
    screenDesc.innerHTML = `Rukawat se takra gaye!<br>Aapka Score: <b style="color:#00f0ff; font-size:24px;">${score}</b>`;
    startBtn.innerText = "↻ PLAY AGAIN";
    overlay.classList.remove("hidden");
  }

  startBtn.addEventListener("click", startGame);

  function animate() {
    if (!running) return;
    requestAnimationFrame(animate);

    // Horse Steer
    horseGroup.position.x += (targetX - horseGroup.position.x) * 0.12;
    horseGroup.rotation.y = -(targetX - horseGroup.position.x) * 0.25;

    // Road Lines Flow
    roadLines.forEach(line => {
      line.position.z += speed;
      if (line.position.z > 6) {
        line.position.z -= 120;
      }
    });

    // Horse Gallop Animation
    animTime += speed * 0.8;
    const gallop = Math.sin(animTime * 10);
    const gallopCos = Math.cos(animTime * 10);

    horseGroup.position.y = -0.85 + Math.abs(gallop) * 0.12;

    legFL.rotation.x = gallop * 0.65;
    legBR.rotation.x = -gallop * 0.65;
    legFR.rotation.x = -gallop * 0.65;
    legBL.rotation.x = gallop * 0.65;

    horseNeck.rotation.x = gallopCos * 0.08;
    horseTail.rotation.x = -gallop * 0.2;

    spawnObjects();

    // Obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.position.z += speed;

      const dist = horseGroup.position.distanceTo(o.position);
      if (dist < 0.95) {
        gameOver();
        return;
      }

      if (o.position.z > 6) {
        scene.remove(o);
        obstacles.splice(i, 1);
        score += 2;
        scoreText.innerText = score;
      }
    }

    // Coins
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.position.z += speed;
      c.rotation.z += 0.05;

      const dist = horseGroup.position.distanceTo(c.position);
      if (dist < 1.05) {
        playCoinSound();
        scene.remove(c);
        coins.splice(i, 1);
        score += 10;
        scoreText.innerText = score;
        continue;
      }

      if (c.position.z > 6) {
        scene.remove(c);
        coins.splice(i, 1);
      }
    }

    renderer.render(scene, camera);
  }

  init3D();
})();
</script>
</body>
</html>
