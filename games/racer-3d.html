<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MULTANI 3D HORSE RUNNER</title>
<!-- Three.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body {
  background: #06070a;
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}
#game-wrap {
  width: 100%;
  max-width: 500px;
  margin: auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background-color: #0b0f19;
  background-image: url('https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/1792388836123.jpg');
  background-size: 100% 100%;
  background-position: center;
}
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: rgba(14, 17, 24, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid #ff542d44;
  z-index: 10;
}
.back-btn {
  background: #ff542d;
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 8px;
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(255,84,45,0.4);
}
.title-tag { font-size: 15px; font-weight: 900; color: #ffbe00; text-shadow: 0 0 10px rgba(255,190,0,0.5); }
.header-actions { display: flex; align-items: center; gap: 8px; }
.stats-badge { font-weight: bold; font-size: 14px; color: #00f0ff; }
.music-toggle {
  background: rgba(255,255,255,0.1);
  border: 1px solid #00f0ff;
  color: #fff;
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  font-weight: 700;
}

#stage-box { flex: 1; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }

.brake-control {
  position: absolute;
  bottom: 24px;
  right: 20px;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle, #ff1744, #b71c1c);
  border: 3px solid #ffbe00;
  color: white;
  font-weight: 900;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 16px rgba(255, 23, 68, 0.6);
  cursor: pointer;
  z-index: 15;
  user-select: none;
}
.brake-control:active {
  transform: scale(0.92);
  background: #b71c1c;
}
.brake-control span { font-size: 18px; line-height: 1; margin-bottom: 2px; }

#game-overlay {
  position: absolute;
  inset: 0;
  background: rgba(4, 6, 12, 0.88);
  backdrop-filter: blur(5px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  z-index: 20;
}
#game-overlay h1 { font-size: 30px; color: #ffbe00; margin-bottom: 8px; text-shadow: 0 0 16px #ff542d; }
#game-overlay p { font-size: 13px; color: #cbd5e1; line-height: 1.6; max-width: 290px; margin-bottom: 20px; }
.play-btn {
  padding: 13px 34px;
  font-size: 16px;
  font-weight: 800;
  color: #000;
  background: linear-gradient(135deg, #00f0ff, #00e676);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 240, 255, 0.4);
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="game-wrap">
  <div class="header-bar">
    <button class="back-btn" id="backNavBtn">⬅ BACK</button>
    <div class="title-tag">🐎 3D HORSE RUNNER</div>
    <div class="header-actions">
      <button class="music-toggle" id="musicBtn">🎵 MUSIC</button>
      <div class="stats-badge">⭐ <span id="scoreText">0</span></div>
    </div>
  </div>

  <div id="stage-box">
    <div class="brake-control" id="brakeBtn">
      <span>🛑</span>
      BRAKE
    </div>

    <div id="game-overlay">
      <h1 id="screenTitle">3D HORSE RUNNER</h1>
      <p id="screenDesc">
        🐎 Screen par Left / Right drag karke chalaein.<br>
        🛑 <b>BRAKE</b> daba kar ghoray ko slow karein.<br>
        ⭐ Coins pakrein aur asaan maze se khelein!
      </p>
      <button class="play-btn" id="startBtn">▶ START RUN</button>
    </div>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById("stage-box");
  const scoreText = document.getElementById("scoreText");
  const overlay = document.getElementById("game-overlay");
  const screenTitle = document.getElementById("screenTitle");
  const screenDesc = document.getElementById("screenDesc");
  const startBtn = document.getElementById("startBtn");
  const musicBtn = document.getElementById("musicBtn");
  const backNavBtn = document.getElementById("backNavBtn");
  const brakeBtn = document.getElementById("brakeBtn");

  backNavBtn.addEventListener("click", () => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "../index.html";
    }
  });

  let scene, camera, renderer;
  let horseGroup;
  let legFL, legFR, legBL, legBR, horseTail, horseNeck;
  let obstacles = [];
  let coins = [];
  let roadLines = [];
  let running = false;
  let score = 0;
  let animTime = 0;

  const NORMAL_SPEED = 0.20;
  const BRAKE_SPEED = 0.07;
  let speed = NORMAL_SPEED;
  let targetX = 0;

  let audioCtx = null;
  let musicOn = true;

  const bgMusic = new Audio("https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/games/SANWAL___Karaoke_with_URDU_Lyrics___Shafaullah_Khan_Rokhri___Saraiki___Love_Song___Rokhri_Production(256k).mp3");
  bgMusic.loop = true;
  bgMusic.volume = 0.18;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function playCoinSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(650, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  function playCrashSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(35, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.40, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }

  function toggleMusic() {
    initAudio();
    musicOn = !musicOn;
    musicBtn.innerText = musicOn ? "🎵 MUSIC" : "🔇 MUTED";
    if (musicOn && running) bgMusic.play().catch(()=>{});
    else bgMusic.pause();
  }
  musicBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleMusic();
  });

  const startBrake = (e) => {
    e.preventDefault();
    speed = BRAKE_SPEED;
  };
  const endBrake = (e) => {
    e.preventDefault();
    speed = NORMAL_SPEED;
  };
  brakeBtn.addEventListener("pointerdown", startBrake);
  window.addEventListener("pointerup", endBrake);
  window.addEventListener("pointercancel", endBrake);

  // NATURAL LOOKING 3D HORSE
  function create3DHorse() {
    const horse = new THREE.Group();
    const coatMat = new THREE.MeshStandardMaterial({ color: 0x6e473b, roughness: 0.5 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x1d1411, roughness: 0.4 });
    const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.4 });
    const saddleMat = new THREE.MeshStandardMaterial({ color: 0xff3d00, roughness: 0.3 });

    // Body (Rounder Barrel)
    const bodyGeo = new THREE.CylinderGeometry(0.38, 0.42, 1.35, 12);
    bodyGeo.rotateX(Math.PI / 2);
    const body = new THREE.Mesh(bodyGeo, coatMat);
    body.position.y = 1.0;
    horse.add(body);

    // Saddle & Blanket
    const saddleGeo = new THREE.CylinderGeometry(0.41, 0.44, 0.55, 12, 1, false, 0, Math.PI);
    saddleGeo.rotateX(Math.PI / 2);
    saddleGeo.rotateZ(Math.PI);
    const saddle = new THREE.Mesh(saddleGeo, saddleMat);
    saddle.position.set(0, 1.05, 0.05);
    horse.add(saddle);

    // Neck
    horseNeck = new THREE.Group();
    horseNeck.position.set(0, 1.15, -0.6);

    const neckGeo = new THREE.CylinderGeometry(0.18, 0.28, 0.85, 10);
    neckGeo.rotateX(Math.PI / 4.5);
    const neckMesh = new THREE.Mesh(neckGeo, coatMat);
    neckMesh.position.set(0, 0.35, -0.22);
    horseNeck.add(neckMesh);

    // Mane
    const maneGeo = new THREE.BoxGeometry(0.08, 0.75, 0.25);
    const maneMesh = new THREE.Mesh(maneGeo, darkMat);
    maneMesh.position.set(0, 0.45, -0.15);
    horseNeck.add(maneMesh);

    // Head
    const headGeo = new THREE.ConeGeometry(0.22, 0.65, 8);
    headGeo.rotateX(-Math.PI / 3);
    const headMesh = new THREE.Mesh(headGeo, coatMat);
    headMesh.position.set(0, 0.7, -0.55);
    horseNeck.add(headMesh);

    // Blaze (White stripe on face)
    const blazeGeo = new THREE.PlaneGeometry(0.08, 0.45);
    const blaze = new THREE.Mesh(blazeGeo, whiteMat);
    blaze.position.set(0, 0.72, -0.56);
    blaze.rotation.x = -Math.PI / 3;
    horseNeck.add(blaze);

    // Ears
    const earGeo = new THREE.ConeGeometry(0.06, 0.16, 4);
    const earL = new THREE.Mesh(earGeo, coatMat);
    earL.position.set(-0.1, 0.88, -0.42);
    const earR = new THREE.Mesh(earGeo, coatMat);
    earR.position.set(0.1, 0.88, -0.42);
    horseNeck.add(earL);
    horseNeck.add(earR);

    horse.add(horseNeck);

    // Tail (Flowing hair)
    horseTail = new THREE.Group();
    horseTail.position.set(0, 1.15, 0.68);
    const tailGeo = new THREE.CylinderGeometry(0.06, 0.18, 0.9, 8);
    tailGeo.rotateX(-Math.PI / 6);
    const tailMesh = new THREE.Mesh(tailGeo, darkMat);
    tailMesh.position.set(0, -0.38, 0.18);
    horseTail.add(tailMesh);
    horse.add(horseTail);

    // Tapered Legs
    function makeLeg(x, z) {
      const legPivot = new THREE.Group();
      legPivot.position.set(x, 0.95, z);

      const upperLegGeo = new THREE.CylinderGeometry(0.12, 0.08, 0.5, 8);
      const upperLeg = new THREE.Mesh(upperLegGeo, coatMat);
      upperLeg.position.y = -0.25;
      legPivot.add(upperLeg);

      const lowerLegGeo = new THREE.CylinderGeometry(0.08, 0.06, 0.45, 8);
      const lowerLeg = new THREE.Mesh(lowerLegGeo, coatMat);
      lowerLeg.position.y = -0.65;
      legPivot.add(lowerLeg);

      // Hoof
      const hoofGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.12, 8);
      const hoof = new THREE.Mesh(hoofGeo, darkMat);
      hoof.position.y = -0.9;
      legPivot.add(hoof);

      horse.add(legPivot);
      return legPivot;
    }

    legFL = makeLeg(-0.20, -0.42);
    legFR = makeLeg(0.20, -0.42);
    legBL = makeLeg(-0.20, 0.42);
    legBR = makeLeg(0.20, 0.42);

    return horse;
  }

  // 3D WORLD SETUP - ROAD GROUND LEVEL ALIGNED TO GATE ENTRANCE
  function init3D() {
    const W = stage.clientWidth;
    const H = stage.clientHeight;

    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a151b, 0.012);

    // CAMERA: Low-angle, looking down-level toward gate horizon
    camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 100);
    camera.position.set(0, 1.1, 5.8);
    camera.lookAt(0, 0.35, -20);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    stage.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xfff3e0, 0.95);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffedd5, 1.1);
    dirLight.position.set(4, 10, 6);
    scene.add(dirLight);

    // ROAD: Kept right on the ground plane pointing flat into gate
    const roadWidth = 5.2;
    const roadGeo = new THREE.PlaneGeometry(roadWidth, 140);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a2130, roughness: 0.95 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, -0.9, -60);
    scene.add(road);

    // Golden road curbs (Edges)
    const curbMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.5 });
    const curbL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.14, 140), curbMat);
    curbL.position.set(-roadWidth / 2, -0.85, -60);
    scene.add(curbL);

    const curbR = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.14, 140), curbMat);
    curbR.position.set(roadWidth / 2, -0.85, -60);
    scene.add(curbR);

    // Center Dashes
    for (let i = 0; i < 18; i++) {
      const lineGeo = new THREE.PlaneGeometry(0.16, 2.4);
      const lineMat = new THREE.MeshBasicMaterial({ color: 0xffd54f });
      const line = new THREE.Mesh(lineGeo, lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, -0.89, -i * 7.5);
      scene.add(line);
      roadLines.push(line);
    }

    // Horse placement
    horseGroup = create3DHorse();
    horseGroup.position.set(0, -0.9, 0);
    scene.add(horseGroup);
  }

  const LANES = [-1.6, 0, 1.6];

  function spawnObjects() {
    // Single Low Wooden Hurdle (Very easy to dodge)
    if (Math.random() < 0.015) {
      const barGroup = new THREE.Group();
      const woodMat = new THREE.MeshStandardMaterial({ color: 0x8d281e });
      const hurdle = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.35, 0.25), woodMat);
      hurdle.position.y = 0.18;
      barGroup.add(hurdle);

      // Warning stripes
      const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffeb3b });
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.36, 0.26), stripeMat);
      stripe.position.y = 0.18;
      barGroup.add(stripe);

      const laneX = LANES[Math.floor(Math.random() * LANES.length)];
      barGroup.position.set(laneX, -0.9, -60);
      scene.add(barGroup);
      obstacles.push(barGroup);
    }

    // Gold Coins
    if (Math.random() < 0.038) {
      const coinGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.06, 12);
      const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.2 });
      const coin = new THREE.Mesh(coinGeo, coinMat);
      coin.rotation.x = Math.PI / 2;
      const laneX = LANES[Math.floor(Math.random() * LANES.length)];
      coin.position.set(laneX, -0.5, -60);
      scene.add(coin);
      coins.push(coin);
    }
  }

  function handleMove(clientX) {
    if (!running) return;
    const rect = stage.getBoundingClientRect();
    const normX = ((clientX - rect.left) / rect.width) * 2 - 1;
    targetX = normX * 1.8;
  }

  stage.addEventListener("pointerdown", (e) => {
    if (e.target !== brakeBtn && !brakeBtn.contains(e.target)) handleMove(e.clientX);
  });
  stage.addEventListener("pointermove", (e) => {
    if (e.buttons === 1 && e.target !== brakeBtn) handleMove(e.clientX);
  });

  function resize() {
    if (!renderer) return;
    const W = stage.clientWidth;
    const H = stage.clientHeight;
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  }
  window.addEventListener("resize", resize);

  function startGame() {
    initAudio();
    score = 0;
    speed = NORMAL_SPEED;
    targetX = 0;
    animTime = 0;
    horseGroup.position.set(0, -0.9, 0);

    obstacles.forEach(o => scene.remove(o));
    coins.forEach(c => scene.remove(c));
    obstacles = [];
    coins = [];

    scoreText.innerText = "0";
    running = true;
    overlay.classList.add("hidden");

    if (musicOn) bgMusic.play().catch(()=>{});
    animate();
  }

  function gameOver() {
    running = false;
    bgMusic.pause();
    playCrashSound();
    screenTitle.innerText = "💥 OOPS! TAKKAR HO GAYI!";
    screenDesc.innerHTML = `Rukawat se takra gaye!<br>Aapka Score: <b style="color:#00f0ff; font-size:24px;">${score}</b>`;
    startBtn.innerText = "↻ PLAY AGAIN";
    overlay.classList.remove("hidden");
  }

  startBtn.addEventListener("click", startGame);

  function animate() {
    if (!running) return;
    requestAnimationFrame(animate);

    // Horse Steer
    horseGroup.position.x += (targetX - horseGroup.position.x) * 0.12;
    horseGroup.rotation.y = -(targetX - horseGroup.position.x) * 0.2;
    horseGroup.rotation.z = -(targetX - horseGroup.position.x) * 0.08;

    // Road Flow
    roadLines.forEach(line => {
      line.position.z += speed;
      if (line.position.z > 6) {
        line.position.z -= 135;
      }
    });

    // Realistic Gallop Cycle
    animTime += speed * 0.85;
    const gallop = Math.sin(animTime * 11);
    const gallopCos = Math.cos(animTime * 11);

    horseGroup.position.y = -0.9 + Math.abs(gallop) * 0.14;

    legFL.rotation.x = gallop * 0.65;
    legBR.rotation.x = -gallop * 0.65;
    legFR.rotation.x = -gallop * 0.65;
    legBL.rotation.x = gallop * 0.65;

    horseNeck.rotation.x = gallopCos * 0.08;
    horseTail.rotation.x = -gallop * 0.25;

    spawnObjects();

    // Obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.position.z += speed;

      const dist = horseGroup.position.distanceTo(o.position);
      if (dist < 0.9) {
        gameOver();
        return;
      }

      if (o.position.z > 6) {
        scene.remove(o);
        obstacles.splice(i, 1);
        score += 2;
        scoreText.innerText = score;
      }
    }

    // Coins
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.position.z += speed;
      c.rotation.z += 0.06;

      const dist = horseGroup.position.distanceTo(c.position);
      if (dist < 1.05) {
        playCoinSound();
        scene.remove(c);
        coins.splice(i, 1);
        score += 10;
        scoreText.innerText = score;
        continue;
      }

      if (c.position.z > 6) {
        scene.remove(c);
        coins.splice(i, 1);
      }
    }

    renderer.render(scene, camera);
  }

  init3D();
})();
</script>
</body>
</html>
