<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MULTANI MEMORY MATCH</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body {
  background: #06070a;
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
}
#game-wrap {
  width: 100%;
  max-width: 500px;
  margin: auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background-color: #0b0f19;
  background-image: url('https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/1792388836123.jpg');
  background-size: cover;
  background-position: center;
}
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: rgba(14, 17, 24, 0.9);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid #ff542d44;
  z-index: 10;
}
.title-tag { font-size: 16px; font-weight: 900; color: #ffbe00; text-shadow: 0 0 10px rgba(255,190,0,0.5); }
.header-actions { display: flex; align-items: center; gap: 10px; }
.stats-badge { font-weight: bold; font-size: 14px; color: #00f0ff; }
.music-toggle {
  background: rgba(255,255,255,0.1);
  border: 1px solid #00f0ff;
  color: #fff;
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  font-weight: 700;
}

.grid-board {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 12px;
  padding: 16px 18px;
  perspective: 1000px;
}

.card {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  cursor: pointer;
}

.card.flipped {
  transform: rotateY(180deg);
}

.card.matched {
  transform: rotateY(180deg) scale(0.94);
  pointer-events: none;
  filter: drop-shadow(0 0 10px #00e676);
}

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 14px rgba(0,0,0,0.6);
}

.card-back {
  background: linear-gradient(135deg, #1b2438, #0e121d);
  border: 2px solid #ffbe00;
  color: #ffbe00;
  font-weight: 900;
  font-size: 20px;
}
.card-back span {
  font-size: 11px;
  letter-spacing: 1px;
  color: #ff542d;
  margin-top: 4px;
}

.card-front {
  background: linear-gradient(135deg, #131d31, #0a0e18);
  border: 2px solid #00f0ff;
  transform: rotateY(180deg);
  font-size: 34px;
}
.card-front small {
  font-size: 10px;
  color: #fff;
  font-weight: bold;
  margin-top: 2px;
  text-transform: uppercase;
}

#game-overlay {
  position: absolute;
  inset: 0;
  background: rgba(4, 6, 12, 0.88);
  backdrop-filter: blur(5px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  z-index: 20;
}
#game-overlay h1 { font-size: 30px; color: #ffbe00; margin-bottom: 8px; text-shadow: 0 0 16px #ff542d; }
#game-overlay p { font-size: 13px; color: #cbd5e1; line-height: 1.6; max-width: 290px; margin-bottom: 20px; }
.play-btn {
  padding: 13px 34px;
  font-size: 16px;
  font-weight: 800;
  color: #000;
  background: linear-gradient(135deg, #00f0ff, #00e676);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 240, 255, 0.4);
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="game-wrap">
  <div class="header-bar">
    <div class="title-tag">🧠 MEMORY MATCH</div>
    <div class="header-actions">
      <button class="music-toggle" id="musicBtn">🎵 MUSIC ON</button>
      <div class="stats-badge">MOVES: <span id="movesText">0</span></div>
    </div>
  </div>

  <div class="grid-board" id="board"></div>

  <div id="game-overlay">
    <h1 id="screenTitle">MEMORY MATCH</h1>
    <p id="screenDesc">
      Cards ko palat kar ek jaise jodi milayein!<br>
      🃏 Total 6 Pairs match karne hain.<br>
      🧠 Dekhte hain aap kitne kam moves mein jeette hain!
    </p>
    <button class="play-btn" id="startBtn">▶ START GAME</button>
  </div>
</div>

<script>
(() => {
  const board = document.getElementById("board");
  const movesText = document.getElementById("movesText");
  const overlay = document.getElementById("game-overlay");
  const screenTitle = document.getElementById("screenTitle");
  const screenDesc = document.getElementById("screenDesc");
  const startBtn = document.getElementById("startBtn");
  const musicBtn = document.getElementById("musicBtn");

  const ICONS = [
    { icon: "💎", name: "Diamond" },
    { icon: "🎁", name: "Airdrop" },
    { icon: "🔫", name: "Gun" },
    { icon: "🪖", name: "Helmet" },
    { icon: "🏆", name: "Trophy" },
    { icon: "💊", name: "Medkit" }
  ];

  let cards = [];
  let flippedCards = [];
  let matchedPairs = 0;
  let moves = 0;
  let lockBoard = false;
  let audioCtx = null;
  let musicOn = true;
  let musicInterval = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  // FUNNY SOUND EFFECTS
  function playFlipSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(750, audioCtx.currentTime + 0.07);
    gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.07);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.07);
  }

  function playMatchSound() {
    if (!audioCtx) return;
    // Celebratory ding-ding
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((f, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.07 + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + idx * 0.07);
      osc.stop(audioCtx.currentTime + idx * 0.07 + 0.2);
    });
  }

  function playMismatchSound() {
    if (!audioCtx) return;
    // Funny Boing-oops
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(260, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(140, audioCtx.currentTime + 0.18);
    gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.18);
  }

  // CHEERFUL CARTOON BGM
  const melody = [330, 392, 440, 523, 440, 392, 330, 262];
  let melIdx = 0;

  function startMusic() {
    if (musicInterval) clearInterval(musicInterval);
    if (!musicOn) return;

    musicInterval = setInterval(() => {
      if (!musicOn || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = melody[melIdx % melody.length];
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
      melIdx++;
    }, 240);
  }

  function toggleMusic() {
    initAudio();
    musicOn = !musicOn;
    musicBtn.innerText = musicOn ? "🎵 MUSIC ON" : "🔇 MUSIC OFF";
    if (musicOn) startMusic();
    else if (musicInterval) {
      clearInterval(musicInterval);
      musicInterval = null;
    }
  }

  musicBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleMusic();
  });

  function setupCards() {
    board.innerHTML = "";
    const deck = [...ICONS, ...ICONS].sort(() => Math.random() - 0.5);

    deck.forEach(item => {
      const cardEl = document.createElement("div");
      cardEl.className = "card";
      cardEl.dataset.name = item.name;

      cardEl.innerHTML = `
        <div class="card-face card-back">
          🔥
          <span>MULTANI</span>
        </div>
        <div class="card-face card-front">
          <div>${item.icon}</div>
          <small>${item.name}</small>
        </div>
      `;

      cardEl.addEventListener("pointerdown", () => flipCard(cardEl));
      board.appendChild(cardEl);
    });
  }

  function flipCard(card) {
    if (lockBoard || card.classList.contains("flipped") || card.classList.contains("matched")) return;

    initAudio();
    playFlipSound();
    card.classList.add("flipped");
    flippedCards.push(card);

    if (flippedCards.length === 2) {
      moves++;
      movesText.innerText = moves;
      checkMatch();
    }
  }

  function checkMatch() {
    const [c1, c2] = flippedCards;
    lockBoard = true;

    if (c1.dataset.name === c2.dataset.name) {
      setTimeout(() => {
        playMatchSound();
        c1.classList.add("matched");
        c2.classList.add("matched");
        matchedPairs++;
        flippedCards = [];
        lockBoard = false;

        if (matchedPairs === ICONS.length) {
          gameWon();
        }
      }, 350);
    } else {
      setTimeout(() => {
        playMismatchSound();
        c1.classList.remove("flipped");
        c2.classList.remove("flipped");
        flippedCards = [];
        lockBoard = false;
      }, 750);
    }
  }

  function startGame() {
    initAudio();
    moves = 0;
    matchedPairs = 0;
    flippedCards = [];
    lockBoard = false;
    movesText.innerText = "0";
    overlay.classList.add("hidden");
    setupCards();
    startMusic();
  }

  function gameWon() {
    if (musicInterval) {
      clearInterval(musicInterval);
      musicInterval = null;
    }
    screenTitle.innerText = "🎉 BOOYAH! YOU WON!";
    screenDesc.innerHTML = `Aapne saari jodiyan dhoondh lein!<br>Total Moves: <b style="color:#00f0ff; font-size:22px;">${moves}</b>`;
    startBtn.innerText = "↻ PLAY AGAIN";
    overlay.classList.remove("hidden");
  }

  startBtn.addEventListener("click", startGame);
})();
</script>
</body>
</html>
