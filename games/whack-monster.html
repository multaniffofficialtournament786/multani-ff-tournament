<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MULTANI MONSTER SHOOTER</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body {
  background: #030712;
  color: #fff;
  font-family: 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
#game-wrap {
  width: 100%;
  max-width: 480px;
  height: 100dvh;
  position: relative;
  overflow: hidden;
  background: #050814;
}
#gameCanvas {
  width: 100%;
  height: 100%;
  display: block;
}
.hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: linear-gradient(180deg, rgba(3,7,18,0.92) 0%, rgba(3,7,18,0) 100%);
  pointer-events: none;
  z-index: 10;
}
.title-tag {
  font-size: 14px;
  font-weight: 900;
  color: #f59e0b;
  letter-spacing: 1px;
}
.stats {
  display: flex;
  gap: 12px;
  font-weight: 800;
  font-size: 15px;
}
.stat-score { color: #38bdf8; }
.stat-hp { color: #f43f5e; }

.screen-modal {
  position: absolute;
  inset: 0;
  background: rgba(3, 7, 18, 0.88);
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  z-index: 25;
}
.screen-modal h1 {
  font-size: 28px;
  color: #fbbf24;
  margin-bottom: 8px;
  text-shadow: 0 0 16px rgba(251, 191, 36, 0.5);
}
.screen-modal p {
  font-size: 14px;
  color: #cbd5e1;
  line-height: 1.6;
  max-width: 300px;
  margin-bottom: 22px;
}
.action-btn {
  padding: 14px 36px;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 0.5px;
  color: #030712;
  background: linear-gradient(135deg, #38bdf8, #4ade80);
  border: none;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="game-wrap">
  <div class="hud">
    <div class="title-tag">🎯 MONSTER SHOOTER</div>
    <div class="stats">
      <span class="stat-score">⭐ <span id="scoreVal">0</span></span>
      <span class="stat-hp">❤️ <span id="hpVal">100</span>%</span>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="screen-modal" id="overlay">
    <h1 id="screenTitle">MONSTER SHOOTER</h1>
    <p id="screenDesc">
      Screen par tap kar ke Monsters ko blast karein!<br><br>
      👾 Normal = 1 Hit (+1)<br>
      ⚡ Fast Demon = Tez raftaar (+2)<br>
      👹 Boss Monster = 3 Hits (+5)<br><br>
      Base ko monsters se bachayein!
    </p>
    <button class="action-btn" id="startBtn">▶ START GAME</button>
  </div>
</div>

<audio id="bgm" loop preload="auto" src="https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/games/SANWAL___Karaoke_with_URDU_Lyrics___Shafaullah_Khan_Rokhri___Saraiki___Love_Song___Rokhri_Production(256k).mp3"></audio>

<script>
(() => {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("game-wrap");
  const scoreVal = document.getElementById("scoreVal");
  const hpVal = document.getElementById("hpVal");
  const overlay = document.getElementById("overlay");
  const screenTitle = document.getElementById("screenTitle");
  const screenDesc = document.getElementById("screenDesc");
  const startBtn = document.getElementById("startBtn");
  const bgm = document.getElementById("bgm");

  let w = 0, h = 0;
  function resize() {
    w = wrap.clientWidth;
    h = wrap.clientHeight;
    canvas.width = w;
    canvas.height = h;
  }
  window.addEventListener("resize", resize);
  resize();

  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    bgm.play().catch(() => {});
  }

  function playShootSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  function playExplodeSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.22);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.22);
  }

  let running = false;
  let score = 0;
  let hp = 100;
  let turretAngle = -Math.PI / 2;
  let bullets = [];
  let monsters = [];
  let particles = [];
  let spawnTimer = 0;

  class Bullet {
    constructor(x, y, angle) {
      this.x = x;
      this.y = y;
      this.speed = 12;
      this.vx = Math.cos(angle) * this.speed;
      this.vy = Math.sin(angle) * this.speed;
      this.radius = 5;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#38bdf8";
      ctx.shadowColor = "#38bdf8";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  class Monster {
    constructor() {
      const rand = Math.random();
      if (rand < 0.2) {
        this.type = "boss";
        this.emoji = "👹";
        this.hp = 3;
        this.maxHp = 3;
        this.radius = 28;
        this.speed = 1.0;
        this.scoreVal = 5;
      } else if (rand < 0.5) {
        this.type = "fast";
        this.emoji = "⚡";
        this.hp = 1;
        this.maxHp = 1;
        this.radius = 20;
        this.speed = 2.4;
        this.scoreVal = 2;
      } else {
        this.type = "normal";
        this.emoji = "👾";
        this.hp = 1;
        this.maxHp = 1;
        this.radius = 22;
        this.speed = 1.5;
        this.scoreVal = 1;
      }
      this.x = Math.random() * (w - 60) + 30;
      this.y = -30;
    }
    update() {
      this.y += this.speed + (score * 0.015);
    }
    draw() {
      ctx.font = `${this.radius * 1.5}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(this.emoji, this.x, this.y);

      if (this.maxHp > 1) {
        const barW = 32;
        const barH = 4;
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(this.x - barW / 2, this.y - this.radius - 8, barW, barH);
        ctx.fillStyle = "#f43f5e";
        ctx.fillRect(this.x - barW / 2, this.y - this.radius - 8, (barW * (this.hp / this.maxHp)), barH);
      }
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.5) * 6;
      this.vy = (Math.random() - 0.5) * 6;
      this.radius = Math.random() * 3 + 2;
      this.alpha = 1;
      this.color = color;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.alpha -= 0.03;
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.restore();
    }
  }

  function createExplosion(x, y, color = "#f59e0b") {
    for (let i = 0; i < 14; i++) {
      particles.push(new Particle(x, y, color));
    }
  }

  function handlePointer(e) {
    if (!running) return;
    const rect = canvas.getBoundingClientRect();
    const targetX = e.clientX - rect.left;
    const targetY = e.clientY - rect.top;

    const turretX = w / 2;
    const turretY = h - 40;

    turretAngle = Math.atan2(targetY - turretY, targetX - turretX);
    bullets.push(new Bullet(turretX, turretY, turretAngle));
    playShootSound();
  }

  canvas.addEventListener("pointerdown", handlePointer);

  function resetGame() {
    initAudio();
    score = 0;
    hp = 100;
    scoreVal.innerText = score;
    hpVal.innerText = hp;
    bullets = [];
    monsters = [];
    particles = [];
    spawnTimer = 0;
    running = true;
    overlay.classList.add("hidden");
  }

  function gameOver() {
    running = false;
    screenTitle.innerText = "💥 BASE DESTROYED!";
    screenDesc.innerHTML = `Monsters ne base par qabza kar liya!<br><br>Final Score: <b style="color:#38bdf8; font-size:24px;">${score}</b>`;
    startBtn.innerText = "↻ PLAY AGAIN";
    overlay.classList.remove("hidden");
  }

  function loop() {
    ctx.clearRect(0, 0, w, h);

    // Grid effect background
    ctx.strokeStyle = "rgba(255,255,255,0.03)";
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y < h; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    if (running) {
      // Spawn monsters
      spawnTimer++;
      const interval = Math.max(35, 75 - Math.floor(score * 0.8));
      if (spawnTimer >= interval) {
        monsters.push(new Monster());
        spawnTimer = 0;
      }

      // Update Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.update();
        b.draw();
        if (b.x < 0 || b.x > w || b.y < 0 || b.y > h) {
          bullets.splice(i, 1);
        }
      }

      // Update Monsters & Collisions
      for (let i = monsters.length - 1; i >= 0; i--) {
        const m = monsters[i];
        m.update();
        m.draw();

        // Check monster reached base
        if (m.y >= h - 60) {
          hp -= 20;
          if (hp < 0) hp = 0;
          hpVal.innerText = hp;
          createExplosion(m.x, m.y, "#f43f5e");
          playExplodeSound();
          monsters.splice(i, 1);
          if (hp <= 0) {
            gameOver();
            break;
          }
          continue;
        }

        // Bullet vs Monster
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const dist = Math.hypot(b.x - m.x, b.y - m.y);
          if (dist < m.radius + b.radius) {
            bullets.splice(j, 1);
            m.hp--;
            createExplosion(b.x, b.y, "#38bdf8");
            if (m.hp <= 0) {
              score += m.scoreVal;
              scoreVal.innerText = score;
              createExplosion(m.x, m.y, "#fbbf24");
              playExplodeSound();
              monsters.splice(i, 1);
            }
            break;
          }
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    // Draw Turret Base
    const tx = w / 2;
    const ty = h - 40;

    // Base Dome
    ctx.beginPath();
    ctx.arc(tx, ty + 10, 36, Math.PI, 0);
    ctx.fillStyle = "#1e293b";
    ctx.fill();
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Cannon Barrel
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(turretAngle);
    ctx.fillStyle = "#0284c7";
    ctx.fillRect(0, -7, 34, 14);
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(26, -5, 8, 10);
    ctx.restore();

    // Turret Core
    ctx.beginPath();
    ctx.arc(tx, ty, 14, 0, Math.PI * 2);
    ctx.fillStyle = "#0284c7";
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();

    requestAnimationFrame(loop);
  }

  startBtn.addEventListener("click", resetGame);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
