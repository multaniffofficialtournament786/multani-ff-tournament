<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MULTANI WHACK A MONSTER</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body {
  background: #06070a;
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
}
#game-wrap {
  width: 100%;
  max-width: 500px;
  margin: auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background-color: #0b0f19;
  background-image: url('https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/1792388836123.jpg');
  background-size: cover;
  background-position: center;
}
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: rgba(14, 17, 24, 0.9);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid #ff542d44;
  z-index: 10;
}
.title-tag { font-size: 16px; font-weight: 900; color: #ffbe00; text-shadow: 0 0 10px rgba(255,190,0,0.5); }
.score-box { display: flex; gap: 14px; font-weight: bold; font-size: 15px; }
.score-box .score { color: #00f0ff; }
.score-box .lives { color: #ff1744; }

.grid-area {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 16px;
  padding: 24px 20px;
  align-items: center;
  justify-items: center;
  position: relative;
}

.hole {
  position: relative;
  width: 125px;
  height: 110px;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.hole-base {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 38px;
  background: radial-gradient(ellipse at center, #111520 0%, #06080e 100%);
  border: 2px solid #2a3449;
  border-radius: 50%;
  box-shadow: 0 8px 15px rgba(0,0,0,0.8), inset 0 4px 8px #000;
  z-index: 5;
}

.monster {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  position: absolute;
  bottom: -90px;
  transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  cursor: pointer;
  z-index: 4;
}

.monster.up {
  transform: translateY(-85px);
}

.monster.beast {
  background: radial-gradient(circle, #ff4624, #b31d02);
  border: 2.5px solid #ffbe00;
  box-shadow: 0 0 16px rgba(255,70,36,0.6);
}
.monster.diamond {
  background: radial-gradient(circle, #00f0ff, #0077ff);
  border: 2.5px solid #fff;
  box-shadow: 0 0 16px rgba(0,240,255,0.7);
}
.monster.bomb {
  background: radial-gradient(circle, #2d323f, #111);
  border: 2.5px solid #ff1744;
  box-shadow: 0 0 16px rgba(255,23,68,0.7);
}

.monster.hit {
  transform: translateY(-85px) scale(0.85);
  filter: brightness(1.6);
  pointer-events: none;
}

#game-overlay {
  position: absolute;
  inset: 0;
  background: rgba(4, 6, 12, 0.88);
  backdrop-filter: blur(5px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  z-index: 20;
}
#game-overlay h1 { font-size: 30px; color: #ffbe00; margin-bottom: 8px; text-shadow: 0 0 16px #ff542d; }
#game-overlay p { font-size: 13px; color: #cbd5e1; line-height: 1.6; max-width: 290px; margin-bottom: 20px; }
.play-btn {
  padding: 13px 34px;
  font-size: 16px;
  font-weight: 800;
  color: #000;
  background: linear-gradient(135deg, #00f0ff, #00e676);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 240, 255, 0.4);
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="game-wrap">
  <div class="header-bar">
    <div class="title-tag">🪓 WHACK A MONSTER</div>
    <div class="score-box">
      <span class="score">⭐ <span id="scoreText">0</span></span>
      <span class="lives">❤️ <span id="livesText">❤️❤️❤️</span></span>
    </div>
  </div>

  <div class="grid-area" id="grid">
    <!-- 6 HOLES -->
    <div class="hole"><div class="monster" data-idx="0"></div><div class="hole-base"></div></div>
    <div class="hole"><div class="monster" data-idx="1"></div><div class="hole-base"></div></div>
    <div class="hole"><div class="monster" data-idx="2"></div><div class="hole-base"></div></div>
    <div class="hole"><div class="monster" data-idx="3"></div><div class="hole-base"></div></div>
    <div class="hole"><div class="monster" data-idx="4"></div><div class="hole-base"></div></div>
    <div class="hole"><div class="monster" data-idx="5"></div><div class="hole-base"></div></div>
  </div>

  <div id="game-overlay">
    <h1 id="screenTitle">WHACK A MONSTER</h1>
    <p id="screenDesc">
      Hole se nikalte hi Monster par tap karein!<br>
      👹 Monster = <b>+1 Point</b><br>
      💎 Diamond = <b>+5 Points</b><br>
      💣 <b>3 Baar Bomb hit par Game Over!</b>
    </p>
    <button class="play-btn" id="startBtn">▶ PLAY NOW</button>
  </div>
</div>

<script>
(() => {
  const monsters = document.querySelectorAll(".monster");
  const scoreText = document.getElementById("scoreText");
  const livesText = document.getElementById("livesText");
  const overlay = document.getElementById("game-overlay");
  const screenTitle = document.getElementById("screenTitle");
  const screenDesc = document.getElementById("screenDesc");
  const startBtn = document.getElementById("startBtn");

  let score = 0;
  let lives = 3;
  let running = false;
  let lastHole = -1;
  let popTimer = null;
  let audioContext = null;

  function initAudio() {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === "suspended") audioContext.resume();
  }

  function playHitSound() {
    if (!audioContext) return;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(450, audioContext.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, audioContext.currentTime + 0.09);
    gain.gain.setValueAtTime(0.14, audioContext.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioContext.currentTime + 0.09);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
    osc.stop(audioContext.currentTime + 0.09);
  }

  function playBombSound() {
    if (!audioContext) return;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(180, audioContext.currentTime);
    osc.frequency.linearRampToValueAtTime(40, audioContext.currentTime + 0.3);
    gain.gain.setValueAtTime(0.25, audioContext.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
    osc.stop(audioContext.currentTime + 0.3);
  }

  function updateLives() {
    if (lives === 3) livesText.innerText = "❤️❤️❤️";
    else if (lives === 2) livesText.innerText = "❤️❤️🖤";
    else if (lives === 1) livesText.innerText = "❤️🖤🖤";
    else livesText.innerText = "🖤🖤🖤";
  }

  function randomHole() {
    let idx = Math.floor(Math.random() * monsters.length);
    while (idx === lastHole) {
      idx = Math.floor(Math.random() * monsters.length);
    }
    lastHole = idx;
    return monsters[idx];
  }

  function popMonster() {
    if (!running) return;

    const m = randomHole();
    m.classList.remove("hit", "beast", "diamond", "bomb");

    const rand = Math.random();
    let type = 'beast';
    if (rand < 0.22) {
      type = 'bomb';
      m.innerText = '💣';
      m.className = 'monster bomb up';
    } else if (rand < 0.4) {
      type = 'diamond';
      m.innerText = '💎';
      m.className = 'monster diamond up';
    } else {
      type = 'beast';
      m.innerText = '👹';
      m.className = 'monster beast up';
    }
    m.dataset.type = type;

    const stayTime = Math.max(650, 1100 - score * 10);

    setTimeout(() => {
      m.classList.remove("up");
      if (running) {
        const nextTime = Math.max(300, 600 - score * 8);
        popTimer = setTimeout(popMonster, nextTime);
      }
    }, stayTime);
  }

  monsters.forEach(m => {
    m.addEventListener("pointerdown", () => {
      if (!running || !m.classList.contains("up") || m.classList.contains("hit")) return;

      m.classList.add("hit");
      const type = m.dataset.type;

      if (type === 'bomb') {
        playBombSound();
        lives--;
        updateLives();
        if (lives <= 0) gameOver();
      } else {
        playHitSound();
        score += (type === 'diamond' ? 5 : 1);
        scoreText.innerText = score;
      }

      setTimeout(() => m.classList.remove("up"), 120);
    });
  });

  function startGame() {
    initAudio();
    score = 0;
    lives = 3;
    scoreText.innerText = "0";
    updateLives();
    running = true;
    overlay.classList.add("hidden");
    popMonster();
  }

  function gameOver() {
    running = false;
    clearTimeout(popTimer);
    monsters.forEach(m => m.classList.remove("up"));
    screenTitle.innerText = "💥 GAME OVER!";
    screenDesc.innerHTML = `Bomb 3 baar hit ho gaya!<br>Final Score: <b style="color:#00f0ff; font-size:22px;">${score}</b>`;
    startBtn.innerText = "↻ PLAY AGAIN";
    overlay.classList.remove("hidden");
  }

  startBtn.addEventListener("click", startGame);
})();
</script>
</body>
</html>
