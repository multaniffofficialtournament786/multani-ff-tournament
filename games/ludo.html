<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ludo Championship • VIP Coming Soon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at 50% 25%, #1e293b 0%, #090d16 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    /* VIP Card Container */
    .vip-card {
      background: linear-gradient(145deg, rgba(17, 24, 39, 0.95), rgba(9, 14, 26, 0.98));
      border: 2px solid #ffd700;
      border-radius: 24px;
      padding: 34px 22px;
      text-align: center;
      max-width: 350px;
      width: 100%;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.35), inset 0 0 15px rgba(255, 215, 0, 0.1);
      position: relative;
      animation: vipZoom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes vipZoom {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Floating Golden Badge */
    .vip-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #ffd700, #ff8800);
      color: #0b0f19;
      font-size: 11px;
      font-weight: 900;
      padding: 5px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
      letter-spacing: 1px;
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.6);
      text-transform: uppercase;
    }

    /* Dice Icon Glow */
    .icon-box {
      width: 74px;
      height: 74px;
      margin: 0 auto 16px;
      background: radial-gradient(circle, #2d2410 0%, #111726 100%);
      border: 2px solid #ffd700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
      animation: pulseGlow 1.8s infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: scale(1); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
      to { transform: scale(1.06); box-shadow: 0 0 26px rgba(255, 215, 0, 0.7); }
    }

    h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .sub-heading {
      color: #20e7f4;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.8px;
      margin-bottom: 24px;
      text-shadow: 0 0 10px rgba(32, 231, 244, 0.4);
      text-transform: uppercase;
    }

    .btn-back {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #ffd700, #ff8800);
      border: none;
      border-radius: 14px;
      color: #090d16;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(255, 136, 0, 0.4);
      transition: transform 0.1s ease;
      outline: none;
    }

    .btn-back:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="vip-card">
    <div class="vip-badge">
      <i class="fa-solid fa-crown"></i> VIP EXCLUSIVE
    </div>

    <div class="icon-box">
      🎲
    </div>

    <h1>LUDDU</h1>
    <div class="sub-heading">Online Games Friend Coming Soon</div>

    <button type="button" class="btn-back" onclick="goBackToArena()">
      <i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i> WAPAS JAYEIN
    </button>
  </div>

  <script>
    function goBackToArena() {
      try {
        if (window.parent && window.parent !== window) {
          // Parent iframe ko hide karna
          const pDoc = window.parent.document;
          if (pDoc) {
            const iframes = pDoc.querySelectorAll('iframe, #ludoModal, #gameModal, .game-modal');
            iframes.forEach(el => {
              if (el.parentElement && el.parentElement !== pDoc.body) {
                el.parentElement.style.display = 'none';
              } else {
                el.style.display = 'none';
              }
            });
          }
          if (window.parent.history.length > 1) {
            window.parent.history.back();
            return;
          }
        }
      } catch(e) {}

      // Fallback redirection
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '../index.html';
      }
    }
  </script>
</body>
</html>
