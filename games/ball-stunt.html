<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MULTANI BRICK BREAKER VIP</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body {
  background: #06070a;
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}
#game-wrap {
  width: 100%;
  max-width: 500px;
  margin: auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background-color: #0b0f19;
  background-image: url('https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/1792388836123.jpg');
  background-size: cover;
  background-position: center;
}
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: rgba(14, 17, 24, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid #ff542d44;
  z-index: 10;
}
.back-btn {
  background: #ff542d;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 8px;
  font-weight: 800;
  font-size: 12px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(255,84,45,0.4);
}
.title-tag {
  font-size: 13px;
  font-weight: 900;
  color: #ffbe00;
  text-shadow: 0 0 10px rgba(255,190,0,0.5);
}
.header-actions { display: flex; align-items: center; gap: 6px; }
.level-badge { font-weight: 800; font-size: 12px; color: #ffeb3b; background: rgba(255,235,59,0.15); padding: 3px 6px; border-radius: 6px; border: 1px solid rgba(255,235,59,0.3); }
.stats-badge { font-weight: bold; font-size: 13px; color: #00f0ff; }
.lives-badge { font-weight: bold; font-size: 13px; color: #ff1744; }

.icon-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid #00f0ff;
  color: #fff;
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 800;
}
.dots-btn {
  background: rgba(255, 84, 45, 0.2);
  border: 1px solid #ff542d;
  color: #ffbe00;
  font-size: 16px;
  padding: 2px 8px;
  border-radius: 8px;
  cursor: pointer;
  line-height: 1;
}

#stage-box { flex: 1; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }

/* DEDICATED THUMB SLIDER ZONE AT BOTTOM */
.thumb-slider-zone {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 85px;
  background: linear-gradient(to top, rgba(6, 9, 16, 0.88), rgba(6, 9, 16, 0.45));
  border-top: 1.5px solid rgba(0, 240, 255, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #00f0ff;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-shadow: 0 0 8px rgba(0,240,255,0.6);
  z-index: 5;
  pointer-events: none;
}
.thumb-indicator {
  width: 50px;
  height: 6px;
  background: linear-gradient(90deg, #ff542d, #ffbe00);
  border-radius: 3px;
  box-shadow: 0 0 10px #ffbe00;
}

#game-overlay {
  position: absolute;
  inset: 0;
  background: rgba(4, 6, 12, 0.9);
  backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  z-index: 20;
}
#game-overlay h1 { font-size: 28px; color: #ffbe00; margin-bottom: 10px; text-shadow: 0 0 16px #ff542d; }
#game-overlay p { font-size: 13px; color: #cbd5e1; line-height: 1.6; max-width: 320px; margin-bottom: 22px; }
.play-btn {
  padding: 13px 34px;
  font-size: 16px;
  font-weight: 800;
  color: #000;
  background: linear-gradient(135deg, #00f0ff, #00e676);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 240, 255, 0.4);
}

/* LEVELS MODAL */
#levels-modal {
  position: absolute;
  inset: 0;
  background: rgba(4, 6, 14, 0.96);
  backdrop-filter: blur(8px);
  z-index: 30;
  display: flex;
  flex-direction: column;
  padding: 16px;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}
.modal-title { font-size: 18px; font-weight: 900; color: #ffbe00; }
.close-modal-btn {
  background: #ff1744;
  border: none;
  color: #fff;
  font-weight: 900;
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
}
.levels-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  overflow-y: auto;
  padding: 14px 4px;
}
.lvl-card {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  transition: transform 0.1s;
}
.lvl-card.unlocked {
  background: linear-gradient(135deg, #00f0ff22, #00e67633);
  border: 1.5px solid #00f0ff;
  color: #fff;
  box-shadow: 0 0 10px rgba(0,240,255,0.2);
}
.lvl-card.unlocked:active { transform: scale(0.92); }
.lvl-card.current {
  border-color: #ffbe00;
  background: linear-gradient(135deg, #ff542d44, #ffbe0044);
  box-shadow: 0 0 12px rgba(255,190,0,0.6);
}
.lvl-card.locked {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: #64748b;
  cursor: not-allowed;
}

.hidden { display: none !important; }
</style>
</head>
<body>

<div id="game-wrap">
  <div class="header-bar">
    <button class="back-btn" id="backNavBtn">⬅ BACK</button>
    <div class="title-tag">VIP BREAKER</div>
    <div class="header-actions">
      <div class="level-badge" id="levelTag">LVL 1</div>
      <button class="icon-btn" id="musicBtn">🎵</button>
      <div class="stats-badge">⭐ <span id="scoreText">0</span></div>
      <div class="lives-badge">❤️ <span id="livesText">3</span></div>
      <button class="dots-btn" id="openLevelsBtn" title="Select Level">⋮</button>
    </div>
  </div>

  <div id="stage-box">
    <canvas id="gameCanvas"></canvas>

    <!-- THUMB CONTROL ZONE GUIDE -->
    <div class="thumb-slider-zone">
      <span>◄ SLIDE</span>
      <div class="thumb-indicator"></div>
      <span>SLIDE ►</span>
    </div>

    <!-- OVERLAY -->
    <div id="game-overlay">
      <h1 id="screenTitle">VIP BRICK BREAKER</h1>
      <p id="screenDesc">
        🎮 <b>Neeche Angootha</b> rakh kar slide karein!<br>
        💎 Power-ups: ⚽ Multi-Ball, ❤️ Life, ⏱️ Speed Boost, 💣 Rocket Bomb!<br>
        🏆 500 Challenging Levels complete karein!
      </p>
      <button class="play-btn" id="startBtn">▶ PLAY NOW</button>
    </div>

    <!-- 500 LEVELS SELECT MODAL -->
    <div id="levels-modal" class="hidden">
      <div class="modal-header">
        <div class="modal-title">SELECT LEVEL (1 - 500)</div>
        <button class="close-modal-btn" id="closeLevelsBtn">✕ CLOSE</button>
      </div>
      <div class="levels-grid" id="levelsGrid"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage-box");
  const scoreText = document.getElementById("scoreText");
  const livesText = document.getElementById("livesText");
  const levelTag = document.getElementById("levelTag");
  const overlay = document.getElementById("game-overlay");
  const screenTitle = document.getElementById("screenTitle");
  const screenDesc = document.getElementById("screenDesc");
  const startBtn = document.getElementById("startBtn");
  const musicBtn = document.getElementById("musicBtn");
  const backNavBtn = document.getElementById("backNavBtn");
  const openLevelsBtn = document.getElementById("openLevelsBtn");
  const closeLevelsBtn = document.getElementById("closeLevelsBtn");
  const levelsModal = document.getElementById("levelsModal") || document.getElementById("levels-modal");
  const levelsGrid = document.getElementById("levelsGrid");

  backNavBtn.addEventListener("click", () => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "../index.html";
    }
  });

  let W, H;
  let running = false;
  let score = 0;
  let lives = 3;
  let audioCtx = null;
  let musicOn = true;

  // Level Progression Storage
  let currentLevel = parseInt(localStorage.getItem("vip_breaker_curr") || "1", 10);
  let maxUnlocked = parseInt(localStorage.getItem("vip_breaker_unlocked") || "1", 10);

  // Background Audio
  const bgMusic = new Audio("https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/games/saraiki_karaoke_music._original_karaoke_music(256k).mp3");
  bgMusic.loop = true;
  bgMusic.volume = 0.18;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function playHitSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(520, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1250, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  function playPaddleSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(340, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(680, audioCtx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.06);
  }

  function playPowerupSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(950, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }

  function playExplosionSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.35);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
  }

  function playLoseLifeSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(260, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(55, audioCtx.currentTime + 0.38);
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.38);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.38);
  }

  function toggleMusic() {
    initAudio();
    musicOn = !musicOn;
    musicBtn.innerText = musicOn ? "🎵" : "🔇";
    if (musicOn && running) bgMusic.play().catch(()=>{});
    else bgMusic.pause();
  }
  musicBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleMusic();
  });

  // GAME ENTITIES
  const paddle = {
    w: 96,
    h: 16,
    x: 0,
    y: 0
  };

  let balls = [];
  let bricks = [];
  let particles = [];
  let drops = [];
  let activeRockets = [];

  const VIP_PALETTES = [
    { top: "#ff3366", mid: "#c2185b", glow: "#ff1744", border: "#ff80ab" },
    { top: "#ff9100", mid: "#e65100", glow: "#ff6d00", border: "#ffcc80" },
    { top: "#ffd600", mid: "#f57f17", glow: "#ffab00", border: "#fff59d" },
    { top: "#00e676", mid: "#1b5e20", glow: "#00c853", border: "#b9f6ca" },
    { top: "#00f0ff", mid: "#006064", glow: "#00b4d8", border: "#80deea" },
    { top: "#d500f9", mid: "#4a148c", glow: "#ea80fc", border: "#f3e5f5" }
  ];

  function resize() {
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    paddle.y = H - 130;
    if (paddle.x === 0) paddle.x = (W - paddle.w) / 2;
  }
  window.addEventListener("resize", resize);
  resize();

  // LEVEL GENERATOR (Supports 1 to 500 levels with progressive hardness)
  function initBricksForLevel(lvl) {
    bricks = [];
    const cols = 6;
    const baseRows = Math.min(9, 4 + Math.floor(lvl / 25));
    const pad = 6;
    const brickW = (W - (cols + 1) * pad) / cols;
    const brickH = 22;
    const topOffset = 20;

    // Pattern seed based on level
    for (let r = 0; r < baseRows; r++) {
      for (let c = 0; c < cols; c++) {
        // Layout Variations: Pyramid, Checkerboard, Alternating, Fortress
        let active = true;
        const mod = lvl % 5;
        if (mod === 1 && (r + c) % 2 === 1 && lvl > 2) active = false; // Checkerboard
        if (mod === 2 && Math.abs(c - 2.5) > r + 0.5) active = false; // Pyramid
        if (mod === 3 && (c === 0 || c === cols - 1) && r % 2 === 1) active = false;

        if (!active) continue;

        // Brick HP hardness scales with level (Up to 3-4 hits in higher levels)
        let hp = 1;
        const rand = (Math.sin(lvl * 99 + r * 13 + c * 7) + 1) / 2;
        if (lvl > 10 && rand > 0.6) hp = 2;
        if (lvl > 35 && rand > 0.78) hp = 3;
        if (lvl > 80 && rand > 0.90) hp = 4;

        const paletteIndex = (r + hp - 1) % VIP_PALETTES.length;
        bricks.push({
          x: pad + c * (brickW + pad),
          y: topOffset + r * (brickH + pad),
          w: brickW,
          h: brickH,
          hp: hp,
          maxHp: hp,
          style: VIP_PALETTES[paletteIndex]
        });
      }
    }
  }

  function getBaseBallSpeed() {
    // Speed gradually increases per level
    return Math.min(8.6, 5.2 + (currentLevel - 1) * 0.018);
  }

  function spawnInitialBall() {
    balls = [];
    const spd = getBaseBallSpeed();
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.5;
    balls.push({
      x: paddle.x + paddle.w / 2,
      y: paddle.y - 12,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      r: 8.5,
      speed: spd
    });
  }

  // CONTROLS
  function movePaddle(clientX) {
    const rect = canvas.getBoundingClientRect();
    const touchX = clientX - rect.left;
    paddle.x = Math.max(0, Math.min(W - paddle.w, touchX - paddle.w / 2));
  }

  canvas.addEventListener("pointerdown", (e) => {
    initAudio();
    movePaddle(e.clientX);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (e.buttons === 1) movePaddle(e.clientX);
  });

  // PARTICLES
  function spawnParticles(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = Math.random() * 4.5 + 2;
      particles.push({
        x, y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        color,
        alpha: 1
      });
    }
  }

  // DRAW FUNCTIONS
  function drawVipBrick(b) {
    const { x, y, w, h, style, hp, maxHp } = b;
    ctx.save();
    ctx.shadowColor = style.glow;
    ctx.shadowBlur = 7;

    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, style.top);
    grad.addColorStop(0.5, style.mid);
    grad.addColorStop(1, "rgba(10, 15, 25, 0.95)");

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 6);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = style.border;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Top Gloss bar
    ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
    ctx.beginPath();
    ctx.roundRect(x + 3, y + 2, w - 6, h * 0.35, 3);
    ctx.fill();

    // Center Display (HP dots or Diamond)
    const cx = x + w / 2;
    const cy = y + h / 2;
    if (maxHp > 1) {
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🛡️" + hp, cx, cy + 1);
    } else {
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(cx, cy - 4);
      ctx.lineTo(cx + 4, cy);
      ctx.lineTo(cx, cy + 4);
      ctx.lineTo(cx - 4, cy);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawVipPaddle() {
    ctx.save();
    const { x, y, w, h } = paddle;

    ctx.shadowColor = "#00f0ff";
    ctx.shadowBlur = 10;

    const pGrad = ctx.createLinearGradient(x, y, x, y + h);
    pGrad.addColorStop(0, "#00f0ff");
    pGrad.addColorStop(0.6, "#ff542d");
    pGrad.addColorStop(1, "#b71c1c");

    ctx.fillStyle = pGrad;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 8);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffbe00";
    ctx.beginPath();
    ctx.roundRect(x + w * 0.2, y + 3, w * 0.6, 4, 2);
    ctx.fill();

    ctx.fillStyle = "#00f0ff";
    ctx.fillRect(x + 4, y + h - 2, 8, 3);
    ctx.fillRect(x + w - 12, y + h - 2, 8, 3);
    ctx.restore();
  }

  function drawBall(b) {
    ctx.save();
    ctx.shadowColor = "#00f0ff";
    ctx.shadowBlur = 10;

    const bGrad = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, b.r);
    bGrad.addColorStop(0, "#ffffff");
    bGrad.addColorStop(0.4, "#00f0ff");
    bGrad.addColorStop(1, "#0077ff");

    ctx.fillStyle = bGrad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  function drawDrop(d) {
    ctx.save();
    ctx.font = "20px 'Segoe UI Emoji', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    let icon = "💎";
    if (d.type === "multi") icon = "⚽";
    if (d.type === "life") icon = "❤️";
    if (d.type === "speed") icon = "⏱️";
    if (d.type === "bomb") icon = "💣";

    ctx.fillText(icon, d.x, d.y);
    ctx.restore();
  }

  function drawRocket(r) {
    ctx.save();
    ctx.font = "22px 'Segoe UI Emoji', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "#ff542d";
    ctx.shadowBlur = 14;
    ctx.fillText("💣", r.x, r.y);
    ctx.restore();
  }

  // POWERUP SPAWNER
  function maybeSpawnDrop(x, y) {
    const rand = Math.random();
    if (rand < 0.38) {
      let type = "gem";
      const sub = Math.random();
      if (sub < 0.30) type = "multi";      // Multi ball
      else if (sub < 0.48) type = "bomb";  // Bomb
      else if (sub < 0.65) type = "life";  // Extra Life
      else if (sub < 0.82) type = "speed"; // Timer watch speed boost
      else type = "gem";

      drops.push({
        x, y,
        vy: 2.3,
        type
      });
    }
  }

  // APPLY POWER-UP
  function applyPowerup(d) {
    playPowerupSound();
    if (d.type === "multi") {
      // Catching multi ball doubles active balls (1->2, 2->4, etc)
      const currentLen = balls.length;
      for (let i = 0; i < currentLen && balls.length < 8; i++) {
        const b = balls[i];
        const angle = Math.atan2(b.vy, b.vx) + 0.35;
        const spd = b.speed || getBaseBallSpeed();
        balls.push({
          x: b.x,
          y: b.y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          r: b.r,
          speed: spd
        });
      }
    } else if (d.type === "life") {
      lives++;
      livesText.innerText = lives;
      spawnParticles(paddle.x + paddle.w / 2, paddle.y, "#ff1744", 16);
    } else if (d.type === "speed") {
      // Timer Watch: boost ball speeds
      balls.forEach(b => {
        b.speed = Math.min(10.5, b.speed + 1.6);
        const norm = Math.hypot(b.vx, b.vy);
        b.vx = (b.vx / norm) * b.speed;
        b.vy = (b.vy / norm) * b.speed;
      });
      spawnParticles(paddle.x + paddle.w / 2, paddle.y, "#ffeb3b", 16);
    } else if (d.type === "bomb") {
      // Launch rocket-bomb straight up like a jumping ball
      activeRockets.push({
        x: paddle.x + paddle.w / 2,
        y: paddle.y - 12,
        vy: -7.5,
        r: 12
      });
    } else {
      score += 50;
      scoreText.innerText = score;
    }
  }

  // BOMB BLAST MECHANIC (AoE Explosion)
  function triggerBombBlast(bx, by) {
    playExplosionSound();
    spawnParticles(bx, by, "#ff542d", 30);
    spawnParticles(bx, by, "#ffbe00", 25);
    const blastRadius = 85;

    for (let i = bricks.length - 1; i >= 0; i--) {
      const b = bricks[i];
      const dist = Math.hypot(bx - (b.x + b.w / 2), by - (b.y + b.h / 2));
      if (dist <= blastRadius) {
        score += b.hp * 30;
        scoreText.innerText = score;
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.style.glow, 8);
        maybeSpawnDrop(b.x + b.w / 2, b.y + b.h / 2);
        bricks.splice(i, 1);
      }
    }
  }

  function startLevel(lvl) {
    initAudio();
    currentLevel = Math.max(1, Math.min(500, lvl));
    localStorage.setItem("vip_breaker_curr", currentLevel);
    levelTag.innerText = `LVL ${currentLevel}`;

    paddle.w = Math.max(72, 98 - Math.floor(currentLevel / 40) * 4); // Slight paddle decrease for challenge
    paddle.x = (W - paddle.w) / 2;

    drops = [];
    particles = [];
    activeRockets = [];
    initBricksForLevel(currentLevel);
    spawnInitialBall();

    running = true;
    overlay.classList.add("hidden");
    levelsModal.classList.add("hidden");
    if (musicOn) bgMusic.play().catch(()=>{});
    loop();
  }

  function gameOver(win = false) {
    running = false;
    bgMusic.pause();

    if (win) {
      if (currentLevel >= maxUnlocked && maxUnlocked < 500) {
        maxUnlocked = currentLevel + 1;
        localStorage.setItem("vip_breaker_unlocked", maxUnlocked);
      }
      screenTitle.innerText = `🎉 LEVEL ${currentLevel} CLEARED!`;
      screenDesc.innerHTML = `Shandar kheli! Saari VIP plates blast ho gayin.<br>Total Score: <b style="color:#00f0ff; font-size:22px;">${score}</b>`;
      startBtn.innerText = currentLevel < 500 ? `▶ PLAY LEVEL ${currentLevel + 1}` : "🏆 GAME FINISHED!";
      startBtn.onclick = () => {
        if (currentLevel < 500) startLevel(currentLevel + 1);
        else startLevel(1);
      };
    } else {
      screenTitle.innerText = "💥 GAME OVER!";
      screenDesc.innerHTML = `Ball neeche gir gayi!<br>Final Score: <b style="color:#00f0ff; font-size:22px;">${score}</b>`;
      startBtn.innerText = `↻ RETRY LEVEL ${currentLevel}`;
      startBtn.onclick = () => {
        lives = 3;
        livesText.innerText = lives;
        startLevel(currentLevel);
      };
    }
    overlay.classList.remove("hidden");
  }

  startBtn.onclick = () => {
    lives = 3;
    livesText.innerText = lives;
    score = 0;
    scoreText.innerText = score;
    startLevel(currentLevel);
  };

  // 500 LEVEL SELECTOR MODAL
  function renderLevelsGrid() {
    levelsGrid.innerHTML = "";
    for (let i = 1; i <= 500; i++) {
      const card = document.createElement("div");
      const isUnlocked = i <= maxUnlocked;
      const isCurrent = i === currentLevel;

      card.className = `lvl-card ${isUnlocked ? 'unlocked' : 'locked'} ${isCurrent ? 'current' : ''}`;
      card.innerHTML = isUnlocked ? `${i}` : `🔒`;

      if (isUnlocked) {
        card.addEventListener("click", () => {
          levelsModal.classList.add("hidden");
          lives = 3;
          livesText.innerText = lives;
          startLevel(i);
        });
      }
      levelsGrid.appendChild(card);
    }
  }

  openLevelsBtn.addEventListener("click", () => {
    running = false;
    bgMusic.pause();
    renderLevelsGrid();
    levelsModal.classList.remove("hidden");
    const activeCard = levelsGrid.children[currentLevel - 1];
    if (activeCard) activeCard.scrollIntoView({ block: "center", behavior: "smooth" });
  });

  closeLevelsBtn.addEventListener("click", () => {
    levelsModal.classList.add("hidden");
    if (bricks.length > 0 && lives > 0) {
      running = true;
      if (musicOn) bgMusic.play().catch(()=>{});
      loop();
    }
  });

  // MAIN GAME LOOP
  function loop() {
    if (!running) return;
    ctx.clearRect(0, 0, W, H);

    // 1. UPDATE & DRAW BALLS
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      b.x += b.vx;
      b.y += b.vy;

      // Walls
      if (b.x - b.r <= 0) {
        b.x = b.r;
        b.vx *= -1;
        playPaddleSound();
      } else if (b.x + b.r >= W) {
        b.x = W - b.r;
        b.vx *= -1;
        playPaddleSound();
      }
      if (b.y - b.r <= 0) {
        b.y = b.r;
        b.vy *= -1;
        playPaddleSound();
      }

      // Paddle Collision
      if (
        b.y + b.r >= paddle.y &&
        b.y - b.r <= paddle.y + paddle.h &&
        b.x >= paddle.x &&
        b.x <= paddle.x + paddle.w
      ) {
        playPaddleSound();
        b.y = paddle.y - b.r;
        const hitOffset = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const angle = hitOffset * (Math.PI / 3);
        const spd = b.speed || getBaseBallSpeed();
        b.vx = spd * Math.sin(angle);
        b.vy = -spd * Math.cos(angle);
      }

      // Ball Falls Below
      if (b.y > paddle.y + 40) {
        balls.splice(i, 1);
        continue;
      }

      // Ball vs Bricks Collision
      for (let j = bricks.length - 1; j >= 0; j--) {
        const br = bricks[j];
        if (
          b.x + b.r > br.x &&
          b.x - b.r < br.x + br.w &&
          b.y + b.r > br.y &&
          b.y - b.r < br.y + br.h
        ) {
          b.vy *= -1;
          br.hp--;
          playHitSound();
          spawnParticles(b.x, b.y, br.style.glow, 6);

          if (br.hp <= 0) {
            score += 25 * br.maxHp;
            scoreText.innerText = score;
            spawnParticles(br.x + br.w / 2, br.y + br.h / 2, br.style.glow, 14);
            maybeSpawnDrop(br.x + br.w / 2, br.y + br.h / 2);
            bricks.splice(j, 1);
          }
          break;
        }
      }

      drawBall(b);
    }

    // Check Ball depletion
    if (balls.length === 0) {
      playLoseLifeSound();
      lives--;
      livesText.innerText = lives;
      if (lives <= 0) {
        gameOver(false);
        return;
      } else {
        spawnInitialBall();
      }
    }

    // Level Win Check
    if (bricks.length === 0) {
      gameOver(true);
      return;
    }

    // 2. UPDATE & DRAW ROCKET BOMBS
    for (let i = activeRockets.length - 1; i >= 0; i--) {
      const r = activeRockets[i];
      r.y += r.vy;
      drawRocket(r);

      // Rocket collision with bricks
      let hit = false;
      for (let j = 0; j < bricks.length; j++) {
        const br = bricks[j];
        if (
          r.x >= br.x && r.x <= br.x + br.w &&
          r.y >= br.y && r.y <= br.y + br.h
        ) {
          triggerBombBlast(r.x, r.y);
          hit = true;
          break;
        }
      }

      if (hit || r.y < 0) {
        if (!hit && r.y < 0) triggerBombBlast(r.x, 15);
        activeRockets.splice(i, 1);
      }
    }

    // 3. DRAW BRICKS
    for (const br of bricks) {
      drawVipBrick(br);
    }

    // 4. FALLING POWERUP DROPS
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.y += d.vy;
      drawDrop(d);

      // Catch check with paddle
      if (
        d.y >= paddle.y &&
        d.y <= paddle.y + paddle.h &&
        d.x >= paddle.x &&
        d.x <= paddle.x + paddle.w
      ) {
        applyPowerup(d);
        drops.splice(i, 1);
        continue;
      }

      if (d.y > H) drops.splice(i, 1);
    }

    // 5. DRAW PADDLE & PARTICLES
    drawVipPaddle();

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.035;
      if (p.alpha <= 0) particles.splice(i, 1);
      else {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
