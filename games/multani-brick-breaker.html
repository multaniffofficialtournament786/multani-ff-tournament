<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MULTANI BRICK BREAKER 100 FORTS</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #030408;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: #000;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    height: 56px;
    background: #070712;
    border-bottom: 2px solid #ff007f;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 10px;
    z-index: 20;
  }
  .title-box {
    display: flex;
    flex-direction: column;
  }
  .title-main {
    font-size: 12px;
    font-weight: 900;
    color: #ff007f;
    letter-spacing: 0.5px;
    line-height: 1.1;
  }
  .title-sub {
    font-size: 8px;
    color: #00e5ff;
    letter-spacing: 1px;
    font-weight: bold;
  }
  .stat-group {
    display: flex;
    gap: 8px;
    text-align: center;
  }
  .stat-box {
    display: flex;
    flex-direction: column;
  }
  .stat-label {
    font-size: 8px;
    color: #8fa0be;
    font-weight: 800;
  }
  .stat-val {
    font-size: 12px;
    font-weight: 900;
  }
  .val-lvl { color: #ffffff; }
  .val-score { color: #ffcc00; }
  .val-balls { color: #00e5ff; }
  .val-lives { color: #ff0055; font-size: 11px; letter-spacing: 1px; }

  .header-actions {
    display: flex;
    gap: 4px;
  }
  .btn-hdr {
    background: #0d162b;
    border: 1px solid #00e5ff;
    color: #00e5ff;
    border-radius: 5px;
    padding: 5px 7px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-hdr:active {
    background: #00e5ff;
    color: #000;
  }

  #landmark-pill {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.88);
    border: 1px solid #00e5ff;
    color: #fff;
    padding: 3px 12px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: bold;
    z-index: 15;
    pointer-events: none;
    white-space: nowrap;
  }

  #canvas-wrapper {
    position: relative;
    flex: 1;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  #real-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 1;
    opacity: 0.35;
    filter: brightness(0.65) contrast(1.1);
    transition: opacity 0.5s ease, filter 0.5s ease;
  }

  #real-photo.revealed {
    opacity: 1 !important;
    filter: brightness(1) contrast(1) !important;
  }

  canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    z-index: 5;
    background: transparent;
  }

  #win-screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 45px;
    background: transparent;
    z-index: 25;
  }
  .win-card {
    background: rgba(5, 5, 15, 0.92);
    border: 2px solid #39ff14;
    border-radius: 14px;
    padding: 14px 26px;
    text-align: center;
    margin-bottom: 16px;
  }
  .win-card h2 {
    color: #39ff14;
    font-size: 22px;
    font-weight: 900;
  }
  .win-card p {
    font-size: 14px;
    color: #ffcc00;
    font-weight: bold;
    margin-top: 4px;
  }

  .btn-huge {
    width: 84%;
    padding: 15px 0;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #000;
    background: linear-gradient(90deg, #ff007f, #ffaa00);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    text-transform: uppercase;
  }

  #gameover-screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.92);
    z-index: 30;
  }
  #gameover-screen h1 {
    font-size: 34px;
    color: #ff0044;
    font-weight: 900;
    margin-bottom: 10px;
  }

  #level-modal {
    position: absolute;
    inset: 0;
    background: rgba(5, 7, 16, 0.98);
    z-index: 100;
    display: none;
    flex-direction: column;
    padding: 16px;
  }
  #level-modal header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  #level-modal h3 {
    color: #00e5ff;
    font-size: 17px;
  }
  .grid-levels {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding-bottom: 25px;
  }
  .lvl-btn {
    aspect-ratio: 1;
    background: #0d1222;
    border: 1px solid #28334e;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
  }
  .lvl-btn.unlocked {
    border-color: #ff007f;
    color: #00e5ff;
  }
  .lvl-btn.active {
    background: #ff007f;
    color: #fff;
  }
  .lvl-btn.locked {
    opacity: 0.3;
    cursor: not-allowed;
  }

  #tap-hint {
    position: absolute;
    bottom: 180px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    background: rgba(0, 0, 0, 0.75);
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px dashed #00e5ff;
    pointer-events: none;
    z-index: 15;
  }
</style>
</head>
<body>
<div id="game-container">
  <header id="header">
    <div class="title-box">
      <div class="title-main">MULTANI</div>
      <div class="title-main" style="color:#fff;">BRICK BREAKER</div>
      <div class="title-sub">100 FORTS</div>
    </div>
    <div class="stat-group">
      <div class="stat-box">
        <span class="stat-label">LVL</span>
        <span class="stat-val val-lvl" id="disp-lvl">1</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">SCORE</span>
        <span class="stat-val val-score" id="disp-score">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">BALLS</span>
        <span class="stat-val val-balls" id="disp-balls">1</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">LIVES</span>
        <span class="stat-val val-lives" id="disp-lives">❤️❤️❤️</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-hdr" id="btn-sfx">SFX: ON</button>
      <button class="btn-hdr" id="btn-lvls">LVLS</button>
      <button class="btn-hdr" id="btn-pause">⏸</button>
    </div>
  </header>

  <div id="canvas-wrapper">
    <img id="real-photo" referrerpolicy="no-referrer" alt="Fort Landmark" />
    <div id="landmark-pill">Derawar Fort, Bahawalpur</div>
    <canvas id="gameCanvas"></canvas>
    <div id="tap-hint">TAP TO LAUNCH BALL</div>

    <div id="win-screen">
      <div class="win-card">
        <h2>FORT DESTROYED!</h2>
        <p id="win-score-txt">SCORE: 0</p>
      </div>
      <button class="btn-huge" id="btn-next">NEXT LEVEL</button>
    </div>

    <div id="gameover-screen">
      <h1>GAME OVER</h1>
      <p style="color:#aaa; margin-bottom:20px;">Fort defended by enemies!</p>
      <button class="btn-huge" id="btn-retry" style="background:#ff0055; color:#fff;">RESTART LEVEL</button>
    </div>

    <div id="level-modal">
      <header>
        <h3>SELECT FORT LEVEL (1 - 100)</h3>
        <button class="btn-hdr" id="btn-close-lvl" style="padding:6px 12px;">✕</button>
      </header>
      <div class="grid-levels" id="grid-levels"></div>
    </div>
  </div>
</div>

<script>
class SoundSys {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playTone(freq, type, duration, endFreq) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      if (endFreq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(10, endFreq), this.ctx.currentTime + duration);
      }
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }
  hitPaddle() { this.playTone(320, 'square', 0.06, 480); }
  hitBrick() { this.playTone(550, 'sine', 0.05, 220); }
  hitSteel() { this.playTone(180, 'square', 0.04, 110); }
  powerup() { this.playTone(320, 'triangle', 0.18, 950); }
  win() {
    [440, 554, 659, 880].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sine', 0.18, f * 1.2), i * 110);
    });
  }
  over() {
    [300, 240, 180, 120].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sawtooth', 0.14, f * 0.7), i * 80);
    });
  }
}

const photoData = [
  { name: "Derawar Fort, Bahawalpur", url: "https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=800&auto=format&fit=crop&q=85" },
  { name: "Minar-e-Pakistan, Lahore", url: "https://images.unsplash.com/photo-1590059390046-81534a6e87f7?w=800&auto=format&fit=crop&q=85" },
  { name: "Badshahi Mosque, Lahore", url: "https://images.unsplash.com/photo-1587974928442-77dc3e0dba72?w=800&auto=format&fit=crop&q=85" },
  { name: "Lahore Fort (Shahi Qila)", url: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=800&auto=format&fit=crop&q=85" },
  { name: "Rohtas Fort, Jhelum", url: "https://images.unsplash.com/photo-1563089145-599997674d42?w=800&auto=format&fit=crop&q=85" },
  { name: "Ranikot Fort, Sindh", url: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&auto=format&fit=crop&q=85" },
  { name: "Tomb of Shah Rukn-e-Alam, Multan", url: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&auto=format&fit=crop&q=85" },
  { name: "Faisal Mosque, Islamabad", url: "https://images.unsplash.com/photo-1589182373726-e4f658ab50f0?w=800&auto=format&fit=crop&q=85" },
  { name: "Baltit Fort, Hunza Valley", url: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop&q=85" },
  { name: "Mohenjo-daro Ancient Citadel", url: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=800&auto=format&fit=crop&q=85" }
];

class MultaniGame {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.snd = new SoundSys();
    this.bgImg = document.getElementById('real-photo');

    this.dispLvl = document.getElementById('disp-lvl');
    this.dispScore = document.getElementById('disp-score');
    this.dispBalls = document.getElementById('disp-balls');
    this.dispLives = document.getElementById('disp-lives');
    this.btnSfx = document.getElementById('btn-sfx');
    this.btnLvls = document.getElementById('btn-lvls');
    this.btnPause = document.getElementById('btn-pause');
    this.winScreen = document.getElementById('win-screen');
    this.gameoverScreen = document.getElementById('gameover-screen');
    this.levelModal = document.getElementById('level-modal');
    this.gridLevels = document.getElementById('grid-levels');
    this.btnNext = document.getElementById('btn-next');
    this.btnRetry = document.getElementById('btn-retry');
    this.btnCloseLvl = document.getElementById('btn-close-lvl');
    this.tapHint = document.getElementById('tap-hint');
    this.landmarkPill = document.getElementById('landmark-pill');

    this.width = 400;
    this.height = 700;

    this.level = parseInt(localStorage.getItem('multani_unlocked_level') || '1');
    this.currentLevel = this.level;
    this.score = 0;
    this.lives = 3;

    this.paddle = {
      w: 84,
      h: 14,
      x: 158,
      y: this.height - 110,
      targetX: 158
    };

    this.isDraggingPaddle = false;
    this.touchStartX = 0;
    this.paddleStartOriginX = 0;

    this.balls = [];
    this.bricks = [];
    this.powerups = [];
    this.particles = [];
    this.state = 'WAIT_LAUNCH';

    this.maxBalls = 50;

    // Ball speed slow aur comfortable kar di (8.5 se kam karke 6.2)
    this.baseSpeed = 6.2;

    this.initEvents();
    this.resize();
    window.addEventListener('resize', () => this.resize());

    this.loadLevel(this.currentLevel);
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }

  resize() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    this.canvas.width = rect.width * (window.devicePixelRatio || 1);
    this.canvas.height = rect.height * (window.devicePixelRatio || 1);
    this.scaleX = this.canvas.width / this.width;
    this.scaleY = this.canvas.height / this.height;
  }

  initEvents() {
    const getCanvasPos = (clientX, clientY) => {
      const rect = this.canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (this.width / rect.width),
        y: (clientY - rect.top) * (this.height / rect.height)
      };
    };

    const onStart = (clientX, clientY) => {
      this.snd.init();
      if (this.state === 'WAIT_LAUNCH') {
        this.launchBall();
        return;
      }
      const pos = getCanvasPos(clientX, clientY);
      if (pos.y >= this.paddle.y - 80) {
        this.isDraggingPaddle = true;
        this.touchStartX = pos.x;
        this.paddleStartOriginX = this.paddle.x;
      }
    };

    const onMove = (clientX, clientY) => {
      if (!this.isDraggingPaddle) return;
      const pos = getCanvasPos(clientX, clientY);
      const deltaX = pos.x - this.touchStartX;
      const newX = this.paddleStartOriginX + deltaX;
      this.paddle.targetX = Math.max(6, Math.min(this.width - this.paddle.w - 6, newX));
      this.paddle.x = this.paddle.targetX;
    };

    const onEnd = () => {
      this.isDraggingPaddle = false;
    };

    window.addEventListener('touchstart', (e) => {
      if (e.target === this.canvas && e.touches.length > 0) {
        onStart(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (this.isDraggingPaddle && e.touches.length > 0) {
        onMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    window.addEventListener('touchend', onEnd);
    window.addEventListener('touchcancel', onEnd);

    this.canvas.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', onEnd);

    this.btnSfx.addEventListener('click', () => {
      this.snd.enabled = !this.snd.enabled;
      this.btnSfx.textContent = this.snd.enabled ? 'SFX: ON' : 'SFX: OFF';
    });

    this.btnPause.addEventListener('click', () => {
      if (this.state === 'PLAYING') {
        this.state = 'PAUSED';
        this.btnPause.textContent = '▶';
      } else if (this.state === 'PAUSED') {
        this.state = 'PLAYING';
        this.btnPause.textContent = '⏸';
      }
    });

    this.btnLvls.addEventListener('click', () => this.showLevelModal());
    this.btnCloseLvl.addEventListener('click', () => this.levelModal.style.display = 'none');

    this.btnNext.addEventListener('click', () => {
      this.winScreen.style.display = 'none';
      this.currentLevel++;
      if (this.currentLevel > 100) this.currentLevel = 1;
      this.saveProgress();
      this.loadLevel(this.currentLevel);
    });

    this.btnRetry.addEventListener('click', () => {
      this.gameoverScreen.style.display = 'none';
      this.lives = 3;
      this.loadLevel(this.currentLevel);
    });
  }

  saveProgress() {
    const unlocked = Math.max(this.level, this.currentLevel);
    this.level = unlocked;
    localStorage.setItem('multani_unlocked_level', unlocked);
  }

  showLevelModal() {
    this.gridLevels.innerHTML = '';
    for (let i = 1; i <= 100; i++) {
      const b = document.createElement('button');
      b.className = 'lvl-btn';
      b.textContent = i;
      if (i <= this.level) {
        b.classList.add('unlocked');
        if (i === this.currentLevel) b.classList.add('active');
        b.addEventListener('click', () => {
          this.currentLevel = i;
          this.levelModal.style.display = 'none';
          this.winScreen.style.display = 'none';
          this.gameoverScreen.style.display = 'none';
          this.loadLevel(i);
        });
      } else {
        b.classList.add('locked');
      }
      this.gridLevels.appendChild(b);
    }
    this.levelModal.style.display = 'flex';
  }

  loadLevel(lvl) {
    this.currentLevel = lvl;
    this.bricks = [];
    this.powerups = [];
    this.particles = [];
    this.balls = [];
    this.state = 'WAIT_LAUNCH';
    this.isDraggingPaddle = false;
    this.tapHint.style.display = 'block';
    this.winScreen.style.display = 'none';
    this.gameoverScreen.style.display = 'none';

    const photo = photoData[(lvl - 1) % photoData.length];
    this.landmarkPill.textContent = photo.name;
    this.bgImg.src = photo.url;
    this.bgImg.classList.remove('revealed');

    this.paddle.w = Math.max(54, 84 - Math.floor(lvl * 0.25));
    this.paddle.x = (this.width - this.paddle.w) / 2;
    this.paddle.targetX = this.paddle.x;

    this.resetBallToPaddle();

    const cols = 20;
    const rows = 28;
    const brickW = 18;
    const brickH = 13;
    const offsetX = 20;
    const offsetY = 30;

    const fortStyle = (lvl - 1) % 10;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let isSteel = false;
        let isBreakable = false;

        const isOuterBorder = (r === 0 || c === 0 || c === cols - 1 || r === rows - 1);

        if (isOuterBorder) {
          if (r === rows - 1) {
            if (fortStyle === 0 && (c === 9 || c === 10)) isSteel = false;
            else if (fortStyle === 1 && (c === 4 || c === 15)) isSteel = false;
            else if (fortStyle === 2 && (c === 6 || c === 13)) isSteel = false;
            else if (fortStyle === 3 && (c === 9 || c === 10)) isSteel = false;
            else if (fortStyle === 4 && (c === 9)) isSteel = false;
            else if (fortStyle === 5 && (c === 4 || c === 15)) isSteel = false;
            else if (fortStyle === 6 && (c === 10)) isSteel = false;
            else if (fortStyle === 7 && (c === 6 || c === 13)) isSteel = false;
            else if (fortStyle === 8 && (c === 8 || c === 11)) isSteel = false;
            else if (fortStyle === 9 && (c === 9 || c === 10)) isSteel = false;
            else isSteel = true;
          } else {
            isSteel = true;
          }
        }

        if (!isSteel && !isOuterBorder) {
          switch (fortStyle) {
            case 0:
              if (r === 6 && (c < 9 || c > 10)) isSteel = true;
              else if (r === 12 && (c < 5 || (c > 7 && c < 12) || c > 14)) isSteel = true;
              else if (r === 18 && (c < 9 || c > 10)) isSteel = true;
              else if (r >= 20 && r <= 25 && (c === 5 || c === 14)) isSteel = true;
              else if (r >= 1 && r <= 19) isBreakable = true;
              break;

            case 1:
              if (c === 9 && r >= 3 && r <= 20 && r !== 8) isSteel = true;
              else if (r === 8 && (c === 3 || c === 4 || c === 15 || c === 16)) isSteel = true;
              else if (r === 14 && (c < 8 || c > 11)) isSteel = true;
              else if (r >= 1 && r <= 20) isBreakable = true;
              break;

            case 2:
              if ((r === 5 || r === 15) && c >= 5 && c <= 14 && c !== 9) isSteel = true;
              else if ((c === 5 || c === 14) && r >= 5 && r <= 15 && r !== 10) isSteel = true;
              else if (r >= 1 && r <= 20) isBreakable = true;
              break;

            case 3:
              if (r === 5 && c <= 15) isSteel = true;
              else if (r === 10 && c >= 4) isSteel = true;
              else if (r === 15 && c <= 15) isSteel = true;
              else if (r >= 1 && r <= 20) isBreakable = true;
              break;

            case 4:
              if ((c === 5 || c === 14) && r >= 4 && r <= 20 && r !== 11) isSteel = true;
              else if (r === 9 && (c <= 5 || c >= 14)) isSteel = true;
              else if (r === 15 && (c >= 7 && c <= 12 && c !== 9)) isSteel = true;
              else if (r >= 1 && r <= 20) isBreakable = true;
              break;

            case 5:
              if ((r === 6 || r === 13) && (c % 4 !== 0)) isSteel = true;
              else if ((c === 5 || c === 14) && r >= 16 && r <= 24) isSteel = true;
              else if (r >= 1 && r <= 20) isBreakable = true;
              break;

            case 6:
              if (r === 5 && (c <= 6 || c >= 13)) isSteel = true;
              else if (r === 9 && (c <= 8 || c >= 11)) isSteel = true;
              else if (r === 14 && (c < 9 || c > 10)) isSteel = true;
              else if (r >= 1 && r <= 20) isBreakable = true;
              break;

            case 7:
              if (c === 9 && r >= 2 && r <= 19 && r !== 6 && r !== 14) isSteel = true;
              else if (r === 10 && c >= 2 && c <= 17 && c !== 5 && c !== 14) isSteel = true;
              else if (r >= 1 && r <= 20) isBreakable = true;
              break;

            case 8:
              if ((r === 4 || r === 15) && c >= 4 && c <= 15 && c !== 9) isSteel = true;
              else if ((c === 4 || c === 15) && r >= 4 && r <= 15 && r !== 9) isSteel = true;
              else if (r >= 1 && r <= 20) isBreakable = true;
              break;

            case 9:
              if (r === 4 && c >= 4 && c <= 15) isSteel = true;
              else if (r === 9 && (c <= 7 || c >= 12)) isSteel = true;
              else if (r === 14 && c >= 3 && c <= 16 && c !== 9 && c !== 10) isSteel = true;
              else if (r >= 1 && r <= 20) isBreakable = true;
              break;
          }
        }

        if (isSteel) {
          this.bricks.push({
            x: offsetX + c * brickW,
            y: offsetY + r * brickH,
            w: brickW,
            h: brickH,
            isSteel: true,
            color: '#1a1f33'
          });
        } else if (isBreakable) {
          let hp = 1;
          if (lvl > 15 && Math.random() < 0.25) hp = 2;
          if (lvl > 40 && Math.random() < 0.18) hp = 3;

          let pPower = null;
          const roll = Math.random();
          if (roll < 0.05) pPower = '2X';
          else if (roll < 0.08) pPower = '3X';
          else if (roll < 0.10) pPower = '4X';
          else if (roll < 0.11) pPower = '5X';

          let col = '#ff007f';
          const stripe = (r + c + lvl) % 3;
          if (stripe === 1) col = '#00e5ff';
          else if (stripe === 2) col = '#ff9900';

          this.bricks.push({
            x: offsetX + c * brickW,
            y: offsetY + r * brickH,
            w: brickW,
            h: brickH,
            hp: hp,
            maxHp: hp,
            isSteel: false,
            color: col,
            powerup: pPower
          });
        }
      }
    }

    this.updateHUD();
  }

  resetBallToPaddle() {
    const spd = this.baseSpeed + Math.min(2.0, this.currentLevel * 0.02);
    this.balls = [{
      x: this.paddle.x + this.paddle.w / 2,
      y: this.paddle.y - 7,
      vx: 0,
      vy: 0,
      radius: 4.8,
      speed: spd,
      active: true
    }];
  }

  launchBall() {
    if (this.state !== 'WAIT_LAUNCH') return;
    this.state = 'PLAYING';
    this.tapHint.style.display = 'none';
    const angle = -Math.PI / 2 + (Math.random() * 0.3 - 0.15);
    const spd = this.balls[0].speed;
    this.balls[0].vx = Math.cos(angle) * spd;
    this.balls[0].vy = Math.sin(angle) * spd;
  }

  multiplyBalls(factor) {
    if (this.balls.length >= this.maxBalls) return;
    const currentList = [...this.balls];
    const totalToMake = Math.min(this.maxBalls, currentList.length * factor);
    const need = totalToMake - currentList.length;

    let added = 0;
    for (let i = 0; added < need && i < currentList.length; i++) {
      const src = currentList[i];
      for (let k = 1; k < factor && added < need; k++) {
        const spreadAngle = (Math.random() - 0.5) * 1.4;
        const currentAngle = Math.atan2(src.vy, src.vx) || -Math.PI / 2;
        const newAngle = currentAngle + spreadAngle;
        const spd = Math.max(this.baseSpeed, Math.hypot(src.vx, src.vy));

        this.balls.push({
          x: src.x,
          y: src.y,
          vx: Math.cos(newAngle) * spd,
          vy: Math.sin(newAngle) * spd,
          radius: 4.8,
          speed: spd,
          active: true
        });
        added++;
      }
    }
    this.updateHUD();
  }

  createExplosion(x, y, color) {
    if (this.particles.length > 30) return;
    for (let i = 0; i < 3; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = Math.random() * 2.5 + 1;
      this.particles.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1,
        color: color
      });
    }
  }

  updateHUD() {
    this.dispLvl.textContent = this.currentLevel;
    this.dispScore.textContent = this.score;
    this.dispBalls.textContent = Math.min(this.maxBalls, this.balls.length);
    this.dispLives.textContent = '❤️'.repeat(Math.max(0, this.lives));
  }

  update() {
    if (this.state !== 'PLAYING') return;

    for (let i = this.powerups.length - 1; i >= 0; i--) {
      const p = this.powerups[i];
      p.y += p.speed;

      if (
        p.y + p.r >= this.paddle.y &&
        p.y - p.r <= this.paddle.y + this.paddle.h &&
        p.x >= this.paddle.x &&
        p.x <= this.paddle.x + this.paddle.w
      ) {
        this.snd.powerup();
        const factor = parseInt(p.type[0]) || 2;
        this.multiplyBalls(factor);
        this.powerups.splice(i, 1);
        continue;
      }
      if (p.y > this.height) {
        this.powerups.splice(i, 1);
      }
    }

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life -= 0.08;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }

    const subSteps = 2;
    for (let step = 0; step < subSteps; step++) {
      for (let i = 0; i < this.balls.length; i++) {
        const b = this.balls[i];
        if (!b.active) continue;

        if (Math.abs(b.vy) < 1.6) {
          b.vy = (b.vy < 0 ? -1 : 1) * 2.4;
        }

        b.x += b.vx / subSteps;
        b.y += b.vy / subSteps;

        if (b.x - b.radius <= 2) {
          b.x = 2 + b.radius;
          b.vx = Math.abs(b.vx);
        } else if (b.x + b.radius >= this.width - 2) {
          b.x = this.width - 2 - b.radius;
          b.vx = -Math.abs(b.vx);
        }
        if (b.y - b.radius <= 2) {
          b.y = 2 + b.radius;
          b.vy = Math.abs(b.vy);
        }

        if (
          b.vy > 0 &&
          b.y + b.radius >= this.paddle.y &&
          b.y - b.radius <= this.paddle.y + this.paddle.h &&
          b.x >= this.paddle.x - 3 &&
          b.x <= this.paddle.x + this.paddle.w + 3
        ) {
          b.y = this.paddle.y - b.radius;
          const hitPos = (b.x - (this.paddle.x + this.paddle.w / 2)) / (this.paddle.w / 2);
          const bounceAngle = hitPos * (Math.PI * 0.42) - Math.PI / 2;
          const spd = Math.max(this.baseSpeed, Math.hypot(b.vx, b.vy));
          b.vx = Math.cos(bounceAngle) * spd;
          b.vy = Math.sin(bounceAngle) * spd;
          this.snd.hitPaddle();
        }

        for (let j = 0; j < this.bricks.length; j++) {
          const br = this.bricks[j];

          if (
            b.x + b.radius > br.x &&
            b.x - b.radius < br.x + br.w &&
            b.y + b.radius > br.y &&
            b.y - b.radius < br.y + br.h
          ) {
            const overlapLeft = (b.x + b.radius) - br.x;
            const overlapRight = (br.x + br.w) - (b.x - b.radius);
            const overlapTop = (b.y + b.radius) - br.y;
            const overlapBottom = (br.y + br.h) - (b.y - b.radius);

            const minX = Math.min(overlapLeft, overlapRight);
            const minY = Math.min(overlapTop, overlapBottom);

            if (minX < minY) {
              if (overlapLeft < overlapRight) {
                b.x = br.x - b.radius;
                b.vx = -Math.abs(b.vx);
              } else {
                b.x = br.x + br.w + b.radius;
                b.vx = Math.abs(b.vx);
              }
            } else {
              if (overlapTop < overlapBottom) {
                b.y = br.y - b.radius;
                b.vy = -Math.abs(b.vy);
              } else {
                b.y = br.y + br.h + b.radius;
                b.vy = Math.abs(b.vy);
              }
            }

            if (!br.isSteel) {
              br.hp--;
              this.score += 15;
              this.createExplosion(b.x, b.y, br.color);
              this.snd.hitBrick();

              if (br.hp <= 0) {
                if (br.powerup) {
                  this.powerups.push({
                    x: br.x + br.w / 2,
                    y: br.y + br.h / 2,
                    type: br.powerup,
                    r: 9,
                    speed: 2.8
                  });
                }
                this.bricks.splice(j, 1);
                j--;
              }
            } else {
              this.snd.hitSteel();
            }
            break;
          }
        }

        if (b.y > this.height + 25) {
          b.active = false;
        }
      }
    }

    this.balls = this.balls.filter(b => b.active);
    this.dispBalls.textContent = Math.min(this.maxBalls, this.balls.length);

    const remainingBreakable = this.bricks.filter(b => !b.isSteel).length;
    if (remainingBreakable === 0) {
      this.handleLevelWin();
      return;
    }

    if (this.balls.length === 0) {
      this.lives--;
      this.updateHUD();
      if (this.lives <= 0) {
        this.state = 'GAMEOVER';
        this.snd.over();
        this.gameoverScreen.style.display = 'flex';
      } else {
        this.state = 'WAIT_LAUNCH';
        this.tapHint.style.display = 'block';
        this.resetBallToPaddle();
      }
    }
  }

  handleLevelWin() {
    this.state = 'WIN';
    this.snd.win();
    this.saveProgress();
    this.bricks = [];
    this.powerups = [];
    this.balls = [];
    this.bgImg.classList.add('revealed');
    document.getElementById('win-score-txt').textContent = `FORT CLEARED! SCORE: ${this.score}`;
    this.winScreen.style.display = 'flex';
  }

  render() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    this.ctx.save();
    this.ctx.scale(this.scaleX, this.scaleY);

    if (this.state !== 'WIN') {
      for (let i = 0; i < this.bricks.length; i++) {
        const br = this.bricks[i];
        if (br.isSteel) {
          this.ctx.fillStyle = '#1c2236';
          this.ctx.fillRect(br.x, br.y, br.w, br.h);
          this.ctx.strokeStyle = '#323d60';
          this.ctx.lineWidth = 1;
          this.ctx.strokeRect(br.x, br.y, br.w, br.h);
        } else {
          this.ctx.fillStyle = br.color;
          this.ctx.fillRect(br.x, br.y, br.w, br.h);

          this.ctx.strokeStyle = 'rgba(255,255,255,0.35)';
          this.ctx.lineWidth = 1;
          this.ctx.strokeRect(br.x, br.y, br.w, br.h);

          if (br.powerup) {
            this.ctx.fillStyle = '#ffffff';
            this.ctx.fillRect(br.x + br.w / 2 - 1.5, br.y + br.h / 2 - 1.5, 3, 3);
          }
        }
      }

      for (let i = 0; i < this.powerups.length; i++) {
        const p = this.powerups[i];
        let col = '#00e5ff';
        if (p.type === '3X') col = '#9d00ff';
        if (p.type === '4X') col = '#ff00aa';
        if (p.type === '5X') col = '#ffea00';

        this.ctx.fillStyle = col;
        this.ctx.beginPath();
        this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 8px sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText(p.type, p.x, p.y);
      }

      for (let i = 0; i < this.particles.length; i++) {
        const pt = this.particles[i];
        this.ctx.fillStyle = pt.color;
        this.ctx.fillRect(pt.x, pt.y, 2, 2);
      }

      this.ctx.fillStyle = '#ff6600';
      this.ctx.beginPath();
      this.ctx.roundRect(this.paddle.x, this.paddle.y, this.paddle.w, this.paddle.h, 6);
      this.ctx.fill();

      this.ctx.fillStyle = '#ffffbb';
      this.ctx.fillRect(this.paddle.x + this.paddle.w * 0.25, this.paddle.y + 2.5, this.paddle.w * 0.5, 2);

      this.ctx.fillStyle = '#ffffff';
      for (let i = 0; i < this.balls.length; i++) {
        const b = this.balls[i];
        this.ctx.beginPath();
        this.ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        this.ctx.fill();
      }
    }

    this.ctx.restore();
  }

  loop() {
    this.update();
    this.render();
    requestAnimationFrame(this.loop);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  new MultaniGame();
});
</script>
