<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MULTANI BRICK BREAKER 100</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #050508;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
  }
  #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 500px;
    margin: 0 auto;
    background: #000;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Top Dashboard */
  #header {
    height: 72px;
    background: #080811;
    border-bottom: 2px solid #ff007f;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 10px;
    z-index: 10;
  }
  .title-box {
    display: flex;
    flex-direction: column;
  }
  .title-main {
    font-size: 13px;
    font-weight: 900;
    color: #ff007f;
    letter-spacing: 1px;
    line-height: 1.1;
    text-shadow: 0 0 8px rgba(255,0,127,0.7);
  }
  .title-sub {
    font-size: 9px;
    color: #00e5ff;
    letter-spacing: 1px;
    font-weight: bold;
  }
  .stat-group {
    display: flex;
    gap: 8px;
    text-align: center;
  }
  .stat-box {
    display: flex;
    flex-direction: column;
  }
  .stat-label {
    font-size: 8px;
    color: #8888aa;
    font-weight: bold;
  }
  .stat-val {
    font-size: 13px;
    font-weight: 900;
  }
  .val-lvl { color: #fff; }
  .val-score { color: #ffcc00; }
  .val-balls { color: #00e5ff; }
  .val-lives { color: #ff0055; letter-spacing: 1px; font-size: 11px; }

  .header-actions {
    display: flex;
    gap: 4px;
  }
  .btn-hdr {
    background: #0d1b2a;
    border: 1px solid #00e5ff;
    color: #00e5ff;
    border-radius: 4px;
    padding: 5px 7px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-hdr:active {
    background: #00e5ff;
    color: #000;
  }

  /* Canvas Area */
  #canvas-wrapper {
    position: relative;
    flex: 1;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Overlays */
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 70px;
    z-index: 50;
    pointer-events: auto;
  }
  #win-screen {
    background: transparent;
  }
  .win-card {
    background: rgba(8, 8, 20, 0.85);
    border: 2px solid #00e5ff;
    box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
    border-radius: 12px;
    padding: 18px 24px;
    text-align: center;
    margin-bottom: 20px;
    backdrop-filter: blur(4px);
  }
  .win-card h2 {
    color: #39ff14;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 0 10px #39ff14;
  }
  .win-card p {
    font-size: 14px;
    color: #ffcc00;
    font-weight: bold;
    margin-bottom: 4px;
  }

  .btn-huge {
    width: 82%;
    padding: 16px 0;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #000;
    background: linear-gradient(90deg, #ff007f, #ffaa00);
    border: none;
    border-radius: 35px;
    box-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
    cursor: pointer;
    text-transform: uppercase;
    animation: pulseBtn 1.2s infinite alternate;
  }
  @keyframes pulseBtn {
    0% { transform: scale(0.97); }
    100% { transform: scale(1.03); }
  }

  #gameover-screen {
    background: rgba(0, 0, 0, 0.88);
    justify-content: center;
    padding-bottom: 0;
  }
  #gameover-screen h1 {
    font-size: 34px;
    color: #ff0044;
    font-weight: 900;
    text-shadow: 0 0 15px #ff0044;
    margin-bottom: 15px;
  }

  /* Level Selection Modal */
  #level-modal {
    position: absolute;
    inset: 0;
    background: rgba(5,5,10,0.96);
    z-index: 100;
    display: none;
    flex-direction: column;
    padding: 15px;
  }
  #level-modal header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  #level-modal h3 {
    color: #00e5ff;
    font-size: 18px;
  }
  .grid-levels {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding-bottom: 20px;
  }
  .lvl-btn {
    aspect-ratio: 1;
    background: #111422;
    border: 1px solid #333a56;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
  }
  .lvl-btn.unlocked {
    border-color: #ff007f;
    color: #00e5ff;
  }
  .lvl-btn.active {
    background: #ff007f;
    color: #fff;
  }
  .lvl-btn.locked {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* Start instructions hint */
  #tap-hint {
    position: absolute;
    bottom: 240px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 13px;
    letter-spacing: 1px;
    font-weight: bold;
    background: rgba(0,0,0,0.6);
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px dashed #00e5ff;
    pointer-events: none;
    animation: blinkHint 1s infinite alternate;
  }
  @keyframes blinkHint {
    0% { opacity: 0.3; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>
<div id="game-container">
  <!-- Top Arcade Dashboard -->
  <header id="header">
    <div class="title-box">
      <div class="title-main">MULTANI</div>
      <div class="title-main" style="color:#fff;">BRICK BREAKER</div>
      <div class="title-sub">100 FORTS</div>
    </div>
    <div class="stat-group">
      <div class="stat-box">
        <span class="stat-label">LVL</span>
        <span class="stat-val val-lvl" id="disp-lvl">1</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">SCORE</span>
        <span class="stat-val val-score" id="disp-score">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">BALLS</span>
        <span class="stat-val val-balls" id="disp-balls">1</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">LIVES</span>
        <span class="stat-val val-lives" id="disp-lives">❤️❤️❤️</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-hdr" id="btn-sfx">SFX: ON</button>
      <button class="btn-hdr" id="btn-lvls">LVLS</button>
      <button class="btn-hdr" id="btn-pause">⏸</button>
    </div>
  </header>

  <!-- Gameplay Canvas -->
  <div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div id="tap-hint">TAP TO LAUNCH BALL</div>

    <!-- Win Screen: Background photo clearly visible + Next Level button below -->
    <div class="overlay" id="win-screen">
      <div class="win-card">
        <h2>LEVEL CLEAR!</h2>
        <p id="win-score-txt">SCORE: 2500</p>
        <span style="font-size:12px; color:#aaa;">Photo Unlocked</span>
      </div>
      <button class="btn-huge" id="btn-next">NEXT LEVEL</button>
    </div>

    <!-- Game Over Screen -->
    <div class="overlay" id="gameover-screen">
      <h1>GAME OVER</h1>
      <p style="color:#aaa; margin-bottom:20px; font-size:15px;">Target missed. Try again!</p>
      <button class="btn-huge" id="btn-retry" style="background:#ff0055; color:#fff;">RESTART LEVEL</button>
    </div>

    <!-- Level Selection Grid -->
    <div id="level-modal">
      <header>
        <h3>SELECT LEVEL (1 - 100)</h3>
        <button class="btn-hdr" id="btn-close-lvl" style="padding:6px 14px;">✕</button>
      </header>
      <div class="grid-levels" id="grid-levels"></div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   AUDIO SYNTHESIZER (No outside MP3 needed)
   ========================================================================== */
class SoundSys {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playTone(freq, type, duration, endFreq) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      if (endFreq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(10, endFreq), this.ctx.currentTime + duration);
      }
      gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }
  hitPaddle() { this.playTone(320, 'square', 0.08, 480); }
  hitBrick() { this.playTone(550, 'sine', 0.06, 200); }
  powerup() {
    this.playTone(300, 'triangle', 0.25, 900);
  }
  win() {
    [400, 520, 660, 880].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sine', 0.2, f * 1.2), i * 110);
    });
  }
  over() {
    [320, 260, 200, 140].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sawtooth', 0.18, f * 0.7), i * 100);
    });
  }
}

/* ==========================================================================
   BACKGROUND PHOTO MANAGER (Photos load behind bricks)
   ========================================================================== */
const photoUrls = [
  // Curated high quality neon sci-fi / arcade portrait backgrounds
  "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=600&auto=format&fit=crop&q=80",
  "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop&q=80",
  "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=600&auto=format&fit=crop&q=80",
  "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=600&auto=format&fit=crop&q=80",
  "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600&auto=format&fit=crop&q=80",
  "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600&auto=format&fit=crop&q=80",
  "https://images.unsplash.com/photo-1563089145-599997674d42?w=600&auto=format&fit=crop&q=80"
];

const bgImages = {};
function preloadPhoto(level) {
  const url = photoUrls[(level - 1) % photoUrls.length];
  if (!bgImages[url]) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = url;
    bgImages[url] = img;
  }
  return bgImages[url];
}

/* ==========================================================================
   MAIN GAME CLASS
   ========================================================================== */
class MultaniGame {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.snd = new SoundSys();

    // DOM Elements
    this.dispLvl = document.getElementById('disp-lvl');
    this.dispScore = document.getElementById('disp-score');
    this.dispBalls = document.getElementById('disp-balls');
    this.dispLives = document.getElementById('disp-lives');
    this.btnSfx = document.getElementById('btn-sfx');
    this.btnLvls = document.getElementById('btn-lvls');
    this.btnPause = document.getElementById('btn-pause');
    this.winScreen = document.getElementById('win-screen');
    this.gameoverScreen = document.getElementById('gameover-screen');
    this.levelModal = document.getElementById('level-modal');
    this.gridLevels = document.getElementById('grid-levels');
    this.btnNext = document.getElementById('btn-next');
    this.btnRetry = document.getElementById('btn-retry');
    this.btnCloseLvl = document.getElementById('btn-close-lvl');
    this.tapHint = document.getElementById('tap-hint');

    // Virtual Game Coordinates
    this.width = 400;
    this.height = 700;

    // Progress
    this.level = parseInt(localStorage.getItem('multani_unlocked_level') || '1');
    this.currentLevel = this.level;
    this.score = 0;
    this.lives = 3;

    // Game Objects
    this.paddle = {
      w: 88,
      h: 15,
      x: 156,
      // PADDLE KO BAHUT UPAR POSITION KIYA GAYA HAI TA-KI BOTTOM BAR MEIN NA CHUPE
      y: this.height - 135,
      targetX: 156,
      speed: 16
    };

    this.balls = [];
    this.bricks = [];
    this.powerups = [];
    this.particles = [];

    this.state = 'WAIT_LAUNCH'; // 'WAIT_LAUNCH', 'PLAYING', 'WIN', 'GAMEOVER', 'PAUSED'
    this.maxBalls = 250; // Performance safety ceiling

    this.initEvents();
    this.resize();
    window.addEventListener('resize', () => this.resize());

    this.loadLevel(this.currentLevel);
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }

  resize() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    this.canvas.width = rect.width * (window.devicePixelRatio || 1);
    this.canvas.height = rect.height * (window.devicePixelRatio || 1);
    this.scaleX = this.canvas.width / this.width;
    this.scaleY = this.canvas.height / this.height;
  }

  initEvents() {
    // Touch & Mouse input
    const handleMove = (clientX) => {
      const rect = this.canvas.getBoundingClientRect();
      const canvasX = (clientX - rect.left) * (this.width / rect.width);
      this.paddle.targetX = Math.max(10, Math.min(this.width - this.paddle.w - 10, canvasX - this.paddle.w / 2));
    };

    const handlePointerStart = (clientX) => {
      this.snd.init();
      if (this.state === 'WAIT_LAUNCH') {
        this.launchBall();
      } else {
        handleMove(clientX);
      }
    };

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handleMove(e.touches[0].clientX);
    }, { passive: false });

    window.addEventListener('touchstart', (e) => {
      if (e.target === this.canvas && e.touches.length > 0) {
        handlePointerStart(e.touches[0].clientX);
      }
    }, { passive: false });

    window.addEventListener('mousemove', (e) => handleMove(e.clientX));
    this.canvas.addEventListener('mousedown', (e) => handlePointerStart(e.clientX));

    // Dashboard Buttons
    this.btnSfx.addEventListener('click', () => {
      this.snd.enabled = !this.snd.enabled;
      this.btnSfx.textContent = this.snd.enabled ? 'SFX: ON' : 'SFX: OFF';
    });

    this.btnPause.addEventListener('click', () => {
      if (this.state === 'PLAYING') {
        this.state = 'PAUSED';
        this.btnPause.textContent = '▶';
      } else if (this.state === 'PAUSED') {
        this.state = 'PLAYING';
        this.btnPause.textContent = '⏸';
      }
    });

    this.btnLvls.addEventListener('click', () => this.showLevelModal());
    this.btnCloseLvl.addEventListener('click', () => this.levelModal.style.display = 'none');

    this.btnNext.addEventListener('click', () => {
      this.winScreen.style.display = 'none';
      this.currentLevel++;
      if (this.currentLevel > 100) this.currentLevel = 1;
      this.saveProgress();
      this.loadLevel(this.currentLevel);
    });

    this.btnRetry.addEventListener('click', () => {
      this.gameoverScreen.style.display = 'none';
      this.lives = 3;
      this.loadLevel(this.currentLevel);
    });
  }

  saveProgress() {
    const unlocked = Math.max(this.level, this.currentLevel);
    this.level = unlocked;
    localStorage.setItem('multani_unlocked_level', unlocked);
  }

  showLevelModal() {
    this.gridLevels.innerHTML = '';
    for (let i = 1; i <= 100; i++) {
      const b = document.createElement('button');
      b.className = 'lvl-btn';
      b.textContent = i;
      if (i <= this.level) {
        b.classList.add('unlocked');
        if (i === this.currentLevel) b.classList.add('active');
        b.addEventListener('click', () => {
          this.currentLevel = i;
          this.levelModal.style.display = 'none';
          this.winScreen.style.display = 'none';
          this.gameoverScreen.style.display = 'none';
          this.loadLevel(i);
        });
      } else {
        b.classList.add('locked');
      }
      this.gridLevels.appendChild(b);
    }
    this.levelModal.style.display = 'flex';
  }

  /* ---------------------------------------------------------
     LEVEL GENERATOR (100 Unique Patterns)
     --------------------------------------------------------- */
  loadLevel(lvl) {
    this.currentLevel = lvl;
    this.bricks = [];
    this.powerups = [];
    this.particles = [];
    this.balls = [];
    this.state = 'WAIT_LAUNCH';
    this.tapHint.style.display = 'block';
    this.winScreen.style.display = 'none';
    this.gameoverScreen.style.display = 'none';

    // Preload background photo for this level
    preloadPhoto(lvl);

    // Paddle size adjustment for difficulty
    this.paddle.w = Math.max(55, 90 - Math.floor(lvl * 0.35));
    this.paddle.x = (this.width - this.paddle.w) / 2;
    this.paddle.targetX = this.paddle.x;

    this.resetBallToPaddle();

    const cols = 10;
    const rows = 14;
    const brickW = 34;
    const brickH = 14;
    const offsetX = 30;
    const offsetY = 50;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let active = false;
        let hp = 1;
        let isSteel = false;

        // Custom mathematical and geometric patterns per level
        const pat = (lvl - 1) % 15;
        if (pat === 0) active = r >= 2 && r <= 7 && c >= 1 && c <= 8; // Square
        else if (pat === 1) active = Math.abs(c - 4.5) + Math.abs(r - 5) <= 4.5; // Diamond
        else if (pat === 2) active = r >= 2 && Math.abs(c - 4.5) <= (r - 1.5); // Triangle
        else if (pat === 3) active = (r + c) % 2 === 0 && r >= 2 && r <= 9; // Checker / Zigzag
        else if (pat === 4) { // Heart
          active = (r === 2 && (c === 2 || c === 3 || c === 6 || c === 7)) ||
                   (r === 3 && (c >= 1 && c <= 8)) ||
                   (r >= 4 && r <= 7 && Math.abs(c - 4.5) <= (7.5 - r));
        }
        else if (pat === 5) active = (r === 2 || r === 9 || c === 1 || c === 8 || (r === 5 && c >= 3 && c <= 6)); // Spiral / Maze
        else if (pat === 6) active = (c === 1 || c === 2 || c === 7 || c === 8) && r >= 2 && r <= 10; // Twin Pillars
        else if (pat === 7) active = (r === 2 || r === 4 || r === 6 || r === 8) && c >= 1 && c <= 8; // Horizontal Bars
        else if (pat === 8) active = (c === 2 || c === 4 || c === 6 || c === 8) && r >= 2 && r <= 9; // Vertical Strips
        else if (pat === 9) active = (r >= 2 && r <= 8) && (c >= 1 && c <= 8) && (r + c) % 3 !== 0; // Crosshatch
        else if (pat === 10) active = Math.hypot(c - 4.5, r - 5.5) <= 3.8 && Math.hypot(c - 4.5, r - 5.5) >= 1.5; // Ring
        else if (pat === 11) active = (r <= 6 && (c <= 3 || c >= 6)) || (r > 6 && c >= 3 && c <= 6); // Hourglass
        else if (pat === 12) active = ((c + r * 2) % 4 === 0) && r >= 2 && r <= 9; // Staggered
        else if (pat === 13) active = (r >= 3 && r <= 8 && c >= 2 && c <= 7) && !(r >= 5 && r <= 6 && c >= 4 && c <= 5); // Window
        else active = ((c * r + lvl) % 3 !== 0) && r >= 2 && r <= 8; // Alien fortress

        // Boss Levels & Unbreakables
        if (lvl % 10 === 0 && r === 2 && (c === 4 || c === 5)) {
          isSteel = true;
          active = true;
        }

        if (active) {
          // Brick durability scales with level
          if (lvl > 15 && Math.random() < 0.25) hp = 2;
          if (lvl > 45 && Math.random() < 0.2) hp = 3;

          // Powerup probability (2X, 3X, 4X, 5X)
          let pType = null;
          const pRoll = Math.random();
          if (pRoll < 0.12) pType = '2X';
          else if (pRoll < 0.19) pType = '3X';
          else if (pRoll < 0.23) pType = '4X';
          else if (pRoll < 0.25) pType = '5X';

          // Color palette based on screenshot (pink, cyan, orange)
          let color = '#ff007f';
          if ((r + c) % 3 === 0) color = '#00e5ff';
          if ((r + c) % 4 === 0) color = '#ff9900';

          this.bricks.push({
            x: offsetX + c * (brickW + 2),
            y: offsetY + r * (brickH + 2),
            w: brickW,
            h: brickH,
            hp: hp,
            maxHp: hp,
            color: isSteel ? '#444d66' : color,
            isSteel: isSteel,
            powerup: pType
          });
        }
      }
    }

    this.updateHUD();
  }

  resetBallToPaddle() {
    this.balls = [{
      x: this.paddle.x + this.paddle.w / 2,
      y: this.paddle.y - 8,
      vx: 0,
      vy: 0,
      radius: 6,
      speed: 4.8 + Math.min(3, this.currentLevel * 0.05),
      active: true
    }];
  }

  launchBall() {
    if (this.state !== 'WAIT_LAUNCH') return;
    this.state = 'PLAYING';
    this.tapHint.style.display = 'none';
    const angle = -Math.PI / 2 + (Math.random() * 0.6 - 0.3);
    const spd = this.balls[0].speed;
    this.balls[0].vx = Math.cos(angle) * spd;
    this.balls[0].vy = Math.sin(angle) * spd;
  }

  multiplyBalls(factor) {
    if (this.balls.length >= this.maxBalls) return;
    const currentList = [...this.balls];
    const totalToMake = Math.min(this.maxBalls, currentList.length * factor);
    const need = totalToMake - currentList.length;

    let added = 0;
    for (let i = 0; added < need && i < currentList.length; i++) {
      const src = currentList[i];
      for (let k = 1; k < factor && added < need; k++) {
        const spreadAngle = (Math.random() - 0.5) * 1.6;
        const currentAngle = Math.atan2(src.vy, src.vx) || -Math.PI / 2;
        const newAngle = currentAngle + spreadAngle;
        const spd = Math.hypot(src.vx, src.vy) || 5;

        this.balls.push({
          x: src.x,
          y: src.y,
          vx: Math.cos(newAngle) * spd,
          vy: Math.sin(newAngle) * spd,
          radius: 5,
          speed: spd,
          active: true
        });
        added++;
      }
    }
    this.updateHUD();
  }

  createExplosion(x, y, color) {
    for (let i = 0; i < 8; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = Math.random() * 3 + 1;
      this.particles.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1,
        color: color
      });
    }
  }

  updateHUD() {
    this.dispLvl.textContent = this.currentLevel;
    this.dispScore.textContent = this.score;
    this.dispBalls.textContent = this.balls.length;
    this.dispLives.textContent = '❤️'.repeat(Math.max(0, this.lives));
  }

  update() {
    if (this.state !== 'PLAYING') return;

    // Smooth paddle tracking
    this.paddle.x += (this.paddle.targetX - this.paddle.x) * 0.35;

    // Update Powerups
    for (let i = this.powerups.length - 1; i >= 0; i--) {
      const p = this.powerups[i];
      p.y += p.speed;

      // Check catch by paddle
      if (
        p.y + p.r >= this.paddle.y &&
        p.y - p.r <= this.paddle.y + this.paddle.h &&
        p.x >= this.paddle.x &&
        p.x <= this.paddle.x + this.paddle.w
      ) {
        this.snd.powerup();
        const factor = parseInt(p.type[0]) || 2;
        this.multiplyBalls(factor);
        this.powerups.splice(i, 1);
        continue;
      }
      if (p.y > this.height) {
        this.powerups.splice(i, 1);
      }
    }

    // Update Particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life -= 0.04;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }

    // Update Balls & Collisions
    let aliveBalls = 0;
    const subSteps = 2; // Continuous collision precision

    for (let step = 0; step < subSteps; step++) {
      for (let i = 0; i < this.balls.length; i++) {
        const b = this.balls[i];
        if (!b.active) continue;

        b.x += b.vx / subSteps;
        b.y += b.vy / subSteps;

        // Walls
        if (b.x - b.radius <= 4) {
          b.x = 4 + b.radius;
          b.vx = Math.abs(b.vx);
        } else if (b.x + b.radius >= this.width - 4) {
          b.x = this.width - 4 - b.radius;
          b.vx = -Math.abs(b.vx);
        }
        if (b.y - b.radius <= 4) {
          b.y = 4 + b.radius;
          b.vy = Math.abs(b.vy);
        }

        // Paddle Collision (Paddle upar hone ki wajah se yahan bounce hoga)
        if (
          b.vy > 0 &&
          b.y + b.radius >= this.paddle.y &&
          b.y - b.radius <= this.paddle.y + this.paddle.h &&
          b.x >= this.paddle.x - 4 &&
          b.x <= this.paddle.x + this.paddle.w + 4
        ) {
          b.y = this.paddle.y - b.radius;
          const hitPos = (b.x - (this.paddle.x + this.paddle.w / 2)) / (this.paddle.w / 2);
          const maxBounceAngle = Math.PI * 0.42;
          const bounceAngle = hitPos * maxBounceAngle - Math.PI / 2;
          const spd = Math.hypot(b.vx, b.vy);
          b.vx = Math.cos(bounceAngle) * spd;
          b.vy = Math.sin(bounceAngle) * spd;
          this.snd.hitPaddle();
        }

        // Brick Collision
        for (let j = 0; j < this.bricks.length; j++) {
          const br = this.bricks[j];
          if (
            b.x + b.radius > br.x &&
            b.x - b.radius < br.x + br.w &&
            b.y + b.radius > br.y &&
            b.y - b.radius < br.y + br.h
          ) {
            // Find collision side
            const prevX = b.x - b.vx / subSteps;
            const prevY = b.y - b.vy / subSteps;

            if (prevX <= br.x || prevX >= br.x + br.w) {
              b.vx = -b.vx;
            } else {
              b.vy = -b.vy;
            }

            if (!br.isSteel) {
              br.hp--;
              this.score += 10;
              this.createExplosion(b.x, b.y, br.color);
              this.snd.hitBrick();

              if (br.hp <= 0) {
                // Drop powerup
                if (br.powerup) {
                  this.powerups.push({
                    x: br.x + br.w / 2,
                    y: br.y + br.h / 2,
                    type: br.powerup,
                    r: 12,
                    speed: 2.2
                  });
                }
                this.bricks.splice(j, 1);
                j--;
              }
            } else {
              this.snd.hitPaddle();
            }
            break;
          }
        }

        // Bottom Boundary check (Ball Lost)
        if (b.y > this.height + 20) {
          b.active = false;
        } else {
          aliveBalls++;
        }
      }
    }

    // Clean up inactive balls
    this.balls = this.balls.filter(b => b.active);
    this.dispBalls.textContent = this.balls.length;

    // Check Level Complete (All breakable bricks cleared)
    const remainingBreakable = this.bricks.filter(b => !b.isSteel).length;
    if (remainingBreakable === 0) {
      this.handleLevelWin();
      return;
    }

    // Check All Balls Lost
    if (this.balls.length === 0) {
      this.lives--;
      this.updateHUD();
      if (this.lives <= 0) {
        this.state = 'GAMEOVER';
        this.snd.over();
        this.gameoverScreen.style.display = 'flex';
      } else {
        this.state = 'WAIT_LAUNCH';
        this.tapHint.style.display = 'block';
        this.resetBallToPaddle();
      }
    }
  }

  handleLevelWin() {
    this.state = 'WIN';
    this.snd.win();
    this.saveProgress();
    // Bricks saaf taaki background photo clear dikhe
    this.bricks = [];
    this.powerups = [];
    this.balls = [];
    document.getElementById('win-score-txt').textContent = `FINAL SCORE: ${this.score}`;
    this.winScreen.style.display = 'flex';
  }

  render() {
    this.ctx.save();
    this.ctx.scale(this.scaleX, this.scaleY);

    // 1. Draw Background Photo (Clearly visible & dimmed during play, 100% visible on clear)
    const currentImg = preloadPhoto(this.currentLevel);
    if (currentImg && currentImg.complete && currentImg.naturalWidth !== 0) {
      this.ctx.drawImage(currentImg, 0, 0, this.width, this.height);
      // Agar khel rahe hain to thoda dark tint takay bricks dikhein, level win par full clean clear
      if (this.state !== 'WIN') {
        this.ctx.fillStyle = 'rgba(5, 5, 12, 0.72)';
        this.ctx.fillRect(0, 0, this.width, this.height);
      }
    } else {
      // Fallback sci-fi gradient
      const grad = this.ctx.createLinearGradient(0, 0, 0, this.height);
      grad.addColorStop(0, '#090a14');
      grad.addColorStop(1, '#020205');
      this.ctx.fillStyle = grad;
      this.ctx.fillRect(0, 0, this.width, this.height);
    }

    // 2. Neon Arena Borders
    this.ctx.strokeStyle = '#222744';
    this.ctx.lineWidth = 4;
    this.ctx.strokeRect(2, 2, this.width - 4, this.height - 4);

    // 3. Draw Bricks (agar win nahi hua)
    if (this.state !== 'WIN') {
      for (const br of this.bricks) {
        this.ctx.fillStyle = br.color;
        this.ctx.shadowColor = br.color;
        this.ctx.shadowBlur = br.isSteel ? 0 : 8;
        this.ctx.fillRect(br.x, br.y, br.w, br.h);

        // Brick inner border / bevel
        this.ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        this.ctx.lineWidth = 1;
        this.ctx.strokeRect(br.x, br.y, br.w, br.h);

        // Power-up indicator dot
        if (br.powerup) {
          this.ctx.fillStyle = '#fff';
          this.ctx.beginPath();
          this.ctx.arc(br.x + br.w / 2, br.y + br.h / 2, 2.5, 0, Math.PI * 2);
          this.ctx.fill();
        }
      }
      this.ctx.shadowBlur = 0;

      // 4. Draw Falling Powerup Spheres
      for (const p of this.powerups) {
        let col = '#00e5ff';
        if (p.type === '3X') col = '#b026ff';
        if (p.type === '4X') col = '#ff00aa';
        if (p.type === '5X') col = '#ffea00';

        this.ctx.save();
        this.ctx.shadowColor = col;
        this.ctx.shadowBlur = 12;
        this.ctx.fillStyle = col;
        this.ctx.beginPath();
        this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.fillStyle = '#000';
        this.ctx.font = 'bold 9px Arial';
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText(p.type, p.x, p.y);
        this.ctx.restore();
      }

      // 5. Particles
      for (const pt of this.particles) {
        this.ctx.fillStyle = pt.color;
        this.ctx.globalAlpha = Math.max(0, pt.life);
        this.ctx.fillRect(pt.x, pt.y, 3, 3);
      }
      this.ctx.globalAlpha = 1;

      // 6. Draw Paddle (Glowing Neon Orange, elevated)
      this.ctx.save();
      this.ctx.shadowColor = '#ff6600';
      this.ctx.shadowBlur = 15;
      this.ctx.fillStyle = '#ff6600';
      this.ctx.beginPath();
      this.ctx.roundRect(this.paddle.x, this.paddle.y, this.paddle.w, this.paddle.h, 7);
      this.ctx.fill();

      // Paddle center light accent
      this.ctx.fillStyle = '#ffffaa';
      this.ctx.fillRect(this.paddle.x + this.paddle.w * 0.25, this.paddle.y + 3, this.paddle.w * 0.5, 3);
      this.ctx.restore();

      // 7. Draw Balls (Glowing White)
      this.ctx.save();
      this.ctx.shadowColor = '#ffffff';
      this.ctx.shadowBlur = 10;
      this.ctx.fillStyle = '#ffffff';
      for (const b of this.balls) {
        this.ctx.beginPath();
        this.ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        this.ctx.fill();
      }
      this.ctx.restore();
    }

    this.ctx.restore();
  }

  loop() {
    this.update();
    this.render();
    requestAnimationFrame(this.loop);
  }
}

// Start game when DOM is loaded
window.addEventListener('DOMContentLoaded', () => {
  new MultaniGame();
});
</script>
