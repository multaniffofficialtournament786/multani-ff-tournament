<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MULTANI BRICK BREAKER 100 FORTS</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #030408;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: #000;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Top Arcade HUD Header */
  #header {
    height: 66px;
    background: #070712;
    border-bottom: 2px solid #ff007f;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 10px;
    z-index: 10;
  }
  .title-box {
    display: flex;
    flex-direction: column;
  }
  .title-main {
    font-size: 13px;
    font-weight: 900;
    color: #ff007f;
    letter-spacing: 0.5px;
    line-height: 1.1;
    text-shadow: 0 0 8px rgba(255,0,127,0.8);
  }
  .title-sub {
    font-size: 9px;
    color: #00e5ff;
    letter-spacing: 1px;
    font-weight: bold;
  }
  .stat-group {
    display: flex;
    gap: 8px;
    text-align: center;
  }
  .stat-box {
    display: flex;
    flex-direction: column;
  }
  .stat-label {
    font-size: 8px;
    color: #8fa0be;
    font-weight: 800;
  }
  .stat-val {
    font-size: 13px;
    font-weight: 900;
  }
  .val-lvl { color: #ffffff; }
  .val-score { color: #ffcc00; }
  .val-balls { color: #00e5ff; }
  .val-lives { color: #ff0055; font-size: 11px; letter-spacing: 1px; }

  .header-actions {
    display: flex;
    gap: 4px;
  }
  .btn-hdr {
    background: #0d162b;
    border: 1px solid #00e5ff;
    color: #00e5ff;
    border-radius: 5px;
    padding: 6px 8px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-hdr:active {
    background: #00e5ff;
    color: #000;
  }

  /* Landmark Name Pill */
  #landmark-pill {
    position: absolute;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.78);
    border: 1px solid #00e5ff;
    color: #fff;
    padding: 3px 14px;
    border-radius: 15px;
    font-size: 11px;
    font-weight: bold;
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    z-index: 5;
    pointer-events: none;
    white-space: nowrap;
  }

  /* Gameplay Canvas Wrapper */
  #canvas-wrapper {
    position: relative;
    flex: 1;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Level Complete Screen (Photo Visible, Clear Bricks) */
  #win-screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 50px;
    background: transparent;
    z-index: 50;
  }
  .win-card {
    background: rgba(5, 5, 15, 0.85);
    border: 2px solid #39ff14;
    box-shadow: 0 0 25px rgba(57, 255, 20, 0.5);
    border-radius: 14px;
    padding: 14px 26px;
    text-align: center;
    margin-bottom: 16px;
    backdrop-filter: blur(4px);
  }
  .win-card h2 {
    color: #39ff14;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1.5px;
  }
  .win-card p {
    font-size: 14px;
    color: #ffcc00;
    font-weight: bold;
    margin-top: 4px;
  }

  .btn-huge {
    width: 82%;
    padding: 16px 0;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #000;
    background: linear-gradient(90deg, #ff007f, #ffaa00);
    border: none;
    border-radius: 35px;
    box-shadow: 0 0 25px rgba(255, 0, 127, 0.9);
    cursor: pointer;
    text-transform: uppercase;
    animation: btnPulse 1.2s infinite alternate;
  }
  @keyframes btnPulse {
    0% { transform: scale(0.97); }
    100% { transform: scale(1.03); }
  }

  #gameover-screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.9);
    z-index: 60;
  }
  #gameover-screen h1 {
    font-size: 36px;
    color: #ff0044;
    font-weight: 900;
    text-shadow: 0 0 20px #ff0044;
    margin-bottom: 10px;
  }

  #level-modal {
    position: absolute;
    inset: 0;
    background: rgba(5, 7, 16, 0.98);
    z-index: 100;
    display: none;
    flex-direction: column;
    padding: 16px;
  }
  #level-modal header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  #level-modal h3 {
    color: #00e5ff;
    font-size: 17px;
  }
  .grid-levels {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding-bottom: 25px;
  }
  .lvl-btn {
    aspect-ratio: 1;
    background: #0d1222;
    border: 1px solid #28334e;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
  }
  .lvl-btn.unlocked {
    border-color: #ff007f;
    color: #00e5ff;
  }
  .lvl-btn.active {
    background: #ff007f;
    color: #fff;
  }
  .lvl-btn.locked {
    opacity: 0.3;
    cursor: not-allowed;
  }

  #tap-hint {
    position: absolute;
    bottom: 240px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 12px;
    letter-spacing: 1px;
    font-weight: bold;
    background: rgba(0, 0, 0, 0.7);
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px dashed #00e5ff;
    pointer-events: none;
    animation: blinkHint 1s infinite alternate;
  }
  @keyframes blinkHint {
    0% { opacity: 0.3; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>
<div id="game-container">
  <header id="header">
    <div class="title-box">
      <div class="title-main">MULTANI</div>
      <div class="title-main" style="color:#fff;">BRICK BREAKER</div>
      <div class="title-sub">100 FORTS</div>
    </div>
    <div class="stat-group">
      <div class="stat-box">
        <span class="stat-label">LVL</span>
        <span class="stat-val val-lvl" id="disp-lvl">1</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">SCORE</span>
        <span class="stat-val val-score" id="disp-score">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">BALLS</span>
        <span class="stat-val val-balls" id="disp-balls">1</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">LIVES</span>
        <span class="stat-val val-lives" id="disp-lives">❤️❤️❤️</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-hdr" id="btn-sfx">SFX: ON</button>
      <button class="btn-hdr" id="btn-lvls">LVLS</button>
      <button class="btn-hdr" id="btn-pause">⏸</button>
    </div>
  </header>

  <div id="canvas-wrapper">
    <div id="landmark-pill">Derawar Fort, Bahawalpur</div>
    <canvas id="gameCanvas"></canvas>
    <div id="tap-hint">TAP TO LAUNCH BALL</div>

    <div id="win-screen">
      <div class="win-card">
        <h2>FORT DESTROYED!</h2>
        <p id="win-score-txt">SCORE: 0</p>
        <span style="font-size:11px; color:#aaa;">Photo Fully Revealed</span>
      </div>
      <button class="btn-huge" id="btn-next">NEXT LEVEL</button>
    </div>

    <div id="gameover-screen">
      <h1>GAME OVER</h1>
      <p style="color:#aaa; margin-bottom:20px;">Fort defended by enemies!</p>
      <button class="btn-huge" id="btn-retry" style="background:#ff0055; color:#fff;">RESTART LEVEL</button>
    </div>

    <div id="level-modal">
      <header>
        <h3>SELECT FORT LEVEL (1 - 100)</h3>
        <button class="btn-hdr" id="btn-close-lvl" style="padding:6px 12px;">✕</button>
      </header>
      <div class="grid-levels" id="grid-levels"></div>
    </div>
  </div>
</div>

<script>
class SoundSys {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playTone(freq, type, duration, endFreq) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      if (endFreq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(10, endFreq), this.ctx.currentTime + duration);
      }
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }
  hitPaddle() { this.playTone(320, 'square', 0.08, 480); }
  hitBrick() { this.playTone(550, 'sine', 0.06, 220); }
  hitSteel() { this.playTone(180, 'square', 0.05, 110); }
  powerup() { this.playTone(320, 'triangle', 0.22, 950); }
  win() {
    [440, 554, 659, 880].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sine', 0.2, f * 1.2), i * 120);
    });
  }
  over() {
    [300, 240, 180, 120].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sawtooth', 0.16, f * 0.7), i * 90);
    });
  }
}

const photoData = [
  { name: "Derawar Fort, Bahawalpur", url: "https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=600&auto=format&fit=crop&q=80" },
  { name: "Minar-e-Pakistan, Lahore", url: "https://images.unsplash.com/photo-1590059390046-81534a6e87f7?w=600&auto=format&fit=crop&q=80" },
  { name: "Badshahi Mosque, Lahore", url: "https://images.unsplash.com/photo-1587974928442-77dc3e0dba72?w=600&auto=format&fit=crop&q=80" },
  { name: "Lahore Fort (Shahi Qila)", url: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=600&auto=format&fit=crop&q=80" },
  { name: "Rohtas Fort, Jhelum", url: "https://images.unsplash.com/photo-1563089145-599997674d42?w=600&auto=format&fit=crop&q=80" },
  { name: "Ranikot Fort, Sindh", url: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600&auto=format&fit=crop&q=80" },
  { name: "Tomb of Shah Rukn-e-Alam, Multan", url: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop&q=80" },
  { name: "Faisal Mosque, Islamabad", url: "https://images.unsplash.com/photo-1589182373726-e4f658ab50f0?w=600&auto=format&fit=crop&q=80" },
  { name: "Baltit Fort, Hunza Valley", url: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=600&auto=format&fit=crop&q=80" },
  { name: "Mohenjo-daro Ancient Citadel", url: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=600&auto=format&fit=crop&q=80" }
];

const imgCache = {};
function getPhoto(lvl) {
  const item = photoData[(lvl - 1) % photoData.length];
  if (!imgCache[item.url]) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = item.url;
    imgCache[item.url] = img;
  }
  return { item, img: imgCache[item.url] };
}

class MultaniGame {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.snd = new SoundSys();

    this.dispLvl = document.getElementById('disp-lvl');
    this.dispScore = document.getElementById('disp-score');
    this.dispBalls = document.getElementById('disp-balls');
    this.dispLives = document.getElementById('disp-lives');
    this.btnSfx = document.getElementById('btn-sfx');
    this.btnLvls = document.getElementById('btn-lvls');
    this.btnPause = document.getElementById('btn-pause');
    this.winScreen = document.getElementById('win-screen');
    this.gameoverScreen = document.getElementById('gameover-screen');
    this.levelModal = document.getElementById('level-modal');
    this.gridLevels = document.getElementById('grid-levels');
    this.btnNext = document.getElementById('btn-next');
    this.btnRetry = document.getElementById('btn-retry');
    this.btnCloseLvl = document.getElementById('btn-close-lvl');
    this.tapHint = document.getElementById('tap-hint');
    this.landmarkPill = document.getElementById('landmark-pill');

    this.width = 400;
    this.height = 700;

    this.level = parseInt(localStorage.getItem('multani_unlocked_level') || '1');
    this.currentLevel = this.level;
    this.score = 0;
    this.lives = 3;

    // Paddle elevated so it never gets covered by Android bottom navigation
    this.paddle = {
      w: 86,
      h: 15,
      x: 157,
      y: this.height - 135,
      targetX: 157
    };

    this.balls = [];
    this.bricks = [];
    this.powerups = [];
    this.particles = [];
    this.state = 'WAIT_LAUNCH';
    this.maxBalls = 250;

    this.initEvents();
    this.resize();
    window.addEventListener('resize', () => this.resize());

    this.loadLevel(this.currentLevel);
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }

  resize() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    this.canvas.width = rect.width * (window.devicePixelRatio || 1);
    this.canvas.height = rect.height * (window.devicePixelRatio || 1);
    this.scaleX = this.canvas.width / this.width;
    this.scaleY = this.canvas.height / this.height;
  }

  initEvents() {
    const handleMove = (clientX) => {
      const rect = this.canvas.getBoundingClientRect();
      const canvasX = (clientX - rect.left) * (this.width / rect.width);
      this.paddle.targetX = Math.max(8, Math.min(this.width - this.paddle.w - 8, canvasX - this.paddle.w / 2));
    };

    const handlePointerStart = (clientX) => {
      this.snd.init();
      if (this.state === 'WAIT_LAUNCH') {
        this.launchBall();
      } else {
        handleMove(clientX);
      }
    };

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handleMove(e.touches[0].clientX);
    }, { passive: false });

    window.addEventListener('touchstart', (e) => {
      if (e.target === this.canvas && e.touches.length > 0) {
        handlePointerStart(e.touches[0].clientX);
      }
    }, { passive: false });

    window.addEventListener('mousemove', (e) => handleMove(e.clientX));
    this.canvas.addEventListener('mousedown', (e) => handlePointerStart(e.clientX));

    this.btnSfx.addEventListener('click', () => {
      this.snd.enabled = !this.snd.enabled;
      this.btnSfx.textContent = this.snd.enabled ? 'SFX: ON' : 'SFX: OFF';
    });

    this.btnPause.addEventListener('click', () => {
      if (this.state === 'PLAYING') {
        this.state = 'PAUSED';
        this.btnPause.textContent = '▶';
      } else if (this.state === 'PAUSED') {
        this.state = 'PLAYING';
        this.btnPause.textContent = '⏸';
      }
    });

    this.btnLvls.addEventListener('click', () => this.showLevelModal());
    this.btnCloseLvl.addEventListener('click', () => this.levelModal.style.display = 'none');

    this.btnNext.addEventListener('click', () => {
      this.winScreen.style.display = 'none';
      this.currentLevel++;
      if (this.currentLevel > 100) this.currentLevel = 1;
      this.saveProgress();
      this.loadLevel(this.currentLevel);
    });

    this.btnRetry.addEventListener('click', () => {
      this.gameoverScreen.style.display = 'none';
      this.lives = 3;
      this.loadLevel(this.currentLevel);
    });
  }

  saveProgress() {
    const unlocked = Math.max(this.level, this.currentLevel);
    this.level = unlocked;
    localStorage.setItem('multani_unlocked_level', unlocked);
  }

  showLevelModal() {
    this.gridLevels.innerHTML = '';
    for (let i = 1; i <= 100; i++) {
      const b = document.createElement('button');
      b.className = 'lvl-btn';
      b.textContent = i;
      if (i <= this.level) {
        b.classList.add('unlocked');
        if (i === this.currentLevel) b.classList.add('active');
        b.addEventListener('click', () => {
          this.currentLevel = i;
          this.levelModal.style.display = 'none';
          this.winScreen.style.display = 'none';
          this.gameoverScreen.style.display = 'none';
          this.loadLevel(i);
        });
      } else {
        b.classList.add('locked');
      }
      this.gridLevels.appendChild(b);
    }
    this.levelModal.style.display = 'flex';
  }

  /* ---------------------------------------------------------
     HARD FORT & BORDER MAZE GENERATOR (100 Unique Forts)
     --------------------------------------------------------- */
  loadLevel(lvl) {
    this.currentLevel = lvl;
    this.bricks = [];
    this.powerups = [];
    this.particles = [];
    this.balls = [];
    this.state = 'WAIT_LAUNCH';
    this.tapHint.style.display = 'block';
    this.winScreen.style.display = 'none';
    this.gameoverScreen.style.display = 'none';

    const photoInfo = getPhoto(lvl);
    this.landmarkPill.textContent = photoInfo.item.name;

    this.paddle.w = Math.max(58, 88 - Math.floor(lvl * 0.3));
    this.paddle.x = (this.width - this.paddle.w) / 2;
    this.paddle.targetX = this.paddle.x;

    this.resetBallToPaddle();

    const cols = 18;
    const rows = 23;
    const brickW = 18;
    const brickH = 14;
    const offsetX = 22;
    const offsetY = 70;

    const fortType = (lvl - 1) % 10;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let isSteel = false;
        let isBreakable = false;

        // 1. OUTSIDE HARD FORTRESS BORDER (Always steel with tactical gates)
        const isBorder = (r === 0 || c === 0 || c === cols - 1 || r === rows - 1);
        if (isBorder) {
          // Bottom wall gates: different gate opening position per fort
          if (r === rows - 1) {
            if (fortType === 0 && (c >= 7 && c <= 10)) isSteel = false; // Middle gate
            else if (fortType === 1 && ((c >= 2 && c <= 4) || (c >= 13 && c <= 15))) isSteel = false; // Dual side gates
            else if (fortType === 2 && (c >= 8 && c <= 9)) isSteel = false; // Narrow tunnel
            else if (fortType === 3 && (c <= 4 || c >= 13)) isSteel = false; // Wide flanks
            else if (fortType === 4 && (c >= 5 && c <= 12)) isSteel = false; // Grand entrance
            else if (fortType >= 5 && (c >= 6 && c <= 11)) isSteel = false;
            else isSteel = true;
          } else {
            isSteel = true;
          }
        }

        // 2. INNER FORT WALLS & MAZES (10 completely different tough architectural layouts)
        if (!isSteel && !isBorder) {
          switch (fortType) {
            case 0: // Original Screenshot Fortress: 3 horizontal slit bars + 2 lower pillars
              if ((r === 4 || r === 7 || r === 10) && (c >= 2 && c <= 15 && c !== 8 && c !== 9)) {
                isSteel = true;
              } else if (r >= 14 && r <= 20 && (c === 5 || c === 12)) {
                isSteel = true; // Two vertical towers
              } else if (r >= 1 && r <= 13 && c >= 1 && c <= 16) {
                isBreakable = true;
              }
              break;

            case 1: // The Great Citadel: Center dividing column with dual reinforced vaults
              if (c === 8 && r >= 2 && r <= 15 && r !== 7) {
                isSteel = true; // Central divide
              } else if (r === 6 && ((c >= 1 && c <= 5) || (c >= 12 && c <= 16))) {
                isSteel = true;
              } else if (r === 12 && c >= 3 && c <= 14) {
                isSteel = true;
              } else if (r >= 1 && r <= 14 && c >= 1 && c <= 16) {
                isBreakable = true;
              }
              break;

            case 2: // Diamond Vault Bastion: Enclosed diamond steel core
              if ((Math.abs(c - 8.5) + Math.abs(r - 7)) === 4) {
                isSteel = true;
              } else if (r >= 2 && r <= 13 && c >= 2 && c <= 15) {
                isBreakable = true;
              }
              break;

            case 3: // Zigzag Trench Fort: Alternating steel defense corridors
              if (r === 4 && c <= 13) isSteel = true;
              else if (r === 8 && c >= 4) isSteel = true;
              else if (r === 12 && c <= 13) isSteel = true;
              else if (r >= 1 && r <= 14 && c >= 1 && c <= 16) isBreakable = true;
              break;

            case 4: // Twin Fortress Keeps: Two heavily fortified steel towers
              if ((c === 4 || c === 13) && r >= 3 && r <= 16 && r !== 9) {
                isSteel = true;
              } else if (r === 8 && (c <= 4 || c >= 13)) {
                isSteel = true;
              } else if (r >= 1 && r <= 14 && c >= 1 && c <= 16) {
                isBreakable = true;
              }
              break;

            case 5: // Four Quadrant Prison: 4 separate cells
              if (c === 8 && r >= 2 && r <= 14 && r !== 5 && r !== 11) isSteel = true;
              else if (r === 8 && c >= 2 && c <= 15 && c !== 4 && c !== 13) isSteel = true;
              else if (r >= 1 && r <= 14 && c >= 1 && c <= 16) isBreakable = true;
              break;

            case 6: // Funnel Canyon: Converging steel barriers leading to dense core
              if (r === 4 && (c <= 4 || c >= 13)) isSteel = true;
              else if (r === 7 && (c <= 6 || c >= 11)) isSteel = true;
              else if (r === 10 && (c <= 7 || c >= 10)) isSteel = true;
              else if (r >= 1 && r <= 14 && c >= 1 && c <= 16) isBreakable = true;
              break;

            case 7: // Honeycomb Fortress: Strategic steel barricades
              if ((r === 4 || r === 8 || r === 12) && (c % 3 === 0)) isSteel = true;
              else if (r >= 1 && r <= 14 && c >= 1 && c <= 16) isBreakable = true;
              break;

            case 8: // Concentric Ring Walls: Outer and inner ring
              if ((r === 3 || r === 12) && c >= 3 && c <= 14 && (c < 7 || c > 10)) isSteel = true;
              else if ((c === 3 || c === 14) && r >= 3 && r <= 12 && r !== 7) isSteel = true;
              else if (r >= 1 && r <= 14 && c >= 1 && c <= 16) isBreakable = true;
              break;

            case 9: // Milestone Boss Fortress: Armored Core
              if (r === 3 && c >= 5 && c <= 12) isSteel = true;
              else if (r === 6 && (c <= 5 || c >= 12)) isSteel = true;
              else if (r === 10 && c >= 4 && c <= 13 && c !== 8 && c !== 9) isSteel = true;
              else if (r >= 1 && r <= 14 && c >= 1 && c <= 16) isBreakable = true;
              break;
          }
        }

        // Push Bricks to Level
        if (isSteel) {
          this.bricks.push({
            x: offsetX + c * (brickW + 1),
            y: offsetY + r * (brickH + 1),
            w: brickW,
            h: brickH,
            isSteel: true,
            color: '#1a1f33' // Dark charcoal fort wall color
          });
        } else if (isBreakable) {
          let hp = 1;
          if (lvl > 15 && Math.random() < 0.25) hp = 2;
          if (lvl > 40 && Math.random() < 0.2) hp = 3;

          let pPower = null;
          const roll = Math.random();
          if (roll < 0.14) pPower = '2X';
          else if (roll < 0.20) pPower = '3X';
          else if (roll < 0.23) pPower = '4X';
          else if (roll < 0.25) pPower = '5X';

          // Dense Pink, Cyan, Orange stripes (from screenshot)
          let col = '#ff007f'; // Pink
          const stripe = (r + c + lvl) % 3;
          if (stripe === 1) col = '#00e5ff'; // Cyan
          else if (stripe === 2) col = '#ff9900'; // Orange

          this.bricks.push({
            x: offsetX + c * (brickW + 1),
            y: offsetY + r * (brickH + 1),
            w: brickW,
            h: brickH,
            hp: hp,
            maxHp: hp,
            isSteel: false,
            color: col,
            powerup: pPower
          });
        }
      }
    }

    this.updateHUD();
  }

  resetBallToPaddle() {
    this.balls = [{
      x: this.paddle.x + this.paddle.w / 2,
      y: this.paddle.y - 8,
      vx: 0,
      vy: 0,
      radius: 5.5,
      speed: 4.8 + Math.min(3, this.currentLevel * 0.05),
      active: true
    }];
  }

  launchBall() {
    if (this.state !== 'WAIT_LAUNCH') return;
    this.state = 'PLAYING';
    this.tapHint.style.display = 'none';
    const angle = -Math.PI / 2 + (Math.random() * 0.4 - 0.2);
    const spd = this.balls[0].speed;
    this.balls[0].vx = Math.cos(angle) * spd;
    this.balls[0].vy = Math.sin(angle) * spd;
  }

  multiplyBalls(factor) {
    if (this.balls.length >= this.maxBalls) return;
    const currentList = [...this.balls];
    const totalToMake = Math.min(this.maxBalls, currentList.length * factor);
    const need = totalToMake - currentList.length;

    let added = 0;
    for (let i = 0; added < need && i < currentList.length; i++) {
      const src = currentList[i];
      for (let k = 1; k < factor && added < need; k++) {
        const spreadAngle = (Math.random() - 0.5) * 1.6;
        const currentAngle = Math.atan2(src.vy, src.vx) || -Math.PI / 2;
        const newAngle = currentAngle + spreadAngle;
        const spd = Math.hypot(src.vx, src.vy) || 5;

        this.balls.push({
          x: src.x,
          y: src.y,
          vx: Math.cos(newAngle) * spd,
          vy: Math.sin(newAngle) * spd,
          radius: 5,
          speed: spd,
          active: true
        });
        added++;
      }
    }
    this.updateHUD();
  }

  createExplosion(x, y, color) {
    for (let i = 0; i < 6; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = Math.random() * 3 + 1;
      this.particles.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1,
        color: color
      });
    }
  }

  updateHUD() {
    this.dispLvl.textContent = this.currentLevel;
    this.dispScore.textContent = this.score;
    this.dispBalls.textContent = this.balls.length;
    this.dispLives.textContent = '❤️'.repeat(Math.max(0, this.lives));
  }

  update() {
    if (this.state !== 'PLAYING') return;

    this.paddle.x += (this.paddle.targetX - this.paddle.x) * 0.35;

    // Powerups falling
    for (let i = this.powerups.length - 1; i >= 0; i--) {
      const p = this.powerups[i];
      p.y += p.speed;

      if (
        p.y + p.r >= this.paddle.y &&
        p.y - p.r <= this.paddle.y + this.paddle.h &&
        p.x >= this.paddle.x &&
        p.x <= this.paddle.x + this.paddle.w
      ) {
        this.snd.powerup();
        const factor = parseInt(p.type[0]) || 2;
        this.multiplyBalls(factor);
        this.powerups.splice(i, 1);
        continue;
      }
      if (p.y > this.height) {
        this.powerups.splice(i, 1);
      }
    }

    // Particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life -= 0.04;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }

    // Sub-steps continuous physics
    const subSteps = 2;
    for (let step = 0; step < subSteps; step++) {
      for (let i = 0; i < this.balls.length; i++) {
        const b = this.balls[i];
        if (!b.active) continue;

        b.x += b.vx / subSteps;
        b.y += b.vy / subSteps;

        // Screen Boundary
        if (b.x - b.radius <= 4) {
          b.x = 4 + b.radius;
          b.vx = Math.abs(b.vx);
        } else if (b.x + b.radius >= this.width - 4) {
          b.x = this.width - 4 - b.radius;
          b.vx = -Math.abs(b.vx);
        }
        if (b.y - b.radius <= 4) {
          b.y = 4 + b.radius;
          b.vy = Math.abs(b.vy);
        }

        // Paddle Collision (At elevated position)
        if (
          b.vy > 0 &&
          b.y + b.radius >= this.paddle.y &&
          b.y - b.radius <= this.paddle.y + this.paddle.h &&
          b.x >= this.paddle.x - 4 &&
          b.x <= this.paddle.x + this.paddle.w + 4
        ) {
          b.y = this.paddle.y - b.radius;
          const hitPos = (b.x - (this.paddle.x + this.paddle.w / 2)) / (this.paddle.w / 2);
          const bounceAngle = hitPos * (Math.PI * 0.42) - Math.PI / 2;
          const spd = Math.hypot(b.vx, b.vy);
          b.vx = Math.cos(bounceAngle) * spd;
          b.vy = Math.sin(bounceAngle) * spd;
          this.snd.hitPaddle();
        }

        // Brick & Fort Wall Collision
        for (let j = 0; j < this.bricks.length; j++) {
          const br = this.bricks[j];
          if (
            b.x + b.radius > br.x &&
            b.x - b.radius < br.x + br.w &&
            b.y + b.radius > br.y &&
            b.y - b.radius < br.y + br.h
          ) {
            const prevX = b.x - b.vx / subSteps;
            if (prevX <= br.x || prevX >= br.x + br.w) {
              b.vx = -b.vx;
            } else {
              b.vy = -b.vy;
            }

            if (!br.isSteel) {
              br.hp--;
              this.score += 15;
              this.createExplosion(b.x, b.y, br.color);
              this.snd.hitBrick();

              if (br.hp <= 0) {
                if (br.powerup) {
                  this.powerups.push({
                    x: br.x + br.w / 2,
                    y: br.y + br.h / 2,
                    type: br.powerup,
                    r: 12,
                    speed: 2.2
                  });
                }
                this.bricks.splice(j, 1);
                j--;
              }
            } else {
              this.snd.hitSteel();
            }
            break;
          }
        }

        // Lost Ball
        if (b.y > this.height + 20) {
          b.active = false;
        }
      }
    }

    this.balls = this.balls.filter(b => b.active);
    this.dispBalls.textContent = this.balls.length;

    // Check Win (All breakables cleared)
    const remainingBreakable = this.bricks.filter(b => !b.isSteel).length;
    if (remainingBreakable === 0) {
      this.handleLevelWin();
      return;
    }

    // Check Lives Loss
    if (this.balls.length === 0) {
      this.lives--;
      this.updateHUD();
      if (this.lives <= 0) {
        this.state = 'GAMEOVER';
        this.snd.over();
        this.gameoverScreen.style.display = 'flex';
      } else {
        this.state = 'WAIT_LAUNCH';
        this.tapHint.style.display = 'block';
        this.resetBallToPaddle();
      }
    }
  }

  handleLevelWin() {
    this.state = 'WIN';
    this.snd.win();
    this.saveProgress();
    // Sab fort walls aur bricks clear taaki photo 100% crystal-clear dikhe
    this.bricks = [];
    this.powerups = [];
    this.balls = [];
    document.getElementById('win-score-txt').textContent = `FORT CLEARED! SCORE: ${this.score}`;
    this.winScreen.style.display = 'flex';
  }

  render() {
    this.ctx.save();
    this.ctx.scale(this.scaleX, this.scaleY);

    // 1. Background Image
    const photo = getPhoto(this.currentLevel);
    if (photo.img && photo.img.complete && photo.img.naturalWidth !== 0) {
      this.ctx.drawImage(photo.img, 0, 0, this.width, this.height);
      if (this.state !== 'WIN') {
        this.ctx.fillStyle = 'rgba(2, 3, 8, 0.82)';
        this.ctx.fillRect(0, 0, this.width, this.height);
      }
    } else {
      this.ctx.fillStyle = '#060711';
      this.ctx.fillRect(0, 0, this.width, this.height);
    }

    if (this.state !== 'WIN') {
      // 2. Draw Fort Border & Bricks
      for (const br of this.bricks) {
        if (br.isSteel) {
          this.ctx.fillStyle = '#1c2136';
          this.ctx.fillRect(br.x, br.y, br.w, br.h);
          this.ctx.strokeStyle = '#2d3756';
          this.ctx.lineWidth = 1;
          this.ctx.strokeRect(br.x, br.y, br.w, br.h);
        } else {
          this.ctx.fillStyle = br.color;
          this.ctx.shadowColor = br.color;
          this.ctx.shadowBlur = 6;
          this.ctx.fillRect(br.x, br.y, br.w, br.h);

          this.ctx.strokeStyle = 'rgba(255,255,255,0.4)';
          this.ctx.lineWidth = 1;
          this.ctx.strokeRect(br.x, br.y, br.w, br.h);

          if (br.powerup) {
            this.ctx.fillStyle = '#ffffff';
            this.ctx.beginPath();
            this.ctx.arc(br.x + br.w / 2, br.y + br.h / 2, 2.5, 0, Math.PI * 2);
            this.ctx.fill();
          }
        }
      }
      this.ctx.shadowBlur = 0;

      // 3. Powerups
      for (const p of this.powerups) {
        let col = '#00e5ff';
        if (p.type === '3X') col = '#9d00ff';
        if (p.type === '4X') col = '#ff00aa';
        if (p.type === '5X') col = '#ffea00';

        this.ctx.save();
        this.ctx.shadowColor = col;
        this.ctx.shadowBlur = 14;
        this.ctx.fillStyle = col;
        this.ctx.beginPath();
        this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 9px sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText(p.type, p.x, p.y);
        this.ctx.restore();
      }

      // 4. Particles
      for (const pt of this.particles) {
        this.ctx.fillStyle = pt.color;
        this.ctx.globalAlpha = Math.max(0, pt.life);
        this.ctx.fillRect(pt.x, pt.y, 3, 3);
      }
      this.ctx.globalAlpha = 1;

      // 5. Glowing Orange Paddle
      this.ctx.save();
      this.ctx.shadowColor = '#ff6600';
      this.ctx.shadowBlur = 16;
      this.ctx.fillStyle = '#ff6600';
      this.ctx.beginPath();
      this.ctx.roundRect(this.paddle.x, this.paddle.y, this.paddle.w, this.paddle.h, 7);
      this.ctx.fill();

      this.ctx.fillStyle = '#ffffbb';
      this.ctx.fillRect(this.paddle.x + this.paddle.w * 0.25, this.paddle.y + 3, this.paddle.w * 0.5, 2.5);
      this.ctx.restore();

      // 6. Glowing White Balls
      this.ctx.save();
      this.ctx.shadowColor = '#ffffff';
      this.ctx.shadowBlur = 8;
      this.ctx.fillStyle = '#ffffff';
      for (const b of this.balls) {
        this.ctx.beginPath();
        this.ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        this.ctx.fill();
      }
      this.ctx.restore();
    }

    this.ctx.restore();
  }

  loop() {
    this.update();
    this.render();
    requestAnimationFrame(this.loop);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  new MultaniGame();
});
</script>
