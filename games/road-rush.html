<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MULTANI FF AIR FORCE</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#050912;color:white;
 font-family:'Segoe UI', Roboto, Arial, sans-serif;touch-action:none;
}
#game{
 position:relative;width:100%;height:100%;
 height:100dvh;overflow:hidden;
 background:#071c35;
}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{
 position:absolute;top:env(safe-area-inset-top,10px);
 left:12px;right:12px;display:flex;
 justify-content:space-between;pointer-events:none;
 gap:10px;z-index:3;
}
.panel{
 min-width:115px;padding:8px 14px;
 background:rgba(8, 14, 25, 0.88);
 border:1.8px solid #283955;border-radius:12px;
 box-shadow:0 0 15px rgba(0, 186, 255, 0.25), inset 0 0 10px rgba(255, 255, 255, 0.08);
 backdrop-filter:blur(4px);
}
.panel small{
 display:block;color:#9cb5d9;font-size:10px;
 letter-spacing:2px;font-weight:bold;margin-bottom:3px
}
.panel strong{font-size:clamp(18px,4.5vw,26px);letter-spacing:1px}
#hpText{color:#32ffc0;text-shadow:0 0 10px #00ffab}
#scoreText{color:#ffc64c;text-shadow:0 0 10px #ff9a00}
#hpBar{
 height:5px;background:#182335;margin-top:5px;
 border-radius:5px;overflow:hidden
}
#hpFill{height:100%;width:100%;background:#32ffc0;transition:width 0.2s}
.brand{
 position:absolute;top:76px;left:0;right:0;
 text-align:center;pointer-events:none;
 color:rgba(255, 255, 255, 0.35);font-size:11px;letter-spacing:4px;
 font-weight:900
}

/* Controls layout: Left | FIRE (Center) | Right */
.controls{
 position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));
 left:0;right:0;display:flex;align-items:center;
 justify-content:space-between;padding:0 18px;z-index:4;
 pointer-events:none
}
.control-btn{
 pointer-events:auto;
 width:clamp(64px,18vw,86px);
 height:clamp(64px,18vw,86px);
 border-radius:50%;display:flex;align-items:center;
 justify-content:center;user-select:none;
 -webkit-user-select:none;touch-action:none;
 background:radial-gradient(circle at 35% 25%,#9aafc9,#28384f 55%,#101827 75%);
 border:4px solid #ff4d66;
 box-shadow:0 0 12px #ff415c,0 0 22px rgba(255, 48, 68, 0.4),
 inset 0 0 0 3px rgba(255,255,255,0.4);
 color:white;font-size:32px;font-weight:900;
 text-shadow:0 2px 6px #000;
 cursor:pointer;
 transition:transform 0.08s;
}
.control-btn:active{transform:scale(0.91);filter:brightness(1.3)}

#fire{
 pointer-events:auto;
 width:clamp(86px,24vw,112px);
 height:clamp(86px,24vw,112px);
 flex-direction:column;gap:2px;
 font-size:14px;font-weight:900;color:#ffdc72;
 border:5px solid #ffaa22;
 background:radial-gradient(circle at 35% 25%,#7a582c,#2a1d17 65%,#0d0f14);
 box-shadow:0 0 16px #ff9a1a,0 0 30px rgba(255, 141, 36, 0.55),
 inset 0 0 0 3px rgba(255,255,255,0.45);
 cursor:pointer;
}
#fire span{font-size:34px;line-height:1}
#fire:active{transform:scale(0.92);filter:brightness(1.35)}

#message{
 position:absolute;inset:0;z-index:10;
 display:flex;align-items:center;justify-content:center;
 background:rgba(2, 7, 19, 0.88);backdrop-filter:blur(6px);
 padding:20px;
}
.card{
 width:min(350px,100%);padding:25px 20px;
 border-radius:18px;text-align:center;
 background:linear-gradient(155deg,#131e33,#060b16);
 border:1.5px solid #ffaa22;
 box-shadow:0 0 35px rgba(255, 156, 36, 0.35);
}
.card h1{font-size:24px;color:#ffc14d;margin:0 0 10px;letter-spacing:1px}
.card p{color:#c2d0e6;line-height:1.6;font-size:13.5px}
.action{
 width:100%;padding:14px;margin-top:14px;
 border:0;border-radius:10px;font-weight:900;
 font-size:16px;color:#101018;cursor:pointer;
 background:linear-gradient(90deg,#ffd875,#ff922b);
 box-shadow:0 0 18px rgba(255, 174, 51, 0.4);
}
.hidden{display:none!important}
#pause{
 position:absolute;right:14px;top:84px;z-index:5;
 width:38px;height:38px;border-radius:50%;
 background:rgba(11, 20, 36, 0.85);border:1.5px solid #8ca9d5;
 color:white;font-size:16px;cursor:pointer;
}
</style>
</head>

<body>
<div id="game">
 <canvas id="screen"></canvas>

 <div class="hud">
  <div class="panel">
   <small>HULL / HP</small>
   <strong id="hpText">100%</strong>
   <div id="hpBar"><div id="hpFill"></div></div>
  </div>
  <div class="panel" style="text-align:right">
   <small>MISSION SCORE</small>
   <strong id="scoreText">0000</strong>
  </div>
 </div>

 <div class="brand">MULTANI FF • AIR FORCE</div>
 <button id="pause">Ⅱ</button>

 <!-- Left | FIRE (Center) | Right Layout -->
 <div class="controls">
  <button class="control-btn" id="left" aria-label="Move left">◀</button>
  <button class="control-btn" id="fire"><span>🔥</span>FIRE</button>
  <button class="control-btn" id="right" aria-label="Move right">▶</button>
 </div>

 <div id="message">
  <div class="card">
   <h1>✈ AIR FORCE BATTLE</h1>
   <p>MULTANI FF OFFICIAL<br>
   <b>ELITE FIGHTER JET MISSION</b><br><br>
   Dushman jets ko khatam karein.<br>
   Bayein/Dayein buttons se steer karein aur Center se FIRE karein.</p>
   <button class="action" id="start">START MISSION ▶</button>
  </div>
 </div>
</div>

<script>
(()=>{
"use strict";

const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let W=0,H=0,DPR=1;
let running=false,paused=false,gameOver=false;
let score=0,hp=100,last=0,elapsed=0,spawn=0,shot=0;
let enemies=[],bullets=[],sparks=[],clouds=[],islands=[];
const keys={left:false,right:false,fire:false};

// Precise Jet Dimension definition
const player={x:0,y:0,w:56,h:84,speed:360,inv:0};

// Built-in Web Audio API for VIP Laser and Blast SFX
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
let actx = null;

function playLaserSFX(){
 try{
  if(!actx) actx = new AudioContextClass();
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(750, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(140, actx.currentTime + 0.09);
  gain.gain.setValueAtTime(0.18, actx.currentTime);
  gain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.09);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + 0.09);
 }catch(e){}
}

function playBlastSFX(){
 try{
  if(!actx) actx = new AudioContextClass();
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(140, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(25, actx.currentTime + 0.25);
  gain.gain.setValueAtTime(0.3, actx.currentTime);
  gain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.25);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + 0.25);
 }catch(e){}
}

function resize(){
 DPR=Math.min(window.devicePixelRatio||1,1.5);
 W=canvas.clientWidth;H=canvas.clientHeight;
 canvas.width=Math.round(W*DPR);
 canvas.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 player.x=Math.max(30,Math.min(W-30,player.x||W/2));
 player.y=H*0.74;

 if(!clouds.length){
  for(let i=0;i<12;i++){
   clouds.push({
    x:Math.random()*W,y:Math.random()*H,
    s:35+Math.random()*70,v:18+Math.random()*35
   });
  }
  for(let i=0;i<4;i++){
   islands.push({
    x:W*(0.2+i*0.25)+(Math.random()-0.5)*40,
    y:i*(H/3.5),
    rx:45+Math.random()*30,
    ry:35+Math.random()*20,
    v:22
   });
  }
 }
}
window.addEventListener("resize",resize);
resize();

// High Quality Jet Visuals
function drawFighterJet(x,y,w,h,isEnemy=false){
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(w/60,h/84);
 if(isEnemy) ctx.rotate(Math.PI);

 // Double Jet Engine Afterburners
 const flameHeight = 16 + Math.random()*16;
 const flameGrad = ctx.createLinearGradient(0,34,0,34+flameHeight);
 flameGrad.addColorStop(0,"#ffffff");
 flameGrad.addColorStop(0.3,"#ffaa00");
 flameGrad.addColorStop(1,"rgba(255,50,0,0)");
 ctx.fillStyle = flameGrad;

 ctx.beginPath();
 ctx.moveTo(-11,34);ctx.lineTo(-8,34+flameHeight);ctx.lineTo(-5,34);
 ctx.moveTo(5,34);ctx.lineTo(8,34+flameHeight);ctx.lineTo(11,34);
 ctx.fill();

 // Main Wings (Delta Jet Style)
 ctx.fillStyle = isEnemy ? "#4b5768" : "#2563eb";
 ctx.beginPath();
 ctx.moveTo(0,-38);
 ctx.lineTo(9,-6);
 ctx.lineTo(29,14);
 ctx.lineTo(26,24);
 ctx.lineTo(13,20);
 ctx.lineTo(12,34);
 ctx.lineTo(-12,34);
 ctx.lineTo(-13,20);
 ctx.lineTo(-26,24);
 ctx.lineTo(-29,14);
 ctx.lineTo(-9,-6);
 ctx.closePath();
 ctx.fill();
 ctx.strokeStyle = isEnemy ? "#7c8ba1" : "#93c5fd";
 ctx.lineWidth = 1.6;
 ctx.stroke();

 // Wing Tips Highlights
 ctx.fillStyle = isEnemy ? "#dc2626" : "#60a5fa";
 ctx.fillRect(-27,14,3,9);
 ctx.fillRect(24,14,3,9);

 // Center Fuselage Body
 ctx.fillStyle = isEnemy ? "#718096" : "#e2e8f0";
 ctx.beginPath();
 ctx.moveTo(0,-42);
 ctx.lineTo(6,-12);
 ctx.lineTo(6,30);
 ctx.lineTo(-6,30);
 ctx.lineTo(-6,-12);
 ctx.closePath();
 ctx.fill();

 // Canopy (Cockpit Glass Reflection)
 const glass = ctx.createLinearGradient(0,-24,0,-2);
 if(isEnemy){
  glass.addColorStop(0,"#ff8b8b");
  glass.addColorStop(1,"#450a0a");
 }else{
  glass.addColorStop(0,"#fde047");
  glass.addColorStop(0.5,"#ca8a04");
  glass.addColorStop(1,"#451a03");
 }
 ctx.fillStyle = glass;
 ctx.beginPath();
 ctx.ellipse(0,-14,4,11,0,0,Math.PI*2);
 ctx.fill();
 ctx.strokeStyle = "rgba(255,255,255,0.7)";
 ctx.lineWidth = 1;
 ctx.stroke();

 ctx.restore();
}

function background(dt){
 // VIP Ocean Deep Water
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#0d3859");
 sky.addColorStop(0.5,"#0b2a47");
 sky.addColorStop(1,"#06172a");
 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,H);

 // Floating Green Islands
 islands.forEach(isl=>{
  isl.y+=isl.v*dt;
  if(isl.y>H+80){isl.y=-80;isl.x=W*0.1+Math.random()*W*0.8}
  ctx.fillStyle="#1e5c4d";
  ctx.beginPath();
  ctx.ellipse(isl.x,isl.y,isl.rx,isl.ry,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="rgba(80,180,140,0.25)";
  ctx.lineWidth=2;
  ctx.stroke();
 });

 // Neon Flight-Lane Glowing Lines
 ctx.strokeStyle="rgba(255, 95, 45, 0.45)";
 ctx.lineWidth=3;
 ctx.shadowColor="#ff5511";
 ctx.shadowBlur=12;
 ctx.beginPath();
 ctx.moveTo(W*0.33,0);ctx.lineTo(W*0.33,H);
 ctx.moveTo(W*0.67,0);ctx.lineTo(W*0.67,H);
 ctx.stroke();
 ctx.shadowBlur=0;

 // Scrolling Soft Clouds
 clouds.forEach(c=>{
  c.y+=c.v*dt;
  if(c.y>H+70){c.y=-70;c.x=Math.random()*W}
  ctx.fillStyle="rgba(255, 255, 255, 0.08)";
  ctx.beginPath();
  ctx.ellipse(c.x,c.y,c.s,c.s*0.48,0,0,Math.PI*2);
  ctx.fill();
 });
}

function shoot(){
 playLaserSFX();
 // 5-Way Fan Spreading Lasers
 const angles=[-0.14, -0.07, 0, 0.07, 0.14];
 angles.forEach(ang=>{
  bullets.push({
   x:player.x,
   y:player.y-34,
   vx:Math.sin(ang)*580,
   vy:-Math.cos(ang)*580
  });
 });
}

function enemy(){
 const size=44+Math.random()*10;
 enemies.push({
  x:25+Math.random()*(W-50),
  y:-60,
  w:size,
  h:size*1.3,
  v:115+Math.random()*60+Math.min(score*0.06,120),
  phase:Math.random()*6.28
 });
}

function explosion(x,y,isPlayer=false){
 playBlastSFX();
 const count=isPlayer?36:18;
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2;
  const speed=30+Math.random()*(isPlayer?220:130);
  sparks.push({
   x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
   life:0.35+Math.random()*0.5,
   size:2.5+Math.random()*5,
   color:["#ffffff","#ffee55","#ff7711","#ff2200"][i%4]
  });
 }
}

function update(dt){
 elapsed+=dt;
 background(dt);

 if(running&&!paused&&!gameOver){
  if(keys.left)player.x-=player.speed*dt;
  if(keys.right)player.x+=player.speed*dt;
  player.x=Math.max(26,Math.min(W-26,player.x));

  shot-=dt;
  if(keys.fire&&shot<=0){shoot();shot=0.14}

  spawn-=dt;
  if(spawn<=0){
   enemy();
   spawn=Math.max(0.4,1.1-score/5000);
  }

  // Bullets update
  bullets.forEach(b=>{
   b.x+=b.vx*dt;
   b.y+=b.vy*dt;
  });
  bullets=bullets.filter(b=>b.y>-20&&b.x>-10&&b.x<W+10);

  // Accurate Jet Hitbox Detection (Tight bounds: wing/fuselage overlap only)
  enemies.forEach(e=>{
   e.y+=e.v*dt;
   e.x+=Math.sin(elapsed*1.8+e.phase)*20*dt;

   // Tight Hitbox bounds (No fake touches, real proximity only)
   const xDist = Math.abs(e.x - player.x);
   const yDist = Math.abs(e.y - player.y);

   if(xDist < (player.w * 0.36 + e.w * 0.36) && yDist < (player.h * 0.38 + e.h * 0.38)){
    e.hit=true;
    if(player.inv<=0){
     hp=Math.max(0,hp-20);
     player.inv=0.7;
     explosion(player.x,player.y,true);
    }
   }
  });
  player.inv=Math.max(0,player.inv-dt);

  // Bullets Hit detection
  enemies=enemies.filter(e=>{
   if(e.hit){explosion(e.x,e.y);return false}
   for(const b of bullets){
    if(!b.used && Math.abs(b.x - e.x) < e.w * 0.44 && Math.abs(b.y - e.y) < e.h * 0.44){
     b.used=true;
     score+=100;
     explosion(e.x,e.y);
     return false;
    }
   }
   if(e.y>H+80)return false;
   return true;
  });
  bullets=bullets.filter(b=>!b.used);

  if(hp<=0)endGame();
 }

 // Explosion sparks animation
 sparks.forEach(s=>{
  s.x+=s.vx*dt;s.y+=s.vy*dt;
  s.vx*=0.97;s.vy*=0.97;s.life-=dt;
 });
 sparks=sparks.filter(s=>s.life>0);

 // Draw Glowing Lasers
 bullets.forEach(b=>{
  ctx.shadowBlur=12;ctx.shadowColor="#ffe144";
  ctx.fillStyle="#ffff88";
  ctx.beginPath();
  ctx.arc(b.x,b.y,3.5,0,Math.PI*2);
  ctx.fill();
 });
 ctx.shadowBlur=0;

 // Draw Enemies
 enemies.forEach(e=>{
  drawFighterJet(e.x,e.y,e.w,e.h,true);
 });

 // Draw Explosions
 sparks.forEach(s=>{
  ctx.globalAlpha=Math.min(1,s.life*2.2);
  ctx.fillStyle=s.color;
  ctx.shadowBlur=8;ctx.shadowColor=s.color;
  ctx.beginPath();
  ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
  ctx.fill();
 });
 ctx.globalAlpha=1;ctx.shadowBlur=0;

 // Draw Player Jet (Flashes when invulnerable)
 if(player.inv<=0 || Math.floor(elapsed*20)%2===0){
  drawFighterJet(player.x,player.y,player.w,player.h,false);
 }

 $("hpText").textContent=hp+"%";
 $("hpFill").style.width=hp+"%";
 $("hpFill").style.background=hp<30?"#ff4e59":"#32ffc0";
 $("scoreText").textContent=String(score).padStart(4,"0");
}

function endGame(){
 running=false;gameOver=true;
 $("message").classList.remove("hidden");
 $("message").querySelector("h1").textContent="MISSION FAILED";
 $("message").querySelector("p").innerHTML=
  "Aapka jet dushman se takra kar destroy ho gaya!<br><b>FINAL SCORE: "+score+"</b><br>Dobara koshish karein!";
 $("start").textContent="↻ RESTART MISSION";
}

function reset(){
 score=0;hp=100;elapsed=0;spawn=0.4;shot=0;
 enemies=[];bullets=[];sparks=[];
 player.x=W/2;player.y=H*0.74;player.inv=0;
 gameOver=false;paused=false;running=true;
 Object.keys(keys).forEach(k=>keys[k]=false);
 $("pause").textContent="Ⅱ";
 $("message").classList.add("hidden");
 $("hpText").textContent="100%";
 $("hpFill").style.width="100%";
 $("scoreText").textContent="0000";
 last=performance.now();
}

$("start").addEventListener("click",reset);
$("pause").addEventListener("click",()=>{
 if(!running||gameOver)return;
 paused=!paused;
 $("pause").textContent=paused?"▶":"Ⅱ";
 if(paused){
  $("message").classList.remove("hidden");
  $("message").querySelector("h1").textContent="MISSION PAUSED";
  $("message").querySelector("p").textContent="Aapka mission pause hai.";
  $("start").textContent="RESUME MISSION ▶";
  $("start").onclick=()=>{
   $("start").onclick=null;
   $("message").classList.add("hidden");
   paused=false;$("pause").textContent="Ⅱ";
  };
 }else{
  $("message").classList.add("hidden");
 }
});

function bindHold(id,key){
 const el=$(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;
  try{el.setPointerCapture(e.pointerId)}catch(_){}
 });
 const release=e=>{e.preventDefault();keys[key]=false};
 el.addEventListener("pointerup",release);
 el.addEventListener("pointercancel",release);
 el.addEventListener("lostpointercapture",()=>keys[key]=false);
}
bindHold("left","left");
bindHold("right","right");
bindHold("fire","fire");

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.code==="Space")keys.fire=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
 if(e.code==="Space")keys.fire=false;
});

function loop(now){
 const dt=Math.min((now-last)/1000||0, 0.035);
 last=now;
 if(!paused)update(dt);
 else background(dt);
 requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{
 last=t;
 requestAnimationFrame(loop);
});
})();
</script>
</body>
</html>
