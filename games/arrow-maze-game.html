<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maze Untangle - Super Hard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0f19;
      background-image: url('https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/1792388836123.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
      z-index: 0;
    }
    #game-container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 840px;
      background: rgba(255, 255, 255, 0.96);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border-radius: 20px;
      overflow: hidden;
      z-index: 1;
    }
    .header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border-bottom: 2px solid #edf2f7;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .profile-dp {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #2563eb;
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.4);
    }
    .header-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .level-title {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
    }
    .diff-badge {
      font-size: 11px;
      font-weight: 700;
      color: #2563eb;
      text-transform: uppercase;
    }
    .lives-box {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }
    .heart {
      width: 11px;
      height: 11px;
      background-color: #ef4444;
      border-radius: 50%;
      display: inline-block;
      transition: all 0.2s;
    }
    .heart.lost {
      opacity: 0.2;
      transform: scale(0.8);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .timer-badge {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-icon {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #475569;
    }

    #canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #fafbfc;
    }
    canvas {
      touch-action: none;
    }

    .footer {
      padding: 10px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #2563eb;
      text-transform: uppercase;
      background: #ffffff;
      border-top: 2px solid #edf2f7;
    }

    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(5px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
    }
    .modal-card {
      background: #fff;
      color: #1e293b;
      padding: 24px 20px;
      border-radius: 22px;
      text-align: center;
      width: 84%;
    }
    .modal-card h2 {
      font-size: 22px;
      margin-bottom: 6px;
    }
    .modal-card p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 16px;
    }
    .stats-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .stat-label {
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: #059669;
    }
    .modal-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <audio id="bgm" loop preload="auto">
    <source src="https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/ZIKR_by_Lasani_Sarkar(256k).mp3" type="audio/mpeg">
  </audio>

  <div id="game-container">
    <div class="header">
      <div class="header-left">
        <img class="profile-dp" src="https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/games/file_00000000a3f482088bfdca19f7851f75.png" alt="Gaming Logo">
        <div class="header-info">
          <div class="level-title" id="level-display">Level 1</div>
          <span class="diff-badge" id="diff-tag">Normal</span>
          <div class="lives-box" id="lives-container">
            <span class="heart"></span>
            <span class="heart"></span>
            <span class="heart"></span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="timer-badge">
          <span>⏱</span>
          <span id="live-time-display">00:00</span>
        </div>
        <button class="btn-icon" id="music-btn">🎵</button>
        <button class="btn-icon" id="restart-btn">🔄</button>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="footer">Long Press to Preview • Tap to Untangle</div>

    <div class="modal" id="gameModal">
      <div class="modal-card">
        <h2 id="modal-title">Level Cleared! 🎉</h2>
        <p id="modal-subtitle">Great job navigating the maze.</p>
        <div class="stats-card">
          <div class="stat-item">
            <span class="stat-label">Total Time</span>
            <span class="stat-value" id="stat-time-taken">0s</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Best Record</span>
            <span class="stat-value" id="stat-best-time">--</span>
          </div>
        </div>
        <button class="modal-btn" id="modal-action-btn">Next Level</button>
      </div>
    </div>
  </div>

  <script>
    // Audio FX
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-btn');
    let isMusicPlaying = false;
    bgm.volume = 0.5;

    function toggleMusic() {
      if (isMusicPlaying) {
        bgm.pause();
        musicBtn.innerText = '🔇';
        isMusicPlaying = false;
      } else {
        bgm.play().then(() => {
          musicBtn.innerText = '🎵';
          isMusicPlaying = true;
        }).catch(() => {});
      }
    }
    musicBtn.addEventListener('click', toggleMusic);

    window.addEventListener('click', () => {
      if (!isMusicPlaying && bgm.paused) {
        bgm.play().then(() => {
          isMusicPlaying = true;
          musicBtn.innerText = '🎵';
        }).catch(() => {});
      }
    }, { once: true });

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function playSound(type) {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);
      const t = actx.currentTime;

      if (type === 'escape') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.15);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
        osc.start(t);
        osc.stop(t + 0.15);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.2);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
        osc.start(t);
        osc.stop(t + 0.2);
      } else if (type === 'win') {
        [523, 659, 783, 1046].forEach((f, i) => {
          const o = actx.createOscillator();
          const g = actx.createGain();
          o.connect(g);
          g.connect(actx.destination);
          o.frequency.value = f;
          g.gain.setValueAtTime(0.2, t + i * 0.1);
          g.gain.linearRampToValueAtTime(0.01, t + i * 0.1 + 0.25);
          o.start(t + i * 0.1);
          o.stop(t + i * 0.1 + 0.25);
        });
      }
    }

    // Game Variables
    let currentLevel = parseInt(localStorage.getItem('saved_level')) || 1;
    let lives = 3;
    let secondsSpent = 0;
    let timerInterval = null;
    let arrows = [];
    let isAnimating = false;
    let previewArrow = null;
    let longPressTimer = null;
    let gridCols = 10;
    let gridRows = 14;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelDisplay = document.getElementById('level-display');
    const diffTag = document.getElementById('diff-tag');
    const liveTimeDisplay = document.getElementById('live-time-display');
    const livesContainer = document.getElementById('lives-container');
    const gameModal = document.getElementById('gameModal');
    const modalTitle = document.getElementById('modal-title');
    const modalSubtitle = document.getElementById('modal-subtitle');
    const modalActionBtn = document.getElementById('modal-action-btn');
    const restartBtn = document.getElementById('restart-btn');
    const statTimeTaken = document.getElementById('stat-time-taken');
    const statBestTime = document.getElementById('stat-best-time');

    function resizeCanvas() {
      const wrap = document.getElementById('canvas-wrap');
      const w = wrap.clientWidth - 16;
      const h = wrap.clientHeight - 16;
      canvas.width = Math.min(w, 400);
      canvas.height = Math.min(h, 560);
      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    function formatTime(s) {
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    function seededRandom(seed) {
      let x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    // Procedural Level Generator
    function generateLevel(lvl) {
      arrows = [];
      previewArrow = null;
      secondsSpent = 0;
      liveTimeDisplay.innerText = "00:00";

      // 10 Level k baad Super Hard Mode
      const isHard = lvl > 10;
      diffTag.innerText = isHard ? (lvl > 100 ? "Master Hard" : "Super Hard") : "Normal";
      diffTag.style.color = isHard ? "#ef4444" : "#2563eb";

      gridCols = isHard ? 12 : 8;
      gridRows = isHard ? 16 : 10;

      let randCounter = lvl * 179;
      const getRand = () => seededRandom(randCounter++);

      const count = isHard ? Math.min(18 + Math.floor(lvl / 5), 45) : (5 + lvl);
      const occupied = new Set();

      for (let i = 0; i < count; i++) {
        let sx = Math.floor(getRand() * (gridCols - 4)) + 2;
        let sy = Math.floor(getRand() * (gridRows - 4)) + 2;
        let key = `${sx},${sy}`;
        if (occupied.has(key)) continue;

        let points = [{x: sx, y: sy}];
        occupied.add(key);

        // Hard level me turns aur maze branches banegi
        const turns = isHard ? (Math.floor(getRand() * 3) + 1) : 0;
        let dirs = [{x:0,y:-1}, {x:1,y:0}, {x:0,y:1}, {x:-1,y:0}];
        let curDir = dirs[Math.floor(getRand() * 4)];

        let cx = sx;
        let cy = sy;
        for (let t = 0; t <= turns; t++) {
          let stepLen = isHard ? (Math.floor(getRand() * 3) + 2) : 2;
          cx += curDir.x * stepLen;
          cy += curDir.y * stepLen;
          cx = Math.max(1, Math.min(gridCols - 2, cx));
          cy = Math.max(1, Math.min(gridRows - 2, cy));
          points.push({x: cx, y: cy});

          // Change direction for next segment (90 degree turn)
          curDir = (curDir.x === 0) ? (getRand() > 0.5 ? {x:1,y:0} : {x:-1,y:0}) : (getRand() > 0.5 ? {x:0,y:1} : {x:0,y:-1});
        }

        arrows.push({
          id: i,
          points: points,
          dir: curDir,
          state: 'idle', // idle, queued (red waiting), moving, escaped
          isRed: false,
          progress: 0,
          shake: 0
        });
      }

      startTimer();
      updateUI();
      draw();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsSpent++;
        liveTimeDisplay.innerText = formatTime(secondsSpent);
      }, 1000);
    }

    function updateUI() {
      levelDisplay.innerText = `Level ${currentLevel}`;
      livesContainer.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const h = document.createElement('span');
        h.className = `heart ${i >= lives ? 'lost' : ''}`;
        livesContainer.appendChild(h);
      }
    }

    // Raycast Collision Detection
    function isArrowBlocked(arrow) {
      const head = arrow.points[arrow.points.length - 1];
      const d = arrow.dir;
      let rx = head.x + d.x;
      let ry = head.y + d.y;

      while (rx >= 0 && rx <= gridCols && ry >= 0 && ry <= gridRows) {
        for (let other of arrows) {
          if (other.id === arrow.id || other.state === 'escaped') continue;
          for (let p of other.points) {
            if (p.x === rx && p.y === ry) {
              return true; // Saamne koi dusra arrow hai
            }
          }
        }
        rx += d.x;
        ry += d.y;
      }
      return false;
    }

    // Check agar koi Red Waiting Arrow ab nikal sakta hai
    function checkQueuedArrows() {
      let triggered = false;
      arrows.forEach(arrow => {
        if (arrow.state === 'queued' && !isArrowBlocked(arrow)) {
          arrow.state = 'moving';
          playSound('escape');
          triggered = true;
        }
      });
      if (triggered && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(animate);
      }
    }

    // Render Everything
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cellW = canvas.width / gridCols;
      const cellH = canvas.height / gridRows;

      // 1. Dotted Background Grid
      ctx.fillStyle = '#cbd5e1';
      for (let x = 1; x < gridCols; x++) {
        for (let y = 1; y < gridRows; y++) {
          ctx.beginPath();
          ctx.arc(x * cellW, y * cellH, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 2. Long Press Path Preview
      if (previewArrow && previewArrow.state !== 'escaped') {
        const head = previewArrow.points[previewArrow.points.length - 1];
        ctx.save();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(head.x * cellW, head.y * cellH);
        ctx.lineTo((head.x + previewArrow.dir.x * gridCols) * cellW, (head.y + previewArrow.dir.y * gridRows) * cellH);
        ctx.stroke();
        ctx.restore();
      }

      // 3. Draw Arrows / Maze Lines
      arrows.forEach(arrow => {
        if (arrow.state === 'escaped') return;

        let strokeColor = '#0f172a';
        if (arrow.isRed || arrow.state === 'queued') strokeColor = '#ef4444';
        if (arrow === previewArrow) strokeColor = '#2563eb';

        ctx.save();
        ctx.strokeStyle = strokeColor;
        ctx.fillStyle = strokeColor;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        let offsetX = 0;
        let offsetY = 0;
        if (arrow.state === 'moving') {
          offsetX = arrow.dir.x * arrow.progress * canvas.width;
          offsetY = arrow.dir.y * arrow.progress * canvas.height;
        }
        if (arrow.shake > 0) {
          offsetX += Math.sin(arrow.shake * 12) * 4;
          arrow.shake -= 0.1;
        }

        ctx.translate(offsetX, offsetY);

        // Draw segments
        ctx.beginPath();
        for (let i = 0; i < arrow.points.length; i++) {
          let px = arrow.points[i].x * cellW;
          let py = arrow.points[i].y * cellH;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Draw Arrowhead on the final segment
        const head = arrow.points[arrow.points.length - 1];
        const hx = head.x * cellW;
        const hy = head.y * cellH;
        const angle = Math.atan2(arrow.dir.y, arrow.dir.x);

        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(-10, -6);
        ctx.lineTo(2, 0);
        ctx.lineTo(-10, 6);
        ctx.stroke();
        ctx.restore();

        ctx.restore();
      });
    }

    // Animation Loop
    function animate() {
      let active = false;

      arrows.forEach(arrow => {
        if (arrow.state === 'moving') {
          arrow.progress += 0.08;
          active = true;
          if (arrow.progress >= 1.2) {
            arrow.state = 'escaped';
            checkQueuedArrows();
            checkWinCondition();
          }
        }
        if (arrow.shake > 0) active = true;
      });

      draw();

      if (active) requestAnimationFrame(animate);
      else isAnimating = false;
    }

    // Touch & Pointer Logic
    function getClickedArrow(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const px = clientX - rect.left;
      const py = clientY - rect.top;
      const cellW = canvas.width / gridCols;
      const cellH = canvas.height / gridRows;

      for (let arrow of arrows) {
        if (arrow.state === 'escaped') continue;
        for (let p of arrow.points) {
          let dist = Math.hypot(px - p.x * cellW, py - p.y * cellH);
          if (dist < cellW * 0.75) return arrow;
        }
      }
      return null;
    }

    function handlePointerDown(e) {
      const cx = e.clientX || (e.touches && e.touches[0].clientX);
      const cy = e.clientY || (e.touches && e.touches[0].clientY);
      const clicked = getClickedArrow(cx, cy);

      if (clicked) {
        longPressTimer = setTimeout(() => {
          previewArrow = clicked;
          draw();
        }, 300);
      }
    }

    function handlePointerUp(e) {
      clearTimeout(longPressTimer);
      if (previewArrow) {
        previewArrow = null;
        draw();
        return;
      }

      const cx = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
      const cy = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);
      const clicked = getClickedArrow(cx, cy);

      if (clicked && clicked.state !== 'moving' && clicked.state !== 'escaped') {
        if (isArrowBlocked(clicked)) {
          // Blocked: Red ho jayega aur queue me wait karega
          playSound('hit');
          clicked.isRed = true;
          clicked.state = 'queued';
          clicked.shake = 1.0;
          lives--;
          updateUI();
          if (lives <= 0) handleGameOver("Out of Lives!");
        } else {
          // Raasta saaf hai: seedha bahar
          playSound('escape');
          clicked.state = 'moving';
          clicked.isRed = false;
        }

        if (!isAnimating) {
          isAnimating = true;
          requestAnimationFrame(animate);
        }
      }
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mouseup', handlePointerUp);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); handlePointerUp(e); }, { passive: false });

    function checkWinCondition() {
      const remaining = arrows.filter(a => a.state !== 'escaped');
      if (remaining.length === 0) {
        clearInterval(timerInterval);
        playSound('win');

        const bestTimeKey = `best_time_lvl_${currentLevel}`;
        let savedBest = localStorage.getItem(bestTimeKey);
        if (!savedBest || secondsSpent < parseInt(savedBest)) {
          localStorage.setItem(bestTimeKey, secondsSpent);
          savedBest = secondsSpent;
        }

        statTimeTaken.innerText = `${secondsSpent}s`;
        statBestTime.innerText = `${savedBest}s`;

        modalTitle.innerText = "Level Complete! 🎉";
        modalSubtitle.innerText = `Shaandar! Aapne Level ${currentLevel} solve kar liya.`;
        modalActionBtn.onclick = () => {
          currentLevel++;
          if (currentLevel > 5000) currentLevel = 1;
          localStorage.setItem('saved_level', currentLevel);
          gameModal.style.display = 'none';
          generateLevel(currentLevel);
        };
        gameModal.style.display = 'flex';
      }
    }

    function handleGameOver(reason) {
      clearInterval(timerInterval);
      modalTitle.innerText = reason;
      modalSubtitle.innerText = "Dobara koshish karein maze ko untangle karne ki.";
      modalActionBtn.innerText = "Try Again";
      modalActionBtn.onclick = () => {
        lives = 3;
        gameModal.style.display = 'none';
        generateLevel(currentLevel);
      };
      gameModal.style.display = 'flex';
    }

    restartBtn.addEventListener('click', () => {
      lives = 3;
      generateLevel(currentLevel);
    });

    resizeCanvas();
    generateLevel(currentLevel);
  </script>
</body>
</html>
