<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maze Untangle - Master Puzzle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0f19;
      background-image: url('https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/1792388836123.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.65);
      backdrop-filter: blur(4px);
      z-index: 0;
    }
    #game-container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 840px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      border-radius: 20px;
      overflow: hidden;
      z-index: 1;
    }
    .header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border-bottom: 2px solid #f1f5f9;
      position: relative;
      z-index: 20;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .profile-dp {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #2563eb;
      box-shadow: 0 2px 8px rgba(37,99,235,0.3);
    }
    .header-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .level-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .level-title {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
    }
    .diff-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 6px;
      background: #eff6ff;
      color: #2563eb;
      text-transform: uppercase;
    }
    .shape-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 5px;
      background: #f1f5f9;
      color: #64748b;
      text-transform: uppercase;
    }
    .lives-box {
      display: flex;
      gap: 4px;
      margin-top: 1px;
    }
    .heart {
      width: 11px;
      height: 11px;
      background-color: #ef4444;
      border-radius: 50%;
      display: inline-block;
      transition: all 0.2s;
    }
    .heart.lost {
      opacity: 0.2;
      transform: scale(0.75);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .timer-badge {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
      padding: 5px 10px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-icon {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #475569;
    }
    .btn-icon:active {
      transform: scale(0.92);
    }

    .dropdown-menu {
      position: absolute;
      top: 55px;
      right: 14px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border: 1px solid #e2e8f0;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 100;
      min-width: 145px;
    }
    .dropdown-item {
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
    }
    .dropdown-item:hover, .dropdown-item:active {
      background: #f1f5f9;
      color: #2563eb;
    }

    #canvas-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #ffffff;
      touch-action: none;
      overflow: hidden;
    }
    canvas {
      display: block;
      touch-action: none;
      background: #ffffff;
    }

    .footer {
      padding: 10px;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #64748b;
      text-transform: uppercase;
      background: #ffffff;
      border-top: 1px solid #f1f5f9;
      z-index: 20;
      flex-shrink: 0;
    }

    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 50;
    }
    .modal-card {
      background: #fff;
      color: #0f172a;
      padding: 24px 18px;
      border-radius: 20px;
      text-align: center;
      width: 84%;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    }
    .modal-card h2 {
      font-size: 22px;
      margin-bottom: 6px;
    }
    .modal-card p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 16px;
    }
    .stats-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-around;
    }
    .stat-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      text-transform: uppercase;
      display: block;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: #16a34a;
    }
    .modal-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }

    #levels-modal .modal-card {
      width: 90%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
    }
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      overflow-y: auto;
      max-height: 52vh;
      padding: 8px 4px;
      margin-bottom: 14px;
    }
    .level-box {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .level-box.unlocked {
      background: #eff6ff;
      color: #2563eb;
      border-color: #bfdbfe;
    }
    .level-box.current {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(37,99,235,0.4);
    }
    .level-box.locked {
      background: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .level-box.locked span {
      font-size: 12px;
    }
  </style>
</head>
<body>

  <audio id="bgm" loop preload="auto">
    <source src="https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/ZIKR_by_Lasani_Sarkar(256k).mp3" type="audio/mpeg">
  </audio>

  <div id="game-container">
    <div class="header">
      <div class="header-left">
        <img class="profile-dp" src="https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/games/file_00000000a3f482088bfdca19f7851f75.png" alt="Gaming Logo">
        <div class="header-info">
          <div class="level-row">
            <span class="level-title" id="level-display">Level 1</span>
            <span class="diff-badge" id="diff-tag">Easy</span>
            <span class="shape-badge" id="shape-tag">Square</span>
          </div>
          <div class="lives-box" id="lives-container">
            <span class="heart"></span>
            <span class="heart"></span>
            <span class="heart"></span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="timer-badge">
          <span>⏱</span>
          <span id="live-time-display">00:00</span>
        </div>
        <button class="btn-icon" id="music-btn">🎵</button>
        <button class="btn-icon" id="menu-dots-btn" style="font-weight: 900; font-size: 20px;">⋮</button>
      </div>

      <div class="dropdown-menu" id="dropdown-menu">
        <button class="dropdown-item" id="opt-all-levels">📋 All Levels</button>
        <button class="dropdown-item" id="opt-restart-level">🔄 Restart Level</button>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="footer">Tap Arrow • Untangle The Maze</div>

    <div class="modal" id="gameModal">
      <div class="modal-card">
        <h2 id="modal-title">Level Cleared! 🎉</h2>
        <p id="modal-subtitle">Great job navigating the maze.</p>
        <div class="stats-card">
          <div>
            <span class="stat-label">Total Time</span>
            <span class="stat-value" id="stat-time-taken">0s</span>

        <button class="modal-btn" id="modal-action-btn">Next Level</button>

    <div class="modal" id="levels-modal">
      <div class="modal-card">
        <h2>Select Level</h2>
        <p id="unlocked-count-text">Unlocked: 1 / 5000</p>
        <div class="levels-grid" id="levels-container-grid"></div>
        <button class="modal-btn" id="close-levels-btn">Close</button>
      </div>
    </div>
  </div>

  <script>
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-btn');
    let isMusicPlaying = false;
    bgm.volume = 0.5;

    function toggleMusic() {
      if (isMusicPlaying) {
        bgm.pause();
        musicBtn.innerText = '🔇';
        isMusicPlaying = false;
      } else {
        bgm.play().then(() => {
          musicBtn.innerText = '🎵';
          isMusicPlaying = true;
        }).catch(() => {});
      }
    }
    musicBtn.addEventListener('click', toggleMusic);

    window.addEventListener('pointerdown', () => {
      if (!isMusicPlaying && bgm.paused) {
        bgm.play().then(() => {
          isMusicPlaying = true;
          musicBtn.innerText = '🎵';
        }).catch(() => {});
      }
    }, { once: true });

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function playSound(type) {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);
      const t = actx.currentTime;

      if (type === 'escape') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, t);
        osc.frequency.exponentialRampToValueAtTime(950, t + 0.12);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
        osc.start(t);
        osc.stop(t + 0.12);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(60, t + 0.18);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
        osc.start(t);
        osc.stop(t + 0.18);
      } else if (type === 'win') {
        [523, 659, 783, 1046].forEach((f, i) => {
          const o = actx.createOscillator();
          const g = actx.createGain();
          o.connect(g);
          g.connect(actx.destination);
          o.frequency.value = f;
          g.gain.setValueAtTime(0.2, t + i * 0.08);
          g.gain.linearRampToValueAtTime(0.01, t + i * 0.08 + 0.2);
          o.start(t + i * 0.08);
          o.stop(t + i * 0.08 + 0.2);
        });
      }
    }

    let currentLevel = parseInt(localStorage.getItem('saved_level')) || 1;
    let maxUnlockedLevel = parseInt(localStorage.getItem('max_unlocked_level')) || 1;
    if (currentLevel > maxUnlockedLevel) maxUnlockedLevel = currentLevel;

    let lives = 3;
    let secondsSpent = 0;
    let timerInterval = null;
    let arrows = [];
    let animFrameId = null;
    let isGameOverOrWon = false;
    let previewArrow = null;
    let longPressTimer = null;
    let pointerDownPos = { x: 0, y: 0 };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelDisplay = document.getElementById('level-display');
    const diffTag = document.getElementById('diff-tag');
    const shapeTag = document.getElementById('shape-tag');
    const liveTimeDisplay = document.getElementById('live-time-display');
    const livesContainer = document.getElementById('lives-container');
    const gameModal = document.getElementById('gameModal');
    const modalTitle = document.getElementById('modal-title');
    const modalSubtitle = document.getElementById('modal-subtitle');
    const modalActionBtn = document.getElementById('modal-action-btn');
    const statTimeTaken = document.getElementById('stat-time-taken');
    const statBestTime = document.getElementById('stat-best-time');

    const menuDotsBtn = document.getElementById('menu-dots-btn');
    const dropdownMenu = document.getElementById('dropdown-menu');
    const optAllLevels = document.getElementById('opt-all-levels');
    const optRestartLevel = document.getElementById('opt-restart-level');
    const levelsModal = document.getElementById('levels-modal');
    const levelsContainerGrid = document.getElementById('levels-container-grid');
    const unlockedCountText = document.getElementById('unlocked-count-text');
    const closeLevelsBtn = document.getElementById('close-levels-btn');

    let cols = 16;
    let rows = 22;
    let cellSize = 16;
    let originX = 0;
    let originY = 0;

    const SHAPE_NAMES = [
      'Square', 'Diamond', 'Circle', 'Cross', 
      'Triangle', 'Hexagon', 'Spiral', 'Zigzag', 
      'Key', 'Shield', 'Bottle', 'Lightning', 
      'Heart', 'Star', 'Labyrinth', 'Comb'
    ];

    menuDotsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.style.display = dropdownMenu.style.display === 'flex' ? 'none' : 'flex';
    });

    window.addEventListener('click', () => {
      dropdownMenu.style.display = 'none';
    });

    optRestartLevel.addEventListener('click', () => {
      dropdownMenu.style.display = 'none';
      lives = 3;
      generateLevel(currentLevel);
    });

    optAllLevels.addEventListener('click', () => {
      dropdownMenu.style.display = 'none';
      showLevelsMap();
    });

    function showLevelsMap() {
      levelsContainerGrid.innerHTML = '';
      unlockedCountText.innerText = `Unlocked: ${maxUnlockedLevel} / 5000`;
      const totalToShow = Math.min(5000, Math.max(80, maxUnlockedLevel + 20));

      for (let i = 1; i <= totalToShow; i++) {
        const box = document.createElement('div');
        box.className = 'level-box';

        if (i <= maxUnlockedLevel) {
          box.classList.add(i === currentLevel ? 'current' : 'unlocked');
          box.innerText = i;
          box.onclick = () => {
            currentLevel = i;
            localStorage.setItem('saved_level', currentLevel);
            levelsModal.style.display = 'none';
            lives = 3; // Reset lives on selecting level
            generateLevel(currentLevel);
          };
        } else {
          box.classList.add('locked');
          box.innerHTML = `<span>🔒</span>`;
        }
        levelsContainerGrid.appendChild(box);
      }
      levelsModal.style.display = 'flex';
    }

    closeLevelsBtn.addEventListener('click', () => {
      levelsModal.style.display = 'none';
    });

    function resizeCanvas() {
      const wrap = document.getElementById('canvas-wrap');
      const w = wrap.clientWidth || 360;
      const h = wrap.clientHeight || 520;
      canvas.width = w;
      canvas.height = h;

      const margin = 16;
      cellSize = Math.floor(Math.min((w - margin * 2) / cols, (h - margin * 2) / rows));
      originX = Math.floor((w - cols * cellSize) / 2);
      originY = Math.floor((h - rows * cellSize) / 2);

      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    function createPRNG(seed) {
      let s = seed >>> 0;
      return function() {
        s |= 0;
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function formatTime(s) {
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    function isCellInShape(c, r, shapeId, lvl) {
      const cx = (cols - 1) / 2;
      const cy = (rows - 1) / 2;
      const stretchX = 1.0 + (((lvl * 17) % 7) - 3) * 0.035;
      const stretchY = 1.0 + (((lvl * 29) % 7) - 3) * 0.035;
      const nx = ((c - cx) / cx) * stretchX;
      const ny = ((r - cy) / cy) * stretchY;
      const angle = Math.atan2(ny, nx);
      const wobble = 1.0 + 0.05 * Math.sin(angle * 4 + lvl);

      switch(shapeId) {
        case 0:
          return Math.abs(nx) <= (0.88 * wobble) && Math.abs(ny) <= (0.88 * wobble);
        case 1:
          return (Math.abs(nx) * 1.15 + Math.abs(ny) * 1.15) <= (1.12 * wobble);
        case 2:
          return (nx * nx + ny * ny) <= (0.85 * wobble);
        case 3:
          return (Math.abs(nx) <= 0.4 && Math.abs(ny) <= 0.92) || (Math.abs(nx) <= 0.92 && Math.abs(ny) <= 0.4);
        case 4:
          return ny >= -0.88 && (Math.abs(nx) <= (ny + 0.9) * 0.62 * wobble);
        case 5:
          return Math.abs(ny) <= 0.9 && (Math.abs(nx) + Math.abs(ny) * 0.48 <= 0.92 * wobble);
        case 6:
          const rDist = Math.hypot(nx, ny);
          return rDist <= 0.92 && (rDist >= 0.18 || Math.abs(nx) <= 0.45);
        case 7:
          return Math.abs(nx - Math.sin(ny * 3.5 + lvl) * 0.35) <= 0.58;
        case 8:
          const keyHead = Math.hypot(nx, ny + 0.45);
          if (keyHead <= 0.5 && keyHead >= 0.18) return true;
          if (ny >= -0.15 && ny <= 0.88 && Math.abs(nx) <= 0.2) return true;
          if (ny >= 0.45 && ny <= 0.8 && nx > 0.18 && nx <= 0.6) return true;
          return false;
        case 9:
          if (ny < 0) return Math.abs(nx) <= (0.85 * wobble);
          return Math.abs(nx) <= ((0.85 - ny * 0.75) * wobble);
        case 10:
          if (ny < -0.45) return Math.abs(nx) <= 0.25;
          return Math.abs(nx) <= (0.78 * wobble) && ny <= 0.88;
        case 11:
          if (ny < 0) return nx >= ny * 0.6 - 0.45 && nx <= ny * 0.6 + 0.45;
          return nx >= ny * 0.7 - 0.25 && nx <= ny * 0.7 + 0.6;
        case 12:
          const hx = nx * 1.1;
          const hy = -ny * 1.1 + 0.2;
          return (hx * hx + hy * hy - 1) ** 3 - hx * hx * (hy ** 3) <= 0.08;
        case 13:
          const rad = Math.hypot(nx, ny);
          const starRadius = 0.58 + 0.35 * Math.cos(angle * 5 + (lvl % 3));
          return rad <= starRadius;
        case 14:
          return Math.abs(nx) <= 0.9 && Math.abs(ny) <= 0.9 && (Math.abs(nx) > 0.15 || Math.abs(ny) > 0.15);
        case 15:
        default:
          return (nx >= -0.8 && nx <= 0.8 && Math.abs(ny) <= 0.85) && (r % 2 === 0 || nx <= -0.1);
      }
    }

    // High Density Difficulty Setting (Full Board Packing)
    function getDifficultyConfig(lvl) {
      if (lvl <= 100) {
        return {
          tier: 'Easy',
          color: '#22c55e',
          cols: 14,
          rows: 18,
          maxLen: 7, // Varied short and long corridors
          turnChance: 0.35,
          minArrows: 12,
          maxArrows: 24,
          minDepth: 2,
          maxInitialFreeRatio: 0.70
        };
      } else if (lvl <= 500) {
        return {
          tier: 'Normal',
          color: '#2563eb',
          cols: 16,
          rows: 20,
          maxLen: 8,
          turnChance: 0.40,
          minArrows: 20,
          maxArrows: 34,
          minDepth: 3,
          maxInitialFreeRatio: 0.55
        };
      } else if (lvl <= 1500) {
        return {
          tier: 'Hard',
          color: '#eab308',
          cols: 16,
          rows: 22,
          maxLen: 9,
          turnChance: 0.45,
          minArrows: 28,
          maxArrows: 42,
          minDepth: 4,
          maxInitialFreeRatio: 0.45
        };
      } else if (lvl <= 3000) {
        return {
          tier: 'Expert',
          color: '#f97316',
          cols: 18,
          rows: 24,
          maxLen: 10,
          turnChance: 0.50,
          minArrows: 36,
          maxArrows: 50,
          minDepth: 5,
          maxInitialFreeRatio: 0.35
        };
      } else {
        return {
          tier: 'Master',
          color: '#ef4444',
          cols: 20,
          rows: 26,
          maxLen: 11,
          turnChance: 0.52,
          minArrows: 44,
          maxArrows: 60,
          minDepth: 6,
          maxInitialFreeRatio: 0.30
        };
      }
    }

    function checkRaycastBlocked(arrow, activeArrows) {
      const head = arrow.points[arrow.points.length - 1];
      const d = arrow.exitDir;
      let checkC = head.c + d.dx;
      let checkR = head.r + d.dy;

      while (checkC >= -1 && checkC <= cols && checkR >= -1 && checkR <= rows) {
        for (let i = 0; i < activeArrows.length; i++) {
          const other = activeArrows[i];
          if (other.id === arrow.id || other.state === 'escaped' || other.state === 'moving') continue;
          for (let p = 0; p < other.points.length; p++) {
            if (other.points[p].c === checkC && other.points[p].r === checkR) {
              return true;
            }
          }
        }
        checkC += d.dx;
        checkR += d.dy;
      }
      return false;
    }

    function isArrowBlocked(arrow) {
      return checkRaycastBlocked(arrow, arrows);
    }

    function evaluatePuzzleMetrics(candidateArrows) {
      const simList = candidateArrows.map(a => ({
        id: a.id,
        points: a.points,
        exitDir: a.exitDir,
        state: 'idle'
      }));

      let depth = 0;
      let initialFree = 0;
      let escapedCount = 0;

      while (true) {
        const canEscape = [];
        for (let i = 0; i < simList.length; i++) {
          const a = simList[i];
          if (a.state === 'idle' && !checkRaycastBlocked(a, simList)) {
            canEscape.push(a);
          }
        }

        if (depth === 0) initialFree = canEscape.length;
        if (canEscape.length === 0) break;

        for (let i = 0; i < canEscape.length; i++) {
          canEscape[i].state = 'escaped';
          escapedCount++;
        }
        depth++;
      }

      return {
        isSolvable: (escapedCount === candidateArrows.length),
        depth,
        initialFree,
        total: candidateArrows.length,
        initialRatio: initialFree / (candidateArrows.length || 1)
      };
    }

    // Dense Full-Maze Corridor Synthesis (Pack Board Completely)
    function buildCandidateArrows(lvl, shapeId, diff, prng) {
      const grid = Array.from({ length: cols }, () => Array(rows).fill(null));
      const validCells = [];

      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          if (isCellInShape(c, r, shapeId, lvl)) {
            validCells.push({ c, r });
          }
        }
      }

      for (let i = validCells.length - 1; i > 0; i--) {
        const j = Math.floor(prng() * (i + 1));
        const temp = validCells[i];
        validCells[i] = validCells[j];
        validCells[j] = temp;
      }

      const dirs = [
        { dx: 0, dy: -1 }, // UP
        { dx: 1, dy: 0 },  // RIGHT
        { dx: 0, dy: 1 },  // DOWN
        { dx: -1, dy: 0 }  // LEFT
      ];

      const candidates = [];
      let arrowId = 0;

      for (let i = 0; i < validCells.length; i++) {
        if (candidates.length >= diff.maxArrows) break;
        const start = validCells[i];
        if (grid[start.c][start.r] !== null) continue;

        let curC = start.c;
        let curR = start.r;
        let path = [{ c: curC, r: curR }];
        grid[curC][curR] = arrowId;

        let curDir = dirs[Math.floor(prng() * dirs.length)];
        
        // Dynamic path length: Mix of short (2-3), normal (4-5), and super long (6-11)
        const isSuperLong = prng() < 0.28;
        const targetLen = isSuperLong 
          ? Math.floor(prng() * 4) + (diff.maxLen - 3) 
          : Math.floor(prng() * 3) + 2;

        for (let step = 1; step < targetLen; step++) {
          if (step > 1 && prng() < diff.turnChance) {
            const turnOptions = (curDir.dx === 0) ? [dirs[1], dirs[3]] : [dirs[0], dirs[2]];
            curDir = turnOptions[Math.floor(prng() * turnOptions.length)];
          }

          let nextC = curC + curDir.dx;
          let nextR = curR + curDir.dy;

          if (
            nextC >= 0 && nextC < cols &&
            nextR >= 0 && nextR < rows &&
            isCellInShape(nextC, nextR, shapeId, lvl) &&
            grid[nextC][nextR] === null
          ) {
            grid[nextC][nextR] = arrowId;
            path.push({ c: nextC, r: nextR });
            curC = nextC;
            curR = nextR;
          } else {
            break;
          }
        }

        if (path.length >= 2) {
          const tail = path[path.length - 2];
          const head = path[path.length - 1];
          const exitDir = {
            dx: Math.sign(head.c - tail.c),
            dy: Math.sign(head.r - tail.r)
          };

          candidates.push({
            id: arrowId,
            points: path,
            exitDir: exitDir,
            state: 'idle',
            progress: 0,
            shake: 0
          });
          arrowId++;
        } else {
          grid[start.c][start.r] = null;
        }
      }

      return candidates;
    }

    function generateLevel(lvl) {
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      isGameOverOrWon = false;
      previewArrow = null;
      secondsSpent = 0;
      liveTimeDisplay.innerText = "00:00";

      const diff = getDifficultyConfig(lvl);
      cols = diff.cols;
      rows = diff.rows;

      diffTag.innerText = diff.tier;
      diffTag.style.color = diff.color;

      const shapeId = (lvl - 1) % SHAPE_NAMES.length;
      shapeTag.innerText = SHAPE_NAMES[shapeId];

      resizeCanvas();

      let validPuzzleFound = false;
      let generatedArrows = [];
      let attempt = 0;
      let baseSeed = ((lvl * 1234567) ^ 0x5DEECE66) >>> 0;

      while (!validPuzzleFound && attempt < 80) {
        const prng = createPRNG(baseSeed + attempt * 101);
        const candidates = buildCandidateArrows(lvl, shapeId, diff, prng);

        if (candidates.length >= diff.minArrows) {
          const metrics = evaluatePuzzleMetrics(candidates);
          if (
            metrics.isSolvable &&
            metrics.depth >= diff.minDepth &&
            metrics.initialFree >= 1 &&
            metrics.initialRatio <= diff.maxInitialFreeRatio
          ) {
            validPuzzleFound = true;
            generatedArrows = candidates;
            break;
          }
        }
        attempt++;
      }

      if (!validPuzzleFound) {
        let fallbackAttempt = 0;
        while (!validPuzzleFound && fallbackAttempt < 50) {
          const prng = createPRNG((baseSeed ^ 0xA5A5A5A5) + fallbackAttempt * 13);
          const candidates = buildCandidateArrows(lvl, 0, diff, prng);
          const metrics = evaluatePuzzleMetrics(candidates);
          if (metrics.isSolvable && metrics.initialFree >= 1) {
            validPuzzleFound = true;
            generatedArrows = candidates;
            break;
          }
          fallbackAttempt++;
        }
      }

      arrows = generatedArrows;

      startTimer();
      updateUI();
      draw();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isGameOverOrWon) {
          secondsSpent++;
          liveTimeDisplay.innerText = formatTime(secondsSpent);
        }
      }, 1000);
    }

    function updateUI() {
      levelDisplay.innerText = `Level ${currentLevel}`;
      livesContainer.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const h = document.createElement('span');
        h.className = `heart ${i >= lives ? 'lost' : ''}`;
        livesContainer.appendChild(h);
      }
    }

    function checkQueuedArrows() {
      let released = false;
      arrows.forEach(arrow => {
        if (arrow.state === 'queued' && !isArrowBlocked(arrow)) {
          arrow.state = 'moving';
          playSound('escape');
          released = true;
        }
      });
      if (released) triggerAnimation();
    }

    // Straight Orthogonal Exit Trajectory (Fix for diagonal lines)
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const shapeId = (currentLevel - 1) % SHAPE_NAMES.length;
      const occupied = new Set();
      arrows.forEach(arrow => {
        if (arrow.state !== 'escaped') {
          arrow.points.forEach(pt => occupied.add(`${pt.c},${pt.r}`));
        }
      });

      // Dot Matrix
      ctx.fillStyle = '#e2e8f0';
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          if (isCellInShape(c, r, shapeId, currentLevel) && !occupied.has(`${c},${r}`)) {
            const dx = originX + (c + 0.5) * cellSize;
            const dy = originY + (r + 0.5) * cellSize;
            ctx.beginPath();
            ctx.arc(dx, dy, 1.25, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // Long-Press Preview Ray
      if (previewArrow && previewArrow.state !== 'escaped') {
        const head = previewArrow.points[previewArrow.points.length - 1];
        ctx.save();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        const startX = originX + (head.c + 0.5) * cellSize;
        const startY = originY + (head.r + 0.5) * cellSize;
        ctx.moveTo(startX, startY);
        ctx.lineTo(
          startX + previewArrow.exitDir.dx * canvas.width,
          startY + previewArrow.exitDir.dy * canvas.height
        );
        ctx.stroke();
        ctx.restore();
      }

      // Render Arrows
      arrows.forEach(arrow => {
        if (arrow.state === 'escaped') return;

        let strokeColor = '#0f172a';
        if (arrow.state === 'queued') strokeColor = '#ef4444';
        if (arrow.state === 'moving') strokeColor = '#22c55e';
        if (arrow === previewArrow) strokeColor = '#2563eb';

        ctx.save();
        ctx.strokeStyle = strokeColor;
        ctx.fillStyle = strokeColor;
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'miter';

        let moveDist = 0;
        if (arrow.state === 'moving') {
          moveDist = arrow.progress * (Math.max(cols, rows) * cellSize * 1.5);
        }

        let shakeX = 0;
        let shakeY = 0;
        if (arrow.shake > 0) {
          shakeX = Math.sin(arrow.shake * 12) * 3;
          arrow.shake -= 0.1;
        }

        ctx.translate(shakeX, shakeY);

        // Path coordinates
        const pts = arrow.points.map(pt => ({
          x: originX + (pt.c + 0.5) * cellSize,
          y: originY + (pt.r + 0.5) * cellSize
        }));

        // Move strictly straight out along exitDir
        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) {
          const px = pts[i].x + arrow.exitDir.dx * moveDist;
          const py = pts[i].y + arrow.exitDir.dy * moveDist;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Tip arrowhead at the head point
        const headPt = pts[pts.length - 1];
        const hx = headPt.x + arrow.exitDir.dx * moveDist;
        const hy = headPt.y + arrow.exitDir.dy * moveDist;

        const dx = arrow.exitDir.dx;
        const dy = arrow.exitDir.dy;
        const sz = 5.2;

        ctx.beginPath();
        if (dx === 1) { // Right
          ctx.moveTo(hx - sz, hy - sz * 0.7);
          ctx.lineTo(hx + 1, hy);
          ctx.lineTo(hx - sz, hy + sz * 0.7);
        } else if (dx === -1) { // Left
          ctx.moveTo(hx + sz, hy - sz * 0.7);
          ctx.lineTo(hx - 1, hy);
          ctx.lineTo(hx + sz, hy + sz * 0.7);
        } else if (dy === 1) { // Down
          ctx.moveTo(hx - sz * 0.7, hy - sz);
          ctx.lineTo(hx, hy + 1);
          ctx.lineTo(hx + sz * 0.7, hy - sz);
        } else if (dy === -1) { // Up
          ctx.moveTo(hx - sz * 0.7, hy + sz);
          ctx.lineTo(hx, hy - 1);
          ctx.lineTo(hx + sz * 0.7, hy + sz);
        }
        ctx.stroke();

        ctx.restore();
      });
    }

    function triggerAnimation() {
      if (!animFrameId) {
        animFrameId = requestAnimationFrame(animate);
      }
    }

    function animate() {
      let active = false;

      arrows.forEach(arrow => {
        if (arrow.state === 'moving') {
          arrow.progress += 0.08;
          active = true;
          if (arrow.progress >= 1.25) {
            arrow.state = 'escaped';
            checkQueuedArrows();
            checkWinCondition();
          }
        }
        if (arrow.shake > 0) active = true;
      });

      draw();

      if (active) {
        animFrameId = requestAnimationFrame(animate);
      } else {
        animFrameId = null;
      }
    }

    function getTouchedArrow(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const px = clientX - rect.left;
      const py = clientY - rect.top;

      let found = null;
      let minDistance = 9999;

      for (let i = 0; i < arrows.length; i++) {
        const arrow = arrows[i];
        if (arrow.state === 'escaped') continue;
        for (let p = 0; p < arrow.points.length; p++) {
          const pt = arrow.points[p];
          const ax = originX + (pt.c + 0.5) * cellSize;
          const ay = originY + (pt.r + 0.5) * cellSize;
          const dist = Math.hypot(px - ax, py - ay);
          if (dist < cellSize * 0.9 && dist < minDistance) {
            minDistance = dist;
            found = arrow;
          }
        }
      }
      return found;
    }

    function onPointerDown(e) {
      if (isGameOverOrWon) return;
      pointerDownPos = { x: e.clientX, y: e.clientY };

      const clicked = getTouchedArrow(e.clientX, e.clientY);
      if (clicked) {
        longPressTimer = setTimeout(() => {
          previewArrow = clicked;
          draw();
        }, 280);
      }
    }

    // Smart Fast Tap Combo Engine (No lives lost on chained taps)
    function onPointerUp(e) {
      clearTimeout(longPressTimer);
      if (isGameOverOrWon) return;

      if (previewArrow) {
        previewArrow = null;
        draw();
        return;
      }

      if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 15) return;

      const clicked = getTouchedArrow(e.clientX, e.clientY);

      if (clicked && clicked.state !== 'moving' && clicked.state !== 'escaped') {
        if (!isArrowBlocked(clicked)) {
          // Free to escape immediately
          playSound('escape');
          clicked.state = 'moving';
          triggerAnimation();
        } else {
          // Check if blocking obstacle is ALREADY moving/escaping
          const head = clicked.points[clicked.points.length - 1];
          const d = clicked.exitDir;
          let checkC = head.c + d.dx;
          let checkR = head.r + d.dy;
          let isDirectBlockerLeaving = false;

          while (checkC >= -1 && checkC <= cols && checkR >= -1 && checkR <= rows) {
            for (let i = 0; i < arrows.length; i++) {
              const other = arrows[i];
              if (other.id === clicked.id || other.state === 'escaped') continue;
              for (let p = 0; p < other.points.length; p++) {
                if (other.points[p].c === checkC && other.points[p].r === checkR) {
                  if (other.state === 'moving') isDirectBlockerLeaving = true;
                  break;
                }
              }
            }
            checkC += d.dx;
            checkR += d.dy;
          }

          if (isDirectBlockerLeaving) {
            // Fast tap combo: Queue cleanly without losing life
            clicked.state = 'queued';
            playSound('escape');
            triggerAnimation();
          } else {
            // Real wrong tap -> shake, lose life, queue
            playSound('hit');
            clicked.state = 'queued';
            clicked.shake = 1.0;
            lives--;
            updateUI();
            if (lives <= 0) handleGameOver("Out of Lives!");
            triggerAnimation();
          }
        }
      }
    }

    function onPointerCancel() {
      clearTimeout(longPressTimer);
      if (previewArrow) {
        previewArrow = null;
        draw();
      }
    }

    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerCancel);

    function checkWinCondition() {
      if (isGameOverOrWon) return;
      const remaining = arrows.filter(a => a.state !== 'escaped');
      if (remaining.length === 0) {
        isGameOverOrWon = true;
        clearInterval(timerInterval);
        playSound('win');

        const bestTimeKey = `best_time_lvl_${currentLevel}`;
        let savedBest = localStorage.getItem(bestTimeKey);
        if (!savedBest || secondsSpent < parseInt(savedBest)) {
          localStorage.setItem(bestTimeKey, secondsSpent);
          savedBest = secondsSpent;
        }

        statTimeTaken.innerText = `${secondsSpent}s`;
        statBestTime.innerText = `${savedBest}s`;

        modalTitle.innerText = "Level Cleared! 🎉";
        modalSubtitle.innerText = `Awesome! Level ${currentLevel} fully untangled.`;
        modalActionBtn.onclick = () => {
          currentLevel++;
          lives = 3; // Har naye level par 3 hearts restore
          if (currentLevel > maxUnlockedLevel) {
            maxUnlockedLevel = currentLevel;
            localStorage.setItem('max_unlocked_level', maxUnlockedLevel);
          }
          if (currentLevel > 5000) currentLevel = 1;
          localStorage.setItem('saved_level', currentLevel);
          gameModal.style.display = 'none';
          generateLevel(currentLevel);
        };
        gameModal.style.display = 'flex';
      }
    }

    function handleGameOver(reason) {
      isGameOverOrWon = true;
      clearInterval(timerInterval);
      modalTitle.innerText = reason;
      modalSubtitle.innerText = "Don't give up! Try again to clear this maze.";
      modalActionBtn.innerText = "Try Again";
      modalActionBtn.onclick = () => {
        lives = 3;
        gameModal.style.display = 'none';
        generateLevel(currentLevel);
      };
      gameModal.style.display = 'flex';
    }

    // Start Game
    generateLevel(currentLevel);
  </script>
</body>
</html>
