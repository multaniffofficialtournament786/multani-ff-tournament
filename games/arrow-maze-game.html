<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maze Untangle - Master Puzzle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0f19;
      background-image: url('https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/1792388836123.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.65);
      backdrop-filter: blur(4px);
      z-index: 0;
    }
    #game-container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 840px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      border-radius: 20px;
      overflow: hidden;
      z-index: 1;
    }
    .header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border-bottom: 2px solid #f1f5f9;
      position: relative;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .profile-dp {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #2563eb;
      box-shadow: 0 2px 8px rgba(37,99,235,0.3);
    }
    .header-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .level-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .level-title {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
    }
    .diff-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 6px;
      background: #eff6ff;
      color: #2563eb;
      text-transform: uppercase;
    }
    .lives-box {
      display: flex;
      gap: 4px;
      margin-top: 1px;
    }
    .heart {
      width: 11px;
      height: 11px;
      background-color: #ef4444;
      border-radius: 50%;
      display: inline-block;
      transition: all 0.2s;
    }
    .heart.lost {
      opacity: 0.2;
      transform: scale(0.75);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .timer-badge {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
      padding: 5px 10px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-icon {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #475569;
    }
    .btn-icon:active {
      transform: scale(0.92);
    }

    .dropdown-menu {
      position: absolute;
      top: 55px;
      right: 14px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border: 1px solid #e2e8f0;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 100;
      min-width: 145px;
    }
    .dropdown-item {
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
    }
    .dropdown-item:hover, .dropdown-item:active {
      background: #f1f5f9;
      color: #2563eb;
    }

    #canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #ffffff;
      padding: 12px;
    }
    canvas {
      touch-action: none;
      background: #ffffff;
    }

    .footer {
      padding: 10px;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #64748b;
      text-transform: uppercase;
      background: #ffffff;
      border-top: 1px solid #f1f5f9;
    }

    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 50;
    }
    .modal-card {
      background: #fff;
      color: #0f172a;
      padding: 24px 18px;
      border-radius: 20px;
      text-align: center;
      width: 84%;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    }
    .modal-card h2 {
      font-size: 22px;
      margin-bottom: 6px;
    }
    .modal-card p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 16px;
    }
    .stats-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-around;
    }
    .stat-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      text-transform: uppercase;
      display: block;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: #16a34a;
    }
    .modal-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }

    #levels-modal .modal-card {
      width: 90%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
    }
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      overflow-y: auto;
      max-height: 52vh;
      padding: 8px 4px;
      margin-bottom: 14px;
    }
    .level-box {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .level-box.unlocked {
      background: #eff6ff;
      color: #2563eb;
      border-color: #bfdbfe;
    }
    .level-box.current {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(37,99,235,0.4);
    }
    .level-box.locked {
      background: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .level-box.locked span {
      font-size: 12px;
    }
  </style>
</head>
<body>

  <audio id="bgm" loop preload="auto">
    <source src="https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/ZIKR_by_Lasani_Sarkar(256k).mp3" type="audio/mpeg">
  </audio>

  <div id="game-container">
    <div class="header">
      <div class="header-left">
        <img class="profile-dp" src="https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/games/file_00000000a3f482088bfdca19f7851f75.png" alt="Gaming Logo">
        <div class="header-info">
          <div class="level-row">
            <span class="level-title" id="level-display">Level 1</span>
            <span class="diff-badge" id="diff-tag">Normal</span>
          </div>
          <div class="lives-box" id="lives-container">
            <span class="heart"></span>
            <span class="heart"></span>
            <span class="heart"></span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="timer-badge">
          <span>⏱</span>
          <span id="live-time-display">00:00</span>
        </div>
        <button class="btn-icon" id="music-btn">🎵</button>
        <button class="btn-icon" id="menu-dots-btn" style="font-weight: 900; font-size: 20px;">⋮</button>
      </div>

      <div class="dropdown-menu" id="dropdown-menu">
        <button class="dropdown-item" id="opt-all-levels">📋 All Levels</button>
        <button class="dropdown-item" id="opt-restart-level">🔄 Restart Level</button>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="footer">Tap Arrow • Untangle The Maze</div>

    <!-- Modals -->
    <div class="modal" id="gameModal">
      <div class="modal-card">
        <h2 id="modal-title">Level Cleared! 🎉</h2>
        <p id="modal-subtitle">Great job navigating the maze.</p>
        <div class="stats-card">
          <div>
            <span class="stat-label">Total Time</span>
            <span class="stat-value" id="stat-time-taken">0s</span>
          </div>
          <div>
            <span class="stat-label">Best Record</span>
            <span class="stat-value" id="stat-best-time">--</span>
          </div>
        </div>
        <button class="modal-btn" id="modal-action-btn">Next Level</button>
      </div>
    </div>

    <div class="modal" id="levels-modal">
      <div class="modal-card">
        <h2>Select Level</h2>
        <p id="unlocked-count-text">Unlocked: 1 / 5000</p>
        <div class="levels-grid" id="levels-container-grid"></div>
        <button class="modal-btn" id="close-levels-btn">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Audio FX
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-btn');
    let isMusicPlaying = false;
    bgm.volume = 0.5;

    function toggleMusic() {
      if (isMusicPlaying) {
        bgm.pause();
        musicBtn.innerText = '🔇';
        isMusicPlaying = false;
      } else {
        bgm.play().then(() => {
          musicBtn.innerText = '🎵';
          isMusicPlaying = true;
        }).catch(() => {});
      }
    }
    musicBtn.addEventListener('click', toggleMusic);

    window.addEventListener('click', () => {
      if (!isMusicPlaying && bgm.paused) {
        bgm.play().then(() => {
          isMusicPlaying = true;
          musicBtn.innerText = '🎵';
        }).catch(() => {});
      }
    }, { once: true });

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function playSound(type) {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);
      const t = actx.currentTime;

      if (type === 'escape') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, t);
        osc.frequency.exponentialRampToValueAtTime(950, t + 0.12);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
        osc.start(t);
        osc.stop(t + 0.12);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(60, t + 0.18);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
        osc.start(t);
        osc.stop(t + 0.18);
      } else if (type === 'win') {
        [523, 659, 783, 1046].forEach((f, i) => {
          const o = actx.createOscillator();
          const g = actx.createGain();
          o.connect(g);
          g.connect(actx.destination);
          o.frequency.value = f;
          g.gain.setValueAtTime(0.2, t + i * 0.08);
          g.gain.linearRampToValueAtTime(0.01, t + i * 0.08 + 0.2);
          o.start(t + i * 0.08);
          o.stop(t + i * 0.08 + 0.2);
        });
      }
    }

    // Game state
    let currentLevel = parseInt(localStorage.getItem('saved_level')) || 1;
    let maxUnlockedLevel = parseInt(localStorage.getItem('max_unlocked_level')) || 1;
    if (currentLevel > maxUnlockedLevel) maxUnlockedLevel = currentLevel;

    let lives = 3;
    let secondsSpent = 0;
    let timerInterval = null;
    let arrows = [];
    let isAnimating = false;
    let previewArrow = null;
    let longPressTimer = null;
    let pointerDownPos = { x: 0, y: 0 };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelDisplay = document.getElementById('level-display');
    const diffTag = document.getElementById('diff-tag');
    const liveTimeDisplay = document.getElementById('live-time-display');
    const livesContainer = document.getElementById('lives-container');
    const gameModal = document.getElementById('gameModal');
    const modalTitle = document.getElementById('modal-title');
    const modalSubtitle = document.getElementById('modal-subtitle');
    const modalActionBtn = document.getElementById('modal-action-btn');
    const statTimeTaken = document.getElementById('stat-time-taken');
    const statBestTime = document.getElementById('stat-best-time');

    const menuDotsBtn = document.getElementById('menu-dots-btn');
    const dropdownMenu = document.getElementById('dropdown-menu');
    const optAllLevels = document.getElementById('opt-all-levels');
    const optRestartLevel = document.getElementById('opt-restart-level');
    const levelsModal = document.getElementById('levels-modal');
    const levelsContainerGrid = document.getElementById('levels-container-grid');
    const unlockedCountText = document.getElementById('unlocked-count-text');
    const closeLevelsBtn = document.getElementById('close-levels-btn');

    let cols = 18;
    let rows = 26;
    let cellSize = 14;
    let originX = 0;
    let originY = 0;

    menuDotsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.style.display = dropdownMenu.style.display === 'flex' ? 'none' : 'flex';
    });

    window.addEventListener('click', () => {
      dropdownMenu.style.display = 'none';
    });

    optRestartLevel.addEventListener('click', () => {
      dropdownMenu.style.display = 'none';
      lives = 3;
      generateLevel(currentLevel);
    });

    optAllLevels.addEventListener('click', () => {
      dropdownMenu.style.display = 'none';
      showLevelsMap();
    });

    function showLevelsMap() {
      levelsContainerGrid.innerHTML = '';
      unlockedCountText.innerText = `Unlocked: ${maxUnlockedLevel} / 5000`;
      const totalToShow = Math.min(5000, Math.max(80, maxUnlockedLevel + 20));

      for (let i = 1; i <= totalToShow; i++) {
        const box = document.createElement('div');
        box.className = 'level-box';

        if (i <= maxUnlockedLevel) {
          box.classList.add(i === currentLevel ? 'current' : 'unlocked');
          box.innerText = i;
          box.onclick = () => {
            currentLevel = i;
            localStorage.setItem('saved_level', currentLevel);
            levelsModal.style.display = 'none';
            lives = 3;
            generateLevel(currentLevel);
          };
        } else {
          box.classList.add('locked');
          box.innerHTML = `<span>🔒</span>`;
        }
        levelsContainerGrid.appendChild(box);
      }
      levelsModal.style.display = 'flex';
    }

    closeLevelsBtn.addEventListener('click', () => {
      levelsModal.style.display = 'none';
    });

    function resizeCanvas() {
      const wrap = document.getElementById('canvas-wrap');
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      canvas.width = w;
      canvas.height = h;

      cellSize = Math.min((w - 20) / cols, (h - 20) / rows);
      originX = (w - (cols * cellSize)) / 2;
      originY = (h - (rows * cellSize)) / 2;

      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    function seededRandom(seed) {
      let x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    function formatTime(s) {
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    // Precise Shape Masks
    function isShapeActive(c, r, lvl) {
      const shapeType = lvl % 5;
      const cx = (cols - 1) / 2;
      const cy = (rows - 1) / 2;
      const nx = (c - cx) / cx;
      const ny = (r - cy) / cy;

      switch(shapeType) {
        case 1: // Key Shape
          const distTop = Math.hypot(nx, ny + 0.45);
          if (distTop <= 0.48 && distTop >= 0.22) return true;
          if (ny >= -0.15 && ny <= 0.85 && Math.abs(nx) <= 0.18) return true;
          if (ny >= 0.45 && ny <= 0.78 && nx > 0.18 && nx <= 0.55) return true;
          return false;

        case 2: // Chess Knight
          if (ny < -0.7 && nx < 0.2 && nx > -0.4) return true;
          if (ny >= -0.7 && ny < -0.2 && nx < 0.3 && nx > -0.6) return true;
          if (ny >= -0.2 && ny < 0.5 && nx < 0.65 && nx > -0.45) return true;
          if (ny >= 0.6 && ny <= 0.85 && Math.abs(nx) <= 0.8) return true;
          return false;

        case 3: // Shield
          if (ny < 0) return Math.abs(nx) <= 0.8;
          return Math.abs(nx) <= (0.8 - ny * 0.7);

        case 4: // Bottle
          if (ny < -0.5) return Math.abs(nx) <= 0.25;
          return Math.abs(nx) <= 0.75 && ny <= 0.85;

        case 0: // Square Spiral
        default:
          return Math.abs(nx) <= 0.88 && Math.abs(ny) <= 0.88;
      }
    }

    // Robust Non-Head-On Generator
    function generateLevel(lvl) {
      arrows = [];
      previewArrow = null;
      secondsSpent = 0;
      liveTimeDisplay.innerText = "00:00";

      const isHard = lvl > 5;
      diffTag.innerText = isHard ? (lvl > 50 ? "Master" : "Hard") : "Normal";
      diffTag.style.color = isHard ? "#ef4444" : "#2563eb";

      cols = isHard ? 18 : 14;
      rows = isHard ? 24 : 18;

      resizeCanvas();

      let randCounter = lvl * 719;
      const getRand = () => seededRandom(randCounter++);

      const grid = Array.from({ length: cols }, () => Array(rows).fill(null));
      const cells = [];

      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          if (isShapeActive(c, r, lvl)) {
            cells.push({ c, r });
          }
        }
      }

      for (let i = cells.length - 1; i > 0; i--) {
        const j = Math.floor(getRand() * (i + 1));
        [cells[i], cells[j]] = [cells[j], cells[i]];
      }

      const dirs = [
        { dx: 0, dy: -1 }, // UP
        { dx: 1, dy: 0 },  // RIGHT
        { dx: 0, dy: 1 },  // DOWN
        { dx: -1, dy: 0 }  // LEFT
      ];

      let arrowId = 0;

      for (const start of cells) {
        if (grid[start.c][start.r] !== null) continue;

        let curC = start.c;
        let curR = start.r;
        let path = [{ c: curC, r: curR }];
        grid[curC][curR] = arrowId;

        let curDir = dirs[Math.floor(getRand() * dirs.length)];
        const maxLen = isHard ? Math.floor(getRand() * 5) + 3 : Math.floor(getRand() * 3) + 2;

        for (let step = 1; step < maxLen; step++) {
          if (step > 1 && getRand() < 0.4) {
            const turnOptions = (curDir.dx === 0) ? [dirs[1], dirs[3]] : [dirs[0], dirs[2]];
            curDir = turnOptions[Math.floor(getRand() * turnOptions.length)];
          }

          let nextC = curC + curDir.dx;
          let nextR = curR + curDir.dy;

          if (
            nextC >= 0 && nextC < cols &&
            nextR >= 0 && nextR < rows &&
            isShapeActive(nextC, nextR, lvl) &&
            grid[nextC][nextR] === null
          ) {
            grid[nextC][nextR] = arrowId;
            path.push({ c: nextC, r: nextR });
            curC = nextC;
            curR = nextR;
          } else {
            break;
          }
        }

        if (path.length >= 2) {
          const tail = path[path.length - 2];
          const head = path[path.length - 1];
          // Exit vector MUST be strictly from tail to head (towards outside)
          let exitDir = {
            dx: Math.sign(head.c - tail.c),
            dy: Math.sign(head.r - tail.r)
          };

          arrows.push({
            id: arrowId,
            points: path,
            exitDir: exitDir,
            state: 'idle',
            progress: 0,
            shake: 0
          });
          arrowId++;
        } else {
          grid[start.c][start.r] = null;
        }
      }

      // Eliminate Head-on collision (No arrow points directly into another arrow's face)
      fixOpposingCollisions();
      ensureBorderExits();
      resolveDeadlockIfNeeded();

      startTimer();
      updateUI();
      draw();
    }

    // Fix head-on collision
    function fixOpposingCollisions() {
      for (let i = 0; i < arrows.length; i++) {
        for (let j = i + 1; j < arrows.length; j++) {
          const a1 = arrows[i];
          const a2 = arrows[j];
          const h1 = a1.points[a1.points.length - 1];
          const h2 = a2.points[a2.points.length - 1];

          // Check if they are facing each other in same axis
          if (a1.exitDir.dx === -a2.exitDir.dx && a1.exitDir.dy === -a2.exitDir.dy) {
            // Same horizontal line facing each other
            if (a1.exitDir.dy === 0 && h1.r === h2.r) {
              if ((a1.exitDir.dx > 0 && h1.c < h2.c) || (a1.exitDir.dx < 0 && h1.c > h2.c)) {
                // Divert one upwards or downwards
                a1.exitDir = (h1.r <= rows / 2) ? { dx: 0, dy: -1 } : { dx: 0, dy: 1 };
              }
            }
            // Same vertical line facing each other
            if (a1.exitDir.dx === 0 && h1.c === h2.c) {
              if ((a1.exitDir.dy > 0 && h1.r < h2.r) || (a1.exitDir.dy < 0 && h1.r > h2.r)) {
                a1.exitDir = (h1.c <= cols / 2) ? { dx: -1, dy: 0 } : { dx: 1, dy: 0 };
              }
            }
          }
        }
      }
    }

    function ensureBorderExits() {
      arrows.forEach(arrow => {
        const head = arrow.points[arrow.points.length - 1];
        if (head.r <= 2) arrow.exitDir = { dx: 0, dy: -1 };
        else if (head.r >= rows - 3) arrow.exitDir = { dx: 0, dy: 1 };
        else if (head.c <= 2) arrow.exitDir = { dx: -1, dy: 0 };
        else if (head.c >= cols - 3) arrow.exitDir = { dx: 1, dy: 0 };
      });
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsSpent++;
        liveTimeDisplay.innerText = formatTime(secondsSpent);
      }, 1000);
    }

    function updateUI() {
      levelDisplay.innerText = `Level ${currentLevel}`;
      livesContainer.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const h = document.createElement('span');
        h.className = `heart ${i >= lives ? 'lost' : ''}`;
        livesContainer.appendChild(h);
      }
    }

    function isArrowBlocked(arrow) {
      const head = arrow.points[arrow.points.length - 1];
      const d = arrow.exitDir;
      let checkC = head.c + d.dx;
      let checkR = head.r + d.dy;

      while (checkC >= -1 && checkC <= cols && checkR >= -1 && checkR <= rows) {
        for (const other of arrows) {
          if (other.id === arrow.id || other.state === 'escaped') continue;
          for (const p of other.points) {
            if (p.c === checkC && p.r === checkR) {
              return true;
            }
          }
        }
        checkC += d.dx;
        checkR += d.dy;
      }
      return false;
    }

    function resolveDeadlockIfNeeded() {
      const active = arrows.filter(a => a.state !== 'escaped');
      if (active.length === 0) return;

      const hasMove = active.some(a => !isArrowBlocked(a));
      if (!hasMove) {
        let best = active[0];
        let minDist = 999;
        active.forEach(a => {
          const head = a.points[a.points.length - 1];
          let dTop = head.r;
          let dBottom = rows - head.r;
          let dLeft = head.c;
          let dRight = cols - head.c;
          let m = Math.min(dTop, dBottom, dLeft, dRight);
          if (m < minDist) {
            minDist = m;
            best = a;
            if (m === dTop) a.exitDir = { dx: 0, dy: -1 };
            else if (m === dBottom) a.exitDir = { dx: 0, dy: 1 };
            else if (m === dLeft) a.exitDir = { dx: -1, dy: 0 };
            else a.exitDir = { dx: 1, dy: 0 };
          }
        });
      }
    }

    function checkQueuedArrows() {
      let released = false;
      arrows.forEach(arrow => {
        if (arrow.state === 'queued' && !isArrowBlocked(arrow)) {
          arrow.state = 'moving';
          playSound('escape');
          released = true;
        }
      });
      if (released && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(animate);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const occupied = new Set();
      arrows.forEach(arrow => {
        if (arrow.state !== 'escaped') {
          arrow.points.forEach(pt => occupied.add(`${pt.c},${pt.r}`));
        }
      });

      // Subtle Dots on cleared channels
      ctx.fillStyle = '#e2e8f0';
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          if (isShapeActive(c, r, currentLevel) && !occupied.has(`${c},${r}`)) {
            const dx = originX + (c + 0.5) * cellSize;
            const dy = originY + (r + 0.5) * cellSize;
            ctx.beginPath();
            ctx.arc(dx, dy, 1.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // Long press preview
      if (previewArrow && previewArrow.state !== 'escaped') {
        const head = previewArrow.points[previewArrow.points.length - 1];
        ctx.save();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        const startX = originX + (head.c + 0.5) * cellSize;
        const startY = originY + (head.r + 0.5) * cellSize;
        ctx.moveTo(startX, startY);
        ctx.lineTo(
          startX + previewArrow.exitDir.dx * canvas.width,
          startY + previewArrow.exitDir.dy * canvas.height
        );
        ctx.stroke();
        ctx.restore();
      }

      // Draw all arrows with true-direction pointing arrowheads
      arrows.forEach(arrow => {
        if (arrow.state === 'escaped') return;

        let strokeColor = '#0f172a';
        if (arrow.state === 'queued') strokeColor = '#ef4444';
        if (arrow.state === 'moving') strokeColor = '#22c55e';
        if (arrow === previewArrow) strokeColor = '#2563eb';

        ctx.save();
        ctx.strokeStyle = strokeColor;
        ctx.fillStyle = strokeColor;
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'miter';

        let offsetX = 0;
        let offsetY = 0;
        if (arrow.state === 'moving') {
          offsetX = arrow.exitDir.dx * arrow.progress * canvas.width;
          offsetY = arrow.exitDir.dy * arrow.progress * canvas.height;
        }
        if (arrow.shake > 0) {
          offsetX += Math.sin(arrow.shake * 12) * 3;
          arrow.shake -= 0.1;
        }

        ctx.translate(offsetX, offsetY);

        // Corridor Path
        ctx.beginPath();
        for (let i = 0; i < arrow.points.length; i++) {
          const pt = arrow.points[i];
          const px = originX + (pt.c + 0.5) * cellSize;
          const py = originY + (pt.r + 0.5) * cellSize;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Arrowhead pointing forward
        const head = arrow.points[arrow.points.length - 1];
        const hx = originX + (head.c + 0.5) * cellSize;
        const hy = originY + (head.r + 0.5) * cellSize;
        const angle = Math.atan2(arrow.exitDir.dy, arrow.exitDir.dx);

        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(angle);
        const sz = 5.2;
        ctx.beginPath();
        ctx.moveTo(-sz, -sz * 0.75);
        ctx.lineTo(1.5, 0);
        ctx.lineTo(-sz, sz * 0.75);
        ctx.lineWidth = 2.2;
        ctx.stroke();
        ctx.restore();

        ctx.restore();
      });
    }

    function animate() {
      let active = false;

      arrows.forEach(arrow => {
        if (arrow.state === 'moving') {
          arrow.progress += 0.09;
          active = true;
          if (arrow.progress >= 1.25) {
            arrow.state = 'escaped';
            resolveDeadlockIfNeeded();
            checkQueuedArrows();
            checkWinCondition();
          }
        }
        if (arrow.shake > 0) active = true;
      });

      draw();

      if (active) requestAnimationFrame(animate);
      else isAnimating = false;
    }

    function getTouchedArrow(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const px = clientX - rect.left;
      const py = clientY - rect.top;

      let found = null;
      let minDistance = 9999;

      for (const arrow of arrows) {
        if (arrow.state === 'escaped') continue;
        for (const pt of arrow.points) {
          const ax = originX + (pt.c + 0.5) * cellSize;
          const ay = originY + (pt.r + 0.5) * cellSize;
          const dist = Math.hypot(px - ax, py - ay);
          if (dist < cellSize * 0.9 && dist < minDistance) {
            minDistance = dist;
            found = arrow;
          }
        }
      }
      return found;
    }

    function onPointerDown(e) {
      const cx = e.clientX || (e.touches && e.touches[0].clientX);
      const cy = e.clientY || (e.touches && e.touches[0].clientY);
      pointerDownPos = { x: cx, y: cy };

      const clicked = getTouchedArrow(cx, cy);
      if (clicked) {
        longPressTimer = setTimeout(() => {
          previewArrow = clicked;
          draw();
        }, 280);
      }
    }

    function onPointerUp(e) {
      clearTimeout(longPressTimer);
      if (previewArrow) {
        previewArrow = null;
        draw();
        return;
      }

      const cx = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
      const cy = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

      if (Math.hypot(cx - pointerDownPos.x, cy - pointerDownPos.y) > 15) return;

      const clicked = getTouchedArrow(cx, cy);

      if (clicked && clicked.state !== 'moving' && clicked.state !== 'escaped') {
        if (isArrowBlocked(clicked)) {
          playSound('hit');
          clicked.state = 'queued';
          clicked.shake = 1.0;
          lives--;
          updateUI();
          if (lives <= 0) handleGameOver("Out of Lives!");
        } else {
          playSound('escape');
          clicked.state = 'moving';
        }

        if (!isAnimating) {
          isAnimating = true;
          requestAnimationFrame(animate);
        }
      }
    }

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); onPointerUp(e); }, { passive: false });

    function checkWinCondition() {
      const remaining = arrows.filter(a => a.state !== 'escaped');
      if (remaining.length === 0) {
        clearInterval(timerInterval);
        playSound('win');

        const bestTimeKey = `best_time_lvl_${currentLevel}`;
        let savedBest = localStorage.getItem(bestTimeKey);
        if (!savedBest || secondsSpent < parseInt(savedBest)) {
          localStorage.setItem(bestTimeKey, secondsSpent);
          savedBest = secondsSpent;
        }

        statTimeTaken.innerText = `${secondsSpent}s`;
        statBestTime.innerText = `${savedBest}s`;

        modalTitle.innerText = "Level Cleared! 🎉";
        modalSubtitle.innerText = `Awesome! Level ${currentLevel} fully untangled.`;
        modalActionBtn.onclick = () => {
          currentLevel++;
          if (currentLevel > maxUnlockedLevel) {
            maxUnlockedLevel = currentLevel;
            localStorage.setItem('max_unlocked_level', maxUnlockedLevel);
          }
          if (currentLevel > 5000) currentLevel = 1;
          localStorage.setItem('saved_level', currentLevel);
          gameModal.style.display = 'none';
          generateLevel(currentLevel);
        };
        gameModal.style.display = 'flex';
      }
    }

    function handleGameOver(reason) {
      clearInterval(timerInterval);
      modalTitle.innerText = reason;
      modalSubtitle.innerText = "Don't give up! Try again to clear this maze.";
      modalActionBtn.innerText = "Try Again";
      modalActionBtn.onclick = () => {
        lives = 3;
        gameModal.style.display = 'none';
        generateLevel(currentLevel);
      };
      gameModal.style.display = 'flex';
    }

    generateLevel(currentLevel);
  </script>
</body>
</html>
