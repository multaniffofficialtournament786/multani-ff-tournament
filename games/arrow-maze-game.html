<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maze Untangle - Master Puzzle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0f19;
      background-image: url('https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/1792388836123.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.65);
      backdrop-filter: blur(4px);
      z-index: 0;
    }
    #game-container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 840px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      border-radius: 20px;
      overflow: hidden;
      z-index: 1;
    }
    .header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border-bottom: 2px solid #f1f5f9;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-dp {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #2563eb;
      box-shadow: 0 2px 8px rgba(37,99,235,0.3);
    }
    .header-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .level-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .level-title {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
    }
    .diff-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      background: #eff6ff;
      color: #2563eb;
      text-transform: uppercase;
    }
    .lives-box {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }
    .heart {
      width: 12px;
      height: 12px;
      background-color: #ef4444;
      border-radius: 50%;
      display: inline-block;
      transition: all 0.2s;
    }
    .heart.lost {
      opacity: 0.2;
      transform: scale(0.75);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .timer-badge {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
      padding: 6px 12px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-icon {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #475569;
    }
    .btn-icon:active {
      transform: scale(0.92);
    }

    #canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #ffffff;
      padding: 8px;
    }
    canvas {
      touch-action: none;
      background: #ffffff;
    }

    .footer {
      padding: 12px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #64748b;
      text-transform: uppercase;
      background: #ffffff;
      border-top: 1px solid #f1f5f9;
    }

    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
    }
    .modal-card {
      background: #fff;
      color: #0f172a;
      padding: 26px 20px;
      border-radius: 20px;
      text-align: center;
      width: 82%;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    }
    .modal-card h2 {
      font-size: 22px;
      margin-bottom: 6px;
    }
    .modal-card p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 16px;
    }
    .stats-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-around;
    }
    .stat-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      text-transform: uppercase;
      display: block;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: #16a34a;
    }
    .modal-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <audio id="bgm" loop preload="auto">
    <source src="https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/ZIKR_by_Lasani_Sarkar(256k).mp3" type="audio/mpeg">
  </audio>

  <div id="game-container">
    <div class="header">
      <div class="header-left">
        <img class="profile-dp" src="https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/games/file_00000000a3f482088bfdca19f7851f75.png" alt="Gaming Logo">
        <div class="header-info">
          <div class="level-row">
            <span class="level-title" id="level-display">Level 1</span>
            <span class="diff-badge" id="diff-tag">Normal</span>
          </div>
          <div class="lives-box" id="lives-container">
            <span class="heart"></span>
            <span class="heart"></span>
            <span class="heart"></span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="timer-badge">
          <span>⏱</span>
          <span id="live-time-display">00:00</span>
        </div>
        <button class="btn-icon" id="music-btn">🎵</button>
        <button class="btn-icon" id="restart-btn">🔄</button>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="footer">Tap Arrow • Untangle The Maze</div>

    <div class="modal" id="gameModal">
      <div class="modal-card">
        <h2 id="modal-title">Level Cleared! 🎉</h2>
        <p id="modal-subtitle">Great job navigating the maze.</p>
        <div class="stats-card">
          <div>
            <span class="stat-label">Total Time</span>
            <span class="stat-value" id="stat-time-taken">0s</span>
          </div>
          <div>
            <span class="stat-label">Best Record</span>
            <span class="stat-value" id="stat-best-time">--</span>
          </div>
        </div>
        <button class="modal-btn" id="modal-action-btn">Next Level</button>
      </div>
    </div>
  </div>

  <script>
    // Audio engine
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-btn');
    let isMusicPlaying = false;
    bgm.volume = 0.5;

    function toggleMusic() {
      if (isMusicPlaying) {
        bgm.pause();
        musicBtn.innerText = '🔇';
        isMusicPlaying = false;
      } else {
        bgm.play().then(() => {
          musicBtn.innerText = '🎵';
          isMusicPlaying = true;
        }).catch(() => {});
      }
    }
    musicBtn.addEventListener('click', toggleMusic);

    window.addEventListener('click', () => {
      if (!isMusicPlaying && bgm.paused) {
        bgm.play().then(() => {
          isMusicPlaying = true;
          musicBtn.innerText = '🎵';
        }).catch(() => {});
      }
    }, { once: true });

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function playSound(type) {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);
      const t = actx.currentTime;

      if (type === 'escape') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, t);
        osc.frequency.exponentialRampToValueAtTime(950, t + 0.12);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
        osc.start(t);
        osc.stop(t + 0.12);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(60, t + 0.18);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
        osc.start(t);
        osc.stop(t + 0.18);
      } else if (type === 'win') {
        [523, 659, 783, 1046].forEach((f, i) => {
          const o = actx.createOscillator();
          const g = actx.createGain();
          o.connect(g);
          g.connect(actx.destination);
          o.frequency.value = f;
          g.gain.setValueAtTime(0.2, t + i * 0.08);
          g.gain.linearRampToValueAtTime(0.01, t + i * 0.08 + 0.2);
          o.start(t + i * 0.08);
          o.stop(t + i * 0.08 + 0.2);
        });
      }
    }

    // Game state
    let currentLevel = parseInt(localStorage.getItem('saved_level')) || 1;
    let lives = 3;
    let secondsSpent = 0;
    let timerInterval = null;
    let arrows = [];
    let isAnimating = false;
    let previewArrow = null;
    let longPressTimer = null;
    let pointerDownPos = { x: 0, y: 0 };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelDisplay = document.getElementById('level-display');
    const diffTag = document.getElementById('diff-tag');
    const liveTimeDisplay = document.getElementById('live-time-display');
    const livesContainer = document.getElementById('lives-container');
    const gameModal = document.getElementById('gameModal');
    const modalTitle = document.getElementById('modal-title');
    const modalSubtitle = document.getElementById('modal-subtitle');
    const modalActionBtn = document.getElementById('modal-action-btn');
    const restartBtn = document.getElementById('restart-btn');
    const statTimeTaken = document.getElementById('stat-time-taken');
    const statBestTime = document.getElementById('stat-best-time');

    let cols = 14;
    let rows = 20;
    let cellSize = 20;
    let originX = 0;
    let originY = 0;

    function resizeCanvas() {
      const wrap = document.getElementById('canvas-wrap');
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      canvas.width = w;
      canvas.height = h;

      cellSize = Math.min((w - 20) / cols, (h - 20) / rows);
      originX = (w - (cols * cellSize)) / 2;
      originY = (h - (rows * cellSize)) / 2;

      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    function seededRandom(seed) {
      let x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    function formatTime(s) {
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    // Procedural Shape Boundary
    function isShapeActive(c, r, lvl) {
      const shapeType = lvl % 5;
      const cx = (cols - 1) / 2;
      const cy = (rows - 1) / 2;
      const nx = (c - cx) / cx;
      const ny = (r - cy) / cy;

      if (lvl <= 3) return Math.abs(nx) < 0.7 && Math.abs(ny) < 0.7;

      switch(shapeType) {
        case 0: // Dense Full Screen Labyrinth
          return Math.abs(nx) < 0.94 && Math.abs(ny) < 0.94;
        case 1: // Mug/Cup Shape
          return (ny >= -0.5 && ny <= 0.8 && Math.abs(nx) <= 0.68) || (ny >= -0.1 && ny <= 0.4 && nx > 0.68 && nx < 0.95);
        case 2: // Diamond Maze
          return (Math.abs(nx) + Math.abs(ny)) < 1.1;
        case 3: // Cross / Plus
          return (Math.abs(nx) < 0.42 && Math.abs(ny) < 0.92) || (Math.abs(nx) < 0.92 && Math.abs(ny) < 0.42);
        case 4: // Stepped Tower
          if (ny < -0.3) return Math.abs(nx) < 0.45;
          if (ny < 0.2) return Math.abs(nx) < 0.68;
          return Math.abs(nx) < 0.92;
        default:
          return true;
      }
    }

    // Generator: Pura board arrows se bhara hoga, koi empty isolated line nahi
    function generateLevel(lvl) {
      arrows = [];
      previewArrow = null;
      secondsSpent = 0;
      liveTimeDisplay.innerText = "00:00";

      const isHard = lvl > 10;
      diffTag.innerText = isHard ? (lvl > 100 ? "Master" : "Super Hard") : "Normal";
      diffTag.style.color = isHard ? "#ef4444" : "#2563eb";

      cols = isHard ? 16 : 12;
      rows = isHard ? 22 : 16;

      resizeCanvas();

      let randCounter = lvl * 431;
      const getRand = () => seededRandom(randCounter++);

      const grid = Array.from({ length: cols }, () => Array(rows).fill(null));
      const cells = [];

      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          if (isShapeActive(c, r, lvl)) {
            cells.push({ c, r });
          }
        }
      }

      // Shuffle
      for (let i = cells.length - 1; i > 0; i--) {
        const j = Math.floor(getRand() * (i + 1));
        [cells[i], cells[j]] = [cells[j], cells[i]];
      }

      const dirs = [
        { dx: 0, dy: -1 }, // UP
        { dx: 1, dy: 0 },  // RIGHT
        { dx: 0, dy: 1 },  // DOWN
        { dx: -1, dy: 0 }  // LEFT
      ];

      let arrowId = 0;

      // Pack entire shape with interconnected arrow paths
      for (const start of cells) {
        if (grid[start.c][start.r] !== null) continue;

        let curC = start.c;
        let curR = start.r;
        let path = [{ c: curC, r: curR }];
        grid[curC][curR] = arrowId;

        let curDir = dirs[Math.floor(getRand() * dirs.length)];
        const maxLen = isHard ? Math.floor(getRand() * 6) + 4 : Math.floor(getRand() * 3) + 2;

        for (let step = 1; step < maxLen; step++) {
          if (step > 1 && getRand() < 0.45) {
            const turnOptions = (curDir.dx === 0) ? [dirs[1], dirs[3]] : [dirs[0], dirs[2]];
            curDir = turnOptions[Math.floor(getRand() * turnOptions.length)];
          }

          let nextC = curC + curDir.dx;
          let nextR = curR + curDir.dy;

          if (
            nextC >= 0 && nextC < cols &&
            nextR >= 0 && nextR < rows &&
            isShapeActive(nextC, nextR, lvl) &&
            grid[nextC][nextR] === null
          ) {
            grid[nextC][nextR] = arrowId;
            path.push({ c: nextC, r: nextR });
            curC = nextC;
            curR = nextR;
          } else {
            break;
          }
        }

        if (path.length >= 2) {
          const tail = path[path.length - 2];
          const head = path[path.length - 1];
          const exitDir = { dx: head.c - tail.c, dy: head.r - tail.r };

          arrows.push({
            id: arrowId,
            points: path,
            exitDir: exitDir,
            state: 'idle', // idle, queued (red waiting), moving, escaped
            progress: 0,
            shake: 0
          });
          arrowId++;
        } else {
          grid[start.c][start.r] = null;
        }
      }

      startTimer();
      updateUI();
      draw();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsSpent++;
        liveTimeDisplay.innerText = formatTime(secondsSpent);
      }, 1000);
    }

    function updateUI() {
      levelDisplay.innerText = `Level ${currentLevel}`;
      livesContainer.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const h = document.createElement('span');
        h.className = `heart ${i >= lives ? 'lost' : ''}`;
        livesContainer.appendChild(h);
      }
    }

    function isArrowBlocked(arrow) {
      const head = arrow.points[arrow.points.length - 1];
      const d = arrow.exitDir;
      let checkC = head.c + d.dx;
      let checkR = head.r + d.dy;

      while (checkC >= -1 && checkC <= cols && checkR >= -1 && checkR <= rows) {
        for (const other of arrows) {
          if (other.id === arrow.id || other.state === 'escaped') continue;
          for (const p of other.points) {
            if (p.c === checkC && p.r === checkR) {
              return true;
            }
          }
        }
        checkC += d.dx;
        checkR += d.dy;
      }
      return false;
    }

    function checkQueuedArrows() {
      let released = false;
      arrows.forEach(arrow => {
        if (arrow.state === 'queued' && !isArrowBlocked(arrow)) {
          arrow.state = 'moving';
          playSound('escape');
          released = true;
        }
      });
      if (released && !isAnimating) {
        isAnimating = true;
        requestAnimationFrame(animate);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Set of current active coordinates
      const occupiedCoords = new Set();
      arrows.forEach(arrow => {
        if (arrow.state !== 'escaped') {
          arrow.points.forEach(pt => {
            occupiedCoords.add(`${pt.c},${pt.r}`);
          });
        }
      });

      // 1. Draw Dots ONLY where arrows have already escaped (Emptied areas)
      ctx.fillStyle = '#cbd5e1';
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          if (isShapeActive(c, r, currentLevel) && !occupiedCoords.has(`${c},${r}`)) {
            const dx = originX + (c + 0.5) * cellSize;
            const dy = originY + (r + 0.5) * cellSize;
            ctx.beginPath();
            ctx.arc(dx, dy, 1.8, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // 2. Long Press Path Preview
      if (previewArrow && previewArrow.state !== 'escaped') {
        const head = previewArrow.points[previewArrow.points.length - 1];
        ctx.save();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        const startX = originX + (head.c + 0.5) * cellSize;
        const startY = originY + (head.r + 0.5) * cellSize;
        ctx.moveTo(startX, startY);
        ctx.lineTo(
          startX + previewArrow.exitDir.dx * canvas.width,
          startY + previewArrow.exitDir.dy * canvas.height
        );
        ctx.stroke();
        ctx.restore();
      }

      // 3. Draw All Arrows (Master Labyrinth Style)
      arrows.forEach(arrow => {
        if (arrow.state === 'escaped') return;

        let strokeColor = '#0f172a'; // Navy Blue Corridors
        if (arrow.state === 'queued') strokeColor = '#ef4444'; // Red Waiting
        if (arrow === previewArrow) strokeColor = '#2563eb';

        ctx.save();
        ctx.strokeStyle = strokeColor;
        ctx.fillStyle = strokeColor;
        ctx.lineWidth = Math.max(3.5, cellSize * 0.32);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        let offsetX = 0;
        let offsetY = 0;
        if (arrow.state === 'moving') {
          offsetX = arrow.exitDir.dx * arrow.progress * canvas.width;
          offsetY = arrow.exitDir.dy * arrow.progress * canvas.height;
        }
        if (arrow.shake > 0) {
          offsetX += Math.sin(arrow.shake * 12) * 4;
          arrow.shake -= 0.1;
        }

        ctx.translate(offsetX, offsetY);

        // Continuous maze corridor line
        ctx.beginPath();
        for (let i = 0; i < arrow.points.length; i++) {
          const pt = arrow.points[i];
          const px = originX + (pt.c + 0.5) * cellSize;
          const py = originY + (pt.r + 0.5) * cellSize;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Arrow head at exit point
        const head = arrow.points[arrow.points.length - 1];
        const hx = originX + (head.c + 0.5) * cellSize;
        const hy = originY + (head.r + 0.5) * cellSize;
        const angle = Math.atan2(arrow.exitDir.dy, arrow.exitDir.dx);

        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(angle);
        const arrowHeadLen = Math.max(8, cellSize * 0.48);
        ctx.beginPath();
        ctx.moveTo(-arrowHeadLen, -arrowHeadLen * 0.65);
        ctx.lineTo(arrowHeadLen * 0.25, 0);
        ctx.lineTo(-arrowHeadLen, arrowHeadLen * 0.65);
        ctx.stroke();
        ctx.restore();

        ctx.restore();
      });
    }

    function animate() {
      let active = false;

      arrows.forEach(arrow => {
        if (arrow.state === 'moving') {
          arrow.progress += 0.085;
          active = true;
          if (arrow.progress >= 1.25) {
            arrow.state = 'escaped';
            checkQueuedArrows();
            checkWinCondition();
          }
        }
        if (arrow.shake > 0) active = true;
      });

      draw();

      if (active) requestAnimationFrame(animate);
      else isAnimating = false;
    }

    function getTouchedArrow(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const px = clientX - rect.left;
      const py = clientY - rect.top;

      let found = null;
      let minDistance = 9999;

      for (const arrow of arrows) {
        if (arrow.state === 'escaped') continue;
        for (const pt of arrow.points) {
          const ax = originX + (pt.c + 0.5) * cellSize;
          const ay = originY + (pt.r + 0.5) * cellSize;
          const dist = Math.hypot(px - ax, py - ay);
          if (dist < cellSize * 0.8 && dist < minDistance) {
            minDistance = dist;
            found = arrow;
          }
        }
      }
      return found;
    }

    function onPointerDown(e) {
      const cx = e.clientX || (e.touches && e.touches[0].clientX);
      const cy = e.clientY || (e.touches && e.touches[0].clientY);
      pointerDownPos = { x: cx, y: cy };

      const clicked = getTouchedArrow(cx, cy);
      if (clicked) {
        longPressTimer = setTimeout(() => {
          previewArrow = clicked;
          draw();
        }, 280);
      }
    }

    function onPointerUp(e) {
      clearTimeout(longPressTimer);
      if (previewArrow) {
        previewArrow = null;
        draw();
        return;
      }

      const cx = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
      const cy = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

      if (Math.hypot(cx - pointerDownPos.x, cy - pointerDownPos.y) > 15) return;

      const clicked = getTouchedArrow(cx, cy);

      if (clicked && clicked.state !== 'moving' && clicked.state !== 'escaped') {
        if (isArrowBlocked(clicked)) {
          playSound('hit');
          clicked.state = 'queued';
          clicked.shake = 1.0;
          lives--;
          updateUI();
          if (lives <= 0) handleGameOver("Out of Lives!");
        } else {
          playSound('escape');
          clicked.state = 'moving';
        }

        if (!isAnimating) {
          isAnimating = true;
          requestAnimationFrame(animate);
        }
      }
    }

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); onPointerUp(e); }, { passive: false });

    function checkWinCondition() {
      const remaining = arrows.filter(a => a.state !== 'escaped');
      if (remaining.length === 0) {
        clearInterval(timerInterval);
        playSound('win');

        const bestTimeKey = `best_time_lvl_${currentLevel}`;
        let savedBest = localStorage.getItem(bestTimeKey);
        if (!savedBest || secondsSpent < parseInt(savedBest)) {
          localStorage.setItem(bestTimeKey, secondsSpent);
          savedBest = secondsSpent;
        }

        statTimeTaken.innerText = `${secondsSpent}s`;
        statBestTime.innerText = `${savedBest}s`;

        modalTitle.innerText = "Level Cleared! 🎉";
        modalSubtitle.innerText = `Awesome! Level ${currentLevel} fully untangled.`;
        modalActionBtn.onclick = () => {
          currentLevel++;
          if (currentLevel > 5000) currentLevel = 1;
          localStorage.setItem('saved_level', currentLevel);
          gameModal.style.display = 'none';
          generateLevel(currentLevel);
        };
        gameModal.style.display = 'flex';
      }
    }

    function handleGameOver(reason) {
      clearInterval(timerInterval);
      modalTitle.innerText = reason;
      modalSubtitle.innerText = "Don't give up! Try again to clear this maze.";
      modalActionBtn.innerText = "Try Again";
      modalActionBtn.onclick = () => {
        lives = 3;
        gameModal.style.display = 'none';
        generateLevel(currentLevel);
      };
      gameModal.style.display = 'flex';
    }

    restartBtn.addEventListener('click', () => {
      lives = 3;
      generateLevel(currentLevel);
    });

    generateLevel(currentLevel);
  </script>
</body>
</html>
