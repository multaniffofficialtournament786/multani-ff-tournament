<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MULTANI KNIFE HIT</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body {
  background: #06070a;
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}
#game-wrap {
  width: 100%;
  max-width: 500px;
  margin: auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  background-color: #0b0f19;
  background-image: url('https://raw.githubusercontent.com/multaniffofficialtournament786/multani-ff-tournament/main/multani-runner/multani-runner/multani-runner/sounds/1792388836123.jpg');
  background-size: cover;
  background-position: center;
}
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: rgba(14, 17, 24, 0.9);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid #ff542d44;
  z-index: 10;
}
.title-tag { font-size: 16px; font-weight: 900; color: #ffbe00; text-shadow: 0 0 10px rgba(255,190,0,0.5); }
.header-actions { display: flex; align-items: center; gap: 12px; }
.score-badge { font-weight: bold; font-size: 15px; color: #00f0ff; }
.music-toggle {
  background: rgba(255,255,255,0.1);
  border: 1px solid #00f0ff;
  color: #fff;
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  font-weight: 700;
}

#stage-box { flex: 1; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }

#game-overlay {
  position: absolute;
  inset: 0;
  background: rgba(4, 6, 12, 0.88);
  backdrop-filter: blur(5px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px;
  z-index: 20;
}
#game-overlay h1 { font-size: 30px; color: #ffbe00; margin-bottom: 8px; text-shadow: 0 0 16px #ff542d; }
#game-overlay p { font-size: 13px; color: #cbd5e1; line-height: 1.6; max-width: 290px; margin-bottom: 20px; }
.play-btn {
  padding: 13px 34px;
  font-size: 16px;
  font-weight: 800;
  color: #000;
  background: linear-gradient(135deg, #00f0ff, #00e676);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 240, 255, 0.4);
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="game-wrap">
  <div class="header-bar">
    <div class="title-tag">🎯 MULTANI KNIFE HIT</div>
    <div class="header-actions">
      <button class="music-toggle" id="musicBtn">🎵 MUSIC ON</button>
      <div class="score-badge">⭐ <span id="scoreText">0</span></div>
    </div>
  </div>

  <div id="stage-box">
    <canvas id="gameCanvas"></canvas>
    
    <div id="game-overlay">
      <h1 id="screenTitle">KNIFE HIT MASTER</h1>
      <p id="screenDesc">
        Screen par tap karke chhuri pheinqein!<br>
        🎯 Target par nishana lagayein.<br>
        🚫 Pehle se lagi chhuri par mat maarein!
      </p>
      <button class="play-btn" id="startBtn">▶ PLAY GAME</button>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage-box");
  const scoreText = document.getElementById("scoreText");
  const overlay = document.getElementById("game-overlay");
  const screenTitle = document.getElementById("screenTitle");
  const screenDesc = document.getElementById("screenDesc");
  const startBtn = document.getElementById("startBtn");
  const musicBtn = document.getElementById("musicBtn");

  let W, H;
  let running = false;
  let score = 0;
  let audioCtx = null;
  let musicOn = true;
  let musicInterval = null;

  // Target Wheel
  const target = {
    x: 0,
    y: 0,
    radius: 70,
    angle: 0,
    speed: 0.028
  };

  let stuckKnives = []; // angles on target
  let flyingKnife = null;
  let readyKnifeY = 0;
  let particles = [];

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  // FUNNY SOUND EFFECTS
  function playHitSound() {
    if (!audioCtx) return;
    // Funny Boing / Ting sound
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(450, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.07);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  function playThrowSound() {
    if (!audioCtx) return;
    // Funny Whistle / Swoosh
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(950, audioCtx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.06);
  }

  function playFailSound() {
    if (!audioCtx) return;
    // Funny Cartoon Wah-Wah / Clank
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(240, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }

  // FUNNY BACKGROUND BGM (Chiptune Funky Melody)
  const funnyMelody = [261.63, 329.63, 392.00, 523.25, 440.00, 392.00, 349.23, 329.63];
  let noteIndex = 0;

  function startMusic() {
    if (musicInterval) clearInterval(musicInterval);
    if (!musicOn) return;

    musicInterval = setInterval(() => {
      if (!running || !musicOn || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = funnyMelody[noteIndex % funnyMelody.length];
      gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);
      noteIndex++;
    }, 210);
  }

  function toggleMusic() {
    initAudio();
    musicOn = !musicOn;
    musicBtn.innerText = musicOn ? "🎵 MUSIC ON" : "🔇 MUSIC OFF";
    if (musicOn && running) startMusic();
    else if (musicInterval) {
      clearInterval(musicInterval);
      musicInterval = null;
    }
  }

  musicBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleMusic();
  });

  function resize() {
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    target.x = W / 2;
    target.y = H * 0.28;
    readyKnifeY = H - 90;
  }
  window.addEventListener("resize", resize);
  resize();

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 14; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = Math.random() * 5 + 2;
      particles.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        alpha: 1,
        color
      });
    }
  }

  function throwKnife() {
    if (!running || flyingKnife) return;
    initAudio();
    playThrowSound();
    flyingKnife = {
      x: W / 2,
      y: readyKnifeY,
      vy: -18
    };
  }

  canvas.addEventListener("pointerdown", throwKnife);

  function drawKnife(x, y, rot = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    // Blade
    ctx.fillStyle = "#e0f7fa";
    ctx.beginPath();
    ctx.moveTo(0, -32);
    ctx.lineTo(6, -6);
    ctx.lineTo(6, 6);
    ctx.lineTo(-6, 6);
    ctx.lineTo(-6, -6);
    ctx.closePath();
    ctx.fill();

    // Guard
    ctx.fillStyle = "#ffbe00";
    ctx.fillRect(-10, 6, 20, 4);

    // Handle
    ctx.fillStyle = "#ff4624";
    ctx.fillRect(-4, 10, 8, 16);

    ctx.restore();
  }

  function drawTarget() {
    ctx.save();
    ctx.translate(target.x, target.y);
    ctx.rotate(target.angle);

    // Outer Glow Ring
    ctx.strokeStyle = "#ffbe00";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, target.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Wheel Body
    ctx.fillStyle = "#1e2433";
    ctx.beginPath();
    ctx.arc(0, 0, target.radius - 2, 0, Math.PI * 2);
    ctx.fill();

    // Slices pattern
    ctx.fillStyle = "rgba(255, 70, 36, 0.25)";
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, target.radius - 2, (i * Math.PI) / 2, (i * Math.PI) / 2 + Math.PI / 4);
      ctx.closePath();
      ctx.fill();
    }

    // Free Fire Logo / Center Badge
    ctx.fillStyle = "#ff4624";
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("FF", 0, 1);

    // Stuck knives
    for (const ang of stuckKnives) {
      ctx.save();
      ctx.rotate(ang);
      drawKnife(0, target.radius + 12, Math.PI);
      ctx.restore();
    }

    ctx.restore();
  }

  function startGame() {
    initAudio();
    score = 0;
    stuckKnives = [];
    flyingKnife = null;
    particles = [];
    target.angle = 0;
    scoreText.innerText = "0";
    running = true;
    overlay.classList.add("hidden");
    startMusic();
    loop();
  }

  function gameOver() {
    running = false;
    playFailSound();
    if (musicInterval) {
      clearInterval(musicInterval);
      musicInterval = null;
    }
    screenTitle.innerText = "💥 OUCH! HIT KNIFE!";
    screenDesc.innerHTML = `Chhuri doosri chhuri se takra gayi!<br>Aapka Score: <b style="color:#00f0ff; font-size:22px;">${score}</b>`;
    startBtn.innerText = "↻ TRY AGAIN";
    overlay.classList.remove("hidden");
  }

  startBtn.addEventListener("click", startGame);

  function loop() {
    if (!running) return;
    ctx.clearRect(0, 0, W, H);

    // Rotate target
    target.angle += target.speed;

    // Draw Target Wheel
    drawTarget();

    // Ready Knife (Bottom)
    if (!flyingKnife) {
      drawKnife(W / 2, readyKnifeY);
    }

    // Flying Knife
    if (flyingKnife) {
      flyingKnife.y += flyingKnife.vy;
      drawKnife(flyingKnife.x, flyingKnife.y);

      // Check Collision with Target
      if (flyingKnife.y <= target.y + target.radius) {
        // Calculate angle on target
        const hitAngle = -target.angle + Math.PI / 2;
        const normHitAngle = ((hitAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

        // Check if hit another knife (collision margin ~18 degrees)
        let collision = false;
        for (const ang of stuckKnives) {
          const normAng = ((ang % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
          const diff = Math.abs(normHitAngle - normAng);
          const angleDist = Math.min(diff, Math.PI * 2 - diff);
          if (angleDist < 0.28) {
            collision = true;
            break;
          }
        }

        if (collision) {
          spawnParticles(flyingKnife.x, flyingKnife.y, "#ff1744");
          gameOver();
          return;
        } else {
          playHitSound();
          spawnParticles(flyingKnife.x, flyingKnife.y, "#ffbe00");
          stuckKnives.push(hitAngle);
          score++;
          scoreText.innerText = score;
          flyingKnife = null;

          // Target gets slightly faster & can reverse direction
          if (score % 6 === 0) {
            target.speed = -target.speed * 1.05;
          }
        }
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.04;
      if (p.alpha <= 0) particles.splice(i, 1);
      else {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
