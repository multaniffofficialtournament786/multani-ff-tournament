<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MULTANI FF - Official Admin Dashboard</title>
  <meta name="theme-color" content="#06070a" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-base: #06070a;
      --bg-surface: #0e1118;
      --bg-card: #151922;
      --border-color: #262f40;

      --primary: #ff4624;
      --primary-glow: rgba(255, 70, 36, 0.45);
      --accent-cyan: #00f0ff;
      --accent-gold: #ffbe00;
      --accent-gold-glow: rgba(255, 190, 0, 0.4);

      --success: #00e676;
      --danger: #ff1744;
      --text-main: #f3f4f6;
      --text-muted: #8e9bb0;
      --text-dim: #5c687a;

      --header-height: 60px;
      --max-app-width: 480px;
      --font-gaming: 'Rajdhani', sans-serif;
      --font-ui: 'Inter', sans-serif;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: #020203;
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    #admin-container {
      width: 100%;
      max-width: var(--max-app-width);
      height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-base);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0,0,0,0.9), 0 0 2px rgba(255, 190, 0, 0.3);
    }

    @media (min-width: 481px) {
      #admin-container {
        height: 94vh;
        border-radius: 28px;
        border: 1px solid #2a3449;
      }
    }

    /* HEADER */
    .admin-header {
      height: var(--header-height);
      background: rgba(14, 17, 24, 0.98);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .admin-brand {
      display: flex;
      flex-direction: column;
    }

    .admin-brand-sub {
      font-family: var(--font-gaming);
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--accent-gold);
      font-weight: 700;
      line-height: 1;
    }

    .admin-brand-main {
      font-family: var(--font-gaming);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffbe00, #ff5722);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 18px;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn:active { background: rgba(255, 255, 255, 0.08); }

    /* CONTENT SCROLLER */
    .admin-main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      position: relative;
    }

    /* TAB STRIP */
    .admin-tabs {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      scrollbar-width: none;
    }
    .admin-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      font-family: var(--font-gaming);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
      box-shadow: 0 0 12px var(--accent-gold-glow);
    }

    /* CARD COMPONENTS */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
    }
    .pill-gold { background: var(--accent-gold); color: #000; font-weight: 800; border: none; }

    /* FORMS & BUTTONS */
    .form-group { margin-bottom: 12px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 11px 13px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: var(--font-ui);
      font-size: 14px;
      outline: none;
    }
    .form-input:focus { border-color: var(--accent-gold); box-shadow: 0 0 8px var(--accent-gold-glow); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-family: var(--font-gaming);
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .btn:active { transform: scale(0.98); }

    .btn-gold { background: linear-gradient(135deg, #ffc400, #ff9100); color: #000; font-weight: 800; }
    .btn-cyan { background: linear-gradient(135deg, #00f0ff, #0099cc); color: #000; font-weight: 800; }
    .btn-success { background: var(--success); color: #000; font-weight: 800; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-sm { padding: 7px 12px; font-size: 13px; width: auto; }

    /* IMAGE PREVIEWS */
    .slip-preview-container {
      width: 100%;
      max-height: 180px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border-color);
      margin: 10px 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .slip-preview-container img { max-width: 100%; max-height: 180px; object-fit: contain; }

    /* TOAST & LOADER */
    .toast-box {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 16px;
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideToast 0.25s ease;
      pointer-events: auto;
    }
    .toast-success { border-color: var(--success); }
    .toast-error { border-color: var(--danger); }
    .toast-info { border-color: var(--accent-gold); }
    @keyframes slideToast { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .global-loader {
      position: absolute;
      inset: 0;
      background: rgba(6, 7, 10, 0.9);
      backdrop-filter: blur(5px);
      z-index: 600;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid transparent;
      border-top-color: var(--accent-gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .empty-state { text-align: center; padding: 40px 16px; color: var(--text-dim); }
    .empty-state i { font-size: 38px; margin-bottom: 12px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="admin-container">
    <!-- HEADER -->
    <header class="admin-header">
      <div class="admin-brand">
        <span class="admin-brand-sub">CONTROL PANEL</span>
        <span class="admin-brand-main">MULTANI FF ADMIN</span>
      </div>
      <div style="display:flex; gap:6px;">
        <button id="btn-refresh" class="icon-btn" title="Refresh Live Data"><i class="fa-solid fa-rotate-right"></i></button>
        <button id="btn-admin-logout" class="icon-btn" title="Exit Admin" style="color:var(--danger);"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </header>

    <!-- TAB NAVIGATION -->
    <div style="padding: 14px 16px 0 16px;">
      <nav class="admin-tabs">
        <button class="tab-btn active" data-tab="deposits"><i class="fa-solid fa-circle-arrow-down"></i> Deposits <span id="badge-dep-count" class="pill pill-gold">0</span></button>
        <button class="tab-btn" data-tab="rooms"><i class="fa-solid fa-satellite-dish"></i> Room Credentials</button>
        <button class="tab-btn" data-tab="create-tournament"><i class="fa-solid fa-plus"></i> New Match</button>
        <button class="tab-btn" data-tab="withdrawals"><i class="fa-solid fa-money-bill-transfer"></i> Cashouts <span id="badge-wd-count" class="pill pill-gold">0</span></button>
        <button class="tab-btn" data-tab="announcement"><i class="fa-solid fa-bullhorn"></i> Banner Notice</button>
      </nav>
    </div>

    <!-- TAB CONTENT ROOT -->
    <main id="admin-main-view" class="admin-main"></main>

    <!-- TOASTS -->
    <div id="toast-container" class="toast-box"></div>

    <!-- LOADER -->
    <div id="admin-loader" class="global-loader hidden">
      <div class="spinner"></div>
      <span id="loader-msg" style="font-family:var(--font-gaming); font-size:15px; color:var(--accent-gold);">Authorizing...</span>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. SUPABASE CONFIGURATION
       Same URL & Anon Key used in user frontend. (Admin verification happens via profiles.is_admin)
       ========================================================================== */
    const SUPABASE_CONFIG = {
      SUPABASE_URL: "https://your-supabase-project.supabase.co",
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    };

    let sb = null;
    try {
      if (window.supabase && SUPABASE_CONFIG.SUPABASE_URL.startsWith("https://") && !SUPABASE_CONFIG.SUPABASE_URL.includes("your-supabase-project")) {
        sb = window.supabase.createClient(SUPABASE_CONFIG.SUPABASE_URL, SUPABASE_CONFIG.SUPABASE_ANON_KEY);
      }
    } catch(e) {
      console.warn("Supabase init error:", e);
    }

    /* ==========================================================================
       2. ADMIN STATE STORE
       ========================================================================== */
    const AdminState = {
      user: null,
      isAdminAuthorized: true, // Set to true for instant preview; verified with backend on login
      currentTab: 'deposits',
      deposits: [
        {
          id: "dep-001",
          user_id: "usr-010",
          user_name: "Hamza Multani (MLT・HAMZA★)",
          amount: 500,
          payment_method: "JazzCash",
          sender_name: "Hamza Ali",
          transaction_id: "9823145671",
          screenshot_url: "https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=600&auto=format&fit=crop&q=80",
          created_at: "Just now"
        }
      ],
      tournaments: [
        {
          id: "t-101",
          title: "BATTLE ROYALE CLASH SQUAD #402",
          mode: "Squad (4v4)",
          map: "Bermuda Remastered",
          joined_players: 44,
          max_players: 48,
          room_id: "",
          room_pass: ""
        },
        {
          id: "t-102",
          title: "SOLO SURVIVORS SHOWDOWN #108",
          mode: "Solo",
          map: "Purgatory",
          joined_players: 48,
          max_players: 48,
          room_id: "8899120",
          room_pass: "777"
        }
      ],
      withdrawals: [
        {
          id: "wd-001",
          user_name: "Ali Raza (OP_ALII)",
          amount: 600,
          method: "Easypaisa",
          account_number: "03451234567",
          account_title: "Muhammad Ali Raza",
          created_at: "15 mins ago"
        }
      ],
      announcement: {
        status: true,
        text: "🔥 Grand Duo Championship this Sunday! Prize Pool: 15,000 PKR. Slots filling up fast!"
      }
    };

    /* ==========================================================================
       3. UTILITIES & TOASTS
       ========================================================================== */
    const Toast = {
      show(msg, type = 'info') {
        const box = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = `toast toast-${type}`;
        let icon = 'fa-circle-info';
        if (type === 'success') icon = 'fa-circle-check';
        if (type === 'error') icon = 'fa-triangle-exclamation';

        el.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${msg}</span>`;
        box.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = '0.3s ease';
          setTimeout(() => el.remove(), 300);
        }, 3200);
      }
    };

    const Loader = {
      show(msg = "Processing...") {
        document.getElementById('loader-msg').innerText = msg;
        document.getElementById('admin-loader').classList.remove('hidden');
      },
      hide() {
        document.getElementById('admin-loader').classList.add('hidden');
      }
    };

    /* ==========================================================================
       4. AUTHENTICATION & SECURITY GUARD
       ========================================================================== */
    async function checkAdminAuth() {
      if (!sb) {
        renderCurrentTab();
        return;
      }

      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        renderLoginForm();
        return;
      }

      // Check profiles table for admin role
      const { data: profile, error } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).single();
      if (error || !profile || !profile.is_admin) {
        document.getElementById('admin-main-view').innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-shield-xmark" style="color:var(--danger);"></i>
            <h3>Unauthorized Access</h3>
            <p style="font-size:13px; margin-top:6px;">This email does not have verified administrative clearance.</p>
            <button class="btn btn-secondary" style="margin-top:14px;" onclick="location.href='index.html'">Go to Player App</button>
          </div>
        `;
        return;
      }

      AdminState.user = session.user;
      AdminState.isAdminAuthorized = true;
      fetchLiveData();
    }

    function renderLoginForm() {
      document.getElementById('admin-main-view').innerHTML = `
        <div class="card" style="margin-top:20px;">
          <h3 style="font-family:var(--font-gaming); font-size:22px; color:var(--accent-gold); margin-bottom:8px;">ADMIN LOGIN</h3>
          <p style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">Sign in with your verified MULTANI FF Admin credentials.</p>
          <form id="admin-login-form">
            <div class="form-group">
              <label class="form-label">Admin Email</label>
              <input type="email" id="adm-email" class="form-input" placeholder="admin@multaniff.com" required />
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" id="adm-pass" class="form-input" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn btn-gold" style="margin-top:10px;">ENTER SECURE CONSOLE</button>
          </form>
        </div>
      `;

      document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const em = document.getElementById('adm-email').value;
        const ps = document.getElementById('adm-pass').value;
        Loader.show("Verifying Admin Credentials...");

        if (sb) {
          const { error } = await sb.auth.signInWithPassword({ email: em, password: ps });
          Loader.hide();
          if (error) {
            Toast.show(error.message, "error");
          } else {
            Toast.show("Authenticated successfully", "success");
            checkAdminAuth();
          }
        } else {
          Loader.hide();
          Toast.show("Local Admin Session active", "info");
          renderCurrentTab();
        }
      });
    }

    /* ==========================================================================
       5. DATA SYNC (SUPABASE LIVE QUERIES)
       ========================================================================== */
    async function fetchLiveData() {
      if (!sb) {
        updateBadges();
        renderCurrentTab();
        return;
      }

      Loader.show("Fetching Live Platform Data...");

      // 1. Pending Deposits
      const { data: depData } = await sb.from('deposit_requests').select('*').eq('status', 'pending').order('created_at', { ascending: false });
      if (depData) AdminState.deposits = depData;

      // 2. Tournaments
      const { data: tourData } = await sb.from('tournaments').select('*').order('created_at', { ascending: false });
      if (tourData) AdminState.tournaments = tourData;

      // 3. Pending Withdrawals
      const { data: wdData } = await sb.from('withdrawal_requests').select('*').eq('status', 'pending').order('created_at', { ascending: false });
      if (wdData) AdminState.withdrawals = wdData;

      Loader.hide();
      updateBadges();
      renderCurrentTab();
    }

    function updateBadges() {
      document.getElementById('badge-dep-count').innerText = AdminState.deposits.length;
      document.getElementById('badge-wd-count').innerText = AdminState.withdrawals.length;
    }

    /* ==========================================================================
       6. TAB RENDERERS
       ========================================================================== */
    function renderCurrentTab() {
      const container = document.getElementById('admin-main-view');
      container.scrollTop = 0;

      // TAB 1: DEPOSITS APPROVAL
      if (AdminState.currentTab === 'deposits') {
        if (!AdminState.deposits.length) {
          container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-check" style="color:var(--success);"></i><h3>No Pending Deposits</h3><p>All deposit slips verified.</p></div>`;
          return;
        }

        container.innerHTML = AdminState.deposits.map(d => `
          <div class="card">
            <div class="card-header">
              <strong style="color:var(--accent-gold); font-size:18px; font-family:var(--font-gaming);">PKR ${d.amount}</strong>
              <span class="pill pill-gold">${d.payment_method}</span>
            </div>
            <div style="font-size:13px; line-height:1.7; color:var(--text-muted); margin-bottom:10px;">
              <div>Sender: <strong style="color:#fff;">${d.sender_name || 'N/A'}</strong></div>
              <div>Transaction ID (TID): <strong style="color:var(--accent-cyan); font-family:monospace;">${d.transaction_id}</strong></div>
              <div>Requested: ${d.created_at || 'Recently'}</div>
            </div>

            <div class="slip-preview-container">
              <a href="${d.screenshot_url}" target="_blank" title="Tap to expand proof">
                <img src="${d.screenshot_url}" alt="Deposit Slip Proof" />
              </a>
            </div>

            <div style="display:flex; gap:10px; margin-top:12px;">
              <button class="btn btn-success btn-sm" style="flex:1;" onclick="approveDeposit('${d.id}')">
                <i class="fa-solid fa-check"></i> APPROVE & CREDIT
              </button>
              <button class="btn btn-danger btn-sm" style="flex:1;" onclick="rejectDeposit('${d.id}')">
                <i class="fa-solid fa-xmark"></i> REJECT
              </button>
            </div>
          </div>
        `).join('');
      }

      // TAB 2: ROOM CREDENTIALS LIVE RELEASE
      else if (AdminState.currentTab === 'rooms') {
        container.innerHTML = AdminState.tournaments.map(t => `
          <div class="card">
            <h4 style="font-family:var(--font-gaming); font-size:19px; margin-bottom:6px;">${t.title}</h4>
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">
              Mode: ${t.mode} • Map: ${t.map} • Joined: ${t.joined_players}/${t.max_players}
            </div>

            <form onsubmit="publishRoomCredentials(event, '${t.id}')">
              <div class="form-group">
                <label class="form-label">Custom Room ID</label>
                <input type="text" id="room-id-${t.id}" class="form-input" value="${t.room_id || ''}" placeholder="e.g. 5599812" required />
              </div>
              <div class="form-group">
                <label class="form-label">Room Password</label>
                <input type="text" id="room-pass-${t.id}" class="form-input" value="${t.room_pass || ''}" placeholder="e.g. 1234" required />
              </div>
              <button type="submit" class="btn btn-cyan btn-sm" style="width:100%;">
                <i class="fa-solid fa-satellite-dish"></i> BROADCAST TO PLAYERS
              </button>
            </form>
          </div>
        `).join('');
      }

      // TAB 3: CREATE TOURNAMENT
      else if (AdminState.currentTab === 'create-tournament') {
        container.innerHTML = `
          <div class="card">
            <h3 style="font-family:var(--font-gaming); font-size:20px; color:var(--accent-gold); margin-bottom:12px;">CREATE NEW TOURNAMENT</h3>
            <form id="form-create-t">
              <div class="form-group">
                <label class="form-label">Tournament Title</label>
                <input type="text" id="t-title" class="form-input" placeholder="e.g. BATTLE ROYALE SOLO CLASH #55" required />
              </div>
              <div class="form-group">
                <label class="form-label">Game Mode</label>
                <select id="t-mode" class="form-input">
                  <option value="Squad (4v4)">Squad (4v4)</option>
                  <option value="Solo">Solo</option>
                  <option value="Duo">Duo</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Map</label>
                <input type="text" id="t-map" class="form-input" placeholder="Bermuda Remastered / Purgatory" required />
              </div>
              <div class="form-group">
                <label class="form-label">Entry Fee (PKR)</label>
                <input type="number" id="t-fee" class="form-input" placeholder="50" min="0" required />
              </div>
              <div class="form-group">
                <label class="form-label">Prize Pool (PKR)</label>
                <input type="number" id="t-prize" class="form-input" placeholder="2400" required />
              </div>
              <div class="form-group">
                <label class="form-label">Total Slots</label>
                <input type="number" id="t-max" class="form-input" value="48" required />
              </div>
              <div class="form-group">
                <label class="form-label">Match Date & Time</label>
                <input type="text" id="t-schedule" class="form-input" placeholder="Tonight, 09:30 PM PKT" required />
              </div>
              <button type="submit" class="btn btn-gold" style="margin-top:8px;">PUBLISH TO APP</button>
            </form>
          </div>
        `;

        document.getElementById('form-create-t').addEventListener('submit', async (e) => {
          e.preventDefault();
          Loader.show("Publishing Tournament...");
          const payload = {
            title: document.getElementById('t-title').value,
            game: "Free Fire Max",
            mode: document.getElementById('t-mode').value,
            map: document.getElementById('t-map').value,
            entry_fee: parseFloat(document.getElementById('t-fee').value),
            prize_pool: parseFloat(document.getElementById('t-prize').value),
            max_players: parseInt(document.getElementById('t-max').value),
            joined_players: 0,
            match_date: document.getElementById('t-schedule').value,
            reg_deadline: "15 mins before match",
            status: "upcoming",
            banner_url: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600&auto=format&fit=crop&q=80",
            rules: "Strict mobile only. Emulators prohibited.",
            winning_rules: "Winner takes official pool reward."
          };

          if (sb) {
            const { error } = await sb.from('tournaments').insert([payload]);
            Loader.hide();
            if (error) {
              Toast.show(error.message, "error");
              return;
            }
          } else {
            AdminState.tournaments.unshift({ id: "t-" + Date.now(), ...payload });
            Loader.hide();
          }

          Toast.show("Tournament published live!", "success");
          switchTab('rooms');
        });
      }

      // TAB 4: CASHOUTS / WITHDRAWALS
      else if (AdminState.currentTab === 'withdrawals') {
        if (!AdminState.withdrawals.length) {
          container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-check" style="color:var(--success);"></i><h3>No Pending Cashouts</h3><p>All player withdrawals cleared.</p></div>`;
          return;
        }

        container.innerHTML = AdminState.withdrawals.map(w => `
          <div class="card">
            <div class="card-header">
              <strong style="color:var(--success); font-size:18px; font-family:var(--font-gaming);">PKR ${w.amount}</strong>
              <span class="pill pill-gold">${w.method}</span>
            </div>
            <div style="font-size:13px; line-height:1.8; color:var(--text-muted); margin-bottom:12px;">
              <div>Player: <strong style="color:#fff;">${w.user_name || 'Player'}</strong></div>
              <div>Account Title: <strong style="color:#fff;">${w.account_title}</strong></div>
              <div>Account Number: <strong style="color:var(--accent-cyan); font-family:monospace; font-size:15px;">${w.account_number}</strong></div>
              <div>Requested: ${w.created_at || 'Recently'}</div>
            </div>
            <button class="btn btn-success btn-sm" style="width:100%;" onclick="completeWithdrawal('${w.id}')">
              <i class="fa-solid fa-paper-plane"></i> MARK AS SENT (PAID)
            </button>
          </div>
        `).join('');
      }

      // TAB 5: ANNOUNCEMENT BANNER
      else if (AdminState.currentTab === 'announcement') {
        container.innerHTML = `
          <div class="card">
            <h3 style="font-family:var(--font-gaming); font-size:19px; color:var(--accent-gold); margin-bottom:12px;">HOMEPAGE TICKER NOTICE</h3>
            <form onsubmit="saveNotice(event)">
              <div class="form-group">
                <label class="form-label">Banner Message</label>
                <textarea id="notice-text" class="form-input" rows="3" required>${AdminState.announcement.text}</textarea>
              </div>
              <div class="form-group" style="display:flex; justify-content:space-between; align-items:center;">
                <label class="form-label" style="margin:0;">Active Status</label>
                <input type="checkbox" id="notice-toggle" ${AdminState.announcement.status ? 'checked' : ''} />
              </div>
              <button type="submit" class="btn btn-gold btn-sm" style="width:100%; margin-top:8px;">UPDATE APP BANNER</button>
            </form>
          </div>
        `;
      }
    }

    /* ==========================================================================
       7. TAB SWITCHER & ACTION HANDLERS
       ========================================================================= */
    function switchTab(tabId) {
      AdminState.currentTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-tab') === tabId);
      });
      renderCurrentTab();
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
    });

    document.getElementById('btn-refresh').addEventListener('click', () => {
      Toast.show("Refreshing data...", "info");
      fetchLiveData();
    });

    document.getElementById('btn-admin-logout').addEventListener('click', async () => {
      if (sb) await sb.auth.signOut();
      Toast.show("Admin session closed", "info");
      location.href = "index.html";
    });

    // Action: Approve Deposit via RPC
    window.approveDeposit = async function(id) {
      Loader.show("Crediting Player Wallet...");
      if (sb) {
        const { error } = await sb.rpc('approve_deposit_request', { p_request_id: id });
        Loader.hide();
        if (error) {
          Toast.show(error.message, "error");
          return;
        }
      } else {
        AdminState.deposits = AdminState.deposits.filter(d => d.id !== id);
        Loader.hide();
      }

      Toast.show("Deposit approved! Funds automatically added.", "success");
      updateBadges();
      renderCurrentTab();
    };

    // Action: Reject Deposit
    window.rejectDeposit = async function(id) {
      Loader.show("Rejecting Request...");
      if (sb) {
        const { error } = await sb.from('deposit_requests').update({ status: 'rejected' }).eq('id', id);
        Loader.hide();
        if (error) {
          Toast.show(error.message, "error");
          return;
        }
      } else {
        AdminState.deposits = AdminState.deposits.filter(d => d.id !== id);
        Loader.hide();
      }

      Toast.show("Deposit slip marked as rejected", "info");
      updateBadges();
      renderCurrentTab();
    };

    // Action: Broadcast Room Credentials
    window.publishRoomCredentials = async function(e, tournamentId) {
      e.preventDefault();
      const rId = document.getElementById(`room-id-${tournamentId}`).value;
      const rPass = document.getElementById(`room-pass-${tournamentId}`).value;

      Loader.show("Broadcasting Room Info...");
      if (sb) {
        const { error } = await sb.from('tournaments').update({ room_id: rId, room_pass: rPass }).eq('id', tournamentId);
        Loader.hide();
        if (error) {
          Toast.show(error.message, "error");
          return;
        }
      } else {
        const t = AdminState.tournaments.find(x => x.id === tournamentId);
        if (t) { t.room_id = rId; t.room_pass = rPass; }
        Loader.hide();
      }

      Toast.show("Room ID & Password live on player screens!", "success");
    };

    // Action: Complete Withdrawal
    window.completeWithdrawal = async function(id) {
      Loader.show("Processing Cashout...");
      if (sb) {
        const { error } = await sb.from('withdrawal_requests').update({ status: 'completed' }).eq('id', id);
        Loader.hide();
        if (error) {
          Toast.show(error.message, "error");
          return;
        }
      } else {
        AdminState.withdrawals = AdminState.withdrawals.filter(w => w.id !== id);
        Loader.hide();
      }

      Toast.show("Withdrawal marked as successfully sent", "success");
      updateBadges();
      renderCurrentTab();
    };

    // Action: Update Site Notice
    window.saveNotice = async function(e) {
      e.preventDefault();
      const txt = document.getElementById('notice-text').value;
      const status = document.getElementById('notice-toggle').checked;

      AdminState.announcement = { status, text: txt };
      if (sb) {
        await sb.from('site_settings').upsert({ id: 'main', announcement_text: txt, announcement_status: status });
      }

      Toast.show("Homepage announcement updated!", "success");
    };

    /* ==========================================================================
       8. INITIALIZATION
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      checkAdminAuth();
    });
  </script>
</body>
</html>
