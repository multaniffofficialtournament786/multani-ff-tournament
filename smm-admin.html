<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MULTANI FF - SMM Service Control</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #06070a; color: #f3f4f6; }
    .font-gaming { font-family: 'Rajdhani', sans-serif; }
    .sidebar-scroll::-webkit-scrollbar { width: 3px; height: 3px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #262f40; }
    .horizontal-scroll { display:flex; overflow-x:auto; white-space:nowrap; gap:10px; scrollbar-width:none; padding-bottom:4px; }
    .horizontal-scroll::-webkit-scrollbar { display:none; }
    button:disabled { opacity:.55; cursor:not-allowed; }
  </style>
</head>
<body class="p-3 md:p-6 max-w-3xl mx-auto space-y-5 pb-20">

  <div class="flex items-center justify-between border-b border-[#262f40] pb-3">
    <h1 class="font-gaming text-lg md:text-xl font-bold tracking-wider text-white uppercase">SMM SERVICE CONTROL</h1>
    <a href="admin.html" class="bg-[#151922] border border-[#262f40] hover:border-[#ff4624] text-gray-300 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
      <i class="fa-solid fa-arrow-left text-[#ff4624]"></i> Back
    </a>
  </div>

  <div class="horizontal-scroll">
    <button type="button" data-order-filter="All" class="bg-[#151922] border border-[#262f40] hover:border-cyan-400 px-3.5 py-2 rounded-xl flex items-center gap-2.5 shrink-0 shadow-md transition">
      <i class="fa-solid fa-list text-cyan-400 text-sm"></i><div class="text-left"><span class="text-[10px] uppercase font-bold text-gray-400 block">All Orders</span><h3 id="stat-all-orders" class="text-sm font-bold font-gaming text-white">0</h3></div>
    </button>
    <button type="button" data-order-filter="Pending" class="bg-[#151922] border border-[#262f40] hover:border-amber-400 px-3.5 py-2 rounded-xl flex items-center gap-2.5 shrink-0 shadow-md transition">
      <i class="fa-solid fa-clock text-amber-400 text-sm"></i><div class="text-left"><span class="text-[10px] uppercase font-bold text-gray-400 block">Pending</span><h3 id="stat-pending-orders" class="text-sm font-bold font-gaming text-amber-400">0</h3></div>
    </button>
    <button type="button" data-order-filter="Processing" class="bg-[#151922] border border-[#262f40] hover:border-blue-400 px-3.5 py-2 rounded-xl flex items-center gap-2.5 shrink-0 shadow-md transition">
      <i class="fa-solid fa-spinner text-blue-400 text-sm"></i><div class="text-left"><span class="text-[10px] uppercase font-bold text-gray-400 block">Processing</span><h3 id="stat-processing-orders" class="text-sm font-bold font-gaming text-blue-400">0</h3></div>
    </button>
    <button type="button" data-order-filter="Completed" class="bg-[#151922] border border-[#262f40] hover:border-emerald-400 px-3.5 py-2 rounded-xl flex items-center gap-2.5 shrink-0 shadow-md transition">
      <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i><div class="text-left"><span class="text-[10px] uppercase font-bold text-gray-400 block">Completed</span><h3 id="stat-completed-orders" class="text-sm font-bold font-gaming text-emerald-400">0</h3></div>
    </button>
    <button type="button" id="open-services-btn" class="bg-[#151922] border border-[#262f40] hover:border-purple-400 px-3.5 py-2 rounded-xl flex items-center gap-2.5 shrink-0 shadow-md transition">
      <i class="fa-solid fa-layer-group text-purple-400 text-sm"></i><div class="text-left"><span class="text-[10px] uppercase font-bold text-gray-400 block">Manage</span><h3 class="text-sm font-bold font-gaming text-purple-400">All Services</h3></div>
    </button>
  </div>

  <div class="bg-[#0e1118] border border-[#262f40] p-4 md:p-5 rounded-2xl space-y-4 shadow-xl">
    <h2 class="font-gaming text-base font-bold text-white uppercase flex items-center gap-2"><i class="fa-solid fa-circle-plus text-cyan-400"></i> Add Manual SMM Service</h2>
    <div class="space-y-3 text-xs">
      <div>
        <label class="block font-bold text-gray-400 uppercase mb-1">Select Service Template</label>
        <div class="relative">
          <button type="button" id="dropdown-toggle-btn" class="w-full bg-[#06070a] border border-[#262f40] rounded-lg p-2.5 text-white flex items-center justify-between outline-none hover:border-[#ff4624]">
            <span id="selected-service-label" class="flex items-center gap-2 truncate text-gray-300"><i class="fa-solid fa-list-ul"></i> Choose Service with Icon...</span>
            <i class="fa-solid fa-chevron-down text-gray-400 text-xs"></i>
          </button>
          <div id="custom-service-dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-[#0e1118] border border-[#262f40] rounded-xl shadow-2xl z-50 max-h-60 overflow-y-auto sidebar-scroll p-1.5 space-y-1"></div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div><label class="block font-bold text-gray-400 uppercase mb-1">Category Name</label><input type="text" id="srv-category" class="w-full bg-[#06070a] border border-[#262f40] rounded-lg p-2.5 text-white outline-none focus:border-[#ff4624]" placeholder="e.g. YouTube / TikTok" required></div>
        <div><label class="block font-bold text-gray-400 uppercase mb-1">Service Name</label><input type="text" id="srv-name" class="w-full bg-[#06070a] border border-[#262f40] rounded-lg p-2.5 text-white outline-none focus:border-[#ff4624]" placeholder="e.g. YouTube Views [HQ]" required></div>
      </div>

      <div><label class="block font-bold text-gray-400 uppercase mb-1">Service ID (Manual)</label><input type="text" id="srv-custom-id" class="w-full bg-[#06070a] border border-[#262f40] rounded-lg p-2.5 text-white outline-none" placeholder="e.g. 101"></div>

      <div class="grid grid-cols-3 gap-2">
        <div><label class="block font-bold text-gray-400 uppercase mb-1">Rate per 1000</label><input type="number" min="0" step="any" id="srv-rate" class="w-full bg-[#06070a] border border-[#262f40] rounded-lg p-2.5 text-white outline-none" placeholder="100"></div>
        <div><label class="block font-bold text-gray-400 uppercase mb-1">Min Qty</label><input type="number" min="1" step="1" id="srv-min" class="w-full bg-[#06070a] border border-[#262f40] rounded-lg p-2.5 text-white outline-none" placeholder="50"></div>
        <div><label class="block font-bold text-gray-400 uppercase mb-1">Max Qty</label><input type="number" min="1" step="1" id="srv-max" class="w-full bg-[#06070a] border border-[#262f40] rounded-lg p-2.5 text-white outline-none" placeholder="100000"></div>
      </div>
      <button type="button" id="save-service-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white py-2.5 rounded-lg font-gaming font-bold uppercase tracking-wider transition">SAVE MANUAL SERVICE</button>
      <p id="page-message" class="text-center text-xs text-gray-400" role="status"></p>
    </div>
  </div>

  <div id="orders-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-[#0e1118] border border-[#262f40] rounded-2xl p-4 md:p-5 w-full max-w-xl space-y-4 max-h-[85vh] flex flex-col shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-[#262f40]"><h3 id="modal-orders-title" class="font-gaming text-base md:text-lg font-bold text-white uppercase">Orders List</h3><button type="button" id="close-orders-btn" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button></div>
      <div id="modal-orders-body" class="flex-1 overflow-y-auto space-y-2 sidebar-scroll"><p class="text-gray-500 text-xs text-center py-6">Loading orders...</p></div>
    </div>
  </div>

  <div id="services-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-[#0e1118] border border-[#262f40] rounded-2xl p-4 md:p-5 w-full max-w-xl space-y-4 max-h-[85vh] flex flex-col shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-[#262f40]"><h3 class="font-gaming text-base md:text-lg font-bold text-white uppercase">All Configured Services</h3><button type="button" id="close-services-btn" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button></div>
      <div id="modal-services-body" class="flex-1 overflow-y-auto space-y-2 sidebar-scroll"><p class="text-gray-500 text-xs text-center py-6">Loading services...</p></div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const SUPABASE_URL = 'https://yzirjidgdxhljbhhjfqp.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_-dPl2eQV4afRDarZOR3QGA_RoDvmsX5';

  const $ = (id) => document.getElementById(id);
  const state = { orders: [], services: [], currentFilter: 'All' };

  function showMessage(message, isError = false) {
    const el = $('page-message');
    el.textContent = message;
    el.className = 'text-center text-xs ' + (isError ? 'text-red-400' : 'text-emerald-400');
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[ch]));
  }

  function openModal(id) {
    const el = $(id);
    el.classList.remove('hidden');
    el.classList.add('flex');
  }
  function closeModal(id) {
    const el = $(id);
    el.classList.add('hidden');
    el.classList.remove('flex');
  }

  const templates = [
    ['YouTube','YouTube Views','youtube'],['YouTube','YouTube Shorts Views','youtube'],
    ['YouTube','YouTube Subscribers','youtube'],['YouTube','YouTube Likes','youtube'],
    ['YouTube','YouTube Comments','youtube'],['YouTube','YouTube Watch Time','youtube'],
    ['YouTube','YouTube Live Stream','youtube'],['YouTube','YouTube Views + Likes Combo','youtube'],
    ['TikTok','TikTok Views','tiktok'],['TikTok','TikTok Followers','tiktok'],
    ['TikTok','TikTok Likes','tiktok'],['TikTok','TikTok Shares','tiktok'],
    ['TikTok','TikTok Comments','tiktok'],['TikTok','TikTok Live','tiktok'],
    ['TikTok','TikTok Saves','tiktok'],['TikTok','TikTok Views + Likes Combo','tiktok'],
    ['Facebook','Facebook Page Followers','facebook'],['Facebook','Facebook Page Likes','facebook'],
    ['Facebook','Facebook Post Likes','facebook'],['Facebook','Facebook Reactions','facebook'],
    ['Facebook','Facebook Video Views','facebook'],['Facebook','Facebook Reels Views','facebook'],
    ['Facebook','Facebook Comments','facebook'],['Facebook','Facebook Shares','facebook'],
    ['Facebook','Facebook Group Members','facebook'],['Facebook','Facebook Live Viewers','facebook'],
    ['Facebook','Facebook Views + Likes Combo','facebook'],
    ['WhatsApp','WhatsApp Channel Followers','whatsapp'],
    ['Instagram','Instagram Followers','instagram'],['Telegram','Telegram Members','telegram']
  ];
  const iconMap = {
    youtube: ['fa-brands fa-youtube','text-red-500'],
    tiktok: ['fa-brands fa-tiktok','text-cyan-400'],
    facebook: ['fa-brands fa-facebook','text-blue-500'],
    whatsapp: ['fa-brands fa-whatsapp','text-emerald-400'],
    instagram: ['fa-brands fa-instagram','text-pink-500'],
    telegram: ['fa-brands fa-telegram','text-cyan-500']
  };

  function renderTemplateDropdown() {
    const box = $('custom-service-dropdown');
    let lastCategory = '';
    box.innerHTML = '';
    templates.forEach(([category, name, iconKey]) => {
      if (category !== lastCategory) {
        const heading = document.createElement('div');
        heading.className = 'text-[10px] font-bold text-gray-400 uppercase px-2 py-1 mt-2';
        heading.textContent = category + ' Services';
        box.appendChild(heading);
        lastCategory = category;
      }
      const [iconClass, iconColor] = iconMap[iconKey];
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'w-full text-left flex items-center gap-2.5 px-3 py-2 rounded-lg hover:bg-[#151922] text-gray-200';
      item.innerHTML = `<i class="${iconClass} ${iconColor}"></i><span>${escapeHtml(name)}</span>`;
      item.addEventListener('click', () => {
        $('srv-category').value = category;
        $('srv-name').value = name;
        $('selected-service-label').innerHTML = `<i class="${iconClass} ${iconColor}"></i><span>${escapeHtml(name)}</span>`;
        $('custom-service-dropdown').classList.add('hidden');
      });
      box.appendChild(item);
    });
  }

  function setStats() {
    $('stat-all-orders').textContent = state.orders.length;
    $('stat-pending-orders').textContent = state.orders.filter(o => String(o.status || 'Pending').toLowerCase() === 'pending').length;
    $('stat-processing-orders').textContent = state.orders.filter(o => String(o.status || '').toLowerCase() === 'processing').length;
    $('stat-completed-orders').textContent = state.orders.filter(o => String(o.status || '').toLowerCase() === 'completed').length;
  }

  async function loadOrders() {
    const { data, error } = await window.smmClient.from('smm_orders').select('*');
    if (error) throw error;
    state.orders = data || [];
    setStats();
  }

  async function loadServices() {
    const { data, error } = await window.smmClient.from('smm_services').select('*');
    if (error) throw error;
    state.services = data || [];
  }

  async function saveManualService() {
    const category = $('srv-category').value.trim();
    const name = $('srv-name').value.trim();
    const provider_service_id = $('srv-custom-id').value.trim() || null;
    const rate = Number($('srv-rate').value);
    const min = Number($('srv-min').value);
    const max = Number($('srv-max').value);
    if (!category || !name || $('srv-rate').value === '' || $('srv-min').value === '' || $('srv-max').value === '') {
      showMessage('Category, service name, rate, min and max are required.', true);
      alert('Please fill Category, Service Name, Rate, Min Qty and Max Qty.');
      return;
    }
    if (!Number.isFinite(rate) || rate < 0 || !Number.isInteger(min) || !Number.isInteger(max) || min < 1 || max < min) {
      showMessage('Rate or quantity values are invalid.', true);
      alert('Rate sahi likhein. Min kam az kam 1 ho aur Max, Min se bara ya barabar ho.');
      return;
    }

    const button = $('save-service-btn');
    button.disabled = true;
    button.textContent = 'SAVING...';
    showMessage('Saving service...');
    try {
      const row = { category, name, rate, min, max };
      if (provider_service_id) row.provider_service_id = provider_service_id;
      const { error } = await window.smmClient.from('smm_services').insert(row);
      if (error) throw error;

      alert('Manual Service added successfully!');
      ['srv-category','srv-name','srv-custom-id','srv-rate','srv-min','srv-max'].forEach(id => $(id).value = '');
      $('selected-service-label').innerHTML = '<i class="fa-solid fa-list-ul"></i> Choose Service with Icon...';
      await loadServices();
      showMessage('Service successfully saved.');
    } catch (error) {
      console.error('Save service error:', error);
      showMessage(error.message || 'Could not save service.', true);
      alert('Service save nahi hui: ' + (error.message || 'Unknown database error') + '\n\nAgar RLS/permission error hai to Supabase table policies check karni hongi.');
    } finally {
      button.disabled = false;
      button.textContent = 'SAVE MANUAL SERVICE';
    }
  }

  async function openOrdersModal(filterType) {
    state.currentFilter = filterType;
    openModal('orders-modal');
    $('modal-orders-title').textContent = filterType + ' Orders Details';
    const container = $('modal-orders-body');
    container.innerHTML = '<p class="text-gray-500 text-xs text-center py-6">Loading...</p>';
    try {
      await loadOrders();
      const orders = filterType === 'All' ? state.orders : state.orders.filter(o => String(o.status || 'Pending').toLowerCase() === filterType.toLowerCase());
      if (!orders.length) {
        container.innerHTML = '<p class="text-gray-500 text-xs text-center py-6">No orders found in this category.</p>';
        return;
      }
      container.innerHTML = '';
      orders.forEach(order => {
        const status = String(order.status || 'Pending');
        const isCompleted = status.toLowerCase() === 'completed';
        const isPending = status.toLowerCase() === 'pending';
        const id = String(order.id ?? '');
        const card = document.createElement('div');
        card.className = 'bg-[#06070a] border border-[#262f40] p-3 rounded-xl flex items-center justify-between text-xs gap-2';
        card.innerHTML = `
          <div class="space-y-1 truncate flex-1 min-w-0">
            <p class="text-white font-bold">ID: <span class="text-cyan-400">${escapeHtml(id.slice(0,8) || '---')}</span></p>
            <p class="text-gray-400 truncate">Link: ${order.link ? `<a href="${escapeHtml(order.link)}" target="_blank" rel="noopener noreferrer" class="text-amber-400 underline">Open link</a>` : 'N/A'}</p>
            <p class="text-gray-400">Qty: <strong class="text-white">${escapeHtml(order.quantity ?? 0)}</strong> | Charge: <strong class="text-emerald-400">${escapeHtml(order.charge ?? 0)}</strong></p>
          </div>
          <div class="text-right space-y-2 shrink-0">
            <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${isCompleted ? 'bg-emerald-950 text-emerald-400' : status.toLowerCase()==='processing' ? 'bg-blue-950 text-blue-400' : 'bg-amber-950 text-amber-400'}">${escapeHtml(status)}</span>
            <div class="flex gap-1 justify-end pt-1">
              ${isPending ? `<button type="button" data-action="Processing" class="bg-blue-600 text-white px-2.5 py-1 rounded text-[10px] font-bold">Approve</button>` : ''}
              ${!isCompleted ? `<button type="button" data-action="Completed" class="bg-emerald-600 text-white px-2.5 py-1 rounded text-[10px] font-bold">Complete</button>` : '<span class="text-emerald-400 text-[10px] font-bold">Done</span>'}
            </div>
          </div>`;
        card.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', () => updateOrderStatus(id, btn.dataset.action));
        });
        container.appendChild(card);
      });
    } catch (error) {
      console.error('Orders load error:', error);
      container.innerHTML = `<p class="text-red-400 text-xs text-center py-6">Orders load nahi huay: ${escapeHtml(error.message)}</p>`;
    }
  }

  async function updateOrderStatus(orderId, newStatus) {
    if (!orderId) return alert('Order ID missing.');
    try {
      const { error } = await window.smmClient.from('smm_orders').update({ status: newStatus }).eq('id', orderId);
      if (error) throw error;
      await openOrdersModal(state.currentFilter);
      alert('Order status updated to ' + newStatus + '.');
    } catch (error) {
      console.error('Update status error:', error);
      alert('Status update nahi hua: ' + error.message);
    }
  }

  async function openAllServicesModal() {
    openModal('services-modal');
    const container = $('modal-services-body');
    container.innerHTML = '<p class="text-gray-500 text-xs text-center py-6">Loading...</p>';
    try {
      await loadServices();
      if (!state.services.length) {
        container.innerHTML = '<p class="text-gray-500 text-xs text-center py-6">No services added yet.</p>';
        return;
      }
      container.innerHTML = '';
      state.services.forEach(service => {
        const card = document.create
