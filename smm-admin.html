<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MULTANI FF - SMM Service Control</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Inter,sans-serif;background:#06070a;color:#f3f4f6}
.font-gaming{font-family:Rajdhani,sans-serif}
.sidebar-scroll::-webkit-scrollbar{width:4px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:#262f40}
.horizontal-scroll{display:flex;overflow-x:auto;white-space:nowrap;gap:10px;scrollbar-width:none;padding-bottom:4px}
.horizontal-scroll::-webkit-scrollbar{display:none}
button:disabled{opacity:.55;cursor:not-allowed}
</style>
</head>

<body class="p-3 md:p-6 max-w-4xl mx-auto space-y-5 pb-20">

<div class="flex items-center justify-between border-b border-[#262f40] pb-3">
<h1 class="font-gaming text-xl font-bold tracking-wider text-cyan-400">SMM SERVICE CONTROL</h1>
<a href="admin.html" class="bg-[#151922] border border-[#262f40] text-gray-200 px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2">
<i class="fa-solid fa-arrow-left text-[#ff4624]"></i> Back
</a>
</div>

<div class="horizontal-scroll">
<button type="button" data-order-filter="All" class="bg-[#151922] border border-[#262f40] px-4 py-2.5 rounded-xl flex items-center gap-3 shrink-0 shadow-md">
<i class="fa-solid fa-list text-cyan-400 text-lg"></i>
<div class="text-left"><span class="text-[11px] text-gray-400 block font-medium">All Orders</span><h3 id="stat-all-orders" class="text-sm font-bold text-white">0</h3></div>
</button>
<button type="button" data-order-filter="Pending" class="bg-[#151922] border border-[#262f40] px-4 py-2.5 rounded-xl flex items-center gap-3 shrink-0 shadow-md">
<i class="fa-solid fa-clock text-amber-400 text-lg"></i>
<div class="text-left"><span class="text-[11px] text-gray-400 block font-medium">Pending</span><h3 id="stat-pending-orders" class="text-sm font-bold text-amber-400">0</h3></div>
</button>
<button type="button" data-order-filter="Processing" class="bg-[#151922] border border-[#262f40] px-4 py-2.5 rounded-xl flex items-center gap-3 shrink-0 shadow-md">
<i class="fa-solid fa-spinner text-blue-400 text-lg"></i>
<div class="text-left"><span class="text-[11px] text-gray-400 block font-medium">Processing</span><h3 id="stat-processing-orders" class="text-sm font-bold text-blue-400">0</h3></div>
</button>
<button type="button" data-order-filter="Completed" class="bg-[#151922] border border-[#262f40] px-4 py-2.5 rounded-xl flex items-center gap-3 shrink-0 shadow-md">
<i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
<div class="text-left"><span class="text-[11px] text-gray-400 block font-medium">Completed</span><h3 id="stat-completed-orders" class="text-sm font-bold text-emerald-400">0</h3></div>
</button>
<button type="button" id="open-services-btn" class="bg-[#151922] border border-[#262f40] px-4 py-2.5 rounded-xl flex items-center gap-3 shrink-0 shadow-md">
<i class="fa-solid fa-layer-group text-purple-400 text-lg"></i>
<div class="text-left"><span class="text-[11px] text-gray-400 block font-medium">Manage</span><h3 class="text-sm font-bold text-purple-400">All Services</h3></div>
</button>
</div>

<div class="bg-[#0e1118] border border-[#262f40] p-4 md:p-6 rounded-2xl space-y-4 shadow-xl">
<h2 class="font-gaming text-lg font-bold uppercase text-white flex items-center gap-2">
<i class="fa-solid fa-circle-plus text-cyan-400"></i> Add Manual SMM Service
</h2>
<div class="space-y-3.5 text-xs">
<label class="block font-bold text-gray-300 uppercase">Select Service Template</label>
<div class="relative">
<button type="button" id="dropdown-toggle-btn" class="w-full bg-[#06070a] border border-[#262f40] rounded-xl p-3.5 text-white flex justify-between items-center text-sm shadow-inner">
<span id="selected-service-label"><i class="fa-solid fa-list-ul text-amber-400 mr-2"></i> Choose Service Template...</span>
<i class="fa-solid fa-chevron-down text-gray-400"></i>
</button>
<div id="custom-service-dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-[#0e1118] border border-[#262f40] rounded-xl shadow-2xl z-50 max-h-72 overflow-y-auto sidebar-scroll p-2 space-y-1"></div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
<div>
<label class="block font-bold text-gray-300 mb-1">Category Name</label>
<input id="srv-category" type="text" placeholder="Instagram / TikTok" class="w-full bg-[#06070a] border border-[#262f40] rounded-xl p-3.5 text-white text-sm">
</div>
<div>
<label class="block font-bold text-gray-300 mb-1">Service Name</label>
<input id="srv-name" type="text" placeholder="Instagram Followers [HQ]" class="w-full bg-[#06070a] border border-[#262f40] rounded-xl p-3.5 text-white text-sm">
</div>
</div>
<div>
<label class="block font-bold text-gray-300 mb-1">Service ID (Manual / Provider)</label>
<input id="srv-custom-id" type="text" placeholder="101" class="w-full bg-[#06070a] border border-[#262f40] rounded-xl p-3.5 text-white text-sm">
</div>
<div class="grid grid-cols-3 gap-2.5">
<div>
<label class="block font-bold text-gray-300 mb-1">Rate / 1000</label>
<input id="srv-rate" type="number" min="0" step="any" placeholder="100" class="w-full bg-[#06070a] border border-[#262f40] rounded-xl p-3 text-white text-sm">
</div>
<div>
<label class="block font-bold text-gray-300 mb-1">Min Qty</label>
<input id="srv-min" type="number" min="1" placeholder="50" class="w-full bg-[#06070a] border border-[#262f40] rounded-xl p-3 text-white text-sm">
</div>
<div>
<label class="block font-bold text-gray-300 mb-1">Max Qty</label>
<input id="srv-max" type="number" min="1" placeholder="100000" class="w-full bg-[#06070a] border border-[#262f40] rounded-xl p-3 text-white text-sm">
</div>
</div>
<button type="button" id="save-service-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white py-3.5 rounded-xl font-gaming font-bold uppercase text-sm tracking-wide transition shadow-lg">
SAVE MANUAL SERVICE
</button>
<p id="page-message" class="text-center text-xs text-gray-400 font-medium"></p>
</div>
</div>

<!-- Full-Screen Orders Modal -->
<div id="orders-modal" class="fixed inset-0 bg-[#06070a] z-50 hidden flex-col p-4 md:p-6">
<div class="flex justify-between items-center border-b border-[#262f40] pb-4 mb-4">
<h3 id="modal-orders-title" class="font-gaming font-bold text-lg text-cyan-400">Orders List</h3>
<button type="button" id="close-orders-btn" class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-2 rounded-xl text-sm font-bold flex items-center gap-2">
<i class="fa-solid fa-xmark text-lg"></i> Close
</button>
</div>
<div id="modal-orders-body" class="flex-1 overflow-y-auto space-y-3 sidebar-scroll p-1"></div>
</div>

<!-- Full-Screen Services Modal -->
<div id="services-modal" class="fixed inset-0 bg-[#06070a] z-50 hidden flex-col p-4 md:p-6">
<div class="flex justify-between items-center border-b border-[#262f40] pb-4 mb-4">
<h3 class="font-gaming font-bold text-lg text-purple-400">All Configured Services</h3>
<button type="button" id="close-services-btn" class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-2 rounded-xl text-sm font-bold flex items-center gap-2">
<i class="fa-solid fa-xmark text-lg"></i> Close
</button>
</div>
<div id="modal-services-body" class="flex-1 overflow-y-auto space-y-3 sidebar-scroll p-1"></div>
</div>

<script>
(() => {
'use strict';

const SUPABASE_URL = 'https://yzirjidgdxhljbhhjfqp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_-dPl2eQV4afRDarZOR3QGA_RoDvmsX5';

const $ = id => document.getElementById(id);

const state = {
orders: [],
services: [],
currentFilter: 'All'
};

function showMessage(message, isError = false) {
const el = $('page-message');
if (!el) return;
el.textContent = message;
el.className = 'text-center text-xs font-medium ' + (isError ? 'text-red-400' : 'text-emerald-400');
}

function escapeHtml(value) {
return String(value ?? '').replace(/[&<>"']/g, ch => ({
'&': '&amp;',
'<': '&lt;',
'>': '&gt;',
'"': '&quot;',
"'": '&#39;'
}[ch]));
}

function openModal(id) {
const modal = $(id);
if (modal) {
modal.classList.remove('hidden');
modal.classList.add('flex');
}
}

function closeModal(id) {
const modal = $(id);
if (modal) {
modal.classList.add('hidden');
modal.classList.remove('flex');
}
}

const templates = [
// INSTAGRAM
['Instagram', 'Instagram Likes', 'instagram'],
['Instagram', 'Instagram Followers', 'instagram'],
['Instagram', 'Instagram Views', 'instagram'],
['Instagram', 'Instagram Reel Views', 'instagram'],
['Instagram', 'Instagram Story Views', 'instagram'],
['Instagram', 'Instagram Comments', 'instagram'],
['Instagram', 'Instagram Custom Comments', 'instagram'],
['Instagram', 'Instagram Shares', 'instagram'],
['Instagram', 'Instagram Saves', 'instagram'],

// TIKTOK
['TikTok', 'TikTok Likes', 'tiktok'],
['TikTok', 'TikTok Followers', 'tiktok'],
['TikTok', 'TikTok Views', 'tiktok'],
['TikTok', 'TikTok Video Views', 'tiktok'],
['TikTok', 'TikTok Live Views', 'tiktok'],
['TikTok', 'TikTok Live Likes', 'tiktok'],
['TikTok', 'TikTok Comments', 'tiktok'],
['TikTok', 'TikTok Shares', 'tiktok'],
['TikTok', 'TikTok Saves', 'tiktok'],

// YOUTUBE
['YouTube', 'YouTube Likes', 'youtube'],
['YouTube', 'YouTube Subscribers', 'youtube'],
['YouTube', 'YouTube Views', 'youtube'],
['YouTube', 'YouTube Shorts Views', 'youtube'],
['YouTube', 'YouTube Comments', 'youtube'],
['YouTube', 'YouTube Custom Comments', 'youtube'],
['YouTube', 'YouTube Shares', 'youtube'],

// FACEBOOK
['Facebook', 'Facebook Likes', 'facebook'],
['Facebook', 'Facebook Followers', 'facebook'],
['Facebook', 'Facebook Page Likes', 'facebook'],
['Facebook', 'Facebook Page Followers', 'facebook'],
['Facebook', 'Facebook Post Likes', 'facebook'],
['Facebook', 'Facebook Video Views', 'facebook'],
['Facebook', 'Facebook Reel Views', 'facebook'],
['Facebook', 'Facebook Comments', 'facebook'],
['Facebook', 'Facebook Shares', 'facebook'],

// WHATSAPP
['WhatsApp', 'WhatsApp Channel Followers', 'whatsapp'],
['WhatsApp', 'WhatsApp Channel Views', 'whatsapp'],
['WhatsApp', 'WhatsApp Poll Votes', 'whatsapp'],
['WhatsApp', 'WhatsApp Reactions', 'whatsapp'],
['WhatsApp', 'WhatsApp Post Views', 'whatsapp'],
['WhatsApp', 'WhatsApp Likes', 'whatsapp'],

// TELEGRAM
['Telegram', 'Telegram Channel Members', 'telegram'],
['Telegram', 'Telegram Group Members', 'telegram'],
['Telegram', 'Telegram Post Views', 'telegram'],
['Telegram', 'Telegram Reactions', 'telegram'],
['Telegram', 'Telegram Likes', 'telegram'],
['Telegram', 'Telegram Comments', 'telegram'],
['Telegram', 'Telegram Poll Votes', 'telegram'],
['Telegram', 'Telegram Story Views', 'telegram'],

// SNAPCHAT
['Snapchat', 'Snapchat Followers', 'snapchat'],
['Snapchat', 'Snapchat Subscribers', 'snapchat'],
['Snapchat', 'Snapchat Story Views', 'snapchat'],
['Snapchat', 'Snapchat Spotlight Views', 'snapchat'],
['Snapchat', 'Snapchat Profile Views', 'snapchat'],

// X (TWITTER)
['X (Twitter)', 'Twitter Followers', 'twitter'],
['X (Twitter)', 'Twitter Likes', 'twitter'],
['X (Twitter)', 'Twitter Views', 'twitter'],

// PINTEREST
['Pinterest', 'Pinterest Followers', 'pinterest'],
['Pinterest', 'Pinterest Likes', 'pinterest'],
['Pinterest', 'Pinterest Views', 'pinterest'],
['Pinterest', 'Pinterest Saves', 'pinterest']
];

const iconMap = {
instagram: ['fa-brands fa-instagram', 'text-pink-500'],
tiktok: ['fa-brands fa-tiktok', 'text-cyan-400'],
youtube: ['fa-brands fa-youtube', 'text-red-500'],
facebook: ['fa-brands fa-facebook', 'text-blue-500'],
whatsapp: ['fa-brands fa-whatsapp', 'text-emerald-400'],
telegram: ['fa-brands fa-telegram', 'text-cyan-500'],
snapchat: ['fa-brands fa-snapchat', 'text-yellow-400'],
twitter: ['fa-brands fa-x-twitter', 'text-gray-200'],
pinterest: ['fa-brands fa-pinterest', 'text-red-600']
};

function renderTemplateDropdown() {
const box = $('custom-service-dropdown');
if (!box) return;
box.innerHTML = '';
let lastCategory = '';

templates.forEach(([category, name, iconKey]) => {
if (category !== lastCategory) {
const heading = document.createElement('div');
heading.className = 'text-[11px] font-bold text-amber-400 uppercase px-3 py-1.5 mt-2 bg-[#06070a]/60 rounded';
heading.textContent = '--- ' + category + ' Services ---';
box.appendChild(heading);
lastCategory = category;
}

const [iconClass, iconColor] = iconMap[iconKey] || ['fa-solid fa-star', 'text-amber-400'];
const item = document.createElement('button');
item.type = 'button';
item.className = 'w-full text-left flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-[#151922] text-gray-200 transition text-sm';
item.innerHTML = `<i class="${iconClass} ${iconColor} text-base w-5 text-center"></i><span>${escapeHtml(name)}</span>`;

item.addEventListener('click', () => {
$('srv-category').value = category;
$('srv-name').value = name;
$('selected-service-label').innerHTML = `<i class="${iconClass} ${iconColor} mr-2"></i><span>${escapeHtml(name)}</span>`;
box.classList.add('hidden');
});
box.appendChild(item);
});
}

function setStats() {
const allCount = state.orders.length;
const pendingCount = state.orders.filter(o => String(o.status || 'Pending').toLowerCase() === 'pending').length;
const processingCount = state.orders.filter(o => {
const st = String(o.status || '').toLowerCase();
return st === 'processing' || st === 'in progress';
}).length;
const completedCount = state.orders.filter(o => {
const st = String(o.status || '').toLowerCase();
return st === 'completed' || st === 'success';
}).length;

if ($('stat-all-orders')) $('stat-all-orders').textContent = allCount;
if ($('stat-pending-orders')) $('stat-pending-orders').textContent = pendingCount;
if ($('stat-processing-orders')) $('stat-processing-orders').textContent = processingCount;
if ($('stat-completed-orders')) $('stat-completed-orders').textContent = completedCount;
}

async function loadOrders() {
try {
const { data, error } = await window.smmClient
.from('smm_orders')
.select('*')
.order('created_at', { ascending: false });

if (error) throw error;
state.orders = data || [];
setStats();
} catch (error) {
console.error('Error loading orders:', error);
}
}

async function loadServices() {
try {
const { data, error } = await window.smmClient
.from('smm_services')
.select('*');

if (error) throw error;
state.services = data || [];
} catch (error) {
console.error('Error loading services:', error);
}
}

async function saveManualService() {
const category = $('srv-category').value.trim();
const name = $('srv-name').value.trim();
const provider_service_id = $('srv-custom-id').value.trim() || null;

const rate = Number($('srv-rate').value);
const min = Number($('srv-min').value);
const max = Number($('srv-max').value);

if (!category || !name || $('srv-rate').value === '' || $('srv-min').value === '' || $('srv-max').value === '') {
showMessage('Please fill all required fields.', true);
alert('Category, Service Name, Rate, Min Qty and Max Qty are required.');
return;
}

const button = $('save-service-btn');
button.disabled = true;
button.textContent = 'SAVING...';
showMessage('Saving service...');

try {
const row = { category, name, rate, min, max };
if (provider_service_id) {
row.provider_service_id = provider_service_id;
}

const { error } = await window.smmClient
.from('smm_services')
.insert([row]);

if (error) throw error;

alert('Manual Service added successfully!');
['srv-category', 'srv-name', 'srv-custom-id', 'srv-rate', 'srv-min', 'srv-max'].forEach(id => {
if ($(id)) $(id).value = '';
});

if ($('selected-service-label')) {
$('selected-service-label').innerHTML = '<i class="fa-solid fa-list-ul text-amber-400 mr-2"></i> Choose Service Template...';
}

await loadServices();
showMessage('Service successfully saved.');
} catch (error) {
console.error('Save error:', error);
alert('Service save nahi hui: ' + error.message);
showMessage(error.message, true);
} finally {
button.disabled = false;
button.textContent = 'SAVE MANUAL SERVICE';
}
}

async function openOrdersModal(filterType) {
state.currentFilter = filterType;
openModal('orders-modal');

if ($('modal-orders-title')) {
$('modal-orders-title').textContent = filterType + ' Orders Details';
}

const container = $('modal-orders-body');
if (!container) return;

container.innerHTML = '<p class="text-gray-400 text-center py-8 text-sm">Loading orders...</p>';

try {
await loadOrders();
let orders = state.orders;
if (filterType !== 'All') {
orders = state.orders.filter(o => {
const st = String(o.status || 'Pending').toLowerCase();
if (filterType.toLowerCase() === 'processing') return st === 'processing' || st === 'in progress';
if (filterType.toLowerCase() === 'completed') return st === 'completed' || st === 'success';
return st === filterType.toLowerCase();
});
}

if (!orders.length) {
container.innerHTML = '<p class="text-gray-400 text-center py-12 text-sm">No orders found.</p>';
return;
}

container.innerHTML = '';
orders.forEach(order => {
const status = String(order.status || 'Pending');
const id = String(order.id ?? '');
const card = document.createElement('div');
card.className = 'bg-[#0e1118] border border-[#262f40] p-4 rounded-xl flex items-center justify-between text-xs gap-3 shadow-md';

card.innerHTML = `
<div class="space-y-1.5 truncate flex-1 min-w-0">
<p class="text-white font-bold text-sm">ID: <span class="text-cyan-400">#${escapeHtml(order.order_id || id.slice(0, 8) || '---')}</span></p>
<p class="text-gray-300 truncate text-xs">Service: <span class="text-white font-medium">${escapeHtml(order.service_name || 'N/A')}</span></p>
<p class="text-gray-400 truncate text-xs">Link: ${order.link ? `<a href="${escapeHtml(order.link)}" target="_blank" class="text-amber-400 underline font-medium">Open link</a>` : 'N/A'}</p>
<p class="text-gray-400 text-xs">Qty: <strong class="text-white">${escapeHtml(order.quantity ?? 0)}</strong></p>
</div>
<div class="text-right space-y-2 shrink-0">
<span class="px-2.5 py-1 rounded-lg text-xs font-bold uppercase bg-gray-800 text-gray-200 border border-gray-700">${escapeHtml(status)}</span>
</div>
`;
container.appendChild(card);
});
} catch (error) {
container.innerHTML = `<p class="text-red-400 text-center py-8 text-sm">Orders load nahi huay: ${escapeHtml(error.message)}</p>`;
}
}

async function openAllServicesModal() {
openModal('services-modal');
const container = $('modal-services-body');
if (!container) return;

container.innerHTML = '<p class="text-gray-400 text-center py-8 text-sm">Loading services...</p>';

try {
await loadServices();

if (!state.services.length) {
container.innerHTML = '<p class="text-gray-400 text-center py-12 text-sm">No services added yet.</p>';
return;
}

container.innerHTML = '';

state.services.forEach(service => {
const card = document.createElement('div');
card.className = 'bg-[#0e1118] border border-[#262f40] p-4 rounded-xl flex items-center justify-between text-xs gap-3 shadow-md';

card.innerHTML = `
<div class="space-y-1.5 truncate flex-1 min-w-0">
<p class="text-white font-bold text-sm">
<span class="text-cyan-400 mr-1">[${escapeHtml(service.category || 'General')}]</span>
${escapeHtml(service.name || 'Service')}
</p>
<p class="text-gray-300 text-xs">
Rate/1k: <strong class="text-emerald-400">${escapeHtml(service.rate ?? 0)}</strong>
| Min: <span class="text-white">${escapeHtml(service.min ?? 0)}</span> - Max: <span class="text-white">${escapeHtml(service.max ?? 0)}</span>
</p>
</div>
<button type="button" data-delete-service class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow">
Delete
</button>
`;

card.querySelector('[data-delete-service]').addEventListener('click', () => deleteService(service.id));
container.appendChild(card);
});
} catch (error) {
container.innerHTML = `<p class="text-red-400 text-center py-8 text-sm">Services load nahi huin: ${escapeHtml(error.message)}</p>`;
}
}

async function deleteService(serviceId) {
if (!serviceId || !confirm('Are you sure you want to delete this service?')) return;
try {
const { error } = await window.smmClient
.from('smm_services')
.delete()
.eq('id', serviceId);

if (error) throw error;
await openAllServicesModal();
alert('Service deleted successfully!');
} catch (error) {
alert('Service delete nahi hui: ' + error.message);
}
}

async function init() {
if (!window.supabase) return;
window.smmClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
renderTemplateDropdown();

const dropdownBtn = $('dropdown-toggle-btn');
const dropdownMenu = $('custom-service-dropdown');

if (dropdownBtn && dropdownMenu) {
dropdownBtn.addEventListener('click', e => {
e.stopPropagation();
dropdownMenu.classList.toggle('hidden');
});
}

document.addEventListener('click', e => {
if (dropdownBtn && dropdownMenu && !dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
dropdownMenu.classList.add('hidden');
}
});

document.querySelectorAll('[data-order-filter]').forEach(btn => {
btn.addEventListener('click', () => openOrdersModal(btn.dataset.orderFilter));
});

if ($('open-services-btn')) $('open-services-btn').addEventListener('click', openAllServicesModal);
if ($('save-service-btn')) $('save-service-btn').addEventListener('click', saveManualService);
if ($('close-orders-btn')) $('close-orders-btn').addEventListener('click', () => closeModal('orders-modal'));
if ($('close-services-btn')) $('close-services-btn').addEventListener('click', () => closeModal('services-modal'));

try {
await Promise.all([loadOrders(), loadServices()]);
showMessage('Connected to database successfully.');
} catch (error) {
console.error(error);
}
}

window.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
