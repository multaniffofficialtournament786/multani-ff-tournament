<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MULTANI RUNNER</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #06070a;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  touch-action: manipulation;
}

#game {
  width: 100%;
  max-width: 900px;
  margin: auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(#111a30, #20233b 65%, #101116);
  position: relative;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px;
  gap: 8px;
}

.logo {
  font-size: 18px;
  font-weight: 900;
  color: #ff542d;
  text-shadow: 0 0 12px #ff542d66;
}

button {
  border: 1px solid #ff542d;
  color: white;
  background: #191b24;
  padding: 10px 13px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

#soundBtn {
  border-color: #00d9ff;
}

#stage {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px;
  background: #05070ab8;
}

#overlay h1 {
  font-size: clamp(28px, 8vw, 48px);
  color: #ff542d;
  margin: 0 0 12px;
  text-shadow: 0 0 18px #ff542d55;
}

#overlay p {
  line-height: 1.7;
  max-width: 320px;
}

#startBtn {
  margin-top: 12px;
  padding: 15px 32px;
  font-size: 18px;
  background: #ff542d;
  border: none;
  color: #080808;
}

#hint {
  text-align: center;
  padding: 10px;
  color: #bfc5d4;
  font-size: 12px;
}

.stats {
  position: absolute;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  font-size: 15px;
  font-weight: bold;
  text-shadow: 0 2px 5px black;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>
<div id="game">

  <div class="header">
    <div class="logo">🔥 MULTANI RUNNER</div>
    <button id="soundBtn">🎵 MUSIC ON</button>
  </div>

  <div id="stage">
    <canvas id="canvas"></canvas>

    <div class="stats">
      <span>SCORE: <span id="score">0</span></span>
      <span>BEST: <span id="best">0</span></span>
    </div>

    <div id="overlay">
      <h1 id="title">MULTANI RUNNER</h1>
      <p id="message">
        Ready to Run?<br>
        Tap the screen to JUMP!<br>
        Obstacles se bach kar aage barho.
      </p>
      <button id="startBtn">▶ START GAME</button>
    </div>
  </div>

  <div id="hint">TAP SCREEN = JUMP • Obstacles se bacho!</div>

</div>

<script>
(() => {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage");

  const overlay = document.getElementById("overlay");
  const title = document.getElementById("title");
  const message = document.getElementById("message");
  const startBtn = document.getElementById("startBtn");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const soundBtn = document.getElementById("soundBtn");

  let W = 360;
  let H = 550;
  let ground = 440;
  let running = false;
  let gameOver = false;
  let score = 0;
  let speed = 5;
  let spawnTimer = 0;
  let lastTime = 0;
  let frame = 0;
  let audio = null;
  let musicOn = false;
  let musicTimer = null;

  let best = 0;
  try {
    best = Number(localStorage.getItem("multaniRunnerBest") || 0);
  } catch(e) {}
  bestEl.textContent = best;

  const player = {
    x: 65,
    y: 0,
    w: 42,
    h: 62,
    vy: 0,
    jumpPower: -13,
    onGround: true
  };

  let obstacles = [];

  function resize() {
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = rect.width;
    H = rect.height;

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ground = H - 55;
    player.x = Math.max(35, W * 0.16);
    player.y = Math.min(player.y || ground - player.h, ground - player.h);
  }

  window.addEventListener("resize", resize);
  resize();

  function sound(freq, duration, type = "sine", volume = 0.08) {
    if (!audio) return;

    try {
      const osc = audio.createOscillator();
      const gain = audio.createGain();

      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audio.currentTime + duration
      );

      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + duration);
    } catch(e) {}
  }

  function initAudio() {
    if (!audio) {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (AudioContextClass) audio = new AudioContextClass();
    }

    if (audio && audio.state === "suspended") {
      audio.resume();
    }
  }

  function playJumpSound() {
    if (!musicOn) return;
    sound(520, 0.09, "square", 0.035);
    setTimeout(() => sound(720, 0.1, "square", 0.025), 60);
  }

  function playGameOverSound() {
    if (!musicOn) return;
    sound(240, 0.25, "sawtooth", 0.05);
    setTimeout(() => sound(150, 0.45, "sawtooth", 0.04), 200);
  }

  function startMusic() {
    if (musicTimer) clearInterval(musicTimer);
    if (!musicOn || !audio) return;

    const notes = [220, 277, 330, 277, 247, 330, 370, 330];
    let i = 0;

    musicTimer = setInterval(() => {
      if (!musicOn || !running) return;
      sound(notes[i % notes.length], 0.16, "triangle", 0.018);
      i++;
    }, 220);
  }

  function toggleMusic() {
    initAudio();
    musicOn = !musicOn;
    soundBtn.textContent = musicOn ? "🎵 MUSIC ON" : "🔇 MUSIC OFF";

    if (musicOn) startMusic();
    else if (musicTimer) {
      clearInterval(musicTimer);
      musicTimer = null;
    }
  }

  soundBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleMusic();
  });

  function resetGame() {
    score = 0;
    speed = 5;
    spawnTimer = 0;
    frame = 0;
    obstacles = [];

    player.y = ground - player.h;
    player.vy = 0;
    player.onGround = true;

    scoreEl.textContent = "0";
  }

  function startGame() {
    initAudio();
    resetGame();

    running = true;
    gameOver = false;
    overlay.classList.add("hidden");

    if (musicOn) startMusic();

    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    gameOver = true;

    playGameOverSound();

    const finalScore = Math.floor(score);

    if (finalScore > best) {
      best = finalScore;
      bestEl.textContent = best;
      try {
        localStorage.setItem("multaniRunnerBest", best);
      } catch(e) {}
    }

    title.textContent = "GAME OVER!";
    message.innerHTML =
      "Tumhara Score: <b>" + finalScore + "</b><br>" +
      "Best Score: <b>" + best + "</b><br>" +
      "Dobara koshish karo!";

    startBtn.textContent = "↻ PLAY AGAIN";
    overlay.classList.remove("hidden");
  }

  function jump() {
    if (!running) return;

    if (player.onGround) {
      player.vy = player.jumpPower;
      player.onGround = false;
      playJumpSound();
    }
  }

  startBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    startGame();
  });

  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    jump();
  });

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      jump();
    }
  });

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#111a30");
    sky.addColorStop(1, "#303044");

    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = "#ffffff88";
    for (let i = 0; i < 28; i++) {
      const x = (i * 83 + 35) % W;
      const y = (i * 47 + 30) % Math.max(100, ground - 100);
      ctx.fillRect(x, y, 2, 2);
    }

    // Distant buildings
    ctx.fillStyle = "#191c2b";
    for (let i = 0; i < 8; i++) {
      const bw = 35 + (i % 3) * 12;
      const bh = 65 + (i % 4) * 18;
      const x = (i * 95 - (frame * 0.4) % 95);

      ctx.fillRect(x, ground - bh, bw, bh);

      ctx.fillStyle = "#ffb84d55";
      for (let wy = ground - bh + 12; wy < ground - 8; wy += 18) {
        ctx.fillRect(x + 8, wy, 5, 5);
        ctx.fillRect(x + 20, wy, 5, 5);
      }
      ctx.fillStyle = "#191c2b";
    }

    // Ground
    ctx.fillStyle = "#0b0d13";
    ctx.fillRect(0, ground, W, H - ground);

    ctx.fillStyle = "#ff542d";
    ctx.fillRect(0, ground, W, 4);

    ctx.fillStyle = "#35394a";
    const offset = (frame * speed) % 42;

    for (let x = -offset; x < W; x += 42) {
      ctx.fillRect(x, ground + 25, 22, 3);
    }
  }

  function drawPlayer() {
    const x = player.x;
    const y = player.y;
    const bob = player.onGround ? Math.sin(frame * 0.25) * 2 : 0;

    ctx.save();
    ctx.translate(x, y + bob);

    // Shadow
    ctx.fillStyle = "#00000066";
    ctx.beginPath();
    ctx.ellipse(21, player.h + 2, 25, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legs
    const legSwing = player.onGround ? Math.sin(frame * 0.35) * 8 : 0;

    ctx.strokeStyle = "#151821";
    ctx.lineWidth = 9;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(16, 43);
    ctx.lineTo(14 + legSwing, 57);
    ctx.lineTo(8 + legSwing, 59);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(27, 43);
    ctx.lineTo(30 - legSwing, 56);
    ctx.lineTo(38 - legSwing, 58);
    ctx.stroke();

    // Shoes
    ctx.strokeStyle = "#ff542d";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(3 + legSwing, 60);
    ctx.lineTo(13 + legSwing, 60);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(33 - legSwing, 59);
    ctx.lineTo(42 - legSwing, 59);
    ctx.stroke();

    // Body / hoodie
    ctx.fillStyle = "#ff542d";
    ctx.beginPath();
    ctx.roundRect(8, 20, 27, 27, 7);
    ctx.fill();

    // Hoodie centre
    ctx.fillStyle = "#1b1e2a";
    ctx.fillRect(19, 23, 5, 18);

    // Arms
    ctx.strokeStyle = "#ff542d";
    ctx.lineWidth = 7;

    ctx.beginPath();
    ctx.moveTo(10, 25);
    ctx.lineTo(3, 34 + legSwing * 0.4);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(33, 25);
    ctx.lineTo(39, 33 - legSwing * 0.4);
    ctx.stroke();

    // Neck
    ctx.fillStyle = "#b97850";
    ctx.fillRect(18, 15, 9, 8);

    // Head
    ctx.fillStyle = "#b97850";
    ctx.beginPath();
    ctx.arc(22, 12, 11, 0, Math.PI * 2);
    ctx.fill();

    // Hair
    ctx.fillStyle = "#101116";
    ctx.beginPath();
    ctx.arc(22, 8, 11, Math.PI, Math.PI * 2);
    ctx.lineTo(32, 12);
    ctx.lineTo(12, 12);
    ctx.fill();

    // Eye
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(27, 11, 3, 3);

    // Orange chest emblem
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 12px Arial";
    ctx.fillText("M", 17, 36);

    ctx.restore();
  }

  function makeObstacle() {
    const size = 30 + Math.random() * 15;

    obstacles.push({
      x: W + 20,
      y: ground - size,
      w: size,
      h: size
    });
  }

  function drawObstacles() {
    for (const o of obstacles) {
      ctx.fillStyle = "#a84b25";
      ctx.fillRect(o.x, o.y, o.w, o.h);

      ctx.strokeStyle = "#ffb15b";
      ctx.lineWidth = 3;
      ctx.strokeRect(o.x + 2, o.y + 2, o.w - 4, o.h - 4);

      ctx.strokeStyle = "#54281c";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(o.x + 5, o.y + 5);
      ctx.lineTo(o.x + o.w - 5, o.y + o.h - 5);
      ctx.moveTo(o.x + o.w - 5, o.y + 5);
      ctx.lineTo(o.x + 5, o.y + o.h - 5);
      ctx.stroke();
    }
  }

  function collision(a, b) {
    const margin = 7;

    return (
      a.x + margin < b.x + b.w &&
      a.x + a.w - margin > b.x &&
      a.y + margin < b.y + b.h &&
      a.y + a.h - 3 > b.y
    );
  }

  function update(delta) {
    const step = Math.min(delta / 16.67, 2);

    frame += step;
    score += 0.12 * step;
    speed = Math.min(5 + score / 100, 10);

    scoreEl.textContent = Math.floor(score);

    // Gravity and jump
    player.vy += 0.65 * step;
    player.y += player.vy * step;

    if (player.y + player.h >= ground) {
      player.y = ground - player.h;
      player.vy = 0;
      player.onGround = true;
    }

    // Create obstacles
    spawnTimer += step;

    if (spawnTimer > Math.max(48, 95 - speed * 4) + Math.random() * 25) {
      makeObstacle();
      spawnTimer = 0;
    }

    // Move obstacles and check collision
    for (const o of obstacles) {
      o.x -= speed * step;

      if (collision(player, o)) {
        endGame();
        return;
      }
    }

    obstacles = obstacles.filter(o => o.x + o.w > -20);
  }

  function render() {
    drawBackground();
    drawObstacles();
    drawPlayer();
  }

  function loop(now) {
    if (!running) return;

    const delta = Math.min(now - lastTime, 35);
    lastTime = now;

    update(delta);
    render();

    if (running) requestAnimationFrame(loop);
  }

  // Initial screen
  resetGame();
  render();

})();
</script>
</body>
</html>
